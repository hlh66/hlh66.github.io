<style>
  :root{
    --ink:#16191d; --sub:#6b7280; --line:#e6e8ec; --bg:#f4f5f7; --card:#fff;
    --red:#c0392b; --red-soft:#fdf1ef; --amber:#b7791f; --amber-soft:#fdf6e7;
    --green:#2f7d4f; --blue:#2c5c8f;
    --A:#7c4dff; --B:#2c5c8f; --C:#2f7d4f; --D:#b7791f; --E:#6b7280;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 14px;width:100%}

  /* 顶部 */
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);
    backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0 9px}
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em}
  .meta{font-size:12px;color:var(--sub);margin-top:2px}
  .pbox{text-align:right;flex:none}
  .pnum{font-size:20px;font-weight:700;color:var(--green);line-height:1.1;font-variant-numeric:tabular-nums}
  .plbl{font-size:11px;color:var(--sub)}
  .pbar{height:5px;background:#eceef1;border-radius:99px;overflow:hidden;margin-top:6px}
  .pbar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .3s}

  /* 搜索 */
  .search{padding:0 0 10px}
  .search input{width:100%;border:1px solid var(--line);background:#f7f8fa;border-radius:11px;
    padding:10px 14px;font-size:15px;font-family:inherit;color:var(--ink);outline:none}
  .search input:focus{border-color:#c9cdd4;background:#fff}

  /* 筛选条 */
  .chips{display:flex;gap:7px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:6px 13px;border-radius:99px;border:1px solid var(--line);
    background:#fff;color:var(--sub);font-size:13.5px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
  .chip.ghost{background:transparent}

  /* 摘要 */
  .stats{display:flex;gap:8px;padding:12px 0 4px;flex-wrap:wrap}
  .stat{flex:1;min-width:88px;background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:9px 11px;cursor:pointer}
  .stat b{display:block;font-size:19px;line-height:1.2;font-variant-numeric:tabular-nums}
  .stat span{font-size:11.5px;color:var(--sub)}
  .stat.red b{color:var(--red)} .stat.amber b{color:var(--amber)} .stat.green b{color:var(--green)}

  /* 分组 */
  .sec{margin-top:20px}
  .sec-h{display:flex;align-items:center;gap:8px;padding:0 2px 8px;font-size:14px;color:var(--sub);font-weight:600}
  .dot{width:8px;height:8px;border-radius:99px;background:var(--dc)}
  .sec-h .n{margin-left:auto;font-weight:500;font-size:12.5px;color:#9aa1ab}

  /* 卡片 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:13px 14px;margin-bottom:9px;display:flex;gap:11px;align-items:flex-start;
    transition:.14s;position:relative}
  .card:active{background:#fafbfc}
  .tick{flex:none;width:23px;height:23px;border-radius:99px;border:2px solid #d4d8de;
    margin-top:2px;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:transparent;transition:.14s;background:#fff}
  .card.done .tick{background:var(--green);border-color:var(--green);color:#fff}
  .body{flex:1;min-width:0}
  .ttl{font-size:15.5px;line-height:1.55;word-break:break-word;overflow-wrap:anywhere}
  .ttl strong{font-weight:650}
  .ttl code{background:#f4f5f7;padding:1px 5px;border-radius:4px;font-size:13.5px;
    font-family:ui-monospace,Consolas,monospace;color:#2c5c8f;word-break:break-all}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .tag{font-size:11.5px;color:var(--sub);background:#f4f5f7;border-radius:6px;padding:2px 8px;
    overflow-wrap:anywhere}
  .id{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;font-weight:700;
    color:var(--dc,#6b7280);background:color-mix(in srgb,var(--dc,#6b7280) 12%,#fff);
    border-radius:6px;padding:2px 7px}
  .tag.today{background:var(--red);color:#fff;font-weight:700}
  .tag.hot{background:var(--red-soft);color:var(--red);font-weight:600}
  .tag.warn{background:var(--amber-soft);color:var(--amber);font-weight:600}
  .tag.rec{background:#eef2ff;color:#3451b2;font-weight:600}
  .tag.ice{background:#f1f2f4;color:#8b9199}
  .tag.ok{background:#eaf5ee;color:var(--green);font-weight:600}

  .card.done{opacity:.45}
  .card.done .ttl{text-decoration:line-through;text-decoration-thickness:1px}
  .card.ice{opacity:.6}

  .empty{color:var(--sub);text-align:center;padding:46px 0;font-size:14.5px}
  footer{margin-top:28px;text-align:center;color:#a3a9b2;font-size:12px;line-height:1.9}
  footer a{color:#8b9199;text-decoration:none;border-bottom:1px dashed #cfd4da}
  .reset{display:inline-block;margin-top:10px;color:#a3a9b2;font-size:12px;
    border:1px solid var(--line);border-radius:99px;padding:3px 12px;cursor:pointer;background:#fff}
  @media(max-width:400px){body{font-size:15.5px}.stat{min-width:76px}}
</style>
</head>

try { done = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e){ done = {}; }
let F = {d:"all", sc:"", m:0, q:"", hide:1, r:0};

const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
                          .replace(/`(.+?)`/g,"<code>$1</code>");
const isDone = d => !!done[d.id];

function pass(d){
  if (F.d !== "all" && d.d !== F.d) return false;
  if (F.sc && !(d.sc||[]).includes(F.sc)) return false;
  if (F.r && !d.rec) return false;
  if (F.m > 0 && (d.m === null || d.m > F.m)) return false;
  if (F.hide && isDone(d)) return false;
  if (F.q){
    const hay = (d.id + d.t + d.w + d.dur + d.due + d.dn).toLowerCase();
    if (!hay.includes(F.q.toLowerCase())) return false;
  }
  return true;
}

function cardHTML(d){
  const c = DC[d.d] || "#6b7280";
  const cls = ["card"];
  if (isDone(d)) cls.push("done");
  if (d.st === "ice") cls.push("ice");

  let tags = `<span class="id" style="--dc:${c}">${d.id}</span>`;
  if (d.today) tags += `<span class="tag today">今天</span>`;
  if (d.hot && !d.today) tags += `<span class="tag hot">${esc(d.due)}</span>`;
  else if (d.rec && !d.today) tags += `<span class="tag rec">🎯 ${esc(d.due)}</span>`;
  else if (d.due && !d.today) tags += `<span class="tag">${esc(d.due)}</span>`;
  if (d.st === "warn") tags += `<span class="tag warn">待确认</span>`;
  if (d.st === "ice") tags += `<span class="tag ice">冰柜</span>`;
  if (d.st === "wait") tags += `<span class="tag ice">等别人</span>`;
  if (d.dur) tags += `<span class="tag">${esc(d.dur)}</span>`;
  if (d.w) tags += `<span class="tag">${esc(d.w)}</span>`;
  if (isDone(d)) tags += `<span class="tag ok">已完成</span>`;

  return `<div class="${cls.join(" ")}" data-id="${d.id}" style="--dc:${c}">
    <div class="tick">✓</div>
    <div class="body"><div class="ttl">${inline(d.t)}</div><div class="tags">${tags}</div></div>
  </div>`;
}

function render(){
  const list = DATA.filter(pass);
  const groups = {};
  list.forEach(d => (groups[d.d] = groups[d.d] || []).push(d));
  // 近期重点排前面（未完成的更前）
  Object.keys(groups).forEach(k=>{
    groups[k].sort((a,b)=>(b.rec?1:0)-(a.rec?1:0) || (isDone(a)?1:0)-(isDone(b)?1:0));
  });

  let out = "";
  ["A","B","C","D","E"].forEach(k=>{
    const arr = groups[k];
    if (!arr || !arr.length) return;
    const left = arr.filter(d=>!isDone(d)).length;
    out += `<div class="sec"><div class="sec-h" style="--dc:${DC[k]}">
      <i class="dot"></i>${DN[k]}<span class="n">${left} / ${arr.length} 待办</span></div>
      ${arr.map(cardHTML).join("")}</div>`;
  });
  $("#list").innerHTML = out;
  $("#empty").style.display = list.length ? "none" : "block";

  const active = DATA.filter(d => d.st !== "ice");
  const fin = active.filter(isDone).length;
  const pct = active.length ? Math.round(fin / active.length * 100) : 0;
  $("#pnum").textContent = pct + "%";
  $("#plbl").textContent = `${fin} / ${active.length}`;
  $("#pbar").style.width = pct + "%";

  $("#sToday").textContent = DATA.filter(d=>d.today && !isDone(d)).length;
  $("#sLeft").textContent = DATA.filter(d=>d.st!=="ice" && !isDone(d)).length;
  $("#sQuick").textContent = DATA.filter(d=>d.st!=="ice" && !isDone(d) && d.m!==null && d.m<=15).length;

  document.querySelectorAll(".card").forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.id;
      if (done[id]) delete done[id]; else done[id] = Date.now();
      localStorage.setItem(KEY, JSON.stringify(done));
      render();
    };
  });
}

$("#domChips").onclick = e=>{
  const p = e.target.closest(".chip"); if(!p) return;
  $("#domChips").querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
  p.classList.add("on"); F.d = p.dataset.d; render();
};
$("#moreChips").onclick = e=>{
  const p = e.target.closest(".chip"); if(!p) return;
  if (p.id === "hideBtn"){
    F.hide = F.hide ? 0 : 1;
    p.classList.toggle("on", !!F.hide);
    p.textContent = F.hide ? "✅ 隐藏已完成" : "👀 显示全部";
    render(); return;
  }
  if (p.dataset.sc){
    const on = p.classList.contains("on");
    $("#moreChips").querySelectorAll(".chip[data-sc]").forEach(x=>x.classList.remove("on"));
    if (on){ F.sc = ""; } else { p.classList.add("on"); F.sc = p.dataset.sc; }
    render(); return;
  }
  if (p.dataset.r){
    const on = p.classList.contains("on");
    p.classList.toggle("on", !on);
    F.r = on ? 0 : 1;
    render(); return;
  }
  if (p.dataset.m){
    const on = p.classList.contains("on");
    if (on){ p.classList.remove("on"); F.m = 0; }
    else { p.classList.add("on"); F.m = parseInt(p.dataset.m); }
    render();
  }
};
$("#q").oninput = e=>{ F.q = e.target.value.trim(); render(); };
document.querySelectorAll(".stat").forEach(s=>{
  s.onclick = ()=>{
    F.d="all"; F.sc=""; F.m=0; F.q=""; F.r=0; $("#q").value="";
    $("#domChips").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on", x.dataset.d==="all"));
    $("#moreChips").querySelectorAll(".chip[data-sc],.chip[data-r],.chip[data-m]").forEach(x=>x.classList.remove("on"));
    if (s.dataset.jump === "quick"){
      document.querySelector('.chip[data-m="15"]').classList.add("on"); F.m = 15;
    }
    if (s.dataset.jump === "left"){
      F.hide = 0; const hb = $("#hideBtn"); hb.classList.remove("on"); hb.textContent = "👀 显示全部";
    }
    render();
    if (s.dataset.jump === "today"){
      const el = document.querySelector(".tag.today");
      if (el) el.closest(".card").scrollIntoView({behavior:"smooth", block:"center"});
    }
  };
});
$("#reset").onclick = ()=>{
  if (!confirm("清空这台设备上的所有打勾记录？")) return;
  done = {}; localStorage.removeItem(KEY); render();
};
render();
</script>
</body>
</html>
