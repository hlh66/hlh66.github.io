}

}

function updateClock() {
    var now = new Date();
    var h = String(now.getHours()).padStart(2,'0');
    var m = String(now.getMinutes()).padStart(2,'0');
    var s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('clockTime').textContent = h + ':' + m + ':' + s;
    updateWeekStatus(now);
}
setInterval(updateClock, 1000);

function updateWeekStatus(now) {
    var todayMonth = now.getMonth() + 1;
    var todayDate = now.getDate();
    var currentWeekNum = 0;
    var currentWeekObj = null;
    var daysUntilWeek = 0;

    for (var i = 0; i < weeks.length; i++) {
        var w = weeks[i];
        var inRange = false;
        if (w.startM === w.endM) {
            if (todayMonth === w.startM && todayDate >= w.startD && todayDate <= w.endD) inRange = true;
        } else {
            if ((todayMonth === w.startM && todayDate >= w.startD) || (todayMonth === w.endM && todayDate <= w.endD)) inRange = true;
        }
        if (inRange) { currentWeekNum = w.w; currentWeekObj = w; break; }
    }

    if (!currentWeekNum) {
        for (var j = 0; j < weeks.length; j++) {
            var wf = weeks[j];
            var ws = new Date(2025, wf.startM - 1, wf.startD);
            if (ws >= now) { currentWeekNum = wf.w; currentWeekObj = wf; break; }
        }
    }

    var weekInfo = "", countdownText = "";
    if (currentWeekObj) {
        weekInfo = currentWeekObj.label + "（" + currentWeekObj.d + "）";
        var weekStart = new Date(2025, currentWeekObj.startM - 1, currentWeekObj.startD);
        var diffMs = weekStart - now;
        daysUntilWeek = Math.ceil(diffMs / 86400000);
        if (daysUntilWeek > 0) countdownText = "距开学还有 " + daysUntilWeek + " 天";
        else if (daysUntilWeek === 0) countdownText = "🎉 今天开学！";
        else countdownText = "已开学第 " + (-daysUntilWeek) + " 天";
    } else {
        weekInfo = "假期中"; countdownText = "距开学待定";
    }
    document.getElementById('navWeekInfo').textContent = "当前：" + weekInfo;
    document.getElementById('navCountdown').textContent = countdownText;

    var chips = document.querySelectorAll(".week-chip");
    for (var k = 0; k < chips.length; k++) {
        var chipW = parseInt(chips[k].dataset.w);
        if (chipW === currentWeekNum) { chips[k].classList.add("current"); }
        else { chips[k].classList.remove("current"); }
    }

    var items = document.querySelectorAll(".lesson-item");
    for (var m = 0; m < items.length; m++) {
        var itemW = parseInt(items[m].dataset.week);
        if (itemW === currentWeekNum) { items[m].classList.add("now"); }
        else { items[m].classList.remove("now"); }
    }

    if (currentWeekNum > 0) {
        var currentItems = document.querySelectorAll(".lesson-item[data-week='" + currentWeekNum + "']");
        for (var n = 0; n < currentItems.length; n++) {
            currentItems[n].closest(".unit-card").classList.add("open");
        }
    }
}

setTimeout(function() {
    var cards = document.querySelectorAll(".unit-card");
    for (var i = 0; i < cards.length; i++) cards[i].classList.add("open");
    updateClock();
}, 100);

function expandAll() { var c = document.querySelectorAll(".unit-card"); for (var i = 0; i < c.length; i++) c[i].classList.add("open"); }
function collapseAll() { var c = document.querySelectorAll(".unit-card"); for (var i = 0; i < c.length; i++) c[i].classList.remove("open"); }

function jumpToWeek(w) {
    var chips = document.querySelectorAll(".week-chip");
    for (var i = 0; i < chips.length; i++) {
        if (parseInt(chips[i].dataset.w) === w) chips[i].classList.add("active");
        else chips[i].classList.remove("active");
    }
    var items = document.querySelectorAll(".lesson-item");
    var found = false;
    for (var i = 0; i < items.length; i++) {
        if (parseInt(items[i].dataset.week) === w) {
            items[i].closest(".unit-card").classList.add("open");
            items[i].scrollIntoView({ behavior: "smooth", block: "center" });
            found = true;
        }
    }
    if (!found) alert("第" + w + "周暂未安排具体课时");
}

function scrollToCurrent() {
    var currentChip = document.querySelector(".week-chip.current");
    if (currentChip) {
        currentChip.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
        var currentUnit = document.querySelector(".lesson-item.now");
        if (currentUnit) {
            currentUnit.scrollIntoView({ behavior: "smooth", block: "center" });
        }
    } else {
        alert("暂无当前周（可能还没到学期）");
    }
}

function filterAll() {
    var kw = document.getElementById("searchInput").value.toLowerCase().trim();
    var cards = document.querySelectorAll(".unit-card");
    var hasVisible = false;
    for (var ci = 0; ci < cards.length; ci++) {
        var card = cards[ci];
        var unitMatch = (card.dataset.unitName || "").indexOf(kw) !== -1;
        var lessonMatch = false;
        var items = card.querySelectorAll(".lesson-item");
        for (var ii = 0; ii < items.length; ii++) {
            var item = items[ii];
            var match = !kw || (item.dataset.search || "").indexOf(kw) !== -1;
            item.style.display = match ? "" : "none";
            if (match) lessonMatch = true;
        }
        if (!kw) { card.style.display = ""; for (var j = 0; j < items.length; j++) items[j].style.display = ""; hasVisible = true; }
        else if (unitMatch || lessonMatch) { card.style.display = ""; card.classList.add("open"); hasVisible = true; }
        else { card.style.display = "none"; }
    }
    document.getElementById("emptyTip").style.display = hasVisible ? "none" : "block";
}
