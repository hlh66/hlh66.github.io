{ cat:'yicuo', t:'KE2-96', s:'YiCuo100', txt:'[KE2] #96\n\n小学数学材料中有这样一个问题：一个服装厂计划做630 套衣服，已经做了6 天，平均每天做75 套，剩下的要3 天做完，平均每天要做多少套？ 为了让学生积极参与，孙老师把题目改编为：“六一”儿童节要到了，我们三年级要参加表演，需要 演出服装160 套。文心服装厂已经做了5 天，平均每天能20 套，现在离“六一”儿童节还有两天，请你帮 忙算算每天需要完成多少套？ 巧妙的设计激发了学生浓厚的学习兴趣…… 问题： （1）对孙老师成功的教学情境创设进行评析。 （2）阐述教师处理教材内容时的基本要求。 易错100 题中小学科二 让每一个孩子都能遇到好老师 15\n\n(no analysis)' },
{ cat:'yicuo', t:'KE2-97', s:'YiCuo100', txt:'[KE2] #97\n\n学生李某从小父母离异，跟着年老多病的祖父生活，祖父对他管教不严，他经常和社会上的一些无 业青年混混在一起打架斗殴。父亲偶尔回家，对他非打即骂。在学校，他破坏课堂纪律、拖欠作业，完不 成学习任务，还欺负小同学，全班同学都看不起他、疏远他，但他喜欢运动，是班级篮球队的主力队员。 请回答： （1）简述李某不良品德形成的原因； （2）结合案例，分析班主任应如何开展对李某的教育工作。\n\n(no analysis)' },
{ cat:'yicuo', t:'KE2-98', s:'YiCuo100', txt:'[KE2] #98\n\n王老师是初中语文老师，根据教学进度安排，最近她开始讲授古代诗歌单元。在教学时，她先是引 导学生探索五言绝句的平仄规律，刚开始学生总结不准确，经过多次讲解和引导，学生掌握了五言绝句的 平仄规律，随后王老师发现，当学生又学习五言律诗时，他们很快就能总结出五言律诗的平仄规律，再后 来，当学生学习七言律诗时，也很快总结出了其平仄规律。 本单元结束后，王老师进行教学反思：学生之所以能够很容易地总结出七言律诗的平仄规律，是因为 易错100 题中小学科二 让每一个孩子都能遇到好老师 16 学生已经掌握了五言绝句、五言律诗的平仄规律，他们利用已掌握的方法进行分析，很快就能总结出七言 律诗的平仄规律。 问题： （1）请用迁移相关理论分析上述学习现象。 （2）该迁移理论对教学有何启示？\n\n(no analysis)' },
{ cat:'yicuo', t:'KE2-99', s:'YiCuo100', txt:'[KE2] #99\n\n一（2）班的学生经常向刘老师提出一些“稀奇古怪”的问题。比如，当她在课堂上讲太阳和月亮 时，有的学生便会问：“老师，太阳为什么白天出来？月亮为什么晚上才出来？”刘老师对这样的问题还能 回答。但有些学生提出的问题，就让她难以应对了。比如，有的学生会问：“老师，为什么有的小朋友跟爸 爸姓，有的小朋友跟妈妈姓？”“我能成为齐天大圣吗？”“你喜欢熊大还是熊二？”等等。 问题： （1）分析材料中低年级小学生的行为表现。 （2）结合材料谈谈教师应如何对待学生“稀奇古怪”的提问。 易错100 题中小学科二 让每一个孩子都能遇到好老师 17\n\n(no analysis)' },
{ cat:'yicuo', t:'KE2-100', s:'YiCuo100', txt:'[KE2] #100\n\n上学期初，我们班转来个学生叫王伟，他沉迷于网络游戏，导致学习不认真，对班级活动漠不关 心，还常常旷课。 我对王伟定期家访。在家访时了解到，早在王伟读小学的时候，父母为了不让他到处乱跑，便常给他 零花钱去玩电子游戏，以至于形成了网瘾。鉴于此，我建议王伟的父母多抽些时间来与他交流、沟通，并 控制好他的零花钱，尽可能地限制他玩网络游戏。 同时，我发动了全班同学利用各种报刊、网络收集资料，并召开了一次题为“网络游戏给我们带来什 么”的主题班会，通过激烈辩论，最终同学们得出的结论是：中学生玩网络游戏的弊远远大于利，我们不 能沉迷于网络游戏。王伟在班会课后感中写道：“通过主题班会，我才真正意识到经常旷课上网是多么愚蠢。 过去我对学习一直不感兴趣，上课听不懂，整天无所事事，为了消磨时间，我就常常逃课去上网了……” 针对王伟的情况，我语重心长地与他谈心，并为他采取了一项措施：他每坚持一天不上网，就会有一 位同学给他写上一句祝福或鼓励的话。我们班共有50 个同学，有四十九颗火热的心愿意帮助他，我希望他 不要辜负同学们的期望，王伟爽快地说：“没问题。” 此外，为了培养王伟对班集体的责任心，我与班委协商，让他担任学校清洁区卫生评分员，他也非常 乐意地接受了，同时，同学们充分发掘王伟的特长，在每次出黑板报时，就把画报头和插图的任务交给他。 班干部们也非常热心，主动担任王伟各科学习的辅导员，常常辅导他做作业。 一学期过去了，他不再沉迷于网络游戏，学习成绩比以前明显提高，思想也有了很大进步。 问题： 材料中的“我”贯彻了哪些德育原则？结合材料加以分析。\n\n(no analysis)' },
{ cat:'yicuo', t:'KE1-1', s:'YiCuo100', txt:'[KE1] #1\n\n工作多年的张老师有较高水平的教学能力和技巧，班级管理井井有条，还注重激发自我潜能。张老 师所处的教师发展阶段是（ ）。 A.专家生涯阶段 B.退缩生涯阶段 C.更新生涯阶段 D.预备生涯阶段\n\n1.【答案】A 【解析】本题考查教师职业发展阶段。斯德菲依据人文心理学派的自我实现理论，提出教师的人文发 展模式，又称教师更新生涯发展模式，将教师的发展分为以下五个阶段：（1）预备生涯阶段：主要包括初 任教职的教师或重新任职的教师；（2）专家生涯阶段：处于这一阶段的教师已具备较高水平的教学能力与 技能，对学生抱有很高的期望。同时，也能激发自我潜能，达到自我实现的目的；（3）退缩生涯阶段：包 括初期退缩、持续退缩和深度退缩三个阶段；（4）更新生涯阶段：此阶段的教师致力于追求其专业成长、 吸收新知，但仍需要外在的支持，更需要学校行政部门的支持与协助。（5）退出生涯阶段：到了退休年龄， 或由于其他原因而离开教育岗位。故本题选A。' },
{ cat:'yicuo', t:'KE1-2', s:'YiCuo100', txt:'[KE1] #2\n\n陶行知说：“活的人才教育，不是灌输知识，而是将开发文化宝库的钥匙，仅我们知道的交给学生。” 这句话隐含的学生观不包括的是（ ）。 A.教师要重视学生的完整性 B.教师要重视学生的主体性 C.教师要重视学生的发展性 D.教师要重视学生的独立性\n\n2.【答案】A 【解析】本题考查学生观。陶行知的话强调学生是自身学习的主体，我们要尊重学生独立、主体的地 位，促进学生长远发展。题干中未体现重视学生的完整性。故本题选A。' },
{ cat:'yicuo', t:'KE1-3', s:'YiCuo100', txt:'[KE1] #3\n\n张老师选择用诗歌《我用残损的手掌》的教学开展课例研究，并写成课例研究报告提供给青年教师 学习。张老师的角色是（ ）。 A.教学过程的管理者 B.同侪共进的合作者 C.学生成长的示范者 D.校本课程的开发者\n\n3.【答案】B 【解析】本题考查新课程下的教师观。题干中张老师选择用诗歌《我用残损的手掌》的教学开展课例 研究，形成了研究报告，并将这一报告提供给青年教师学习，是与同辈、同侪老师们一起合作共同进步， 体现了张老师是同侪共进的合作者。题干中未体现张老师对于教学过程的管理，也未体现对于学生成长的 示范，排除A、C 项。D 项中校本课程指的是以学校为本位、由学校自己确定的课程，题干中开展课例研究 不属于开发校本课程，排除D 项。故本题选B。' },
{ cat:'yicuo', t:'KE1-4', s:'YiCuo100', txt:'[KE1] #4\n\n李某开设的营业性电子游戏厅，没有在显著位置设立未成年人禁入标志。责令其改正的管理机关是 （ ）。 A.检察机关 B.公安机关 C.文化行政部门 D.教育行政部门\n\n4.【答案】C 【解析】本题考查《中华人民共和国预防未成年犯罪法》。《中华人民共和国预防未成年犯罪法》（2012 年修订）第五十五条规定，营业性歌舞厅以及其他未成年人不适宜进入的场所、营业性电子游戏场所，违 反本法第三十三条的规定，不设置明显的未成年人禁止进入标志，或者允许未成年人进入的，由文化行政 部门责令改正、给予警告、责令停业整顿、没收违法所得，处以罚款，并对直接负责的主管人员和其他直 接责任人员处以罚款；情节严重的，由工商行政部门吊销营业执照。另外，考生需了解新的法律规定，《中 华人民共和国未成年人保护法》（2020 年修订）第五十九条规定，学校、幼儿园周边不得设置烟、酒、彩 票销售网点。禁止向未成年人销售烟、酒、彩票或者兑付彩票奖金。烟、酒和彩票经营者应当在显著位置 设置不向未成年人销售烟、酒或者彩票的标志；对难以判明是不是未成年人的，应当要求其出示身份证件。 易错100 题中小幼科一 让每一个孩子都能遇到好老师 2 任何人不得在学校、幼儿园和其他未成年人集中活动的公共场所吸烟、饮酒。第一百二十三条规定，相关 经营者违反本法第五十八条、第五十九条第一款、第六十条规定的，由文化和旅游、市场监督管理、烟草 专卖、公安等部门按照职责分工责令限期改正，给予警告，没收违法所得，可以并处五万元以下罚款；拒 不改正或者情节严重的，责令停业整顿或者吊销营业执照、吊销相关许可证，可以并处五万元以上五十万 元以下罚款。故本题选C。' },
{ cat:'yicuo', t:'KE1-5', s:'YiCuo100', txt:'[KE1] #5\n\n下列选项中，与“大学生——志愿者”的逻辑关系不一致的是（ ）。 A.“英文书”和“教材” B.“铅笔”和“画笔” C.“老年人”和“科学家” D.“医生”和“护士”\n\n5.【答案】D 【解析】本题考查类比推理。题干中“大学生——志愿者”是交叉关系，A、B、C 项均为交叉关系，D 项“医生”和“护士”是并列关系。故本题选D。' },
{ cat:'yicuo', t:'KE1-6', s:'YiCuo100', txt:'[KE1] #6\n\n教师何某时常在微信朋友圈暗示学生家长送礼，还在家长群里展示家长送的礼物，造成了不良影响。 依据《中华人民共和国教师法》，当地教育行政部门可对何某采取的措施是（ ）。 A.给予行政处分或者解聘 B.给予行政拘留或者罚款 C.责令退还礼物，加倍罚款 D.责令停课，永久取消教师资格 易错100 题中小幼科一 让每一个孩子都能遇到好老师 2\n\n6.【答案】A 【解析】本题考查教育法律法规。《中华人民共和国教师法》第三十七条规定，教师有下列情形之一的， 由所在学校、其他教育机构或者教育行政部门给予行政处分或者解聘：（一）故意不完成教育教学任务给教 育教学工作造成损失的；（二）体罚学生，经教育不改的；（三）品行不良、侮辱学生，影响恶劣的。题干 中教师何某品行不良，造成了不良影响，可以给予行政处分或解聘。故本题选A。' },
{ cat:'yicuo', t:'KE1-7', s:'YiCuo100', txt:'[KE1] #7\n\n某次体育课上，因老师迟迟未到，班长刘某便组织同学到操场踢足球。在踢球时，学生宋某突然昏 倒在地，经抢救无效死亡。经调查得知，宋某患有先天性心脏病而学校事先并不知晓。在这一事故中，应 依法承担责任的是（ ）。 A.学校和宋某的监护人 B.学校和刘某的监护人 C.刘某和宋某的监护人 D.刘某的监护人和宋某的监护人\n\n7.【答案】A 【解析】本题考查教育法律法规。《学生伤害事故处理办法》第九条第（四）项规定，因“学校组织学 生参加教育教学活动或者校外活动，未对学生进行相应的安全教育，并未在可预见的范围内采取必要的安 全措施的”造成的学生伤害事故，学校应当依法承担相应的责任。第十条第（三）项规定，因“学生或者 其监护人知道学生有特异体质，或者患有特定疾病，但未告知学校的”情形造成学生伤害事故，学生或者 未成年学生监护人应当依法承担相应的责任。题干中，体育课上老师迟迟未到，班长组织活动发生的伤害 事故，学校应该承担责任。宋某患有先天性心脏病而学校事先并不知晓，所以宋某或其监护人应当承担责 任。故本题选A。' },
{ cat:'yicuo', t:'KE1-8', s:'YiCuo100', txt:'[KE1] #8\n\n在教育测量中，题目难度计算常用极端分组法。现共有200 人回答了某道试题，总分排名最前面的 54 人中有45 人答对，总分排名最后的54 人中有9 人答对，则这道题的难度是（ ）。 A.0.83 B.0.58 C.0.50 D.0.32\n\n8.【答案】C 【解析】本题考查教育测量中的难度。极端分组法是项目分析的一种方法。先将受测者依照测验总分 的高低次序排列；然后划出人数相等的高分组和低分组，一般取样本中处于两端27%的个案为两极端组； 再分别求出两组在每一题目上的通过率。所以题干中这道题的难度应为（45/54+9/54）/2=0.5。故本题选 C。' },
{ cat:'yicuo', t:'KE1-9', s:'YiCuo100', txt:'[KE1] #9\n\n下列关于素质教育的表述中，不正确的是（ ）。 A.素质教育更要重视德育 B.素质教育主要适用于基础教育 C.素质教育应遵循教育规律 D.素质教育不要求学生平均发展\n\n9.【答案】B 【解析】本题考查素质教育观。关于素质教育，必须明确其内涵和外延。素质教育重视德智体美劳教 育，而且德育为先，五育并举，更加重视德育，A 选项正确；素质教育应当贯穿于幼儿教育、中小学教育、 易错100 题中小幼科一 让每一个孩子都能遇到好老师 3 职业教育、成人教育、高等教育等各级各类教育，应当贯穿于学校教育、家庭教育和社会教育等各个方面。 所以素质教育不仅主要适用于基础教育，也适用于其他阶段的教育，B 选项错误；素质教育应该遵循教育 规律，促进学生健康发展，C 选项正确；素质教育要求促进学生全面发展和个性发展，并没要求平均发展， D 选项正确。故本题选B。' },
{ cat:'yicuo', t:'KE1-10', s:'YiCuo100', txt:'[KE1] #10\n\n每周五，崔老师都会带领老师们研讨并反思学校教学中出现的问题，经常通过电子邮件、电话和登 门拜访等形式向大学教授请教，或是与校外名师共同探讨，以找到解决问题的方法。该做法体现的教师专 业发展途径是（ ）。 A.校本研修 B.自主学习 C.行动研究 D.专业支援\n\n10.【答案】A 【解析】本题考查教师专业发展途径。教师专业发展途径包括：（1）校本导向，包括校本研修、校本 培训等；（2）注重研究，包括行动研究、叙事研究等；（3）注重合作，倡导高校与中小学的合作、建立学 习共同体、同伴互助等；（4）强调反思，包括反思性实践、反思性教学、建立教学档案袋等。校本研修是 基于学校，为了学校，发展学校的研修，需要多角度、多方面地整合力量，创造良好的校本研修生态环境， 让教师在专家引领、同伴互助、个体反思实践中实现专业发展。题干中强调崔老师带领各位老师研讨问题、 以各种形式向专业人士请教，正是体现了校本研修的概念。故本题选A。' },
{ cat:'yicuo', t:'KE1-11', s:'YiCuo100', txt:'[KE1] #11\n\n《中华人民共和国宪法》规定，上级监察委员会对下级监察委员会的工作进行（ ）。 A.监督 B.监察 C.领导 D.指导\n\n11.【答案】C 【解析】本题考查《中华人民共和国宪法》。《中华人民共和国宪法》第一百二十五条规定，中华人民 共和国国家监察委员会是最高监察机关。国家监察委员会领导地方各级监察委员会的工作，上级监察委员 会领导下级监察委员会的工作。上级监察委员会对下级监察委员会的工作进行领导。故本题选C。' },
{ cat:'yicuo', t:'KE1-12', s:'YiCuo100', txt:'[KE1] #12\n\n王老师在教学中总是尝试新的教学方法。在音乐课上，王老师鼓励同学们给经典音乐重新填词，评 选“最美歌词”和“最具创意奖”，同学们对音乐课的兴趣大增。下列选项中是孔子所说，且与王老师做法 相符的是（ ）。 A.“吾生也有涯，而知也无涯” B.“学而不已，阖棺乃止” C.“古人于为学，终生与之俱” D.“朝闻道，夕死可矣”\n\n12.【答案】B 【解析】本题考查终身学习。A 项出自庄子《养生主》，意思是说人生是有限的，但知识是无限的（没 有边界的）；B 项出自汉代韩婴《韩诗外传》，意思是说学习没有完结的时候，直到死去才算停止，是孔子 的言论。C 项出自《梁启超：在政治与学术之间》，是梁启超教育子女的语句，意思是说古人对于治学求学， 是坚持不懈，终身追求的目标。D 项出自《论语·里仁第四》，意思是说早上明白了仁义之道，晚上为它去 死也可以。题干中王老师尝试探索新的教学方法，体现的是终身学习的理念。符合题目要求的，只能选择 B 项。故本题选B。' },
{ cat:'yicuo', t:'KE1-13', s:'YiCuo100', txt:'[KE1] #13\n\n下列现象，不是因地球公转而产生的是（ ）。 A.昼夜的变化 B.四季的变化 易错100 题中小幼科一 让每一个孩子都能遇到好老师 3 C.日食 D.月食\n\n13.【答案】A 【解析】本题考查地理常识。地球公转就是地球按一定轨道围绕太阳转动。地球公转产生的现象有四 季的变化、日食、月食等现象，而昼夜交替的变化是地球自转引起的。故本题选A。' },
{ cat:'yicuo', t:'KE1-14', s:'YiCuo100', txt:'[KE1] #14\n\n在Word 的编辑状态下，选择整个表格，执行“表格”菜单中的“删除行”命令，对其结果表述正 确的是（ ）。 A.表格中一行被删除 B.整个表格被删除 C.表格中一列被删除 D.表格没有被删除\n\n14.【答案】B 【解析】本题考查Word 的应用。在Word 的编辑状态下，如果选中了整个表格，然后执行删除行命令， 会使整个表格被删除。故本题选B。 易错100 题中小幼科一 让每一个孩子都能遇到好老师 4' },
{ cat:'yicuo', t:'KE1-15', s:'YiCuo100', txt:'[KE1] #15\n\n初一语文单元测验中，王老师发现某学生抄袭了一道1 分的题目。阅卷时，他在这个学生的试卷上 打分为“90-1”，该生拿到试卷后非常惭愧，要求改为89 分。王老师给他批了一个“89+1”，并对他说：“知 错能改就好，这1 分是对你能认识和改正错误的奖励。”王老师的做法所体现的教师劳动特殊性不包括（ ）。 A.阶段的特殊性 B.任务的特殊性 C.对象的特殊性 D.工具的特殊性\n\n15.【答案】A 【解析】本题考查教师劳动的特殊性。教师劳动的特殊性包括目的的特殊性、对象的特殊性、手段（工 具）的特殊性、过程的特殊性、内容（任务）的特殊性和“产品”的特殊性。题干中王老师给考试抄袭1 分题目的学生打分“90-1”和“89+1”，既客观给予学生分数，又教育学生要诚信和知错能改，这体现了劳 动任务的特殊性。王老师使用加减1 分的方式，保护了学生的自尊心，体现了劳动对象的特殊性。使用加 减1 分的方式本身也是劳动工具手段的特殊性。A 项说法错误且跟题干无关。故本题选A。' },
{ cat:'yicuo', t:'KE1-16', s:'YiCuo100', txt:'[KE1] #16\n\n找规律填数字是一个很有趣的活动，特别锻炼观察和思考能力。下列选项中，填入数列“101、169、 305、577、（ ）、2209”空缺处的数字，正确的是（ ）。 A.1118 B.1119 C.1120 D.1121\n\n16.【答案】D 【解析】本题考查数字推理。将题干中原数列每一项作差，得到的数列为68，136，272， （544）， （1088）， 是一个公比为2 的等比数列，原数列括弧处应填的数据为：577+544=1121，1121+1088=2209。印证了原数 列最后一个数字。说明我们找的规律是正确的。故本题选D。' },
{ cat:'yicuo', t:'KE1-17', s:'YiCuo100', txt:'[KE1] #17\n\n下列表述，与“‘并非’只有本地人当经理，才能把企业搞好”的判断一致的是（ ）。 A.要想把企业搞好，必须由本地人当经理 B.只要把企业搞好了，谁来当经理都可以 C.不由本地人当经理，也可以把企业搞好 D.不由本地人当经理，就不能把企业搞好\n\n17.【答案】C 【解析】本题考查逻辑推理。题干翻译完后是：—（企业搞好推出本地人当经理）即：—（P 推出q）， 而—（P 推出q）等价于（P 且—q），翻译过来就是：企业搞好了，不是本地人当经理；再进一步就是，不 由本地人当经理，也能把企业搞好。故本题选C。' },
{ cat:'yicuo', t:'KE1-18', s:'YiCuo100', txt:'[KE1] #18\n\n李老师坚持写“作业札记”，其中记录了学生做作业过程中的一些有趣的、特殊的现象，并据此分 析学生在完成作业中的心理变化，然后再将自己的判断结果作为设计、布置、批改和反馈作业的重要依据， 从学生观的角度分析，该教师的做法（ ）。 A.注重了学生发展的差异性 B.发挥了教学的专业自主性 C.注重了学生发展的主体性 D.提升了布置作业的有效性\n\n18.【答案】A 【解析】本题考查“以人为本”的学生观。李老师通过“作业札记”，记录学生有趣、特殊的具体作业 问题，并据此分析学生不同的心理变化，再做具体反馈，体现了教师注重学生发展的差异，注重因材施教。 而B、D 两项都不是从学生观角度分析所得，C 项则没能在题目中体现。故本题选A。' },
{ cat:'yicuo', t:'KE1-19', s:'YiCuo100', txt:'[KE1] #19\n\n某中学违规向学生收取补课费。依据《中华人民共和国教育法》，责令该校退还所收费用的机关是 （ ）。 A.教育行政部门 B.工商管理部门 C.纪检部门 D.公安部门 易错100 题中小幼科一 让每一个孩子都能遇到好老师 4\n\n19.【答案】A 【解析】本题考查《中华人民共和国教育法》。《中华人民共和国教育法》第七十八条规定，学校及其 他教育机构违反国家有关规定向受教育者收取费用的，由教育行政部门或者其他有关行政部门责令退还所 收费用；对直接负责的主管人员和其他直接责任人员，依法给予处分。故本题选A。' },
{ cat:'yicuo', t:'KE1-20', s:'YiCuo100', txt:'[KE1] #20\n\n量子概念的提出，第一次把能量的不连续性引入对自然过程的深入认识，对其后量子理论的进一步 发展起到了重要作用。这一概念的提出者是（ ）。 A.普朗克 B.洛伦兹 C.爱因斯坦 D.麦克斯韦\n\n20.【答案】A 【解析】本题考查西方科学家的成就。德国物理学家普朗克是量子力学的创始人，他于1894 年起，开 始研究黑体辐射问题，发现普朗克辐射定律，并在论证过程中提出了能量子概念和普朗克常数，由于这一 发现，普朗克获得了1918 年诺贝尔物理学奖；B 选项，洛伦兹是近代卓越的理论物理学家、数学家，经典 电子论的创立者；C 选项，爱因斯坦是犹太裔物理学家，创立了广义相对论，为核能的开发也奠定了理论 基础；D 选项，麦克斯韦是英国物理学家、数学家，经典电动力学的创始人，统计物理学的奠基人之一。 故本题选A。 易错100 题中小幼科一 让每一个孩子都能遇到好老师 5' },
{ cat:'yicuo', t:'KE1-21', s:'YiCuo100', txt:'[KE1] #21\n\n中学生邹某上课时玩手机游戏，班主任王老师发现后，当场删除了邹某的游戏账号和他购买的游戏 装备，并告诫邹某不要在上课时玩游戏。课后，王老师将手机返还给了邹某，王老师的做法（ ）。 A.合法，教师有权批评和管教学生 B.不合法，侵犯了邹某的财产权 C.合法，教师有权没收学生的手机 D.不合法，侵犯了邹某的隐私权\n\n21.【答案】B 【解析】本题考查财产权。邹某的游戏账号和他购买的游戏装备属于邹某的私人财产，邹某对其具有 相应的财产权。因此，教师随意删除邹某的游戏账号和购买的游戏装备，是不合法行为，侵犯了邹某的财 产权。故本题选B。' },
{ cat:'yicuo', t:'KE1-22', s:'YiCuo100', txt:'[KE1] #22\n\n某中学规定，凡主动参加所在地区教研室组织的教研活动的教师，在职称晋升评优评选中予以优先 考虑。该学校的做法（ ）。 A.合法，有利于教师科学研究权的落实和保障 B.合法，有利于教师教学自由权的落实和保障 C.不合法，侵犯了其他教师享受平等待遇的权利 D.不合法，违反了教师考核评价的客观公正原则\n\n22.【答案】A 【解析】本题考查教师法的相关规定。《中华人民共和国教师法》第二十二条规定，学校或者其他教育 机构应当对教师的政治思想、业务水平、工作态度和工作成绩进行考核。A 项，科学研究权是指教师从事 科学研究、学术交流，参加专业的学术团体，在学术活动中充分发表意见的权利。题干中，对于积极参与 当地组织的教研活动的老师，在教师的职称晋升、评优评先中予以优先考虑。对注重教育教学质量和专业 技能成长的教师，对表现优异、工作态度积极的老师给予一定的奖励，这种做法可以提高教师参与教学研 究、科学研究等方面的主动性、积极性，有利于教师科学研究权的保障和落实。A 项说法正确。B 项，教学 自由权在题干中并未涉及，故排除。C 项，学校的做法侵犯了教师平等享有待遇的权利，题干中并未体现， 故排除。D 项，题干中强调的是对表现优异的老师适当在考核中加以“优先考虑”，并未违背教师评价的客 观公正原则。B、C、D 项，均不符合题意。故本题选A。' },
{ cat:'yicuo', t:'KE1-23', s:'YiCuo100', txt:'[KE1] #23\n\n李丽同学的爸爸跟学校校长是好朋友，班主任知道后，主动给李丽调整了座位，在课堂教学中给李 丽更多的机会回答问题，并让其担任班长。班主任的行为（ ）。 A.有利于促进家校合作 B.有利于履行班主任职责 C.影响了其他学生的成长 D.影响了校长的廉洁从教\n\n23.【答案】C 【解析】本题考查教师职业道德规范。题干中的班主任因为学生李丽的父亲和校长的关系好，就主动 给予其更多的机会，并让其担任班长。班主任没有做到公正待生的师德要求，影响了其他学生的成长。故 本题选C。' },
{ cat:'yicuo', t:'KE1-24', s:'YiCuo100', txt:'[KE1] #24\n\n于老师总是根据学生不同的学习基础设计课堂提问和练习。这表明于老师（ ）。 A.遵循教学规律，实现学生全面发展 B.关注学生差异，促进全体学生发展 C.注重分层教学，促进学生均衡发展 D.注重循序渐进，实现师生教学相长\n\n24.【答案】B 【解析】本题考查“以人为本”的学生观。于老师根据学生不同的学习基础设计课堂提问和练习，体 现了他关注学生的个体差异，B 项正确。教学规律是教学过程中客观存在的，并不会因为学生的认知水平 不同而变化，不是题干所强调的重点，所以A 项错误。分层教学是教师根据学生现有的知识、能力水平和 潜力倾向把学生科学地分成几组水平相近的群体并区别对待，题干所述并不属于分组教学，所以C 项错误。 循序渐进是要求教学要按照学科的逻辑系统和学生认知发展的顺序进行，题干中，于老师根据学生认知发 展的程度进行教学，与顺序无关，所以D 项错误。故本题选B。' },
{ cat:'yicuo', t:'KE1-25', s:'YiCuo100', txt:'[KE1] #25\n\n在中班绘画活动中，李老师将自己画好的“小汽车”贴在墙上，要求孩子们照着画。李老师看了小 明的画后严厉地说：“小汽车怎么可能有翅膀？去前面看我画的，照着画！”关于李老师的做法，下列评价 不恰当的是（ ）。 A.忽视了对幼儿的天性保护 B.忽视了对幼儿权利的尊重 C.忽视了对幼儿的正确引导 D.忽视了对幼儿特长的培养 易错100 题中小幼科一 让每一个孩子都能遇到好老师 5\n\n25.【答案】D 【解析】本题考查素质教育观。素质教育是促进幼儿个性发展的教育，是以培养幼儿创新精神和实践 能力为重点的教育。题干中李老师要求幼儿照着自己画好的“汽车”画画，忽视了幼儿的想象力和创造力， 不利于保护幼儿的天性和个性，没有做到对幼儿权利的尊重，也没有正确引导幼儿。题干中不涉及幼儿特 易错100 题中小幼科一 让每一个孩子都能遇到好老师 6 长培养的问题。故本题选D。' },
{ cat:'yicuo', t:'KE1-26', s:'YiCuo100', txt:'[KE1] #26\n\n公办幼儿园教师黄某曾有轻微体罚幼儿的行为，园长对其进行了批评教育。没过多久，黄某又再次 同样体罚幼儿。对于黄某，可由所在教育行政部门依法给予（ ）。 A.行政处罚 B.行政处分 C.撤销教师资格 D.刑事处罚\n\n26.【答案】B 【解析】本题考查《中华人民共和国教师法》。《中华人民共和国教师法》第三十七条规定，教师有下 列情形之一的，由所在学校、其他教育机构或者教育行政部门给予行政处分或者解聘：（一）故意不完成教 育教学任务给教育教学工作造成损失的；（二）体罚学生，经教育不改的；（三）品行不良、侮辱学生，影 响恶劣的。教师有前款第（二）项、第（三）项所列情形之一，情节严重，构成犯罪的，依法追究刑事责 任。题干中所述情形属于体罚幼儿屡教不改。故本题选B。' },
{ cat:'yicuo', t:'KE1-27', s:'YiCuo100', txt:'[KE1] #27\n\n《中华人民共和国宪法》规定，中华人民共和国人民检察院是（ ）。 A.国家的法律监督机关 B.国家的法律监察机关 C.国家的法律检察机关 D.国家的法律检查机关\n\n27.【答案】A 【解析】本题考查《中华人民共和国宪法》。《中华人民共和国宪法》第一百三十四条规定，中华人民 共和国人民检察院是国家的法律监督机关。故本题选A。' },
{ cat:'yicuo', t:'KE1-28', s:'YiCuo100', txt:'[KE1] #28\n\n下列选项中，与“医生——护士”的逻辑关系相同的是（ ）。 A.“军人”和“军医” B.“教授”和“助教” C.“校长”和“教师” D.“法警”和“警察”\n\n28.【答案】B 【解析】本题考查类比推理。题干中“医生——护士”是反对关系，即是医生就不是护士，是护士就 不是医生。A 项“军人”和“军医”是包含关系，军人中会看病的是军医。C 项“校长”和“教师”是交叉 关系，有的校长就是教师。D 项“法警”和“警察”是包含关系，“法警”即司法警察，是司法机关所设执 行特定任务的警察。故本题选B。' },
{ cat:'yicuo', t:'KE1-29', s:'YiCuo100', txt:'[KE1] #29\n\n找规律填数字是一项很有趣的活动，特别锻炼观察和思考能力。下列选项中，填入数列“2、4、12、 52、（ ）、32660”空缺处的数字，正确的是（ ）。 A.624 B.628 C.632 D.636\n\n29.【答案】B 【解析】本题考查数字推理。观察数列发现，从第三项开始，后一项等于前两项相乘加4。即：12=2 ×4+4；52=4×12+4。所以空缺处数字应为12×52+4=628。故本题选B。' },
{ cat:'yicuo', t:'KE1-30', s:'YiCuo100', txt:'[KE1] #30\n\n某幼儿园职工家属刘某侵占幼儿园的一间园舍，用于经营快递业务。根据《中华人民共和国教育法》， 刘某应承担（ ） A.刑事责任 B.行政责任 C.民事责任 D.违宪责任\n\n30.【答案】C 【解析】本题考查教育法律法规。《中华人民共和国教育法》第七十二条规定，结伙斗殴、寻衅滋事， 扰乱学校及其他教育机构教育教学秩序或者破坏校舍、场地及其他财产的，由公安机关给予治安管理处罚； 构成犯罪的，依法追究刑事责任。侵占学校及其他教育机构的校舍、场地及其他财产的，依法承担民事责 任。题干中，刘某占用幼儿园的园舍经营快递业务，应当承担民事责任。故本题选C。' },
{ cat:'yicuo', t:'KE1-31', s:'YiCuo100', txt:'[KE1] #31\n\n根据联合国《儿童权利公约》，政府各部门和机构在制定相关政策和落实措施时应首先考虑（ ）。 A.儿童最大利益 B.儿童优先 C.儿童不受任何歧视 D.尊重儿童的原则\n\n31.【答案】A 【解析】本题考查《儿童权利公约》的原则。儿童最大利益原则是指涉及儿童的一切事物和行为，都 应首先考虑以儿童的最大利益为出发点。联合国《儿童权利公约》第三条规定，关于儿童的一切行动，不 论是由公私社会福利机构、法院、行政当局或立法机构执行，均应以儿童的最大利益为一种首要考虑；缔 约国承担确保儿童享有其幸福所必需的保护和照料，考虑到其父母、法定监护人、或任何对其负有法律责 任的个人的权利和义务，并为此采取一切适当的立法和行政措施。故本题选A。 易错100 题中小幼科一 让每一个孩子都能遇到好老师 7' },
{ cat:'yicuo', t:'KE1-32', s:'YiCuo100', txt:'[KE1] #32\n\n根据《幼儿园工作规程》，下列说法正确的是（ ）。 A.幼儿园规模一般不超过500 人 B.入园幼儿只能由法定监护人接送 C.幼儿园一日活动组织应当动静交替 D.幼儿入园可进行健康检查和认知测查 易错100 题中小幼科一 让每一个孩子都能遇到好老师 6\n\n32.【答案】C 【解析】本题考查《幼儿园工作规程》。《幼儿园工作规程》第十一条规定，幼儿园规模应当有利于幼 儿身心健康，便于管理，一般不超过360 人。A 项错误。第十三条规定，入园幼儿应当由监护人或者其委 托的成年人接送。B 项错误。第十条规定，幼儿入园前，应当按照卫生部门制定的卫生保健制度进行健康 检查，合格者方可入园。幼儿入园除进行健康检查外，禁止任何形式的考试或测查。D 项错误。第二十六 条规定，幼儿一日活动的组织应当动静交替，注重幼儿的直接感知、实际操作和亲身体验，保证幼儿愉快 的、有益的自由活动。C 项正确，故本题选C。' },
{ cat:'yicuo', t:'KE1-33', s:'YiCuo100', txt:'[KE1] #33\n\n我国医学历史悠久，很早就有了中医学理论，后世不断丰富和发展，产生许多中医学著作。要通过 一本中医学著作了解我国古代药物学，生物学，矿物学，化学等诸多科学领域成就，下列选项中适合的是 （ ）。 A.《黄帝内经》 B.《伤寒杂病论》 C.《千金方》 D.《本草纲目》\n\n33.【答案】D 【解析】本题考查古代医学成就。《黄帝内经》是中国最早的医学典籍，传统医学四大经典著作之一。 是一本综合性的医书，在黄老道家理论上建立了中医学上的“阴阳五行学说”、“脉象学说”、“藏象学说” 等学说，奠定了人体生理、病理、诊断以及治疗的认识基础，被称为医之始祖。《伤寒杂病论》的作者是张 仲景，中国传统医学著作之一。它系统地分析了伤寒的原因、症状、发展阶段和处理方法，创造性地确立 了对伤寒病的“六经分类”的辨证施治原则，奠定了理、法、方、药的理论基础。《千金方》的作者是孙思 邈，是综合性临床医著，被誉为中国最早的临床百科全书。《本草纲目》的作者是李时珍，书中不仅考证了 过去本草学中的若干错误，综合了大量科学资料，提出了较科学的药物分类方法，融入先进的生物进化思 想，并反映了丰富的临床实践，是中国古代汉医集大成者，被誉为“东方药物巨典”。《本草纲目》广泛涉 及医学，药物学，生物学，矿物学，化学，环境与生物，遗传与变异等诸多科学领域，对人类近代科学以 及医学方面影响巨大，是我国医药宝库中的一份珍贵遗产。故本题选D。' },
{ cat:'yicuo', t:'KE1-34', s:'YiCuo100', txt:'[KE1] #34\n\n1979 年我国第一艘航天测量船投入使用，成为世界上第四个拥有远洋航天测量船的国家，该航天 测量船的名称是（ ）。 A.大洋一号 B.远望一号 C.东方红一号 D.向阳红一号\n\n34.【答案】B 【解析】本题考查科技常识。远望1 号测量船是由中国船舶工业集团公司下属的708 研究所开发和设 计，江南造船（集团）有限责任公司制造的第一代综合性航天远洋测量船，主要担负卫星、飞船和火箭飞 行器全程飞行试验测量和控制任务，圆满完成远程运载火箭、气象卫星、载人飞船等57 次国家级重大科研 试验任务，为国家和民族作出了巨大的贡献，被誉为“航天功勋船”，享有“海上科学城”的美誉，退役后 作为爱国主义和科普教育场所向公众开放。东方红一号是我国第一颗人造卫星；大洋一号是目前中国第一 艘现代化的综合性远洋科学考察船，也是我国远洋科学调查的主力船舶。向阳红一号船是国家海洋局建造 的第一艘水文气象船，也是我国第一艘吨位比较大的气象船。故本题选B。' },
{ cat:'yicuo', t:'KE1-35', s:'YiCuo100', txt:'[KE1] #35\n\n绘画活动中小班幼儿欢欢总是把色彩涂到轮廓线外面，下午李老师当着全班的面对家长说欢欢很不 认真，总是画错。李老师做法（ ）。 A.错误，忽视了幼儿动作发展 B.错误，不能讽刺挖苦幼儿 C.准确，提高了幼儿的绘画能力 D.正确，应该严格要求幼儿\n\n35.【答案】A 【解析】本题考查幼儿发展的特点。小班幼儿大肌肉动作发展早而精细动作发展的晚，所以总是将颜 色涂到轮廓线外面，李老师的做法是忽视幼儿动作发展规律的表现。故本题选A。 易错100 题中小幼科一 让每一个孩子都能遇到好老师 8' },
{ cat:'yicuo', t:'KE1-36', s:'YiCuo100', txt:'[KE1] #36\n\n某地区文化执法部门在对当地一家网吧进行巡查时，发现有未成年人正在网吧上网。根据《中华人 民共和国未成年人保护法》的规定，文化执法部门可以对该网吧采取的措施是（ ）。 A.予以关闭，依法吊销营业执照 B.责令改正，依法给予行政处罚 C.予以查封，依法没收违法所得 D.责令停业，依法追究民事责任\n\n36.【答案】B 【解析】本题考查《中华人民共和国未成年人保护法》。《中华人民共和国未成年人保护法》（2012 年 修订）第六十六条规定，在中小学校园周边设置营业性歌舞娱乐场所、互联网上网服务营业场所等不适宜 未成年人活动的场所的，由主管部门予以关闭，依法给予行政处罚。营业性歌舞娱乐场所、互联网上网服 务营业场所等不适宜未成年人活动的场所允许未成年人进入，或者没有在显著位置设置未成年人禁入标志 的，由主管部门责令改正，依法给予行政处罚。题干中，文化执法部门巡查网吧时发现有未成年人正在上 网，应当对其责令改正，依法给予行政处罚。故本题选B。' },
{ cat:'yicuo', t:'KE1-37', s:'YiCuo100', txt:'[KE1] #37\n\n京剧《贵妃醉酒》经京剧大师梅兰芳倾尽毕生心血精雕细琢，是梅派经典代表剧目之一。它源自于 古代一部戏曲，该戏曲是（ ）。 A.《桃花扇》 B.《南柯梦》 C.《牡丹亭》 D.《长生殿》\n\n37.【答案】D 【解析】本题考查明清戏曲。京剧《贵妃醉酒》又名《百花亭》，是一出单折戏，取材于中国唐朝历史 人物杨贵妃的故事，经过中国著名京剧表演艺术家梅兰芳先生创作、表演而广为人知，是梅派代表剧目之 一。该剧描写的是杨玉环深受唐明皇的荣宠，本是约唐明皇百花亭赴筵，但久候不至，随后知道他早已转 驾西宫，于是羞怒交加，万端愁绪无以排遣，遂命高力士、裴力士添杯奉盏，饮致大醉，后来怅然返宫的 一段情节。该剧源自清初剧作家洪昇创作的传奇《长生殿》。A 选项，《桃花扇》是清代文学家孔尚任创作 的传奇剧本，该剧以侯方域、李香君的悲欢离合为主线，展现了明末南京的社会现实。B 选项，《南柯梦》 改编自“临川四梦”之一的《南柯记》，作者为明朝剧作家汤显祖。该剧讲述了唐朝落魄武官淳于棼的奇幻 之旅。C 选项，《牡丹亭》是明代剧作家汤显祖创作的传奇。该剧描写了官家千金杜丽娘对梦中书生柳梦梅 倾心相爱，竟伤情而死，化为魂魄寻找现实中的爱人，人鬼相恋，最后起死回生，终于与柳梦梅永结同心 的故事。D 选项，《长生殿》作者为清初剧作家洪昇。该剧主要讲述了唐明皇与杨贵妃的故事。故本题选D。' },
{ cat:'yicuo', t:'KE1-38', s:'YiCuo100', txt:'[KE1] #38\n\n下列选项中，与“车票——票据”逻辑关系相同的是（ ）。 A.飞机票——船票 B.戏票——入场券 C.购水票——门票 D.餐券——优惠券\n\n38.【答案】B 【解析】本题考查类比推理。题干中“车票——票据”属于种属关系，即车票是票据的一种。B 选项， “戏票——入场券”也属于种属关系，即戏票属于入场券的一种。A 项属于反对关系，C、D 项没有必然的 逻辑关系。故本题选B。' },
{ cat:'yicuo', t:'KE1-39', s:'YiCuo100', txt:'[KE1] #39\n\n为解决新建小区幼儿入园难的问题，某房产开发公司在所建小区引入了一家由某教育发展集团独资 举办的幼儿园。根据《中华人民共和国教育法》的规定，有权确立该幼儿园管理体制的是（ ）。 A.当地人民政府 B.当地教育行政部门 易错100 题中小幼科一 让每一个孩子都能遇到好老师 7 C.该教育发展集团 D.该房产开发公司\n\n39.【答案】C 【解析】本题考查《中华人民共和国教育法》。《中华人民共和国教育法》第三十一条规定，学校及其 他教育机构的举办者按照国家有关规定，确定其所举办的学校或者其他教育机构的管理体制。故本题选C。' },
{ cat:'yicuo', t:'KE1-40', s:'YiCuo100', txt:'[KE1] #40\n\n如果太阳不发光，那么地球上的人们仍然能够用肉眼直接看到的天体是（ ）。 A.彗星 B.金星 C.流星 D.月亮\n\n40.【答案】C 【解析】本题考查宇宙天体。流星是指运行在星际空间的流星体，通常包括宇宙尘粒和固体块等空间 物质。在接近地球时由于受到地球引力的摄动而被地球吸引，从而进入地球大气层，并与大气摩擦燃烧所 产生的光迹，它不是由于反射了恒星发出的光而被人观察到的，而A、B、D 选项都是需反射恒星发出的光 易错100 题中小幼科一 让每一个孩子都能遇到好老师 9 才能被人看到，其本身不发光。故本题选C。' },
{ cat:'yicuo', t:'KE1-41', s:'YiCuo100', txt:'[KE1] #41\n\n周老师在活动课中趁孩子自主活动的时候，拿起手机看微信，周老师给部分孩子看手机里面漂亮的 图片及有趣的小视频，周老师的行为（ ）。 A.不正确，不利于公正地对待幼儿 B.不正确，不利于保护幼儿的安全 C.正确，有助于拓宽幼儿的知识面 D.正确，有助于建立师幼关系\n\n41.【答案】B 【解析】本题考查教师职业道德规范。《中小学教师职业道德规范》（2008 年修订）中“关爱学生”要 求教师关心爱护全体学生，尊重学生人格，平等公正对待学生。对学生严慈相济，做学生良师益友。保护 学生安全，关心学生健康，维护学生权益。不讽刺、挖苦、歧视学生，不体罚或变相体罚学生。周老师在 活动课上玩手机，没有尽到相应的管理保护职责，不利于保护幼儿的安全。故本题选B。' },
{ cat:'yicuo', t:'KE1-42', s:'YiCuo100', txt:'[KE1] #42\n\n下列选项表述的内容里含有“没有学会分享，就不能感受更多快乐”的是（ ）。 A.只要学会分享，就能感受更多快乐 B.即使学会分享，也未必能感受更多快乐 C.没感受更多快乐，是因为没学会分享 D.只有学会分享，才能感受更多快乐\n\n42.【答案】D 【解析】本题考查翻译推理。题干翻译为：“没有学会分享”推出“不能感受更多快乐”，等价于“感 受更多快乐”推出“学会分享”。AC 选项翻译为：“学会分享”推出“感受更多快乐”，与题干相反。B 选项 多了限定词“未必”。只有D 选项“只有……，才……”后推前，翻译为“感受更多快乐”推出“学会分享”， 与题干意思完全相同。故本题选D。' },
{ cat:'yicuo', t:'KE1-43', s:'YiCuo100', txt:'[KE1] #43\n\n某幼儿园正在开展游戏活动，教师王某活动前反复提醒小朋友注意安全，活动中也一直在旁边组织、 观察、保护，但是意外还是发生，小明在跳跃时摔伤手臂，王某马上将小明送到医院检查，经医生诊断， 小明右手骨折。应对小明所受伤害承担责任的主体是（ ）。 A.幼儿园 B.教师王某 C.小明的监护人 D.幼儿园和小明的监护人\n\n43.【答案】C 【解析】本题考查学生伤害事故的责任。《中华人民共和国侵权责任法》（2009 年通过，2021 年1 月1 日起废止）第三十八条规定，无民事行为能力人在幼儿园、学校或者其他教育机构学习、生活期间受到人 身损害的，幼儿园、学校或者其他教育机构应当承担责任，但能够证明尽到教育、管理职责的，不承担责 任。《中华人民共和国民法典》（2021 年1 月1 日起施行）第一千一百九十九条规定，无民事行为能力人在 幼儿园、学校或者其他教育机构学习、生活期间受到人身损害的，幼儿园、学校或者其他教育机构应当承 担侵权责任；但是，能够证明尽到教育、管理职责的，不承担侵权责任。在活动中，教师王某尽到了看管 责任，因此此次事故属于意外事故，学校方不存在过错，应由幼儿的监护人承担责任。故本题选C。' },
{ cat:'yicuo', t:'KE1-44', s:'YiCuo100', txt:'[KE1] #44\n\n人的身体里布满血管。下列关于人体血管的表述，不正确的是（ ）。 A.人体内的血管分为动脉、静脉和毛细血管 B.毛细血管是极细微血管，连接动脉静脉 C.动脉是将血液送到心室的血管 D.静脉是引导血液流回心房的血管\n\n44.【答案】C 【解析】本题考查医学常识。动脉是由心室发出的血管。动脉在行径中不断分支，越分越细，小动脉 最后移行为毛细血管，而不是将血液送到心室的血管，故C 选项表述错误。A 选项，血管按构造功能不同， 分为动脉、静脉和毛细血管三种。B 选项，毛细血管是管径最细，分布最广的血管。它是连接微动脉和微 静脉的血管。D 选项，静脉是指起自毛细血管，从全身各器官组织运送血液返回心脏的血管体。故本题选C。' },
{ cat:'yicuo', t:'KE1-45', s:'YiCuo100', txt:'[KE1] #45\n\n某幼儿园教师钱某实名举报了园长的违法乱纪行为，园长知晓后，找社会人员殴打钱某，致使钱某 重伤，对该园长的行为应依法（ ）。 A.给予其行政处罚 B.追究其刑事责任 C.给予其行政处分 D.追究其治安责任 易错100 题中小幼科一 让每一个孩子都能遇到好老师 8\n\n45.【答案】B 【解析】本题考查《中华人民共和国教师法》。《中华人民共和国教师法》第三十五条规定，侮辱、殴 打教师的，根据不同情况，分别给予行政处分或者行政处罚；造成损害的，责令赔偿损失；情节严重，构 成犯罪的，依法追究刑事责任。本题中园长找人殴打钱某，并且造成钱某重伤，已经违反了《中华人民共 和国刑法》，故应依法追究园长刑事责任。故本题选B。 易错100 题中小幼科一 让每一个孩子都能遇到好老师 10' },
{ cat:'yicuo', t:'KE1-46', s:'YiCuo100', txt:'[KE1] #46\n\n学生刘某因家庭经济困难无法按规定完成义务教育。依据《中华人民共和国未成年人保护法》，对 于刘某的受教育权利，具有保障责任的是（ ）。 A.刘某的监护人 B.当地教育机构 C.儿童福利机构 D.当地人民政府\n\n46.【答案】D 【解析】本题考查《中华人民共和国未成年人保护法》。《中华人民共和国未成年人保护法》（2012 年 修订）第二十八条规定，各级人民政府应当保障未成年人受教育的权利，并采取措施保障家庭经济困难的、 残疾的和流动人口中的未成年人等接受义务教育。《中华人民共和国未成年人保护法》（2020 年修订）第八 十三条规定，各级人民政府应当保障未成年人受教育的权利，并采取措施保障留守未成年人、困境未成年 人、残疾未成年人接受义务教育。故本题选D。' },
{ cat:'yicuo', t:'KE1-47', s:'YiCuo100', txt:'[KE1] #47\n\n薛老师习惯运用PPT 进行教学。某节课上他自始至终不停地呈现PPT 内容进行讲解，不管学生是否 明白其所表达之意。关于薛老师的做法，下列表述不恰当的是（ ）。 A.忽视了教学的本质 B.忽视了教师的中心地位 C.忽视了教学的目标 D.忽视了学生的主体地位\n\n47.【答案】B 【解析】本题考查“以人为本”的学生观。课堂教学的本质是通过课堂的教学实现教与学的统一，从 而达到教学的目的，根本体现为教师的教与学生的学。此外，在教育教学过程中，学生是学习的主体，教 师是学生学习的引导者、促进者。题干中薛老师过多注重呈现PPT，没有关注到学生的需求，忽视了教学 的本质，忽视了教学的目标，也忽视了学生的主体地位、中心地位。故本题选B。' },
{ cat:'yicuo', t:'KE1-48', s:'YiCuo100', txt:'[KE1] #48\n\n小周因为考试成绩不好被同学们视为差生，班主任刘老师对全班同学说：“小周这次考试的成绩是 差了点，但在我看来他很不错，他一向都认真做值日，做事很踏实。”关于刘老师的做法，下列说法不正确 的是（ ）。 A.注重学生发展的阶段性 B.注重评价学生的多元性 C.注重学生发展的全面性 D.注重教育学生的示范性\n\n48.【答案】A 【解析】本题考查教师职业理念。个体发展的阶段性是指个体在不同的年龄阶段表现出身心发展不同 的总体特征及主要矛盾，面临着不同的发展任务。题干中并没有体现学生发展的阶段性特点。A 项错误， 符合题意。素质教育强调发展性评价、激励性评价，注重评价标准的多元化。题干中班主任刘老师没有把 成绩作为评价学生的唯一标准，对小周的评价是从值日、做事等多角度进行的，体现了评价学生的多元性。 B 项正确，不符合题意。素质教育强调促进学生的全面发展。题干中刘老师能够客观地看待小周的考试成 绩，也能发现他身上认真、踏实的优点，这体现了刘老师注重学生发展的全面性。C 项正确，不符合题意。 教师教育学生的示范性，除了指教师自己带头言传身教，还指教师注意在班级内树立典型，尤其是优秀榜 样，通过榜样示范的力量去教育引导学生。题干中刘老师通过小周身上优秀的品质教育学生应该学习别人 身上的优点，应该客观正确地看待他人。D 项正确，不符合题意。故本题选A。' },
{ cat:'yicuo', t:'KE1-49', s:'YiCuo100', txt:'[KE1] #49\n\n特级教师李老师经常去听年轻教师的课，并给予指导。一次，听孙老师上课时，李老师发现孙老师 对某个知识点的讲解存在偏差，便当场打断教学予以纠正，这说明李老师（ ）。 A.帮扶心切，严慈相济 B.甘为人梯，示范失当 C.教学严谨，循循善诱 D.严于律己，缺乏尊重\n\n49.【答案】B 【解析】本题考查《中小学教师职业道德规范》。《中小学教师职业道德规范》（2008 年修订）中“爱 岗敬业”要求教师勤恳敬业，甘为人梯，乐于奉献。“为人师表”要求教师坚守高尚情操，知荣明耻，严于 律己，以身作则。团结协作，尊重同事。题干中李老师认真指导年轻教师的行为是其敬业、甘为人梯的表 现，也体现了他对年轻教师的帮助协作，但是在孙老师讲课出现错误时，他直接打断纠正的行为简单粗暴， 并不恰当，应该选用更加委婉、尊重的方式。故本题选B。' },
{ cat:'yicuo', t:'KE1-50', s:'YiCuo100', txt:'[KE1] #50\n\n玲玲的圆珠笔不见了，赵老师让同学们在教室里帮玲玲寻找。当发现圆珠笔在婷婷课桌的抽屉里时， 赵老师劈头盖脸地把婷婷批评了一通。对于赵老师的做法，下列说法不正确的是（ ）。 A.缺乏公正对待学生的意识 B.未能做到教育的即时性 C.缺乏换位思考的教育立场 D.未能恰当保护婷婷权益\n\n50.【答案】B 【解析】本题考查教师职业道德规范。《中小学教师职业道德规范》（2008 年修订）中“关爱学生”要 易错100 题中小幼科一 让每一个孩子都能遇到好老师 11 求教师关心爱护全体学生，尊重学生人格，平等公正对待学生。题干中面对玲玲丢失圆珠笔，赵老师立即 处理，做到了教育的即时性。但当发现圆珠笔在婷婷课桌的抽屉里时，没有认真了解情况，平等公正对待 婷婷；没有尊重婷婷隐私，也没有换位思考，教育工作方法有待提升。故本题选B。' },
{ cat:'yicuo', t:'KE1-51', s:'YiCuo100', txt:'[KE1] #51\n\n“初伏日在夏至第三庚”，意思是三伏中入伏的第一天是在夏至后的第三个庚日，据此判断，下列 选项中距离初伏最近的是（ ）。 A.大暑 B.立秋 C.处暑 D.秋分\n\n51.【答案】A 【解析】本题考查二十四节气。初伏是关于日历法的一种说法，按中国的日历法来说，是真正暑天的 开始。古代用天干、地支合并记载时间，三庚中的“庚”字即是天干中的数字。“甲、乙、丙、丁、戊、己、 庚、辛、壬、癸”10 个天干中的第7 个字，庚日每10 天重复一次。初伏日在夏至第三庚，也就是大约30 天以后。夏至一般在每年公历6 月21 日—22 日之间。大暑在每年公历7 月22—24 日之间，立秋在每年公 历8 月7 日—9 日之间，处暑在每年公历8 月22 日—24 日之间，秋分在每年公历9 月22—24 日之间。因 此，距初伏最近的是大暑。故本题选A。' },
{ cat:'yicuo', t:'KE1-52', s:'YiCuo100', txt:'[KE1] #52\n\n陈老师说不是每个学生都能考上大学，学习上暂时落后并不代表永远落后，我绝不放弃任何学生， 下列说法不恰当的是（ ）。 A.陈老师重视学生发展的阶段性 B.陈老师重视学生发展的不平衡性 C.陈老师重视学生发展的差异性 D.陈老师重视学生发展的顺序性 易错100 题中小幼科一 让每一个孩子都能遇到好老师 9\n\n52.【答案】D 【解析】本题考查个体身心发展规律。个体身心发展的个别差异性，是指个体之间的身心发展以及个 体身心发展的不同方面之间，存在发展程度和速度的不同。人的先天素质、环境和教育以及自身的主观能 动性的不同，决定了人的身心发展存在着个别差异。它要求教育工作做到“因材施教” “一把钥匙开一把锁”， 使每个学生都能迅速地切实地提高。题干中强调“每个学生”体现了差异性。阶段性是指个体在不同的年 龄阶段表现出身心发展不同的总体特征及主要矛盾，面临着不同的发展任务。不平衡性是指在连续不断的 发展过程中，个体身心发展的速度并不是完全与时间一致的匀速运动，在不同的年龄阶段，其发展的速度 和水平是有明显差异的。题干中“暂时落后不代表永远落后”体现了阶段性和不平衡性。顺序性指儿童从 出生到成人，他们的身心发展是一个由低级到高级，由量变到质变的连续不断的过程。它要求教学做到“循 序渐进”，题干中并未体现。故本题选D。' },
{ cat:'yicuo', t:'KE1-53', s:'YiCuo100', txt:'[KE1] #53\n\n学校安排优秀教师刘老师和新入职的邓老师“师徒结对”，刘老师悉心指导，邓老师也是主动向刘 老师请教，经常观摩刘老师上课，并在教学设计、教学方法甚至教学语言上尽量模仿刘老师，但教学效果 并不佳，其原因是（ ）。 A.邓老师缺乏自我反思 B.邓老师没有得到专业引领 C.刘老师指导有所保留 D.刘老师的教学示范性不强\n\n53.【答案】A 【解析】本题考查教师职业道德规范。新课程下的教师行为观强调教师在对待自我上，应当做到反思 与终身学习发展。因此，教师应该有终身学习的意识，不断反思，提高自己的知识水平及业务能力。邓老 师观摩学习的做法都是正确的，但学到别人的东西应该通过反思内化为自己的东西。故本题选A。' },
{ cat:'yicuo', t:'KE1-54', s:'YiCuo100', txt:'[KE1] #54\n\n青年教师王老师想要提高教学水平，主动向特级教师李老师学习，经常跟班听课，王老师上课时， 尽管教学设计、教学方法，甚至教学语言都与李老师相仿，但教学效果就是不佳。下列分析不恰当的是（ ）。 A.王老师只注重了模仿，忽视了对自己的教学反思 B.王老师不重视专业学习，专业知识与技能不扎实 C.王老师一味模仿李老师，未形成自己的教学风格 D.王老师不重视班级学情，忽视了学生个体差异性\n\n54.【答案】B 【解析】本题考查教师专业发展。B 选项的说法与题干中王老师积极主动学习、不断努力提高的行为 不符，而且题干中也没有涉及王老师的专业知识与技能方面，故B 选项分析不正确。A、C、D 选项均是其 教学效果不佳的主要原因。故本题选B。 易错100 题中小幼科一 让每一个孩子都能遇到好老师 12' },
{ cat:'yicuo', t:'KE1-55', s:'YiCuo100', txt:'[KE1] #55\n\n下列选项中，不属于全国人民代表大会行使的职权是（ ）。 A.领导和管理国防建设事业 B.修改宪法和监督宪法的实施 C.决定特别行政区的设立及其制度 D.审查和批准国家的预算和预算的执行情况的报告\n\n55.【答案】A 【解析】本题考查《中华人民共和国宪法》。《中华人民共和国宪法》第六十二条第（一）、（二）、（十 四）、（十一）项分别规定，全国人民代表大会行使下列职权：（一）修改宪法；（二）监督宪法的实施；（十 四）决定特别行政区的设立及其制度；（十一）审查和批准国家的预算和预算执行情况的报告。因此B、C、 D 选项均为其职权。而A 选项是《中华人民共和国宪法》第八十九条第（十）项所规定的国务院的职权。 故本题选A。' },
{ cat:'yicuo', t:'KE1-56', s:'YiCuo100', txt:'[KE1] #56\n\n班主任陈老师根据数学成绩将学生分为A、B、C 三类，并为三类学生分别建立综合成长档案。陈老 师的做法（ ）。 A.不恰当，忽视学生的主动发展 B.恰当，注重学生的个性发展 C.不恰当，忽视学生的全面发展 D.恰当，注重学生的可持续发展\n\n56.【答案】C 【解析】本题考查素质教育观。综合成长档案的建立，目的是改变只关注学业成绩的单一总结性的考 试评价方式，着眼于充分全面了解学生，帮助学生认识自我，建立自信，关注个别差异，了解学生发展中 的需求。班主任陈老师以数学成绩作为综合成长档案的划分依据，违背了综合成长档案防止以某一学科或 某科成绩评价学生的初衷，其做法对学生的全面发展和其他教育者开展素质教育工作造成了一定阻碍。故 本题选C。' },
{ cat:'yicuo', t:'KE1-57', s:'YiCuo100', txt:'[KE1] #57\n\n六年级女生朱某学习不好，经常在课堂上讲话。一天上课，朱某又和同桌男生说话，教师张某批评 朱某说：“你怎么这么贱呀，能不能不招惹男生呀！”朱某听后立刻大哭，用头部在课桌上猛烈撞击，造成 额头出血。关于朱某所受的伤害，下列说法正确的是（ ）。 A.学校承担朱某伤害的主要赔偿责任 B.张某侵犯了朱某的言论自由权 C.朱某家长承担朱某伤害的赔偿责任 D.张某承担朱某伤害的部分赔偿责任\n\n57.【答案】A 【解析】本题考查学生伤害事故的责任。《学生伤害事故处理办法》第九条第（九）项规定，因“学校 教师或者其他工作人员体罚或者变相体罚学生，或者在履行职责过程中违反工作要求、操作规程、职业道 德或者其他有关规定的”造成的学生伤害事故，学校应当依法承担相应的责任。题干中朱某的伤害是由于 教师张某的不当言行造成的，因此，学校应当依法承担朱某的主要赔偿责任。故本题选A。' },
{ cat:'yicuo', t:'KE1-58', s:'YiCuo100', txt:'[KE1] #58\n\n依据《中华人民共和国教师法》的相关规定，社会力量所办学校教师的待遇（ ）。 A.由教育行政部门确定，但由举办者予以保障 易错100 题中小幼科一 让每一个孩子都能遇到好老师 10 B.由举办者自行确定，但由教育行政部门予以保障 C.由教育行政部门确定并予以保障 D.由举办者自行确定并予以保障\n\n58.【答案】D 【解析】本题考查《中华人民共和国教师法》。《中华人民共和国教师法》第三十二条规定，社会力量 所办学校的教师的待遇，由举办者自行确定并予以保障。故本题选D。' },
{ cat:'yicuo', t:'KE1-59', s:'YiCuo100', txt:'[KE1] #59\n\n依据《中华人民共和国教师法》的相关规定，教师有下列哪种情形可以由其所在学校予以行政处分 或解聘？（ ） A.故意不完成教学任务造成损失的 B.课余时间无偿为学生补课的 C.教学过程中延长授课时间的 D.学生管理中严厉对待学生的\n\n59.【答案】A 【解析】本题考查《中华人民共和国教师法》。《中华人民共和国教师法》第三十七条规定，教师有下 列情形之一的，由所在学校、其他教育机构或者教育行政部门给予行政处分或者解聘：（一）故意不完成教 育教学任务给教育教学工作造成损失的；（二）体罚学生，经教育不改的；（三）品行不良侮辱学生，影响 恶劣的。教师有前款第（二）项、第（三）项所列情形之一，情节严重，构成犯罪的，依法追究刑事责任。 故本题选A。' },
{ cat:'yicuo', t:'KE1-60', s:'YiCuo100', txt:'[KE1] #60\n\n班主任王老师在班上开展“悦读悦享”活动，与同学们同读一本书，经常撰写“师读心得”与同学 们分享。下列分析不恰当的是（ ）。 A.王老师注重师生同读互促，率先垂范 B.王老师注重营造读书氛围，激趣启智 C.王老师注重学习，不断提升自我素养 D.王老师注重公正，对同学们一视同仁\n\n60.【答案】D 【解析】本题考查教师职业道德规范。班主任王老师与同学们同读一本书，有助于营造班级的读书氛 围；其行为起到了模范带头作用，给学生做出了表率；同时也可以拓展知识视野、提升自我，故A、B、C 易错100 题中小幼科一 让每一个孩子都能遇到好老师 13 三项分析正确。D 选项中的公正指公平正直、没有偏私，该案例中王老师的行为没有体现其注重公平，对 学生一视同仁，所以与题干无关。故本题选D。' },
{ cat:'yicuo', t:'KE1-61', s:'YiCuo100', txt:'[KE1] #61\n\n为了保护学生的隐私，某小学规定语文教师不得在课堂上点评学生的作文。该校的做法（ ）。 A.正确，学校有权对教师提出工作要求 B.正确，学校应该满足学生的自尊需求 C.不正确，学校侵犯了教师的专业权利 D.不正确，学校限制了教师的言论自由\n\n61.【答案】C 【解析】本题考查《中华人民共和国教师法》。《中华人民共和国教师法》第七条规定，教师有指导学 生的学习和发展，评定学生的品行和学业成绩的权利。题干中学校的做法不正确，教师点评学生的作文属 于教师的专业权利，所以学校的做法侵犯了教师的专业权利。故本题选C。' },
{ cat:'yicuo', t:'KE1-62', s:'YiCuo100', txt:'[KE1] #62\n\n下列现象中，属于光的直线传播的是（ ）。 A.做手影游戏 B.照镜子梳妆 C.看到书上的字 D.用近视眼镜矫正视力\n\n62.【答案】A 【解析】本题考查物理知识。A 项正确，做手影游戏是由于光的直线传播形成的。B 项错误，照镜子梳 妆是由于光的反射形成的。C 项错误，看到书上的字是由于光的反射形成的。D 项错误，近视眼镜矫正视力， 属于凸透镜成像，是由于光的折射形成的。故本题选A。' },
{ cat:'yicuo', t:'KE1-63', s:'YiCuo100', txt:'[KE1] #63\n\n“三五步走遍天下，七八人百万雄兵”“咫尺地五湖四海，几更时万古千秋”，这些诗句是对下列哪 种传统艺术特点的描述？（ ） A.书法 B.绘画 C.戏剧 D.杂技\n\n63.【答案】C 【解析】本题考查艺术鉴赏。根据题干“三五步走遍天下，七八人百万雄兵”“咫尺地五湖四海，几更 时万古千秋”可知是我国戏曲艺术虚拟特点的体现，戏剧用虚拟手段表现戏剧时空场景的更替，C 项正确。 书法是用毛笔书写汉字并具有审美功能的艺术形式，与题意无关，排除A 项。传统绘画形式是用毛笔蘸水、 墨、彩作画于绢或纸上，与题意无关，排除B 项。杂耍是旧时对曲艺、杂技等技艺的合称，与题意无关， 排除D 项。故本题选C。' },
{ cat:'yicuo', t:'KE1-64', s:'YiCuo100', txt:'[KE1] #64\n\n《地道战》《地雷战》《小兵张嘎》等电影故事脍炙人口，影响着一代代人的成长。它们主要取材于 （ ）。 A.北伐战争 B.抗日战争 C.解放战争 D.抗美援朝 易错100 题中小幼科一 让每一个孩子都能遇到好老师 11\n\n64.【答案】B 【解析】本题考查中国近代史。地道战是在抗日战争时期，在华北平原上抗日军民利用地道打击日本 侵略者的作战方式。地雷战是抗日战争时期中国山东民兵最重要的作战方法之一，地雷是当时最重要的作 战武器。小兵张嘎故事以抗日战争时期的白洋淀为背景，讲述了嘎子梦想参加八路，在抗日烽火中成长的 戏剧故事。由此分析可知，几部作品都以抗日战争为背景。故本题选B。' },
{ cat:'yicuo', t:'KE1-65', s:'YiCuo100', txt:'[KE1] #65\n\n当人体内有病菌感染时，哪种血细胞的数量会大量增加？（ ） A.红细胞 B.白细胞 C.血小板 D.血红蛋白\n\n65.【答案】B 【解析】本题考查生物细胞。白细胞能吞噬发炎部位的病菌，人体某个部位发炎时，白细胞会大大增 加，具有防御作用。红细胞是血液中数量最多的一种血细胞，同时也是脊椎动物体内通过血液运送氧气的 最主要的媒介，同时还具有免疫功能。血小板是从骨髓成熟的巨核细胞胞浆解脱落下来的小块胞质。巨核 细胞虽然在骨髓的造血细胞中为数最少，仅占骨髓有核细胞总数的0.05%，但其产生的血小板却对机体的 止血功能极为重要。血红蛋白又称血色素，是红细胞的主要组成部分，能与氧结合，运输氧和二氧化碳。 血红蛋白含量能很好地反映贫血程度。因此，当人体内有病菌感染时，白细胞的数量会大量增加，故本题 选B。 易错100 题中小幼科一 让每一个孩子都能遇到好老师 14' },
{ cat:'yicuo', t:'KE1-66', s:'YiCuo100', txt:'[KE1] #66\n\n使用Word 软件编辑文档，打开“字体”对话框，不能完成的设置是（ ）。 A.字符位置降低2 磅 B.字符间距加宽3 磅 C.首行缩进2 字符 D.字形加粗\n\n66.【答案】C 【解析】本题考查“字体”对话框和“段落”对话框的内容。首行缩进属于“段落”对话框，其他都 属于“字体”对话框。故本题选C。' },
{ cat:'yicuo', t:'KE1-67', s:'YiCuo100', txt:'[KE1] #67\n\n以下不是PowerPoint 视图方式的是（ ）。 A.大纲视图 B.普通视图 C.幻灯片浏览视图 D.页面视图\n\n67.【答案】D 【解析】本题考查PowerPoint 的视图方式。演示文稿的视图方式包括大纲视图、普通视图、幻灯片浏 览视图、备注页视图以及阅读视图。页面视图不是演示文稿视图方式，是Word 文档的视图方式。故本题选 D。' },
{ cat:'yicuo', t:'KE1-68', s:'YiCuo100', txt:'[KE1] #68\n\n在PowerPoint 中，幻灯片的切换方式是指（ ）。 A.在编辑幻灯片时切换不同的设计模板 B.在编辑新幻灯片时的过渡形式 C.在幻灯片放映时两张幻灯片间过渡形式 D.在编辑幻灯片时切换不同视图\n\n68.【答案】C 【解析】本题考查幻灯片切换方式。幻灯片切换主要是幻灯片进入下一页的展示效果，是在幻灯片放 映时两张幻灯片间过渡形式。故本题选C。' },
{ cat:'yicuo', t:'KE1-69', s:'YiCuo100', txt:'[KE1] #69\n\n袁枚《马嵬》：“莫唱当年长恨歌，人间亦自有银河。石壕村里夫妻别，泪比长生殿上多”与诗中提 到作品无关的作家是（ ）。 A.洪昇 B.杜甫 C.关汉卿 D.白居易\n\n69.【答案】C 【解析】本题考查文学常识。《长恨歌》，唐代诗人白居易所作之诗，写的是唐玄宗宠幸杨贵妃而造成 的政治悲剧与爱情悲剧。石壕村出自唐代诗人杜甫《石壕吏》一诗，写在安史之乱中，官吏征兵征役，造 成石壕村中一对老年夫妻惨别的情形。《长生殿》是指洪昇的戏曲。因此，诗中提到了洪昇、杜甫、白居易， 没有提到关汉卿。故本题选C。' },
{ cat:'yicuo', t:'KE1-70', s:'YiCuo100', txt:'[KE1] #70\n\n下列笔名原名著作对应错误的是（ ）。 A.茅盾——沈德鸿——《子夜》 B.非我——舒庆春——《骆驼祥子》 C.李尧棠——林语堂——《寒夜》 D.曹禺——万家宝——《雷雨》\n\n70.【答案】C 【解析】本题考查中国近代文学。巴金，原名李尧棠，另有笔名有佩竿、极乐、黑浪、春风等，字芾 甘。代表作是《家》《春》《秋》《雾》《雨》《电》《寒夜》等。林语堂原名和乐，后改玉堂，又改语堂，代 表作是《京华烟云》《啼笑皆非》。C 项对应错误。A 项，茅盾，原名沈德鸿，代表作有《子夜》、农村三部 曲（含《春蚕》、《秋收》、《残冬》），A 项对应正确。B 项，非我，即老舍，原名舒庆春，除笔名非我、老舍 外，还有絜青、鸿来等，代表作有《骆驼祥子》《四世同堂》，剧本《茶馆》《龙须沟》，B 项对应正确。D 项， 曹禺，原名万家宝，中国杰出的现代话剧剧作家，代表作有《雷雨》《日出》《原野》等，D 项对应正确。 故本题选C。' },
{ cat:'yicuo', t:'KE1-71', s:'YiCuo100', txt:'[KE1] #71\n\n“教师是一把茶壶，学生是一个水杯。教师对学生的教学就是茶壶将茶杯灌满。”壶与杯的教育理 论（ ）。 A.合理，体现教师的教和学生的学有机统一 B.不合理，教师要从传授知识的角色向教育促进者的角色转变 C.合理，体现了教师对学生的无私奉献 D.不合理，教师应该终身学习，只有一壶水还不够 易错100 题中小幼科一 让每一个孩子都能遇到好老师 12\n\n71.【答案】B 【解析】本题考查教师角色观。“壶与杯”的教育理论认为教师是茶壶，学生是茶杯。教师是知识的拥 有者，学生只是被动地接受知识，教学过程是向学生传授、灌输知识的过程。“壶与杯”理论忽视了学生在 学习中的主体地位，已经不符合当代教育观念。新课改下的教师角色观提出，教师应该是学生学习的促进 者，教师要从传授知识的角色向教育促进者的角色转变。故本题选B。 易错100 题中小幼科一 让每一个孩子都能遇到好老师 15' },
{ cat:'yicuo', t:'KE1-72', s:'YiCuo100', txt:'[KE1] #72\n\n一位科学家的墓碑上篆刻着这样的铭文： “他以神一般的力量，……第一个说明了行星运动和图像。” 这位科学家是（ ）。 A.伽利略 B.牛顿 C.爱因斯坦 D.普朗克\n\n72.【答案】B 【解析】本题考查世界近代科学家。A 项错误，伽利略是意大利数学家、物理学家、天文学家，科学 革命的先驱，伽利略发明了摆针和温度计，在科学上为人类作出过巨大贡献，是近代实验科学的奠基人之 一。伽利略的墓志铭是：“他失明了，因为在自然界已经没有剩下什么他没有看见过的东西了。”B 项正确， 艾萨克•牛顿是英国著名的物理学家，他在1687 年发表的论文《自然定律》里，对万有引力和三大运动定 律进行了描述。这些描述奠定了此后三个世纪里物理世界的科学观点，并成为现代工程学的基础。牛顿的 墓志铭是：“艾萨克•牛顿爵士，安葬在这里。他以超乎常人的智力，第一个证明了行星的运动与形状、彗 星轨道与海洋的潮汐，他孜孜不倦地研究光线的各种不同的折射角、颜色所产生的种种性质。对于自然、 历史和《圣经》，他是一个勤勉、敏锐而忠实的诠释者。他以自己的哲学证明了上帝的庄严，并在他的举止 中表现了福音的纯朴。让人类欢呼曾经存在过这样一位伟大的人类之光。”C 项错误，阿尔伯特•爱因斯坦 是犹太裔物理学家，他提出光子假设，成功解释了光电效应，并创立狭义相对论和广义相对论。爱因斯坦 的墓志铭是：“在美的前沿揭示了一个崭新的世界。”D 项错误，马克斯•普朗克是德国著名的物理学家和量 子力学的重要创始人，普朗克的墓志铭是：h=6.63×10^-34J•S。故本题选B。' },
{ cat:'yicuo', t:'KE1-73', s:'YiCuo100', txt:'[KE1] #73\n\n在Excel 中，如果单元格A5 的值是单元格A1、A2、A3、A4 的平均值，则不正确的输入公式为（ ）。 A.=AVERAGE（A1，A2，A3，A4） B.=（A1+A2+A3+A4）/4 C.=AVERAGE（A1+A2+A3+A4） D.=AVERAGE（A1:A4）\n\n73.【答案】C 【解析】本题考查Excel 的应用。C 项平均函数内参数格式错误。A、B、D 项均能实现操作。故本题选 C。' },
{ cat:'yicuo', t:'KE1-74', s:'YiCuo100', txt:'[KE1] #74\n\n世界名画《向日葵》通过粗厚有力的笔触和对比强烈的色彩向观者表达了作者对生命的理解。它是 下列哪位画家的代表作？（ ） A.达•芬奇 B.塞尚 C.毕加索 D.梵高\n\n74.【答案】D 【解析】本题考查艺术常识。A 项错误，达·芬奇，欧洲文艺复兴时期的天才科学家、发明家、画家。 现代学者称他为“文艺复兴时期最完美的代表”，他最大的成就是绘画，他的杰作《蒙娜丽莎》《最后的晚 餐》《岩间圣母》等，体现了他精湛的艺术造诣。B 项错误，保罗·塞尚，法国著名画家，是后期印象派的 主将，西方现代画家称他为“现代艺术之父”“造型之父”或“现代绘画之父”。他对物体体积感的追求和 表现，为“立体派”开启了思路，代表作品有《圣维克多山》《法黎耶肖像》、静物系列等。C 项错误，毕 加索，西班牙画家、雕塑家，是现代艺术的创始人，西方现代派绘画的主要代表。他于1907 年创作的《亚 威农少女》是第一张被认为有立体主义倾向的作品，是一幅具有里程碑意义的著名杰作。代表作品还有《斗 牛士》《格尔尼卡》《和平鸽》《梦》《亚威农少女》等。D 项正确，梵高，荷兰后印象派画家。是后印象主 义的先驱，并深深地影响了20 世纪艺术，尤其是野兽派与表现主义。梵高的作品主要有《星夜》《向日葵》 与《有乌鸦的麦田》等。故本题选D。' },
{ cat:'yicuo', t:'KE1-75', s:'YiCuo100', txt:'[KE1] #75\n\n某小组10 名学生，在某次语文考试中成绩分别为87、83、86、92、86、76、83、85、79、83。则 这组数据的众数、中位数分别是（ ）。 A.83 84 B.3 83 C.86 84 D.2 86\n\n75.【答案】A 【解析】本题考查众数和中位数。众数是一个次数分布中出现次数最多的那个数。题干中83 出现了3 易错100 题中小幼科一 让每一个孩子都能遇到好老师 16 次，所以众数是83。中位数也称为中数，指位于数据分布正中间位置上的那个数。如果一组数据从小到大 排列，则中位数通常是将这批数据个数一分为二，居于中间的那个数。题干中的中位数为（83+85）/2=84。 故本题选A。' },
{ cat:'yicuo', t:'KE1-76', s:'YiCuo100', txt:'[KE1] #76\n\n被称为“西方海上生命线”，连接了波斯湾与印度洋的是（ ）。 A.霍尔木兹海峡 B.莫桑比克海峡 C.白令海峡 D.德雷克海峡\n\n76.【答案】A 【解析】本题考查海峡分界线。A 项，霍尔木兹海峡连接了波斯湾与印度洋，被称为“西方海上生命 线”；B 项，莫桑比克海峡位于非洲大陆东南部与马达加斯加岛之间，是南大西洋和印度洋之间的航运要道， 是世界最长的海峡；C 项，白令海峡连接北冰洋与太平洋，是亚洲与北美洲的分界线，太平洋与北冰洋间 的唯一通道；D 项，德雷克海峡位于南美洲与南极半岛之间，连接大西洋与南太平洋，是南美洲与南极洲 的界线。故本题选A。' },
{ cat:'yicuo', t:'KE1-77', s:'YiCuo100', txt:'[KE1] #77\n\n在Excel 中，下列说法不正确的是（ ）。 A.可以对建立的图表进行缩放和修改 B.可将单元格中的数据以各种统计图表的形式显示 C.建立图表首先要在工作表中选取图表的数据区 D.工作表中的数据源发生变化时，图表中的对应数据不能自动更新\n\n77.【答案】D 【解析】本题考查Excel 的应用。在Excel 中，工作表中的数据源发生变化时，图表中的对应数据也 会自动更新。故本题选D。' },
{ cat:'yicuo', t:'KE1-78', s:'YiCuo100', txt:'[KE1] #78\n\n新冠疫情防控期间，各商场、车站、小区等地常使用“测温枪”测量体温，“测温枪”通过识别人 体辐射强度不同的（ ），在不接触人体的情况下测量人体的温度。 A.超声波 B.次声波 C.红外线 D.紫外线\n\n78.【答案】C 【解析】本题考查科学常识。测温枪，学名是“红外线测温仪”或“红外线辐射测温仪”。“测温枪” 通过识别人体辐射强度不同的红外线，在不接触人体的情况下测量人体的温度。A 项，超声波是一种频率 高于20000 赫兹的声波，它的方向性好，穿透能力强，易于获得较集中的声能，在水中传播距离远，可用 于测距、测速、清洗、焊接、碎石、杀菌消毒等。B 项，次声波是频率小于20 赫兹的声波。次声波不容易 衰减，不易被水和空气吸收。而次声波的波长往往很长，因此能绕开某些大型障碍物发生衍射。D 项，紫 外线是电磁波谱中波长为400nm—10nm 辐射的总称，不能引起人们的视觉。它是频率比蓝紫光高的不可见 光。紫外线可以用来灭菌，过多的紫外线进入人体内会导致皮肤癌。故本题选C。' },
{ cat:'yicuo', t:'KE1-79', s:'YiCuo100', txt:'[KE1] #79\n\n东晋时期的道教学者、著名炼丹家、医药学家（ ）所著的《抱朴子》是现存的主要道教典籍。 A.张陵 B.魏伯阳 易错100 题中小幼科一 让每一个孩子都能遇到好老师 13 C.葛洪 D.陶弘景\n\n79.【答案】C 【解析】本题考查道教典籍。张陵，东汉五斗米道创立者。后改名张道陵，敬为张天师。客居于蜀， 学道于鹄鸣山，著有《太平洞极经》，A 项不符合题意。魏伯阳，东汉时期黄老道家、炼丹理论家，道教丹 鼎派的理论奠基人。其所著的《周易参同契》，是现存最早系统阐述炼丹理论的著作，B 项不符合题意。葛 洪，东晋道教理论家、著名炼丹家和医药学家，世称小仙翁。所著《抱朴子》继承和发展了东汉以来的炼 丹法术，对之后道教炼丹术的发展具有很大影响，为研究中国炼丹史以及古代化学史提供了宝贵的史料，C 项符合题意。陶弘景，南北朝著名医药学家。著有《本草经集注》，他是我国医药学史上对本草学进行系统 整理，并加以创造性地发挥的第一人，D 项不符合题意。故本题选C。 易错100 题中小幼科一 让每一个孩子都能遇到好老师 17' },
{ cat:'yicuo', t:'KE1-80', s:'YiCuo100', txt:'[KE1] #80\n\n三年级某班数学老师在考试的时候把发给同学们的卷子拿成了六年级的数学卷子，是测不出学生的 数学水平的，那么这个测验是没有（ ）的。 A.信度 B.效度 C.难度 D.区分度\n\n80.【答案】B 【解析】本题考查教育测量。效度即有效性，它是指测量工具或手段能够准确测出所需测量的事物的 程度。测量结果与要考察的内容越吻合，则效度越高；反之，则效度越低。题干中三年级的学生做六年级 的试卷，显然测验没有效度。故本题选B。' },
{ cat:'yicuo', t:'KE1-81', s:'YiCuo100', txt:'[KE1] #81\n\n某日下午，小学生金某刚从网吧出来正好碰到班主任老师。班主任老师拉着他的耳朵，连拖带拽把 他带到了办公室并对他进行罚站。对班主任老师的处罚，下列哪项不恰当？（ ） A.情节严重的，依法给予处分 B.由其所在单位责令改正 C.由主管部门责令改正 D.由公安机关予以行政拘留\n\n81.【答案】D 【解析】本题考查《中华人民共和国未成年人保护法》。《中华人民共和国未成年人保护法》（2020 年 修订）第二十七条规定，学校、幼儿园的教职员工应当尊重未成年人人格尊严，不得对未成年人实施体罚、 变相体罚或者其他侮辱人格尊严的行为。第一百一十九条规定，学校、幼儿园、婴幼儿照护服务等机构及 其教职员工违反本法第二十七条、第二十八条、第三十九条规定的，由公安、教育、卫生健康、市场监督 管理等部门按照职责分工责令改正；拒不改正或者情节严重的，对直接负责的主管人员和其他直接责任人 员依法给予处分。题干中班主任老师对金某进行罚站体罚，违反了相关法律规定，对班主任老师的处罚不 包括由公安机关予以行政拘留，D 项符合题意。故本题选D。' },
{ cat:'yicuo', t:'KE1-82', s:'YiCuo100', txt:'[KE1] #82\n\n依据《中华人民共和国未成年人保护法》，对未成年人社会保护不包括（ ）。 A.学校、幼儿园周边不得设置烟、酒、彩票销售网点 B.禁止胁迫、诱骗、利用未成年人乞讨 C.幼儿园、校外培训机构不得对学龄前未成年人进行小学课程教育 D.国家鼓励科研机构和科技类社会组织对未成年人开展科学普及活动 二、材料分析题\n\n82.【答案】C 【解析】本题考查对未成年人的社会保护。《中华人民共和国未成年人保护法》（2020 年修订）第四章 “社会保护”第五十九条规定，学校、幼儿园周边不得设置烟、酒、彩票销售网点。营业性歌舞娱乐场所、 酒吧、互联网上网服务营业场所等不适宜未成年人活动场所的经营者，不得允许未成年人进入；游艺娱乐 场所设置的电子游戏设备，除国家法定节假日外，不得向未成年人提供。经营者应当在显著位置设置未成 年人禁入、限入标志；对难以判明是否是未成年人的，应当要求其出示身份证件。该法第五十四条第三款 规定，禁止胁迫、诱骗、利用未成年人乞讨。该法第四十四条第四款规定，国家鼓励科研机构和科技类社 会组织对未成年人开展科学普及活动。A、B、D 项都属于社会保护的内容。该法第三章“学校保护”第三 十三条第三款规定，幼儿园、校外培训机构不得对学龄前未成年人进行小学课程教育。C 项属于学校保护 内容。故本题选C。 二、材料分析题 83.【参考答案】 材料中张老师的教育行为是恰当的，符合素质教育观的要求，具体表现在： （1）素质教育是面向全体学生的教育。教师要关注到所有学生，公平公正地对待学生，不偏袒或歧视 个别学生。材料中张老师没有因为明明结巴的朗读而区别对待，而是一视同仁，尊重学生，引导学生思考， 做到了面向全体学生。 （2）素质教育是促进学生个性发展的教育。教育要尊重学生的个性差异，做到因材施教。材料中张老 易错100 题中小幼科一 让每一个孩子都能遇到好老师 18 师并没有斥责明明的“捣乱”，而是尊重学生的想法，通过耐心询问和引导讨论，帮助大家了解明明的想法， 促进了学生的个性发展。 （3）素质教育是培养学生创新精神和实践能力为重点的教育。教师不仅要重视培养学生的自主探索意 识，也要保护学生的创新精神和实践能力。材料中张老师敢于打破常规，把学生不一样的解释带入课程， 有利于激发学生的探索意识和创新精神。 （4）从教学的方法上看，素质教育强调启发式、探究式教学，促进学生生动、活泼地学习。材料中张 老师听了明明的回答后，积极引导学生讨论，充分调动学生兴趣，并顺势启发学生阅读思考和解决问题。 总之，张老师的教育行为践行了素质教育观的相关要求，是值得我们学习的。 84.【参考答案】 材料中李老师的做法践行了素质教育观的要求，具体分析如下： （1）从素质教育的内涵上看，①素质教育是面向全体幼儿的教育。②素质教育是促进幼儿全面发展的 教育。③素质教育是促进幼儿个性发展的教育。④素质教育是以培养幼儿创新精神和实践能力为重点的教 育。材料中，李老师发现洋洋吃饭不认真、挑食的问题，并没有置之不理，而是采取了一系列措施，如讲 故事，使用童趣的语言鼓励幼儿科学进餐，鼓励洋洋吃绿色蔬菜，帮助洋洋改善了偏食的现象，促进了幼 儿全面健康发展。 （2）幼儿素质教育要求教师在保教活动中从小事抓起，做到保教结合。材料中，李老师在饭前或休息 时间也经常给孩子们讲一些有关偏食的坏处的故事，在餐饮环节用富有感染力的语言引导幼儿就餐，帮助 幼儿养成了良好的餐饮习惯，做到了保教结合。 （3）幼儿素质教育要求以游戏为基本活动，以导为主，以教为辅，尊重幼儿在学习中的主体地位。材 料中，李老师采取的措施，调动了幼儿的积极性，让幼儿自己认识到挑食的坏处，学会了正确吃饭，使洋 洋偏食的现象几乎没有了，而且吃饭速度也提高了很多。 （4）幼儿素质教育要发挥一日生活整体教育功能，提高幼儿的综合能力。要注重幼儿兴趣的培养，强 化幼儿习惯的养成，重视幼儿智力的开发。材料中，李老师的引导教育方式，不仅帮助幼儿养成了良好的 餐饮习惯，而且提高了动手吃饭的能力。 综上所述，李老师的教育行为值得我们学习。 85.【参考答案】 这位教师的做法符合“以人为本”的学生观的要求，具体表现在： （1）学生是发展中的人，要用发展的观点认识学生。学生具有巨大的发展潜能，应该充分信任学生； 学生处于发展过程中，应该鼓励帮助学生；材料中这位教师坚信学生处于发展过程中，具有巨大的发展潜 易错100 题中小幼科一 让每一个孩子都能遇到好老师 19 力，所以积极采取措施，缓解紧张的氛围，让略有口吃的学生建立了自信，朗读得越来越好，获得了同学 们的认可。 （2）学生是独特的人。每个学生都有自身的独特性，与成人之间存在着巨大 美国芯片 的事例来说明企业成就由己定，最后通过正反对比论证，国家要依靠人民才能取得辉煌，反之可能一败涂 地。在论述过程中，考生可以采用举例论证、道理论证等论证方法，丰富文章结构。 易错100 题中小幼科一 让每一个孩子都能遇到好老师 32 结尾：一般是对分论点进行简单分析，总结概括，需要注意的是结尾部分的论述角度要与开头或中间 相符合，做到首尾呼应。本文最后主要是用了排比句，加上结合卢梭的名言，得出结论，无论是人生、企 业还是国家，价值都由己定。 【参考范文】 价值由己定 “稻草定律”说，人的价值有时像一根稻草，与自身价值无关，而取决于你与谁在一起。但倘若一个 人无法决定自己的价值，而要依附他人，那么他永远都是被动的一方，无法操控大局。价值应该由自己决 定，才能把自身的经历变作无穷的财富。 人生价值由己定。我们都说站在巨人的肩膀上能让我们站得更高，看得更远，但小仲马却不想坐在父 亲的肩头摘苹果，而是依靠自己的力量来向世界证明自己的价值。小仲马是法国著名作家大仲马的儿子， 起初，他寄出的稿子总是碰壁，父亲便对小仲马说：“如果你能在寄稿时，随稿给编辑先生附上一封短信， 或者只是一句话，说‘我是大仲马的儿子’，或许情况就会好多了。”但年轻的小仲马不但拒绝以父亲的盛 名做自己事业的敲门砖，而且不露声色地给自己取了十几个其他姓氏的笔名。最终他依靠自己的长篇小说 《茶花女》在文坛上占据了一席之地。 企业成就由己定。众所周知，我国这两年科技领域发展并不顺利，再加上2020 年五月，美国突然发布 芯片禁令，给华为公司带来了前所未有的芯片危机。但好在华为没有过分依赖于美国的芯片，也没有放弃 研发，而是加大了对海思芯片研发的投入，凭借着一己之力抵挡住了一波又一波的制裁打压。华为早在2012 年成立了诺亚方舟实验室自主研发操作系统，历经9 年的研发，2021 年6 月鸿蒙系统问世，同时华为还发 布了多款搭载鸿蒙系统的新产品。此举开启了万物互联互通的大门，打破了西方国家的垄断，从某种程度 上来说还大大提升了我国对美国的博弈能力。相信华为在未来，定能更上一层楼。 国家辉煌由己定。1840 年鸦片战争以后，国家蒙辱、人民蒙难、文明蒙尘，中华民族遭受了前所未有 的劫难。为了拯救民族危亡，仁人志士奔走呐喊，太平天国运动、戊戌变法、义和团运动、辛亥革命接连 而起，各种救国方案轮番出台，但因为没有很好的依靠自己的人民，这些救国运动最后都以失败告终。十 月革命一声炮响，给中国送来了马克思列宁主义，中国共产党应运而生。全国人民在我党的带领下实现了 新民主主义革命的伟大成就、社会主义革命和建设的伟大成就、改革开放和社会主义现代化建设的伟大成 就、新时代中国特色社会主义的伟大成就。这些辉煌的成就都离不开人民，人民才是历史的创造者，是真 正的英雄。 世间万物都有自己的价值。蝉儿用自己的歌声，直白地打破夏的静谧；花儿用自己的色彩，绚丽地点 缀春的盛装；星儿用自己的微光，精妙地勾勒夜的天幕。它们用自己的存在，诠释了自己的价值。卢梭说 易错100 题中小幼科一 让每一个孩子都能遇到好老师 33 过：“人的价值是由人自己决定的”。其实，何止是人，企业，国家亦是如此，只有相信价值由己定，才能 真正披荆斩棘，创造属于自己的天地！' },
{ cat:'yicuo', t:'KE1-83', s:'YiCuo100', txt:'[KE1] #83\n\n材料： 在讲解《坐井观天》这篇课文时，张老师问哪位同学愿意读课文，明明主动举手。但他将课文里的“天 不过井口那么大”这句话读成了：“天，不，不过，井，井口，那，那么大。”他的结巴逗得全班同学哈哈 大笑，学习委员说：“明明，你怎么又捣乱呢？” 张老师愣了一下，问故作结巴的明明：“你为什么要这样读啊？”明明说：“因为青蛙长时间待在井底， 没有人和它讲话，时间长了，它就连话也说不好了。” 听了明明的回答，张老师灵机一动，大声问：“大家觉得明明的回答有道理吗？”同学们七嘴八舌地议 论开了：“有一点道理”“怎么可能呢？” 看到同学们对这个问题那么感兴趣，张老师说： “现在请大家默读课文，体会一下青蛙到底是怎么想的。” 5 分钟后，张老师让同学们带着感情朗读课文，这一次同学们把课文读得有声有色。 问题： 请结合材料，从教育观的角度，评析张老师的教育行为。 易错100 题中小幼科一 让每一个孩子都能遇到好老师 14\n\n(no analysis)' },
{ cat:'yicuo', t:'KE1-84', s:'YiCuo100', txt:'[KE1] #84\n\n材料： 中午进餐的时间到了，今天的午餐是白米饭、虾仁炒蚕豆和青菜豆腐汤。孩子们洗完手在自己的座位 上开始吃饭，教室里一片寂静，只听到碗勺相碰的声音。这时，李老师发现洋洋小朋友刚吃了三口，就和 同桌的小朋友说起了悄悄话。发现老师在注意他，就又吃了一口饭，含在嘴里，坐着发呆，约两分钟后， 再慢吞吞地喝一口汤，吃一口饭，菜几乎没动。这顿饭他足足吃了一个多小时才把米饭吃完，菜全剩在碗 里，理由是“我不喜欢吃”。 如何纠正洋洋偏食的不良习惯呢？针对洋洋的实际情况，李老师在这几方面做了尝试： （1）故事熏陶法。首先给所有小朋友讲了一个故事，故事说的是一个小弟弟因为就餐习惯不好，被一 只大公鸡啄得到处跑的故事。让小朋友们懂得就餐要有一个良好的行为习惯，不能像小弟弟那样。在饭前 或休息时间也经常给孩子们讲一些有关偏食的坏处的故事。 （2）语言指导法。用儿童化的、富有感染力的语言来指导和鼓励幼儿科学进餐。例如，“米饭和青菜 做朋友，放在嘴里一起嚼，味道会更好。” “你的牙齿比大老虎还要厉害。大老虎会嚼肉肉，你会不会啊？”…… （3）循序渐进法。洋洋不吃绿色蔬菜，开始给他少盛点，吃完给予鼓励和表扬，以后逐渐增加，让他 慢慢地逐渐适应，不感到很痛苦。 经过几个月的努力，洋洋有了很大的进步。吃饭的时候偏食的现象几乎没有了，而且吃饭速度也提高 了很多。每次吃完还会大声地告诉老师：“我今天都吃完了”，带着很自豪的样子。 问题： 请从教育观的角度，对材料中老师的做法进行分析。 易错100 题中小幼科一 让每一个孩子都能遇到好老师 15\n\n(no analysis)' },
{ cat:'yicuo', t:'KE1-85', s:'YiCuo100', txt:'[KE1] #85\n\n材料： 某教师在文章中曾经写到在一次作文评讲课上，让一个男生上讲台朗读，结果这位略有口吃的学生遭 到了哄笑。 “台下的同学们紧紧注视着他，课堂里死寂一片。沉默中，我突然从后悔自责中省悟，我不是也有过 临场时的恐惧和冷场时手足无措的尴尬吗？然而是自信战胜了一切。有时候一次小小的成功能够激活一个 人的巨大的自信，可一次难忘的失败也往往可以摧毁一个人仅有的一点自信。眼前这个男孩难道会陷入后 一种情形吗？不，绝不能。我终于微笑着开口了，‘既然他不太习惯在众目睽睽之下说话，那索性我们大家 都趴在桌上，不看，只用耳朵听吧！’我带头走到教室最后，背对讲台站定，同学们也纷纷趴下头来。终于， 我的背后传来了羞怯的声音。那的确是一篇好文章，写的是他和父亲间的故事。因为动情的缘故，我听到 他的声音渐渐响了起来，停顿也不多了，有的地方甚至可以说是声情并茂了，我知道他已渐渐进入了状态， 涌上心头的阵阵窃喜使我禁不住悄悄回头看看他。我竟然发现台下早已经有不少学生抬起头，默默地、赞 许地注视着他。朗读结束后，教室里响起一阵热烈的掌声。我知道，这掌声不仅仅是给予这篇作文的。” 问题： 结合材料，请从学生观的角度评析这位教师的做法。\n\n(no analysis)' },
{ cat:'yicuo', t:'KE1-86', s:'YiCuo100', txt:'[KE1] #86\n\n材料： 9 岁的田田是一个很聪明的孩子，特别是语言表达方面比较突出，思维清晰，反应敏捷。平时喜欢做 手工和小种植。在学校里有时与同学有小纠纷，他总说是别人的错而不反思自己的问题，在学习上不愿意 花精力投入。家长对孩子的管理是粗放和随意的，管得紧一点时，孩子表现就好一些，学习方面也不至于 问题太多；疏于管理时，就会出现作业完不成，且出错还很多的情况。 周一下午，王老师检查周末作业，发现田田的作业又未完成，特别是很简单的题都没做完，且出错很 多；作文寥寥草草，篇幅也不够。这样的情形已经出现好几次了。王老师非常生气。课堂上王老师很激动 地当着全班同学的面严厉地批评了田田，指责他太懒，作业多次做不完，太不像话！要求他下课不许玩， 必须把作业补完！ 易错100 题中小幼科一 让每一个孩子都能遇到好老师 16 晚上，王老师收到田田家长发来的短信，说孩子今天放学回家情形低落，因老师在全班同学面前指责 他懒，完不成作业，他很难过。孩子晚上不吃饭，情绪反应很强烈，甚至说不想活了。还表达了作为家长 的担心和恳求。王老师看完短信，回复家长：自己的孩子要好好管教，不要光指望老师。 问题： 请从学生观角度，评析材料中老师的教学行为。\n\n(no analysis)' },
{ cat:'yicuo', t:'KE1-87', s:'YiCuo100', txt:'[KE1] #87\n\n材料： 昊昊小朋友最近感冒了，总是不好好吃午饭，每当我走到他身边时，他为了得到我的表扬，就使劲地 吃饭，不吃菜。于是中午用餐时，我坐在他旁边，看着他吃饭，希望他可以多吃点菜。我说：“今天青菜很 香，来尝一尝。”昊昊不情愿地说：“我不喜欢吃。”我夹起青菜，大口大口地吃给他看，昊昊有点心动了， 学着我的样子夹起一点青菜，可是刚嚼了几下就又吐了出来。看到这种情况，我十分担心，不吃菜怎么行 呢？我对他说：“只要你吃一点菜，老师就给你咸菜做奖励，好吗？”昊昊十分高兴，爽快地吃了自己的一 口菜，我信守承诺给了他一小块咸菜。在接下来的一段时间里，每次午餐我都给昊昊“加餐”，有时也会给 其他小朋友加餐，不知不觉中，孩子们都食欲大增。 问题： 请结合材料，从儿童观角度，评析该老师的教育行为。 易错100 题中小幼科一 让每一个孩子都能遇到好老师 17\n\n(no analysis)' },
{ cat:'yicuo', t:'KE1-88', s:'YiCuo100', txt:'[KE1] #88\n\n材料： 杨老师带班不久就遇到一件麻烦事。午餐时，强强被小斌打了，杨老师立刻打电话通知双方家长，没 想到双方家长来后都认为自己的孩子没有错，吵得不可开交，最后竟然动起手来……幼儿冲突的问题并没 有得到解决，类似这样的事杨老师又遇到过很多，很是头疼。 为有效处理幼儿冲突问题，杨老师主动向有经验的老师请教，还查阅了许多幼儿心理发展方面的书籍， 咨询幼儿教育专家，了解幼儿心理发展知识，探寻幼儿冲突行为的诱因，寻求破解良策。经过长期理论和 实践的积淀，杨老师逐渐成为处理幼儿冲突方面的专家，并出版了《杨老师教你应对幼儿冲突50 招》。 为妥善处理孩子之间冲突，杨老师定期在幼儿园为家长做专题讲座，还经常与家长沟通幼儿的情况。 其所在幼儿园孩子之间冲突逐渐减少，家长之间因孩子冲突而产生的矛盾也逐渐消失了。 问题： 请结合材料，从教师观的角度，评析杨老师的教育行为。\n\n(no analysis)' },
{ cat:'yicuo', t:'KE1-89', s:'YiCuo100', txt:'[KE1] #89\n\n材料： 董老师和王老师是师徒关系。有一次上课时，王老师发现一个细节：董老师从头到尾都拿着教科书， 而且授课过程中还时不时瞄上几眼。经过观察，王老师发现师傅瞄的并不是教科书本身的内容，而是她事 先就粘贴在书中的小纸片。通常，董老师会在分析这篇课文的单词或句型时看一眼，在讲到有关课文的文 化背景时看一眼，又或是在讲评学生作业时看一眼。这些纸片上都记的啥呢？ 课后，得到董老师允许，王老师翻看了师傅所使用的教科书中的小纸片，发现这些纸片主要分为三类： 绿色纸片是知识拓展类，黄色纸片是考点讲解类，蓝色纸片是错题分析类。王老师向董老师请教：“这样的 小纸片密密麻麻，会不会不利于教学知识的系统梳理？”董老师回答道到：“不会呀，这是在分析学生认知 规律和学习特点的基础上想出来的方法。其中，知识拓展类纸片可以帮助学生解决知识的连贯性、整体性 问题，考点讲解类纸片可以帮助学生解决知识的理解性、应用性问题，错题分析类纸片可以帮助学生解决 知识的巩固性、综合性问题。所以，咱们的教学不仅要观察可以怎么做，还需要去琢磨为什么这样做。” 易错100 题中小幼科一 让每一个孩子都能遇到好老师 18 问题： 请结合材料，从教师观的角度，评析董老师的教育行为。\n\n(no analysis)' },
{ cat:'yicuo', t:'KE1-90', s:'YiCuo100', txt:'[KE1] #90\n\n材料： 在一次语文课上，张老师正讲得神采飞扬，学生也听得津津有味。忽然听到一声尖叫，一名女生神色 惊慌地站了起来。学生的目光齐聚到这位女生身上。原来，从她的上衣口袋中，爬出一只毛毛虫。这时， 张老师从容镇静地走到女生面前，轻轻拍了拍她的肩膀，示意她不要紧张，让她坐下，然后拿起掉在地上 的虫子，轻轻举起，语气轻松地说：“同学们看，只不过是一只小虫子，很普通的小虫子，它是专门吃瓜果 蔬菜的害虫，今天又跑到这里来吓唬我们的同学，你们说，我们应该如何处理它？“踩死它！踩死它！”同 学们异口同声，于是轻轻一踩，一场风波就此结束。 问题： 请从教师职业道德角度，评析材料中张老师的教育行为。张老师处置这次突发事件的方式对你有怎样 的启示？\n\n(no analysis)' },
{ cat:'yicuo', t:'KE1-91', s:'YiCuo100', txt:'[KE1] #91\n\n材料： 师范大学毕业后，孙斌凭借自己的努力成为了一名语文教师。工作前几年，为了适应教学工作，他向 其他同事学习，教学水平逐渐提高，教学效果得到了家长们的认可。这时，他认为教学工作并不神秘，自 己的经验、知识与能力已经足以应付，没有必要继续深入钻研教学。 一天，几位学生的家长找到孙老师，希望他能在课后帮助孩子补习，孙老师认为这事有利于提高学生 易错100 题中小幼科一 让每一个孩子都能遇到好老师 19 成绩就答应了。补习结束时，家长们为了感谢孙老师，给了他一笔可观的补课费，孙老师推辞不过只好接 受。 自此以后，越来越多的学生找孙老师补课，其他班级甚至其他学校的学生也来找他。为了保证补习效 果，孙老师常常将课堂教学与课后辅导联系起来，还专门编印了系列学习资料，仅收取成本费和辛苦费。 随着参与辅导学生的规模的扩大，孙老师家里的空间已不足以容纳。 于是，他在小区里专门租了地方方便学生参与辅导。为了节省学生购买学习资料和学习工具的费用， 孙老师还要求学生统一从自己这里购买。家长对孙老师的辅导非常满意，还给他送了锦旗。 问题： 请结合材料，从教师职业道德的角度，评析孙老师的教育行为。\n\n(no analysis)' },
{ cat:'yicuo', t:'KE1-92', s:'YiCuo100', txt:'[KE1] #92\n\n材料： 这段时间幼儿园李老师一直被一件事情困扰着。李老师发现，班上新来的小钰和别的小朋友不一样。 她见到陌生人就会惊恐地往后躲，在幼儿园里不与同伴交流，不爱运动，拒绝参加班里组织的任何活动， 总是自己默默地坐在小椅子上不让小朋友接近她，谁要跟她说话，她就嗷嗷叫，害怕得瑟瑟发抖。 通过多方了解，李老师得知小钰出生后就被人领养，后来，生父与养父发生纠纷，为了摆脱生父的纠 缠，养父就带着她东躲西藏，3 岁时又将她转给现在的养父母，现在的养父母开了一家饭店，为了生意， 基本无暇顾及她，任她自己玩耍，饭店的服务员经常嘲弄她不会说话，使得她害怕成年人，拒绝与人交往， 没有交流对象，语言表达能力发展很慢。 面对如此情况，该怎么办呢？ 问题： 请结合材料，按照教师职业道德的要求为李老师出谋划策。 易错100 题中小幼科一 让每一个孩子都能遇到好老师 20\n\n(no analysis)' },
{ cat:'yicuo', t:'KE1-93', s:'YiCuo100', txt:'[KE1] #93\n\n材料： 民族文化的独特性和优越性，不仅体现于显性的世界观和价值观，而且根植于隐性的思维模式中。在 人类文明的进程中，中华文明之所以延续得如此绵长，在很大程度上得益于我们这个民族独特的方法论和 辩证法原则，得益于中国人思考问题的方式和解决问题的路径。辩证矛盾思维即是其中之一。 辩证矛盾思维特别注重时间性。既然矛盾双方之间的辩证运动是在时间中展开的，时间就不是可有可 无的，而必须是参与事件的重要因素。因此，辩证思维特别看重“时机”，追求“时中”。 “时中”一词最早出现于《周易》“蒙”卦的《彖传》：“蒙，亨。以亨行，时中也。”意思是说，蒙卦 表示希望亨通，所以，以通来行事，是符合“蒙”这个时机的。可见，所谓“时中”，主要有两方面的含义： 一是要“合乎时宜”，二是要“随时变通”。中而非时，不谓之中。同样，时而不中，更不谓之中了。 《资治通鉴》中记载了这么一个故事，说韩国的国君韩昭侯准备修建一个高门，但他的谋士屈宜臼却 奉劝他不要这么做。屈宜臼说：“如果你非要修建这个高门，恐怕你还等不到这个高门修建完，就要死了。 为什么呢？因为时机不对。国君在自己家修建一个高一点的门楼，搞得气派一些，有错吗？没有错。当年 我们国强民富的时候，你如果修建一个高门，肯定没有问题。可是今天的情况已经不一样了，秦国去年刚 刚攻占了我们的宜阳城，我国元气大伤，你偏偏要在这个时候修建高门，势必会使百姓离心，将士散德， 韩国的败落就不可避免了。”结果，韩昭侯没有听屈宜臼的劝告，而屈宜臼的预言也应验了，高门还没有修 好，韩昭侯就去世了。 当然，这只是一个小故事，但其中蕴含的道理却非常深刻。正如屈宜臼说的那句话：“吾所谓时者，非 时日也。夫人固有利、不利时。”意思是说，我所说的时间，不是客观的时间，而是参与到事情当中来的时 间。在合适的时间做一件事情，效果会很好；在不合适的时间做同一件事情，往往会很糟。这正是“举事 而不时，力虽尽而功不成”的道理。 正因为此，中国文化对时间非常敏感，强调做任何事情都要相时而动，顺势而行。 《中庸》中说：“君子之中庸也，君子而时中；小人之中庸也，小人而无忌惮也。”宋代学者朱熹在注 释“时中”时也说：“盖中无定体，随时而在，是乃平常之理也。”即是指，“中庸”，是因“时”而“中” 的，并非骑墙、折中，更不是简单、僵化的“中间地带”。“时中”又是何其之难！因为它在实践中很难把 握，你不可能一劳永逸地抓住它，然后照本宣科地去实践。但是，认识到这种困难并不是坏事，因为你一 旦明白了“时中”的艰难，就会有一种危机感。而这种危机感又会让你在行为中谨小慎微、如履薄冰，相 易错100 题中小幼科一 让每一个孩子都能遇到好老师 21 时顺势，减少犯错。 （摘编自祝和军《中国传统文化中的辩证思维》） 问题： （1）辩证矛盾思维为何特别注重时间性？请结合文本，简要概括。 （2）追求“时中”，对个体而言有何价值和作用？请结合文本，简要分析。\n\n(no analysis)' },
{ cat:'yicuo', t:'KE1-94', s:'YiCuo100', txt:'[KE1] #94\n\n材料： ①从形而上的层面上讲，审美也是一种终极关怀。我们知道，人的独立意识，产生于人与自然、人与 社会的历史性分裂。这种分裂是文明的结果，同时也带来了文明的问题。于是，生的孤独、爱的寂寞、死 的烦恼，便成为一切文明社会中所不可避免的精神疾患。为了解除这些疾患，人们不仅追求物质的满足， 而且需要精神的慰藉，这也便是“终极关怀”的动因所在。 ②大致说来，人类的终极关怀主要有三种方式：一种是给多样的现实世界以统一之本体存在的哲学承 诺，一种是给有限的个体生命以无限之价值意义的宗教承诺，一种是给异化的现实人生以多样之审美观的 艺术承诺。随着人类文明的发展，哲学之本体论和宗教之形而上学纷纷面临着学理上的危机，在这种情况 下，艺术便需要自觉地承担起为人类提供终极关怀的历史使命。 ③一般认为，艺术的价值十分重要，这其中既有认识论的内容，也有伦理学的成分。而在我们看来， 认识内容的多少并不是艺术价值的关键所在，否则，徐悲鸿笔下那幅不太合乎解剖学原理的《奔马》便不 会价值连城了；伦理成分的强弱也不是艺术价值的关键所在，否则，贝多芬谱写的那首不太具有道德色彩 的《月光》便不会被千古称颂了。说到底，艺术之所以为艺术，不在于认识，不在于教化，而在于给人想 象的空间和情感的慰藉，是对遭受异化痛苦的人们所进行的精神关怀。相对而言，我们可以将这种精神关 怀分为初级和终极两种类型。所谓“初级关怀”，是对人们生活情绪的放松、抚慰、宣泄，并通过这种形式 使其恢复到健康状态。比如我们在一天的辛苦劳作之后，到影院中去观赏一部惊心动魄的美国大片，到歌 厅里去唱几首脍炙人口的流行歌曲，虽然没有什么强烈的精神波澜、深刻的灵魂触动，但总归是一种精神 享受。所谓“终极关怀”，则是对人们生存意义的感悟、理解、追问，并通过这种形式使其获得一种精神的 易错100 题中小幼科一 让每一个孩子都能遇到好老师 22 升华。比如我们在孤独、寂寞或遇到情感危机的时候去音乐厅欣赏一部交响乐，去歌剧院观看一部悲剧， 虽然不见得开心、解闷儿，但常常会有一种心灵的触动、情感的慰藉。对于不同层次、不同状态、不同境 遇中的欣赏者来说，这两种艺术各有其存在的理由。但是，就艺术自身的价值而言，后者显然要比前者更 有意义。 ④一部优秀的艺术品，哪怕是些平平常常的事物，也总能上升到“终极关怀”的高度加以理解。譬如 唐代大诗人白居易年轻时写的那首五言律诗《赋得古原草送别》，从字面上看，通俗易懂，仿佛没有什么深 奥的道理，但它之所以被人们千古传颂，自有其“终极关怀”的重要意义。那“一岁一枯荣”的生命历程， 就像代代不息的人生一样，在宿命的轮回中不断燃起新的希望。一首40 个汉字的短诗如此，一场戏剧、一 部电影、一篇小说更是如此。古今中外凡是超越民族和地域从而具有永恒价值的艺术品，无不具有形而上 的“终极关怀”。 ⑤与西方社会相比，中国古代的哲学本体论并不发达，宗教也并不占据意识形态的主导地位，因此古 人的“终极关怀”往往是通过审美活动加以实现的，这种“代偿功能”也正是中国古典艺术特别发达的原 因所在。我们知道，文明的人类之所以陷入异化的痛苦，乃是因为生产力和生产关系的利刃斩断了人与自 然、人与社会的原始纽带。因此作为治疗异化痛苦的古典艺术，最常用的方式是将人与自然、人与社会的 断裂重新弥合起来，从而将短暂的现实人生与永恒的自然存在联系起来，将有限的个体生命与无限的族类 生活联系起来。 （选自《中国审美文化简史》，有删改） 问题： （1）如果一个时代的宗教与哲学不发达，那么人类的终极关怀主要会以什么形式实现呢？为什么？ （2）结合文中的观点，谈谈你对下面这段话的理解。 荷兰画家梵·高的名画《星夜》所描绘的景象与现实世界的星夜不同，画面上11 颗星星聚集在月亮周 围翻滚着，像炽热燃烧的火球。评论家说，这幅画象征着人类的挣扎与奋斗精神。 易错100 题中小幼科一 让每一个孩子都能遇到好老师 23\n\n(no analysis)' },
{ cat:'yicuo', t:'KE1-95', s:'YiCuo100', txt:'[KE1] #95\n\n材料： “礼”，这个笔画简单的字眼，解释起来却有些复杂。这世上本来没有“礼”，只是因为集体生存、社 会发展的需要，才产生了“礼”的仪式，造出了“礼”的汉字。“礼”字的繁体是“禮”，本字为“豊”，一 看便知与祭祀有关。在甲骨文中，“豊”的顶部就像两串美玉，底部就像有支架的建鼓。合起来就是击鼓奏 乐，用美玉敬奉祖先和神灵。上升到定义，就是履行敬神祈福的仪式。 《礼记》云：“经礼三百，曲礼三千”，可见礼仪数量之多。其实，这么多“礼”是根据时间、场合和 对象制订的，并不需要时时、处处、人人都去掌握。外交上有个术语叫“国际惯例”，社交场合的“礼”也 是约定俗成的惯例，大家都按惯例行事，就习以为常了。在今人字典里，“礼”也分虚实两类，虚的如礼节、 礼仪、礼貌、礼俗等，实的如礼品、礼金、礼服、礼花等。还包括与“礼”相关的人事和行为，如礼宾、 礼遇、礼聘、礼让等。大到国家和社团，小到街邻和家庭，“礼”无处不在。钱穆先生曾说中国文化的特质 是“礼”，西方语言中没有“礼”的同义词；它是整个中国人世界里一切习俗行为的准则，标志着中国的特 殊性。我们常说，中国是文明礼仪之邦，因为礼仪与文明是相统一的，礼仪是文明的载体，文明是礼仪的 内涵，没有了礼仪，文明也就无所依附。 现代的“礼”，主要体现在外交与社交领域，而“礼”在古代还被看作是核心价值观，用来调整社会关 系，具有制度属性和法律属性，是社会的典章制度和道德规范，即所谓“礼法”。“礼”的本意是“别尊卑， 等贵贱”，其本质是对奴隶主中不同等级的人所享有不同礼遇的规定。先秦诸子都强调“礼”的作用在于维 持建立在等级制度和亲属关系上的社会差异，这也正是“礼”的本质内涵。每个人都要按照自己的社会地 位去选择合乎身份的“礼”，否则就是非“礼”。 鲁迅有个著名的立论叫“礼教吃人”。他所抨击的“礼教”，兴起于封建社会，其实质是封建礼法。有 人把“礼教吃人”与孔子联系起来，那是记错了账。孔子曰：“敦礼教，远罪疾，则民寿矣。”孔子倡导的 礼教与封建礼法有着本质的区别。封建卫道士从孔子那里取火，不是去爱人而是害人，这关孔子什么事？ “礼”经夏、殷、周三代沿革，到周公的时代已经比较完善。因此孔子说，“郁郁乎文哉，吾从周”。 孔子遵从的就是周朝的典章礼制，这是他的政治理想。从某种意义上说，孔子是为“礼”而生并为“礼” 奋斗了一生。孔子为何给儿子取名孔鲤，“鲤”者，礼也。他让儿子自小就要学诗、学礼，并说，“不学诗， 无以言”“不学礼，无以立”。“诗”和“礼”是古人教育后代最基本的功课，所以有“诗礼传家”之说。有 的学者把文化分成观念形态、制度形态和物质形态，而在中国传统文化中，礼是把价值观念、制度设计、 物质载体统合在一起，并且包含了风俗习惯的文化形态。还有学者认为，文明产生在国家之前，礼仪产生 在文字之前，文化的传承不仅依靠语言、文字，还依靠礼仪。中国文化作为唯一没有间断的原生文化，是 易错100 题中小幼科一 让每一个孩子都能遇到好老师 24 以礼为标志和根源的。 （摘编自王兆贵《言之有“礼”》） 问题： （1）文章为什么说在我国“礼仪是文明的载体”？请简要概括。 （2）请根据文章，简要分析“礼”的发展进程及其存在意义。 三、写作题\n\n(no analysis)' },

  // ================================================================

  // ================================================================
  const STORAGE_KEY = 'jzzuowen_user_sections';

  // 从 localStorage 加载用户添加的内容
  function loadUserSections() {
    try {
      let saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        let userSections = JSON.parse(saved);
        if (Array.isArray(userSections) && userSections.length > 0) {
          // 用户添加的内容插到数组最前面（最新添加的最先读）
          sections.unshift(...userSections);
        }
      }
    } catch(e) {
      console.error('加载用户内容失败:', e);
    }
  }

  // 保存用户内容到 localStorage
  function saveUserSections(userSections) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(userSections));
      return true;
    } catch(e) {
      console.error('保存用户内容失败:', e);
      return false;
    }
  }

  // 获取当前用户内容（只获取用户添加的，不包括内置的）
  function getUserSections() {
    try {
      let saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        let userSections = JSON.parse(saved);
        if (Array.isArray(userSections)) return userSections;
      }
    } catch(e) {}
    return [];
  }

    // 获取现有用户内容
    let userSections = getUserSections();

  // 检测 Edge TTS 服务器地址
  function detectServerUrl() {
    if (location.protocol === 'http:' || location.protocol === 'https:') {

    return 'http://127.0.0.1:5555';

  // 检测 Edge TTS 服务器是否可用
  async function checkEdgeTTSServer() {
    edgeServerUrl = detectServerUrl();
    try {
      let resp = await fetch(edgeServerUrl + '/api/health', {timeout: 3000});
      if (resp.ok) {
        let data = await resp.json();
        if (data.status === 'ok' && data.engine === 'edge-tts') {
          ttsEngine = 'edge';

  }

  // 构建语音选择列表
  function buildVoiceList() {
    let sel = document.getElementById('voiceSel');
    sel.innerHTML = '';
    if (ttsEngine === 'edge' && edgeVoices.length > 0) {
      // 按风格分组
      let cats = {};
      edgeVoices.forEach(v => {
        let c = v.style || '其他';
        if (!cats[c]) cats[c] = [];
        cats[c].push(v);
      });
      // 优先显示新闻风格
      let order = ['新闻直播', '新闻沉稳', '自然亲切', '温暖自然', '温柔沉稳', '知性沉稳', '冷静沉稳', '活泼明亮', '温暖甜美', '沉稳男声', '成熟男声', '清朗男声'];
      let shown = {};
      order.forEach(cat => {
        if (cats[cat]) {
          let label = document.createElement('div');
          label.className = 'voice-cat-label';
          label.textContent = '─ ' + cat + ' ─';
          sel.appendChild(label);
          cats[cat].forEach(v => {
            let o = document.createElement('option');
            o.value = v.id;
            o.textContent = v.icon + ' ' + v.name + '（' + v.gender + '）' + (v.desc ? ' · ' + v.desc : '');
            sel.appendChild(o);
          });
          shown[cat] = true;
        }
      });
      // 其他未分类
      Object.keys(cats).forEach(cat => {
        if (!shown[cat]) {
          let label = document.createElement('div');
          label.className = 'voice-cat-label';
          label.textContent = '─ ' + cat + ' ─';
          sel.appendChild(label);
          cats[cat].forEach(v => {
            let o = document.createElement('option');
            o.value = v.id;
            o.textContent = v.icon + ' ' + v.name + '（' + v.gender + '）';
            sel.appendChild(o);
          });
        }
      });
      // 默认选第一个（新闻直播风格）
      sel.value = edgeVoices[0].id;
    } else {
      // Web Speech API 语音
      let vs = synth.getVoices().filter(v => v.lang && (v.lang.startsWith('zh')||v.lang.startsWith('cmn')));
      if (!vs.length) {
        sel.innerHTML = '<option value="">无可用中文语音</option>';
        return;
      }
      vs.sort((a,b)=>scoreVoice(b)-scoreVoice(a)).forEach(function(v){
        let o = document.createElement('option');
        o.value = synth.getVoices().indexOf(v);
        o.textContent = displayVoiceName(v);
        sel.appendChild(o);
      });
      if (!zhVoice) { zhVoice = vs[0]; sel.value = synth.getVoices().indexOf(zhVoice); }
    }
  }
  function scoreVoice(v){let n=(v.name||'').toLowerCase(),s=0;if(n.includes('online')||n.includes('natural')||n.includes('xiaoxiao'))s+=100;if(n.includes('microsoft'))s+=50;if(v.lang==='zh-CN')s+=20;return s;}
  function displayVoiceName(v){let n=(v.name||'').toLowerCase(),t='🔊 ';if(n.includes('xiaoxiao')||n.includes('online'))t='✨ ';return t+v.name.replace('Microsoft ','MS ').replace(' (Natural)','').replace(' (Online)','')+' ['+v.lang+']';}

  // 初始化语音系统
  async function initTTS() {
    let hasEdge = await checkEdgeTTSServer();
    if (hasEdge) {
      await loadEdgeVoices();
    }
    updateEngineBadge();
    buildVoiceList();

    // 同时加载 Web Speech 语音作为备用
    if (synth.onvoiceschanged) {
      synth.onvoiceschanged = function() {
        if (ttsEngine === 'web') buildVoiceList();
      };
    }
    // Web Speech 语音可能延迟加载
    setTimeout(function(){ if(ttsEngine==='web') buildVoiceList(); }, 300);
    setTimeout(function(){ if(ttsEngine==='web') buildVoiceList(); }, 1200);

  // 获取当前选中的语音
  function getCurrentVoice() {
    let sel = document.getElementById('voiceSel');
    if (ttsEngine === 'edge') {
      return sel.value || 'zh-CN-YunyangNeural';
    } else {
      let idx = parseInt(sel.value);
      let voices = synth.getVoices();
      return (idx >= 0 && voices[idx]) ? voices[idx] : null;
    }
  }

  function getSpeed(){ return parseFloat(document.getElementById('speedSel').value); }
  function getPitch(){ return parseInt(document.getElementById('pitchSlider').value); }
  function getVolume(){ return parseInt(document.getElementById('volSlider').value) / 100; }

  // 音调/音量滑块事件
  document.getElementById('pitchSlider').addEventListener('input', function() {

  });

  // ================================================================
  //  Edge TTS: 文本分句 + 音频播放
  // ================================================================
  function splitSentences(text) {
    // 按句号、问号、感叹号、换行分割
    let parts = [];
    let cur = '';
    for (let i = 0; i < text.length; i++) {
      cur += text[i];
      if ('\n。！？!?\n'.includes(text[i])) {
        // 包含分隔符后面的空格
        while (i + 1 < text.length && text[i+1] === ' ') { cur += text[i+1]; i++; }
        parts.push({text: cur.trim(), start: i - cur.length + 1, end: i + 1});
        cur = '';
      }
    }
    if (cur.trim()) {
      parts.push({text: cur.trim(), start: text.length - cur.length, end: text.length});
    }
    return parts;
  }

  // Edge TTS: 高亮当前句子
  function hlSentence(start, end) {
    let spans = rBody.querySelectorAll('span[data-i]');
    for (let sp of spans) {
      let i = parseInt(sp.getAttribute('data-i'));
      if (i < start) sp.className = 'w-read';
      else if (i >= start && i < end) sp.className = 'w-now';
      else sp.className = 'w-next';
    }
    // 滚动到当前句子
    let tgt = rBody.querySelector('.w-now');
    if (tgt) {
      let tr = tgt.getBoundingClientRect(), cr = rBody.getBoundingClientRect();
      if (tr.top < cr.top + 80 || tr.bottom > cr.bottom - 80) {
        tgt.scrollIntoView({behavior: 'smooth', block: 'center'});
      }
    }
  }

  // Edge TTS: 获取音频并播放
  let edgeAudio = null;
  let edgeSentenceIdx = 0;
  let edgeSentences = [];

  function speakEdgeTTS(text, onEnd) {
    edgeSentences = splitSentences(text);
    edgeSentenceIdx = 0;

    if (edgeSentences.length === 0) {
      if (onEnd) onEnd();
      return;
    }

    // 如果只有一句，直接播放
    if (edgeSentences.length === 1) {
      playEdgeSentence(0, onEnd);
      return;
    }

    // 多句：逐句播放
    playEdgeSentence(0, function() {
      edgeSentenceIdx++;
      playNextEdgeSentence(onEnd);
    });
  }

  function playNextEdgeSentence(onEnd) {
    if (edgeSentenceIdx >= edgeSentences.length) {
      allRead();
      if (onEnd) onEnd();
      return;
    }
    playEdgeSentence(edgeSentenceIdx, function() {
      edgeSentenceIdx++;
      playNextEdgeSentence(onEnd);
    });
  }

  function playEdgeSentence(idx, onSentenceEnd) {
    let s = edgeSentences[idx];
    if (!s || !s.text) {
      if (onSentenceEnd) onSentenceEnd();
      return;
    }

    // 高亮当前句子
    hlSentence(s.start, s.end);

    // 构建请求参数
    let voice = getCurrentVoice();
    let rate = getSpeed();
    // Web Speech rate (0.75-1.3) → Edge TTS rate percentage
    let edgeRate = Math.round((rate - 1) * 100);
    let rateStr = (edgeRate >= 0 ? '+' : '') + edgeRate + '%';
    // Pitch (-10 to 10) → Edge TTS pitch Hz
    let pitch = getPitch();
    let pitchStr = (pitch >= 0 ? '+' : '') + pitch + 'Hz';

    let loadingEl = document.getElementById('ttsLoading');

    // 请求音频
    fetch(edgeServerUrl + '/api/tts', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        text: s.text,
        voice: voice,
        rate: rateStr,
        pitch: pitchStr
      })
    }).then(function(resp) {
      if (!resp.ok) throw new Error('TTS请求失败');
      return resp.blob();
    }).then(function(blob) {
      let url = URL.createObjectURL(blob);
      if (edgeAudio) {
        edgeAudio.pause();
        edgeAudio.src = '';
      }
      edgeAudio = new Audio(url);
      edgeAudio.volume = getVolume();
      edgeAudio.onended = function() {
        URL.revokeObjectURL(url);
        loadingEl.classList.remove('show');
        if (onSentenceEnd) onSentenceEnd();
      };
      edgeAudio.onerror = function() {
        URL.revokeObjectURL(url);
        loadingEl.classList.remove('show');
        if (onSentenceEnd) onSentenceEnd();
      };
      loadingEl.classList.add('show');
      edgeAudio.play().catch(function(e) {
        console.error('播放失败:', e);
        loadingEl.classList.remove('show');
        // 自动播放被拦截，显示提示
        document.getElementById('autoplayHint').classList.add('show');
      });
    }).catch(function(err) {
      console.error('Edge TTS错误:', err);
      loadingEl.classList.remove('show');
      // Edge TTS 失败，切换到 Web Speech
      if (ttsEngine === 'edge') {
        console.log('切换到 Web Speech 备用引擎');
        ttsEngine = 'web';
        updateEngineBadge();
        buildVoiceList();
        speakWebSpeech(edgeSentences.map(s => s.text).join(''), onSentenceEnd);
      } else {
        if (onSentenceEnd) onSentenceEnd();
      }
    });
  }

  // ================================================================
  //  Web Speech API 播放
  // ================================================================
  function speakWebSpeech(txt, onEnd) {
    if (synth.speaking) synth.cancel();
    utter = null;
    let u = new SpeechSynthesisUtterance(txt);
    u.lang = 'zh-CN';
    let v = getCurrentVoice();
    if (v && typeof v !== 'string') u.voice = v;
    u.rate = getSpeed();
    // 音调：滑块 -10~10 映射到 0.5~1.5
    u.pitch = 1 + getPitch() * 0.05;
    u.volume = getVolume();
    u.onboundary = function(e) { if (e.charIndex !== undefined) hl(e.charIndex, e.charLength || 1); };
    u.onend = function() { allRead(); if (onEnd) onEnd(); };
    u.onerror = function() { if (onEnd) onEnd(); };
    utter = u;
    synth.speak(u);
  }

  function buildTOC(){
    let tl = document.getElementById('tocList'), cur='';
    tl.innerHTML = '';
    for(let i=0;i<sections.length;i++){
      let s=sections[i];
      if(s.cat!==cur){
        cur=s.cat;
        let l=document.createElement('div'); l.className='toc-cat-label';
        l.textContent={'教综':'📘 教综','学科英语':'🔤 学科英语','主题':'📖 主题','名言':'💬 名言','好词':'✨ 好词','好句':'🎯 好句','模板':'📝 模板','自定义':'📝 自定义'}[cur]||cur;
        tl.appendChild(l);
      }
      let b=document.createElement('button');
      b.className='toc-item'+(i===0?' on':'');
      let tag = s.userAdded ? ' <span class="user-content-tag">自定义</span>' : '';
      b.innerHTML='<span class="toc-num">'+(i+1)+'</span><span>'+cleanTitle(s.t)+tag+'</span>';
      b.dataset.idx=i;
      b.onclick=function(){jumpToIdx(parseInt(this.dataset.idx));};
      // 自定义内容添加删除按钮
      if(s.userAdded){
        let delBtn = document.createElement('button');
        delBtn.className = 'toc-delete';
        delBtn.textContent = '删除';
        delBtn.onclick = function(e){
          e.stopPropagation();
          deleteUserSection(parseInt(b.dataset.idx));
        };
        b.appendChild(delBtn);
      }
      tl.appendChild(b);
    }
  }
  function cleanTitle(t){return t.replace(/[🌳🔑🪞❤️📖🌈💡⚖️🔆🕯️🏮🌟🎓🇨🇳✨🎯🔗📝🏁📊]/g,'').trim();}

  // ================================================================
  //  渲染
  // ================================================================
  let rBody = document.getElementById('readingBody');

  function renderSec(i){
    let sec=sections[i]; curIdx=i;
    document.getElementById('dispTitle').textContent=sec.t;
    document.getElementById('dispSubtitle').textContent=sec.s;
    document.getElementById('statusPill').textContent=(i+1)+'/'+TOTAL+' · '+cleanTitle(sec.t);
    document.getElementById('progFill').style.width=((i+1)/TOTAL*100)+'%';

    let txt=sec.txt, html='';
    for(let j=0;j<txt.length;j++){
      let ch=txt[j];
      if(ch==='\n') html+='<br>';
      else if(ch===' ') html+='<span class="w-next" data-i="'+j+'">&nbsp;</span>';
      else html+='<span class="w-next" data-i="'+j+'">'+esc(ch)+'</span>';
    }
    rBody.innerHTML=html;
    rBody.scrollTop=0;
    // 同步目录高亮
    document.querySelectorAll('.toc-item').forEach(b=>b.classList.toggle('on',parseInt(b.dataset.idx)===i));
  }

  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  function hl(ci,cl){
    let spans=rBody.querySelectorAll('span[data-i]'), end=ci+(cl||1), tgt=null;
    for(let sp of spans){
      let i=parseInt(sp.getAttribute('data-i'));
      if(i<ci) sp.className='w-read';
      else if(i>=ci&&i<end){sp.className='w-now';tgt=sp;}
      else sp.className='w-next';
    }
    if(tgt){
      let tr=tgt.getBoundingClientRect(), cr=rBody.getBoundingClientRect();
      if(tr.top<cr.top+80||tr.bottom>cr.bottom-80){
        tgt.scrollIntoView({behavior:'smooth',block:'center'});
      }
    }
  }
  function allRead(){rBody.querySelectorAll('span[data-i]').forEach(s=>s.className='w-read');}

  // ================================================================
  //  播放引擎 - 双引擎调度
  // ================================================================
  function speak(txt,onEnd){
    // ★ 双引擎调度：Edge TTS 或 Web Speech API
    if(ttsEngine === 'edge'){
      speakEdgeTTS(txt, onEnd);
    }else{
      speakWebSpeech(txt, onEnd);
    }
  }
  function stopCur(){
    playToken++; // ★ 作废所有pending回调
    // 停止 Web Speech
    if(synth.speaking) synth.cancel();
    utter=null;
    // 停止 Edge TTS Audio
    if(edgeAudio){
      edgeAudio.pause();
      edgeAudio.src='';
    }
    document.getElementById('ttsLoading').classList.remove('show');
  }

  // ---- 自动播放 ----
  function startAutoPlay(){
    playing=true; paused=false;
    updatePauseBtn();
    document.getElementById('autoplayHint').classList.remove('show');
    document.getElementById('statusPill').textContent='正在播放...';
    playFrom(0);
    onStartPlay();
  }

  function retryPlay(){
    document.getElementById('autoplayHint').classList.remove('show');
    startAutoPlay();
  }

  // ★ 跳转到指定节并续播
  function jumpToIdx(idx){
    stopCur();
    // 无论之前是否在播放，都从选定节开始播放并续播下一段
    playing = true; paused = false;
    updatePauseBtn();
    document.getElementById('autoplayHint').classList.remove('show');
    document.getElementById('statusPill').textContent = '正在播放...';
    playFrom(idx);
    onStartPlay();
  }

  // 从指定节开始自动播放（保留兼容）
  function startAutoPlay_from(idx){
    playing=true; paused=false;
    updatePauseBtn();
    playFrom(idx);
  }

  function playFrom(i){
    if(i>=TOTAL){
      playing=false;
      document.getElementById('statusPill').textContent='播放完成 ✓';
      updatePauseBtn();
      return;
    }
    let myToken = ++playToken; // ★ 本次播放的令牌
    renderSec(i);
    setTimeout(function(){
      if(myToken!==playToken) return; // 被新播放取代了，放弃
      speak(sections[i].txt, function(){
        if(myToken!==playToken) return; // 旧回调，忽略
        if(playing && !paused){
          setTimeout(function(){
            if(myToken!==playToken) return; // 旧回调，忽略
            playFrom(i+1);
          }, 500);
        }
      });
    }, 450);
  }

  function togglePause(){
    if(!playing) return;
    if(paused){
      paused=false;
      // 恢复播放
      if(ttsEngine === 'edge' && edgeAudio){
        edgeAudio.play();
      }else{
        synth.resume();
      }
    }else{
      paused=true;
      // 暂停播放
      if(ttsEngine === 'edge' && edgeAudio){
        edgeAudio.pause();
      }else{
        synth.pause();
      }
    }
    updatePauseBtn();
  }

  function updatePauseBtn(){
    let icon=document.getElementById('pcPauseIcon');
    let label=document.getElementById('pcPauseLabel');
    if(!playing){
      icon.textContent='▶️'; label.textContent='已完成';
    }else if(paused){
      icon.textContent='▶️'; label.textContent='继续';
    }else{
      icon.textContent='⏸️'; label.textContent='暂停';
    }
  }

  function stopAll(){
    stopCur();
    playing=false; paused=false;
    updatePauseBtn();
    document.getElementById('statusPill').textContent='已停止';
    onStopPlay();
  }

  function toggleFullscreen(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(function(){});
    }else{
      document.exitFullscreen();
    }
  }

  // ---- 键盘 ----
  document.addEventListener('keydown',function(e){
    if(e.key===' '&&e.target.tagName!=='SELECT'){e.preventDefault();if(playing)togglePause();}
    if(e.key==='Escape'){
      if(document.fullscreenElement)document.exitFullscreen();
      closeSidebar();
    }
  });

  // ---- 初始化 + 自动播放 ----
  buildTOC();
  renderSec(0);

  // ================================================================
  //  ★★★ 熄屏保活系统（核心！防止手机熄屏后停止播放）★★★
  // ================================================================
  // 方案1: Wake Lock API - 请求屏幕保持唤醒
  let wakeLock = null;
  async function requestWakeLock() {
    if ('wakeLock' in navigator) {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        console.log('Wake Lock 已获取（屏幕保持唤醒）');
        // 失去锁时自动重新请求
        wakeLock.addEventListener('release', function() {
          console.log('Wake Lock 被释放，尝试重新获取...');
          if (playing) requestWakeLock();
        });
      } catch(e) {
        console.log('Wake Lock 获取失败:', e.message);
      }
    }
  }

  // 方案2: 静音心跳音频 - 播放一个几乎无声音的音频循环
  // 防止浏览器在熄屏时暂停JavaScript音频处理
  let keepAliveAudio = null;
  function startKeepAliveAudio() {
    if (keepAliveAudio) return;
    // 创建一个极短的静音WAV（1秒，用base64编码）
    let silentWav = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
    keepAliveAudio = new Audio(silentWav);
    keepAliveAudio.loop = true;
    keepAliveAudio.volume = 0.01; // 极低音量，几乎听不到
    keepAliveAudio.play().catch(function(e) {
      console.log('心跳音频启动失败:', e.message);
    });
    console.log('心跳音频已启动（防止熄屏暂停）');
  }
  function stopKeepAliveAudio() {
    if (keepAliveAudio) {
      keepAliveAudio.pause();
      keepAliveAudio = null;
      console.log('心跳音频已停止');
    }
  }

  // 方案3: Web Speech 防暂停定时器
  // 移动端浏览器在熄屏后可能暂停speechSynthesis
  // 每5秒检查一次，如果应该播放但被暂停了，自动resume
  let keepAliveTimer = null;
  function startKeepAliveTimer() {
    if (keepAliveTimer) return;
    keepAliveTimer = setInterval(function() {
      if (playing && !paused) {
        // Web Speech: 检查是否被浏览器暂停
        if (ttsEngine === 'web' && synth.speaking && synth.paused) {
          console.log('检测到语音被暂停，自动恢复...');
          synth.resume();
        }
        // Edge TTS: 检查音频是否被暂停
        if (ttsEngine === 'edge' && edgeAudio && edgeAudio.paused) {
          console.log('检测到音频被暂停，自动恢复...');
          edgeAudio.play().catch(function(){});
        }
        // 重新请求 Wake Lock
        if (!wakeLock) requestWakeLock();
      }
    }, 5000);
  }
  function stopKeepAliveTimer() {
    if (keepAliveTimer) {
      clearInterval(keepAliveTimer);
      keepAliveTimer = null;
    }
  }

  // 开始播放时启动保活
  function onStartPlay() {
    requestWakeLock();
    startKeepAliveAudio();
    startKeepAliveTimer();
  }
  // 停止播放时停止保活
  function onStopPlay() {
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
    stopKeepAliveAudio();
    stopKeepAliveTimer();
  }

  // ★ 页面加载后：先检测TTS引擎，再自动播放
  async function tryAutoStart(){
    // 初始化TTS引擎（检测Edge TTS服务器）
    await initTTS();

    // 尝试触发浏览器自动播放权限
    try{
      let testU=new SpeechSynthesisUtterance('');
      testU.volume=0;
      synth.speak(testU);
      synth.cancel();
    }catch(e){}

    setTimeout(function(){
      startAutoPlay();
      setTimeout(function(){
        // 检查是否实际在播放
        let isPlaying = (ttsEngine === 'edge') ? (edgeAudio && !edgeAudio.paused) : synth.speaking;
        if(!isPlaying && playing && !paused){
          document.getElementById('autoplayHint').classList.add('show');
        }
        // ★ 播放成功后启动保活系统
        if (isPlaying) onStartPlay();
      },1500);
    },800);
  }

  // 页面隐藏/恢复时的处理（熄屏恢复后自动继续播放）
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
      // 页面恢复可见，检查播放状态
      if (playing && !paused) {
        if (ttsEngine === 'web' && synth.speaking && synth.paused) {
          synth.resume();
        }
        if (ttsEngine === 'edge' && edgeAudio && edgeAudio.paused) {
          edgeAudio.play().catch(function(){});
        }
        requestWakeLock();
      }
    }
  });

  // 启动
  tryAutoStart();
</script>
</body>
</html>
