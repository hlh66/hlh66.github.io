<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教资作文素材 - 侧栏控制版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #0a0f1e;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow: hidden;
  }

  /* === 侧栏切换按钮（固定在右上角）=== */
  .sidebar-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 1200;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #ff6f00, #ff8f00);
    color: #fff;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(255,111,0,0.4);
    transition: all 0.3s;
  }
  .sidebar-toggle:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(255,111,0,0.6); }
  .sidebar-toggle.active { transform: rotate(90deg); }

  /* === 侧栏遮罩 === */
  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 900;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .sidebar-overlay.show { opacity: 1; pointer-events: auto; }

  /* === 右侧抽屉式侧栏 === */
  .sidebar {
    position: fixed;
    top: 0;
    right: 0;
    width: 340px;
    height: 100vh;
    background: rgba(13,21,37,0.98);
    backdrop-filter: blur(20px);
    border-left: 1px solid rgba(255,111,0,0.15);
    z-index: 1100;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: -10px 0 50px rgba(0,0,0,0.5);
  }
  .sidebar.open { transform: translateX(0); }

  /* 侧栏头部 */
  .sidebar-header {
    flex-shrink: 0;
    padding: 20px 20px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-title {
    font-size: 16px;
    font-weight: bold;
    color: #fff;
  }
  .sidebar-close {
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.4);
    cursor: pointer;
    font-size: 22px;
    padding: 4px 8px;
    border-radius: 8px;
    transition: all 0.2s;
  }
  .sidebar-close:hover { color: #fff; background: rgba(255,255,255,0.1); }

  /* 侧栏内容区（可滚动）*/
  .sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,111,0,0.3) transparent;
  }
  .sidebar-body::-webkit-scrollbar { width: 4px; }
  .sidebar-body::-webkit-scrollbar-thumb { background: rgba(255,111,0,0.3); border-radius: 2px; }

  /* 侧栏区块 */
  .sb-section {
    margin-bottom: 22px;
  }
  .sb-section-title {
    font-size: 11px;
    font-weight: bold;
    color: rgba(255,202,40,0.7);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* 播放控制按钮组 */
  .play-controls {
    display: flex;
    gap: 8px;
  }
  .pc-btn {
    flex: 1;
    background: linear-gradient(135deg, #ff6f00, #ff8f00);
    color: #fff;
    border: none;
    padding: 12px 0;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: all 0.25s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .pc-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(255,111,0,0.35); }
  .pc-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  .pc-btn.secondary {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .pc-btn.secondary:hover { background: rgba(255,255,255,0.15); }
  .pc-btn .pc-icon { font-size: 20px; }
  .pc-btn .pc-label { font-size: 11px; opacity: 0.9; }

  /* 设置项 */
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .setting-label {
    font-size: 13px;
    color: rgba(255,255,255,0.7);
  }
  .setting-select {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    min-width: 140px;
  }
  .setting-select option { background: #0d1525; color: #fff; }

  /* 章节目录列表 */
  .toc-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .toc-cat-label {
    font-size: 10px;
    color: rgba(255,111,0,0.5);
    font-weight: bold;
    padding: 8px 4px 4px;
    letter-spacing: 1px;
  }
  .toc-item {
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.6);
    text-align: left;
    padding: 9px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
    line-height: 1.4;
    display: flex;
    align-items: flex-start;
    gap: 6px;
  }
  .toc-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .toc-item.on {
    background: linear-gradient(135deg, rgba(255,111,0,0.25), rgba(255,143,0,0.15));
    color: #ffca28;
    font-weight: bold;
  }
  .toc-num {
    font-size: 11px;
    opacity: 0.5;
    min-width: 22px;
    flex-shrink: 0;
    padding-top: 1px;
  }
  .toc-item.on .toc-num { opacity: 0.8; }

  /* === 主内容区（全屏）=== */
  .main-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 60px;
    position: relative;
    overflow: hidden;
    min-height: 0;
    transition: padding 0.35s;
  }

  .bg-glow {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(80px);
    opacity: 0.35;
  }
  .bg-glow.g1 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(255,111,0,0.3) 0%, transparent 70%);
    top: -100px; right: -80px;
  }
  .bg-glow.g2 {
    width: 350px; height: 350px;
    background: radial-gradient(circle, rgba(21,101,192,0.28) 0%, transparent 70%);
    bottom: -80px; left: -60px;
  }
  .bg-glow.g3 {
    width: 250px; height: 250px;
    background: radial-gradient(circle, rgba(102,187,106,0.2) 0%, transparent 70%);
    top: 40%; left: 30%;
  }

  /* === 文字展示区域 === */
  .text-display {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 1100px;
    text-align: center;
  }

  .display-title {
    font-size: clamp(22px, 3.5vw, 42px);
    font-weight: bold;
    color: #fff;
    margin-bottom: 6px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }
  .display-subtitle {
    font-size: clamp(12px, 1.5vw, 17px);
    color: rgba(255,255,255,0.45);
    margin-bottom: clamp(24px, 4vh, 48px);
  }

  .reading-body {
    font-size: clamp(26px, 4.2vw, 56px);
    line-height: 1.85;
    text-align: justify;
    color: rgba(255,255,255,0.85);
    word-break: break-all;
    letter-spacing: 0.02em;
    text-shadow: 0 1px 12px rgba(0,0,0,0.3);
    overflow-y: auto;
    max-height: calc(100vh - 200px);
    padding-right: 8px;
    scroll-behavior: smooth;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,111,0,0.3) transparent;
  }
  .reading-body::-webkit-scrollbar { width: 4px; }
  .reading-body::-webkit-scrollbar-thumb { background: rgba(255,111,0,0.3); border-radius: 2px; }
  .reading-body::-webkit-scrollbar-track { background: transparent; }

  .w-read { color: rgba(255,255,255,0.22); transition: color 0.15s; }
  .w-now {
    background: linear-gradient(120deg, #ff6f00, #ffca28);
    color: #0d1b2a;
    font-weight: bold;
    border-radius: 5px;
    padding: 2px 6px;
    margin: 0 -2px;
    box-shadow: 0 0 22px rgba(255,152,0,0.95), 0 3px 12px rgba(255,111,0,0.4);
    display: inline-block;
    transition: all 0.05s;
    transform: scale(1.07);
  }
  .w-next { color: rgba(255,255,255,0.85); }

  /* === 底部进度条（极简，贴底）=== */
  .mini-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: rgba(255,255,255,0.05);
    z-index: 500;
  }
  .mini-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff6f00, #ffca28, #66bb6a);
    width: 0%;
    transition: width 0.3s;
  }

  /* === 自动播放提示 === */
  .autoplay-hint {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    z-index: 9000;
    background: linear-gradient(135deg, rgba(255,111,0,0.95), rgba(255,143,0,0.95));
    color: #fff;
    padding: 14px 32px;
    border-radius: 30px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 30px rgba(255,111,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s, transform 0.4s;
    white-space: nowrap;
  }
  .autoplay-hint.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
    animation: hint-pulse 2s infinite;
  }
  @keyframes hint-pulse {
    0%, 100% { box-shadow: 0 6px 30px rgba(255,111,0,0.5); }
    50% { box-shadow: 0 6px 40px rgba(255,111,0,0.8); }
  }

  /* 状态文字（左下角小字）*/
  .status-pill {
    position: fixed;
    bottom: 14px;
    left: 16px;
    z-index: 500;
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    background: rgba(10,15,30,0.7);
    padding: 4px 12px;
    border-radius: 12px;
    backdrop-filter: blur(8px);
  }

  /* === 引擎状态徽章 === */
  .engine-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 10px;
  }
  .engine-badge.edge {
    background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(0,180,255,0.1));
    color: #00d4ff;
    border: 1px solid rgba(0,212,255,0.3);
  }
  .engine-badge.web {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.5);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .engine-badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    animation: pulse-dot 2s infinite;
  }
  .engine-badge.edge .dot { background: #00d4ff; }
  .engine-badge.web .dot { background: rgba(255,255,255,0.4); }
  @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* === 滑块样式 === */
  .slider-row { margin-bottom: 12px; }
  .slider-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 4px;
  }
  .slider-value { color: #ffca28; font-weight: bold; }
  .setting-slider {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.12);
    outline: none;
    cursor: pointer;
  }
  .setting-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6f00, #ffca28);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(255,111,0,0.4);
  }
  .setting-slider::-moz-range-thumb {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6f00, #ffca28);
    cursor: pointer;
    border: none;
    box-shadow: 0 2px 8px rgba(255,111,0,0.4);
  }

  /* === 加载提示 === */
  .tts-loading {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 8000;
    background: rgba(10,15,30,0.95);
    color: #00d4ff;
    padding: 10px 24px;
    border-radius: 20px;
    font-size: 13px;
    border: 1px solid rgba(0,212,255,0.3);
    display: none;
    align-items: center;
    gap: 8px;
  }
  .tts-loading.show { display: flex; }
  .tts-loading .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(0,212,255,0.2);
    border-top-color: #00d4ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* === 添加内容表单 === */
  .add-content-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .add-content-form input,
  .add-content-form textarea {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .add-content-form input:focus,
  .add-content-form textarea:focus {
    border-color: rgba(255,111,0,0.5);
  }
  .add-content-form input::placeholder,
  .add-content-form textarea::placeholder {
    color: rgba(255,255,255,0.3);
  }
  .add-content-form textarea {
    min-height: 120px;
    resize: vertical;
    line-height: 1.6;
  }
  .add-content-form .form-row {
    display: flex;
    gap: 8px;
  }
  .add-content-form .form-row input {
    flex: 1;
  }
  .add-btn-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .add-submit-btn {
    flex: 1;
    background: linear-gradient(135deg, #00d4ff, #00a8e8);
    color: #fff;
    border: none;
    padding: 10px 0;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    transition: all 0.25s;
  }
  .add-submit-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,212,255,0.3); }
  .add-clear-btn {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.5);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .add-clear-btn:hover { background: rgba(255,82,82,0.15); color: #ff5252; }
  .user-content-tag {
    display: inline-block;
    font-size: 9px;
    background: rgba(0,212,255,0.2);
    color: #00d4ff;
    padding: 1px 6px;
    border-radius: 6px;
    margin-left: 4px;
  }
  .toc-item .toc-delete {
    display: none;
    background: rgba(255,82,82,0.2);
    color: #ff5252;
    border: none;
    border-radius: 6px;
    font-size: 11px;
    padding: 2px 8px;
    cursor: pointer;
    margin-left: auto;
    flex-shrink: 0;
  }
  .toc-item:hover .toc-delete { display: block; }
  .toc-item .toc-delete:hover { background: rgba(255,82,82,0.4); }
</style>
</head>
<body>

<!-- 侧栏切换按钮 -->
<button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">☰</button>

<!-- 侧栏遮罩 -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- 右侧抽屉侧栏 -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">📚 控制面板</span>
    <button class="sidebar-close" onclick="closeSidebar()">✕</button>
  </div>
  <div class="sidebar-body">
    <!-- 播放控制 -->
    <div class="sb-section">
      <div class="sb-section-title">▶ 播放控制</div>
      <div class="play-controls">
        <button class="pc-btn" id="pcPause" onclick="togglePause()">
          <span class="pc-icon" id="pcPauseIcon">⏸️</span>
          <span class="pc-label" id="pcPauseLabel">暂停</span>
        </button>
        <button class="pc-btn secondary" onclick="stopAll()">
          <span class="pc-icon">⏹️</span>
          <span class="pc-label">停止</span>
        </button>
        <button class="pc-btn secondary" onclick="toggleFullscreen()">
          <span class="pc-icon">🖥️</span>
          <span class="pc-label">全屏</span>
        </button>
      </div>
    </div>

    <!-- 语音设置 -->
    <div class="sb-section">
      <div class="sb-section-title">⚙ 语音设置</div>
      <div id="engineBadge" class="engine-badge web">
        <span class="dot"></span>
        <span id="engineText">检测中...</span>
      </div>
      <div class="setting-row">
        <span class="setting-label">🎙️ 声音</span>
        <select class="setting-select" id="voiceSel"><option value="">加载中...</option></select>
      </div>
      <div class="setting-row">
        <span class="setting-label">语速</span>
        <select class="setting-select" id="speedSel">
          <option value="0.75">很慢 0.75x</option>
          <option value="0.85">慢速 0.85x</option>
          <option value="1.0" selected>正常 1.0x</option>
          <option value="1.15">快速 1.15x</option>
          <option value="1.3">极速 1.3x</option>
        </select>
      </div>
      <div class="slider-row" id="pitchRow">
        <div class="slider-label">
          <span>🎵 音调</span>
          <span class="slider-value" id="pitchVal">0</span>
        </div>
        <input type="range" class="setting-slider" id="pitchSlider" min="-10" max="10" value="0" step="1">
      </div>
      <div class="slider-row">
        <div class="slider-label">
          <span>🔊 音量</span>
          <span class="slider-value" id="volVal">100%</span>
        </div>
        <input type="range" class="setting-slider" id="volSlider" min="0" max="100" value="100" step="5">
      </div>
    </div>

    <!-- 添加内容 -->
    <div class="sb-section">
      <div class="sb-section-title">✏️ 添加自定义内容</div>
      <div class="add-content-form">
        <div class="form-row">
          <input type="text" id="addCategory" placeholder="分类（如：主题/名言/自定义）" value="自定义">
        </div>
        <input type="text" id="addTitle" placeholder="标题（如：我的素材1）">
        <textarea id="addText" placeholder="输入要朗读的内容...&#10;换行用回车键"></textarea>
        <div class="add-btn-row">
          <button class="add-submit-btn" onclick="addUserContent">➕ 添加并保存</button>
          <button class="add-clear-btn" onclick="clearAllUserContent">🗑️</button>
        </div>
      </div>
    </div>

    <!-- 章节目录 -->
    <div class="sb-section">
      <div class="sb-section-title">📖 章节目录（点击跳转）</div>
      <div class="toc-list" id="tocList"></div>
    </div>
  </div>
</div>

<!-- 自动播放提示 -->
<div class="autoplay-hint" id="autoplayHint" onclick="retryPlay()">👆 浏览器拦截了自动播放，点此开始</div>
<div class="tts-loading" id="ttsLoading"><div class="spinner"></div><span>语音生成中...</span></div>

<!-- 主内容区 -->
<div class="main-stage" id="mainStage">
  <div class="bg-glow g1"></div>
  <div class="bg-glow g2"></div>
  <div class="bg-glow g3"></div>

  <div class="text-display">
    <div class="display-title" id="dispTitle">🌳 立德树人</div>
    <div class="display-subtitle" id="dispSubtitle">教育之本在于立德 · #1/10</div>
    <div class="reading-body" id="readingBody"></div>
  </div>
</div>

<!-- 底部进度条 -->
<div class="mini-bar"><div class="mini-bar-fill" id="progFill"></div></div>
<div class="status-pill" id="statusPill">准备就绪</div>

<script>
  // ================================================================
  //  数据
  //  ★★★ 后期添加新内容，插在数组最前面（unshift），不是放最后！
  //  ★★★ 因为最新添加的最不熟悉，需要最先读到。
  //  ★★★ 用 sections.unshift({ cat:'主题', t:'标题', s:'副标题', txt:'内容' }) 添加
  // ================================================================
  const sections = [
{ cat:'yicuo', t:'KE2-1', s:'YiCuo100', txt:'[KE2] #1\n\n“治贫先治愚”教育扶贫能够阻断贫困的代际传递，这是因为教育具有（ ）。 A.政治功能 B.经济功能 C.生态功能 D.人口功能\n\n1.【答案】B 【解析】本题考查教育的经济功能。教育的经济功能具体体现在：教育是劳动力再产生的基本途径、 是科学知识再生产的最有效形式、是创造和发展新的科学技术的重要基地。题干中的“教育扶贫能够阻断 贫困的代际传递”是通过提升教育水平来改变贫困地区的现状，促进贫困地区的经济发展，属于教育的经 济功能。故本题选B。' },
{ cat:'yicuo', t:'KE2-2', s:'YiCuo100', txt:'[KE2] #2\n\n三（3）班的一些学生只要作业稍微难一点就望而却步，还有一些学生在班级活动中经常叫苦叫累。 对此，班主任需要在班级加强学生（ ）。 A.情绪情感的教育 B.意志品质的培养 C.人际交往的教育 D.思维品质的培养\n\n2.【答案】B 【解析】本题考查意志。意志是指有意识地支配、调节行为，通过克服困难，以实现预定目的的心理 过程。题干中学生遇到稍微难一点的作业就望而却步，体现了意志力的薄弱，因此老师应注重对学生意志 品质的培养。故本题选B。' },
{ cat:'yicuo', t:'KE2-3', s:'YiCuo100', txt:'[KE2] #3\n\n小军因为喜欢班主任王老师，所以喜欢她的课和她组织的各种活动。这种心理现象属于（ ）。 A.泛化 B.强化 C.分化 D.消退\n\n3.【答案】A 【解析】本题考查经典条件反射的基本规律。经典条件反射的基本规律包括获得与消退、泛化与分化、 恢复。其中泛化是对相似的刺激以同样的方式做出反应。题干中的小军因为喜欢王老师，也喜欢她上的课 和她组织的活动，是对相似的刺激产生了相同的反应，属于刺激的泛化。故本题选A。' },
{ cat:'yicuo', t:'KE2-4', s:'YiCuo100', txt:'[KE2] #4\n\n可以促进铁吸收的维生素是（ ）。 A.维生素A B.维生素B C.维生素C D.维生素D\n\n4.【答案】C 【解析】本题考查营养基础知识。维生素C 可使难以吸收利用的三价铁还原，以增加肠道对铁的消化 吸收。维生素C 提高缺铁性贫血的疗效。患有缺铁性贫血的儿童往往伴有维生素C 的缺乏，故单纯以铁剂 治疗缺铁性贫血，其效果不如添加维生素C 联合治疗好。故本题选C。' },
{ cat:'yicuo', t:'KE2-5', s:'YiCuo100', txt:'[KE2] #5\n\n中华人民共和国成立初期，我国师范院校教育学课程普遍采用的教材是（ ）。 A.夸美纽斯的《大教学论》 B.赫尔巴特的《普通教育学》 C.凯洛夫的《教育学》 D.马卡连柯的《论共产主义教育》\n\n5.【答案】C 【解析】本题考查教育人物及作品。1939 年凯洛夫主编的《教育学》，被公认为是世界上第一部马克 思主义的教育学著作，并对我国新中国成立后乃至现在的教育都产生了很大的影响。因此中华人民共和国 成立初期，我国师范院校教育学课程普遍采用的就是他的这本教材。故本题选C。' },
{ cat:'yicuo', t:'KE2-6', s:'YiCuo100', txt:'[KE2] #6\n\n（ ）是课程安排的整体规划，是学校组织教育教学的基本依据。 A.课程计划 B.课程评价 C.课程标准 D.课时计划\n\n6.【答案】A 【解析】本题考查课程计划。课程计划是根据一定的教育目的和培养目标，由教育行政部门制定的有 关学校教育和教学工作的指导性文件。课程计划是指导和规定课程与教学活动的依据，是学校课程与教学 活动的依据。A 选项符合题意。易混选项C，课程标准是教材编写、教学、考试评价以及课程实施管理的直 易错100 题中小学科二 让每一个孩子都能遇到好老师 2 接依据。故本题选A。' },
{ cat:'yicuo', t:'KE2-7', s:'YiCuo100', txt:'[KE2] #7\n\n教师在课堂上通过展示各种实物、直观教具或进行示范性实验，让学生通过观察获得感性认识的教 学方法属于（ ）。 A.实验法 B.演示法 C.讨论法 D.练习法\n\n7.【答案】B 【解析】本题考查演示法。演示法是指教师通过展示实物、教具和示范性的实验来说明、印证某一事 物和现象，使学生掌握新知识的一种教学方法。故本题选B。' },
{ cat:'yicuo', t:'KE2-8', s:'YiCuo100', txt:'[KE2] #8\n\n王老师在讲授“磷及其化合物的性质”时，以磷化氢的“自燃”现象，说明民间俗称“鬼火”现象 产生的原因，对学生进行了“无神论”教育。王老师在教学中主要贯彻的是（ ）。 A.循序渐进原则 B.直观性原则 易错100 题中小学科二 让每一个孩子都能遇到好老师 2 C.科学性和思想性相结合原则 D.启发性原则\n\n8.【答案】C 【解析】本题考查教学原则。科学性和思想性相结合原则是指教学中要以马克思主义为指导，引导学 生掌握正确的知识，同时结合知识对学生进行社会主义品德和正确人生观、科学世界观教育。它是教学的 教育性规律的反映。题干中，老师既教了关于磷的知识，同时对学生进行了“无神论”的思想品德教育， 符合科学性和思想性相结合原则的含义。故本题选C。' },
{ cat:'yicuo', t:'KE2-9', s:'YiCuo100', txt:'[KE2] #9\n\n美国课程论专家古德莱德，把课程划分为五个层次，按照由具体到抽象的排序依次为（ ）。 A.经验的课程—运作的课程—理解的课程—正式的课程—理想的课程 B.理想的课程—正式的课程—理解的课程—运作的课程—经验的课程 C.运作的课程—正式的课程—经验的课程—理想的课程—理解的课程 D.经验的课程—理想的课程—运作的课程—正式的课程—理解的课程\n\n9.【答案】A 【解析】本题考查古德莱德的课程分类。古德莱德把课程分为：（1）理想的课程，即由一些教育研究 机构、学术团体和课程专家提出的应该开设的课程。（2）正式的课程，即由教育行政部门规定的课程计划、 课程标准和教材，我们平时在课程表中看到的课程即属此类。（3）领悟或理解的课程，即任课教师所领悟 的课程，这种领悟的课程可能与正式课程之间会产生一定的距离，正所谓“一千个读者就有一千个哈姆雷 特”。（4）运作的课程，即在课堂上实际实施的课程，在实施中，教师常常会根据学生的反应随时进行调 整。（5）经验的课程，是学生在课堂学习中实实在在体验到的东西，即课程经验。题干问的是从具体到抽 象，故只有A 选项符合。B 选项是从抽象到具体。故本题选A。' },
{ cat:'yicuo', t:'KE2-10', s:'YiCuo100', txt:'[KE2] #10\n\n“庶”与“富”是“教”的先决条件。首次提出这一教育观点的教育家是（ ） A.孔子 B.孟子 C.荀子 D.墨子\n\n10.【答案】A 【解析】本题考查孔子的教育思想。孔子认为教育对社会的发展有作用，提出了“庶、富、教”的观 点，认为人口、财富和教育是立国的三个要素；提出了“性相近，习相远”的哲学命题，强调后天环境对 人发展的影响。故本题选A。' },
{ cat:'yicuo', t:'KE2-11', s:'YiCuo100', txt:'[KE2] #11\n\n光明路小学为了提升学校文化建设，一方面发动教师献计献策，另一方面求助于大学文化设计的专 家到校实地考察，经过一段时间的不断研磨和完善，光明路小学的学校文化建设上了一个层次，这种教育 研究属于（ ）。 A.个案研究 B.调查研究 C.行动研究 D.实验研究\n\n11.【答案】C 【解析】本题考查行动研究法。个案研究是主要通过案例方式考察教育现象，基本目的在于描述与解 释，在描述过程中进行解释。调查研究主要是研究者采用问卷、访谈、观察、测量等方式对现状进行了解， 对事实进行考察，对材料进行收集，从而探讨教育问题、教育现象之间联系的研究方法。实验研究是运用 一定的人为手段，主动干预或控制研究对象的发生、发展过程，通过观察、测量、比较等方式探索、验证 所研究现象因果关系的研究方法。行动研究是教师和研究人员针对实践中的问题，综合运用各种有效方法， 以改进教育工作为目的的教育研究活动。它将教育理论和教育实践融为一体，将教育者和教育现实问题紧 密结合，强调在“行动”中研究，在“情境”中研究，在“做”中研究。题干中描述符合行动研究的教育 易错100 题中小学科二 让每一个孩子都能遇到好老师 3 研究方法。故本题选C。' },
{ cat:'yicuo', t:'KE2-12', s:'YiCuo100', txt:'[KE2] #12\n\n“笨鸟先飞”“勤能补拙”说明（ ）。 A.需要对能力有影响 B.动机对能力有影响 C.性格对能力有影响 D.气质对能力有影响\n\n12.【答案】C 【解析】本题考查性格与能力的关系。性格结构中的态度特征指个体对自己、他人、集体、社会以及 对工作、劳动、学习的态度特征。如谦虚或自负、利他或利己、粗心或细心、创造或墨守成规等。理智特 征指个体在感知、记忆、想象、思维等认识过程中表现出来的认知特点和风格。如主动感知或被动感知， 习惯于看到细节还是看到轮廓等。题干中的“笨鸟先飞”“勤能补拙”说明的是性格特征对能力的积极影 响。故本题选C。' },
{ cat:'yicuo', t:'KE2-13', s:'YiCuo100', txt:'[KE2] #13\n\n李伟同学在上课前会对本节课的内容进行判断，如果认为自己能听懂老师讲述的知识，他就会认真 听课。根据班杜拉的理论，这种现象是（ ）。 A.结果期待 B.过程期待 C.社会期待 D.效能期待\n\n13.【答案】D 【解析】本题考查班杜拉的自我效能感理论。自我效能感理论由班杜拉首次提出，他认为人的行为受 行为的先行因素与结果因素的影响。其中，行为的先行因素是人在认识到行为与强化之间的依随关系之后 产生的对下一步强化的期待。该期待包括结果期待和效能期待。结果期待是人对自己的某一行为会导致某 一结果的客观推测。效能期待是人对自己能够进行某一行为的实施能力的主观推测或判断（即自我效能感）， 它意味着人是否确信自己能够成功地进行某一行为。当个体确信自己有能力进行某一活动，他就会产生高 度的自我效能感，并努力实施该活动。题干中李伟认为自己能听懂老师讲授的知识，才会做出认真听课的 行为，是对自己能力的主观判断，符合效能期待的含义。故本题选D。' },
{ cat:'yicuo', t:'KE2-14', s:'YiCuo100', txt:'[KE2] #14\n\n在古代，中国、埃及和希腊的学校主要采用的教学组织形式是（ ）。 A.个别教学 B.复式数学 C.分组数学 D.班级教学\n\n14.【答案】A 【解析】本题考查个别教学制。个别教学制的产生是与古代社会生产力发展水平比较低的状况相适应 的。在古代的东西方，学校教学组织形式一般都是个别教学形式。教师向学生传授知识，布置检查和批改 作业都是个别进行的，即教师对学生一个个轮流地教，教师在教某个学生时，其余学生均按教师要求进行 复习或作业。在古代中国、埃及和希腊的学校主要采用的教学组织形式就是个别教学制。故本题选A。' },
{ cat:'yicuo', t:'KE2-15', s:'YiCuo100', txt:'[KE2] #15\n\n张老师在课堂教学中按教学要求向学生提问，通过问答、对话的形式来引导学生思考并获取和巩固 知识。张老师所用的这种教学方法是（ ）。 A.讲解法 B.练习法 C.谈话法 D.探究法 易错100 题中小学科二 让每一个孩子都能遇到好老师 3\n\n15.【答案】C 【解析】本题考查教学方法。谈话法，也叫问答法，是教师和学生相互交谈，以引导学生根据自己已 有的知识、经验，通过独立思考去获得新知识的教学方法。从题干中的“问答、对话的形式”等关键词可 以看出张老师使用了谈话法。故本题选C。' },
{ cat:'yicuo', t:'KE2-16', s:'YiCuo100', txt:'[KE2] #16\n\n中国少年先锋队是一个少年儿童的群众组织，其队旗上的图案是（ ）。 A.火炬加镰刀 B.镰刀加斧头 C.五角星加镰刀 D.火炬加五角星\n\n16.【答案】D 【解析】本题考查中国少年先锋队的队旗。少先队的队旗是少先队组织的标志。中国少年先锋队队旗 是五角星加火炬的红旗。队旗为红色，象征革命胜利，队旗中央的五角星，代表中国共产党的领导，火炬 象征光明。故本题选D。 易错100 题中小学科二 让每一个孩子都能遇到好老师 4' },
{ cat:'yicuo', t:'KE2-17', s:'YiCuo100', txt:'[KE2] #17\n\n班主任的工作重点和最为经常的工作是（ ）。 A.整合各方面影响，使其形成正向的合力 B.教育学生努力学习 C.全面了解和研究学生 D.对学生进行品德教育\n\n17.【答案】D 【解析】本题考查班主任工作。整合各方面影响是德育的一致性和连贯性原则的体现，所以A 不符合 题干。根据《班主任工作的暂行规定》班主任应该“教育学生努力完成学习任务”，工作、任务不仅限于 学习。所以B 不符合题干；班主任工作的基础和前提是全面了解和研究学生。所以C 不符合题干；对学生 进行思想品德教育是班主任工作的重点，所以D 符合题干。故本题选D。' },
{ cat:'yicuo', t:'KE2-18', s:'YiCuo100', txt:'[KE2] #18\n\n“为天地立心，为生民立命，为往圣继绝学，为万世开太平。”宋代大儒张载的“横渠四句”成为 了后代许多读书人的座右铭。这四句中的“为往圣继绝学”体现了教育的（ ）。 A.文化传递功能 B.人口控制功能 C.社会改造功能 D.社会流动性功能\n\n18.【答案】A 【解析】本题考查文化的传递功能。文化的传递功能是指教育作为培养人的活动，它以文化为中介， 客观上起着文化的传承和普及作用。题干中“为往圣继绝学”的意思是：能够将儒家的智慧义理发扬光大， 教化万民，才是读书人的立足之本，我们是为了继承先贤的智慧，创当代太平盛世。体现了教育对文化的 传递功能。故本题选A。' },
{ cat:'yicuo', t:'KE2-19', s:'YiCuo100', txt:'[KE2] #19\n\n识字教学中，教师将“辩”“辨”“辫”“瓣”的不同部件标成红色，以帮助小学生更好区别。这 一做法符合（ ）。 A.知觉的选择性 B.知觉的理解性 C.知觉的恒常性 D.知觉的整体性\n\n19.【答案】A 【解析】本题考查知觉的选择性。知觉的选择性指作用于人的客观事物是纷繁多样的，人不可能在瞬 间全部清楚地感知到；但可以按照某种需要和目的，主动而有意地选择少数事物（或事物的某一部分）作 为知觉的对象，或无意识地被某种事物所吸引，以它作为知觉对象，对它产生鲜明、清晰的知觉映象，而 把周围其余的事物当成知觉的背景，只产生比较模糊的知觉映象。题干中老师将音同形近字的不同部分标 上红色，易于学生注意到它们的不同之处，这是利用了知觉的选择性。故本题选A。' },
{ cat:'yicuo', t:'KE2-20', s:'YiCuo100', txt:'[KE2] #20\n\n教师的知识结构中，小学英语教师所拥有的英语学科知识属于（ ）。 A.一般性知识 B.条件性知识 C.本体性知识 D.实践性知识\n\n20.【答案】C 【解析】本题考查本体性知识。本体性知识，指教师所具有的特定的学科知识。题干中小学英语教师 所拥有的英语学科知识属于本体性知识。故本题选C。' },
{ cat:'yicuo', t:'KE2-21', s:'YiCuo100', txt:'[KE2] #21\n\n某班级这学期更换了班主任后，学生的行为习惯、课堂氛围及学生成绩有了明显的变化，这体现了 （ ）的重要性。 A.学科课程 B.隐性课程 C.显性课程 D.活动课程\n\n21.【答案】B 【解析】本题考查隐性课程。隐性课程亦称潜在课程、隐蔽课程，则是以内隐的、间接的方式呈现的 课程，是学生在显性课程以外所获得的所有学校教育的经验。学生在学习过程中，从具体学习环境中所获 得的“计划外”的知识、观念、情感等，不是课程计划中所预期的东西。隐性课程的表现形式中包含：观 念性隐性课程，包括隐藏于显性课程之中的意识形态，学校的学风、校风，有关领导和教师的教育理念、 价值观、知识观、教学风格、教学指导思想等。题目中更换了班主任后，学生的行为习惯、课堂氛围及学 生成绩有了明显的变化，体现了隐性课程的重要性。故本题选B。' },
{ cat:'yicuo', t:'KE2-22', s:'YiCuo100', txt:'[KE2] #22\n\n美国教育心理学家（ ）主张：“不论我们选教什么学科，务必使学生理解该学科的基本结构。” A.梅伊曼 B.赫尔巴特 C.赞科夫 D.布鲁纳\n\n22.【答案】D 【解析】本题考查布鲁纳的教育思想。结构主义课程理论是当代西方出现的一个重要的课程理论，其 代表人物是该课程理论的创始人布鲁纳。结构主义课程理论以学科结构为课程中心，认为人的学习是认知 易错100 题中小学科二 让每一个孩子都能遇到好老师 5 结构不断改进与完善的过程，因此，学科基本结构的学习对学习者的认知结构发展最有价值。题干中“不 论我们选教什么学科，务必使学生理解该学科的基本结构。”符合布鲁纳的结构主义课程理论。故本题选 D。' },
{ cat:'yicuo', t:'KE2-23', s:'YiCuo100', txt:'[KE2] #23\n\n小红语文测验得了90 分，但与全班平均成绩相比属于“中下”，老师鼓励她继续努力，争取取得 更好的成绩。这种评价方式属于（ ）。 A.标准参照评价 B.常模参照评价 易错100 题中小学科二 让每一个孩子都能遇到好老师 4 C.个体内差异评价 D.形成性评价\n\n23.【答案】B 【解析】本题考查常模参照评价。相对评价又称为常模参照评价，依据学生个人的成绩在该班学生成 绩序列中或常模中所处的位置来评价和决定他的成绩优劣，而不考虑他是否达到了教学目标的要求。题干 中教师将小红的语文测验成绩与全班平均成绩比较而判为“中下”，符合常模参照评价的含义。故本题选 B。' },
{ cat:'yicuo', t:'KE2-24', s:'YiCuo100', txt:'[KE2] #24\n\n在教育研究文献中，各类文物、教育史专著、名师教育实录等属于（ ）。 A.事实性文献 B.工具性文献 C.理论性文献 D.经验性文献\n\n24.【答案】A 【解析】本题考查文献的分类。按文献的功能可分为事实性文献、工具性文献、理论性文献、政策性 文献和经验性文献。事实性文献指专门为教育科学研究提供事实证据的文献，包括古今中外已被发现和证 实的各种形式、各种内容的事实资料，如文物、教育史专著、各种测验量表、各类教育实验报告、教育名 家教育实录等。工具性文献指专门为教育科学研究提供检索咨询的文献，包括工具书、网上检索查询、学 术动态综述等。理论性文献指专门为教育科学研究提供理论认识的文献，包括教育专著、论文、文集、教 育家评传、方法论著作等。政策性文献指专门为教育科学研究提供政策依据的文献，包括规章制度、政府 文件与统计资料等。经验性文献指专门为教育科学研究提供感性认识的文献，包括调查报告、工作总结、 经验、教育参考书、各级各类学校教科书、课程标准等。故本题选A。' },
{ cat:'yicuo', t:'KE2-25', s:'YiCuo100', txt:'[KE2] #25\n\n小学《品德与生活》的教学目标，应随着儿童生活及活动过程的变化和需要不断调整。教学内容应 从教科书扩展到儿童生活的各个方面，课堂从教室扩展到家庭、社会，以及儿童的其他生活空间。这段话 说明该课程具有（ ）。 A.生活性 B.综合性 C.开放性 D.活动性\n\n25.【答案】C 【解析】本题考查《品德与生活》课程的特点。《品德与生活》课程具有如下基础特征：生活性、综合 性、开放性、活动性。A 选项生活性，是指课程视儿童的生活为宝贵的课程资源。课程学习本身是儿童生 活的组成部分；是儿童在教师指导下真实体验生活、主动参与生活、创造生活的过程。课程遵循儿童生活 的逻辑；以儿童生活中的需要和问题为出发点；以儿童的现实生活为课程内容的主要源泉；以用正确的价 值观引导儿童在生活中发展、在发展中生活为课程的基本追求。B 选项综合性，是指课程设计体现儿童与 自然、儿童与社会、儿童与自我的内在整合；课程内容体现品德教育和生活教育有机融合；教学活动体现 儿童的生活体验与道德体验；知识学习与社会参与、问题探究等彼此渗透、相互促进；实现生活、教学、 发展的三位一体。D 选项活动性，是指课程超越单一的书本知识的传递和接受；以活动为教和学的基本形 式。课程的呈现形态主要是儿童直接参与的各种主题活动、游戏或其他实践活动；课程目标主要通过儿童 在教师指导下的活动过程中的体验、感悟和主动建构来实现。C 选项开放性，是指课程面向儿童的整个生 活世界，教学目标随着儿童生活及活动过程的变化和需要不断调整；教学内容从教科书扩展到儿童生活的 易错100 题中小学科二 让每一个孩子都能遇到好老师 6 各个方面；课堂从教室扩展到家庭、社区以及儿童的其他生活空间。题干中体现的课程面向儿童生活的各 个方面，正是开放性的表现。故本题选C。' },
{ cat:'yicuo', t:'KE2-26', s:'YiCuo100', txt:'[KE2] #26\n\n学完“压强”概念，学生理解了“在同等压力下，受力面积越大，压强越小”的道理。田老师要求 学生举例说明这个原理在生活中的运用。田老师贯彻的主要教学原则是（ ）。 A.理论联系实际 B.循序渐进 C.直观性 D.启发性\n\n26.【答案】A 【解析】本题考查理论联系实际原则。理论联系实际原则是指教学要以学习基础知识为主导，从理论 与实际的联系上去理解知识，注意运用知识去分析问题和解决问题，达到学懂会用、学以致用。理论联系 实际教学原则是间接经验和直接经验相统一的规律在教学中的反映。题干中学生学完知识后，老师要求学 生举例说明该知识在生活中的运用就是此原则的体现。故本题选A。' },
{ cat:'yicuo', t:'KE2-27', s:'YiCuo100', txt:'[KE2] #27\n\n晓杰在阅读课文时，常常自我提问：“我对课文表达的内容清楚了吗？我抓住了课文的重点了吗？” 这种学习策略属于（ ）。 A.复述策略 B.组织策略 C.计划策略 D.监控策略\n\n27.【答案】D 【解析】本题考查学习策略的类型。监控策略是指在认知过程中，根据认知目标及时评价、反馈自己 认知活动的结果与不足，正确估计自己达到认知目标的程度、水平；根据有效性标准评价各种认知行动、 策略的效果。包括阅读时对注意加以跟踪、对材料进行自我提问、考试时监控自己的速度和时间。题干中 晓杰在阅读中的自我提问符合监控策略的含义和范畴。故本题选D。' },
{ cat:'yicuo', t:'KE2-28', s:'YiCuo100', txt:'[KE2] #28\n\n“课程不应指向活动，而应直接关注制定一套有结构、有序列的学习目标，所有教学活动都是为了 达到这些目标而服务的。”这种观点意味着课程即（ ）。 A.教学科目 B.经验获得 C.社会改造 D.预期的学习结果\n\n28.【答案】D 【解析】本题考查课程的定义。关于课程的定义，主要有以下几种观点：（1）课程即教学科目，强调 学校向学生传授学科的知识体系，是一种典型的“教程”；（2）课程即预期的学习效果，认为课程应该直 接关注预期的学习结果或目标，即要把重点从手段转向目的；（3）课程即有计划的教学活动；（4）课程即 学习经验，指学生体验到的意义，而不是要学生再现的事实或要学生演示的行为；（5）课程即社会文化的 再生产，学校教育的职责是再生产对下一代有用的知识、技能；（6）课程即社会改造。题干表述属于课程 即预期学习效果的观点。故本题选D。' },
{ cat:'yicuo', t:'KE2-29', s:'YiCuo100', txt:'[KE2] #29\n\n国强认为欺负弱小是不可取的、不道德的，因此，他在生活中总是能自觉杜绝这样的行为。这说明 其品德发展处于（ ）。 A.依从阶段 B.内化阶段 C.自主阶段 D.外化阶段\n\n29.【答案】B 【解析】本题考查态度与品德学习的一般过程。态度与品德学习的一般过程包括：依从、认同、内化。 其中，内化指在思想观点上与他人的思想观点一致，将自己所认同的思想和自己原有的观点、信念融为一 体，构成一个完整的价值体系。在内化阶段，个体的行为具有高度的自觉性和主动性，并具有坚定性，表 现为“富贵不能淫，贫贱不能移，威武不能屈”。此时，稳定的态度和品德即形成了。题干中，国强能够 坚持自己的观念并总能自觉落实到行动中，处于品德发展的内化阶段。故本题选B。' },
{ cat:'yicuo', t:'KE2-30', s:'YiCuo100', txt:'[KE2] #30\n\n课外是课内的延伸和拓展，课内是课外的深化和提升，课内与课外相结合才能真正促进孩子的发展， 下列选项中表达了这一思想的是（ ）。 A.安其学而亲其师，乐其友而信其道 B.时教必有正业，退息必有居学 C.发然后禁，则扞格而不胜 D.独学而无友，则孤陋而寡闻 易错100 题中小学科二 让每一个孩子都能遇到好老师 5\n\n30.【答案】B 【解析】本题考查课内与课外相结合思想。选项A 是指这潜心学习并亲近师长，乐于同朋友交往并坚 持正道，这样即使离开了师长和朋友，也不会违背他们的教育。选项C 是指如果在不良行为发生以后才去 禁止，就会遭到情绪上的抵触而不易纠正。强调的是不良行为的预防。选项D 是指如果学习中缺乏学友之 易错100 题中小学科二 让每一个孩子都能遇到好老师 7 间的交流切磋，就必然会导致知识狭隘，见识短浅，强调的是合作学习的重要性。选项B 是指按照时序进 行，必须有正式的课业，课后休息时也得有课外练习。所以B 符合课内和课外相结合思想。故本题选B。' },
{ cat:'yicuo', t:'KE2-31', s:'YiCuo100', txt:'[KE2] #31\n\n有的人在逆境中奋起，有的人在逆境中消沉；有的人在顺境中如鱼得水，有的人在顺境中却虚度光 阴。这种现象说明（ ）。 A.顺境有利于人的发展 B.环境好坏决定人的发展 C.逆境有利于人的发展 D.人对环境影响有能动性\n\n31.【答案】D 【解析】本题考查环境对人的作用。环境对人的作用包括：（1）为个体的发展提供了多种可能，包括 机遇、条件和对象；（2）环境对个体发展的影响有积极和消极之分；（3）人在接受环境影响和作用时的主 观能动性；（4）环境不能决定人的发展。题干所述无论逆境还是顺境，人都有可能获得有利发展或不利发 展，这说明人在接受环境影响和作用时具有主观能动性。故本题选D。' },
{ cat:'yicuo', t:'KE2-32', s:'YiCuo100', txt:'[KE2] #32\n\n进入初中后，赵东难以控制自己的情绪，时常无故地兴奋不已，转而又哀伤忧愁。这反映了青少年 情绪发展具有（ ）。 A.弥散性 B.闭锁性 C.波动性 D.感染性\n\n32.【答案】C 【解析】本题考查青少年情绪发展的波动性。青少年情绪发展的波动性主要表现在：青少年会因一时 成功，欣喜若狂、激动不已，又会因一点挫折，垂头丧气、懊恼不已。表现为情绪在两极性的明显起伏。 题干中赵东时常无故兴奋，转而又哀伤忧愁，是波动性的表现。故本题选C。' },
{ cat:'yicuo', t:'KE2-33', s:'YiCuo100', txt:'[KE2] #33\n\n在17 世纪至19 世纪，主张让儿童接受顺其自然教育的教育家是（ ）。 A.洛克 B.卢梭 C.康德 D.杜威\n\n33.【答案】B 【解析】本题考查卢梭的教育思想。卢梭主张教育目的在于培养自然人；反对封建教育轻视儿童，要 求提高儿童在教育中的地位；主张改革教育内容和方法，顺应儿童的本性，让他们的身心自由发展。故本 题选B。' },
{ cat:'yicuo', t:'KE2-34', s:'YiCuo100', txt:'[KE2] #34\n\n毛泽东在《体育之研究》一文中指出：“欲图体育之有效，非动其主观，促其对于体育之自觉不可。” 这句话强调学校体育应注重（ ）。 A.帮助学生形成正确的体育观念 B.增强学生的体质 C.培养学生自我锻炼的能力与习惯 D.发展学生的体育特长\n\n34.【答案】C 【解析】本题考查学校体育。毛泽东的这句话的意思为：想要得到体育的效果，不是动用主观力量， 非要促进他们对体育的自觉性不可。强调学生要积极主动去锻炼。学校要培养学生自我锻炼的能力和习惯。 故本题选C。' },
{ cat:'yicuo', t:'KE2-35', s:'YiCuo100', txt:'[KE2] #35\n\n救护者对儿童进行急救处理时，做法正确的是（ ）。 A.某生突发惊厥，救护者紧紧搂住该生 B.某生鼻出血，救护者让该生高仰头，捏住鼻翼 C.某生摔伤，救护者怀疑伤及腰椎，抱起该生急送医院 D.溺水者被救上岸，救护者首先迅速帮助其清理呼吸道，控水\n\n35.【答案】D 【解析】本题考查急救技术。溺水者被救上岸，救护者首先迅速帮助其清理呼吸道，控水，保证其呼 吸道的畅通。A 选项突发惊厥，教师应首先拿毛巾塞进儿童的嘴里，防止其自我伤害。B 选项，鼻出血时应 安慰儿童不要紧张，安静坐下，头略向前低。C 选项儿童摔伤，救护者怀疑伤及腰椎，应找专业医生用担 架送儿童去医院。故本题选D。' },
{ cat:'yicuo', t:'KE2-36', s:'YiCuo100', txt:'[KE2] #36\n\n晶晶告诉妈妈，她知道1+3=4，但是不明白为什么老师会说4=1+3。晶晶的认知发展阶段还处在（ ）。 A.感知运动阶段 B.前运算阶段 C.具体运算阶段 D.形式运算阶段\n\n36.【答案】B 【解析】本题考查前运算阶段。皮亚杰提出认知发展的阶段理论，将个体的认知发展分为四个阶段： （1）感知运动阶段；（2）前运算阶段；（3）具体运算阶段；（4）形式运算阶段。前运算阶段的特征是：① 出现了语词或其他符号，开始出现表象和形象图式；②儿童的概念是具体的、动作的，而非抽象的，思维 具有不可逆性；③认为外界一切事物都是有生命的——泛灵论；④自我为中心。题干体现的是思维不可逆， 易错100 题中小学科二 让每一个孩子都能遇到好老师 8 属于前运算阶段。故本题选B。' },
{ cat:'yicuo', t:'KE2-37', s:'YiCuo100', txt:'[KE2] #37\n\n讲完“体积的大小”后，张老师要求学生回家量一量日常用品的体积，这种教学方法是（ ）。 A.实习作业法 B.实践探究法 C.实物演示法 D.实验教学法\n\n37.【答案】A 【解析】本题考查实习作业法。实习作业法是指教师根据学科课程标准要求，指导学生运用所学的知 识在课上或者课外从事一定的工作或操作，将书本知识运用于实践的教学方法。这种方法在自然学科的教 学中占有重要的地位，如数学课的测量练习、生物课的植物栽培和动物饲养等。题干中“张老师要求学生 回家量一量日常用品的体积”属于数学课的测量练习。故本题选A。' },
{ cat:'yicuo', t:'KE2-38', s:'YiCuo100', txt:'[KE2] #38\n\n学生们可以从政治的、经济的、地理的和历史的角度探讨英国与欧盟关系的问题，这种课程类型属 于（ ）。 A.学科课程 B.经验课程 易错100 题中小学科二 让每一个孩子都能遇到好老师 6 C.分科课程 D.综合课程\n\n38.【答案】D 【解析】本题考查综合课程。综合课程指打破传统的分科课程的知识领域，组合两门以上学科领域而 构成的一门学科，它采取合并相关学科的办法，减少教学科目，把几门学科的教学内容组织在一门综合学 科之中。学生们探讨问题时能从政治的、经济的、地理的和历史的角度综合考虑，这属于综合课程。故本 题选D。' },
{ cat:'yicuo', t:'KE2-39', s:'YiCuo100', txt:'[KE2] #39\n\n小学生通过学习，掌握了“长方形面积＝长×宽”这一公式。这种学习属于（ ）。 A.信号学习 B.连锁学习 C.概念学习 D.命题学习\n\n39.【答案】D 【解析】本题考查知识学习的分类。命题学习是指获得由几个概念构成的命题的复合意义，实际上是 学习表示若干概念之间关系的判断。题干中的面积计算公式体现了三个概念之间的关系。故本题选D。' },
{ cat:'yicuo', t:'KE2-40', s:'YiCuo100', txt:'[KE2] #40\n\n明朝著名学者王阳明说：“大抵童子之情，乐嬉游而惮拘检，如草木之始萌芽，舒畅之则条达，摧 挠之则衰痿。今教童子，必使其趋向鼓舞，中心喜悦，则其进自不能已。”这句话表明教育要遵循（ ）。 A.知行统一原则 B.因材施教原则 C.尊重学生原则 D.疏导原则\n\n40.【答案】C 【解析】本题考查德育原则。题干中王阳明观点的意思是：应结合孩子的天性进行教育，使他们顺着 自己的兴趣，多加鼓励，他们内心喜悦，自然就能不断进步。学生只有受到尊重和信赖，才能充分发挥自 己的能动性和创造性，所以符合尊重信任学生与严格要求学生相结合的原则。故本题选C。' },
{ cat:'yicuo', t:'KE2-41', s:'YiCuo100', txt:'[KE2] #41\n\n广义的教育制度指国民教育制度，是一个国家为实现其国民教育的目的，从组织系统上建立起来的 一切教育设施和有关规章制度，狭义的教育制度是指（ ）。 A.高等教育制度 B.自学高考制度 C.学校教育制度 D.成人高考制度\n\n41.【答案】C 【解析】本题考查教育制度。教育制度是指一个国家各级各类实施教育的机构体系及其组织运行的规 则。广义的教育制度指国民教育制度。狭义的教育制度指学校教育制度，简称学制。故本题选C。' },
{ cat:'yicuo', t:'KE2-42', s:'YiCuo100', txt:'[KE2] #42\n\n小文学习成绩不好，但爱在同学面前炫耀自己的限量版运动鞋或其他高档物品，看到同学投来羡慕 的眼光，感到十分满足。小文的心理防御方式是（ ）。 A.升华 B.转移 C.补偿 D.退行\n\n42.【答案】C 【解析】本题考查补偿。补偿又称代偿，是指个体利用某种方法来弥补其生理或心理上的缺陷，从而 掩盖自己的自卑感和不安全感。所谓“失之东隅，收之桑榆”就是这种机制。故本题选C。' },
{ cat:'yicuo', t:'KE2-43', s:'YiCuo100', txt:'[KE2] #43\n\n划分机械学习与有意义学习的主要依据是（ ）。 A.学生是否主动学习 B.学习目的是否为解决问题 C.学生是否理解学习材料 D.学习内容是否由学生发现\n\n43.【答案】C 【解析】本题考查学习的分类。奥苏贝尔根据学习的材料和学习者原有知识的关系，将学习分为有意 义学习和机械学习；根据学习进行的方式，他将学习划分为发现学习和接受学习。学习材料与原有知识的 关系是指学生能否根据已有知识经验理解新材料也就是学生是否理解学习材料。A 选项，学生是否主动学 习主要体现的是发现学习和接受学习的分类。B 和D 选项强调的是学习目的和学习内容，与题意不符。故 易错100 题中小学科二 让每一个孩子都能遇到好老师 9 本题选C。' },
{ cat:'yicuo', t:'KE2-44', s:'YiCuo100', txt:'[KE2] #44\n\n中学生晓阳总认为他是一个完美的人，任何事情都会按自己的意愿发展，但是现实往往事与愿违， 这让他非常苦恼，希望得到心理辅导老师的帮助。如果对晓阳进行心理辅导，最可行的办法是（ ）。 A.放松训练法 B.系统脱敏法 C.理性情绪法 D.代币强化法\n\n44.【答案】C 【解析】本题考查理性情绪疗法。理性情绪疗法认为人的情绪受他们对事件的知觉的影响，这种影响 不是取决于事件的本身，而是取决于个体对事件的看法，合理的观念导致健康的情绪，不合理的观念导致 负向的、不稳定的情绪。题干中晓阳总认为自己是一个完美的人，任何事情都会按自己的意愿发展，这就 是一种不合理的观念，若要帮助晓阳改善情绪状态，必须驳斥他的这一不合理观念，使之建立新观念并获 得正向的情绪效果。故本题选C。' },
{ cat:'yicuo', t:'KE2-45', s:'YiCuo100', txt:'[KE2] #45\n\n在教育理论指导下，通过运用观察、列表、问卷、访谈、个案研究以及测验等方式，搜集教育问题 的资料，从而对教育的现状做出科学分析，并提出具体工作建议的一整套实践活动的研究方法是（ ）。 A.教育行动研究法 B.调查研究法 C.教育叙事研究法 D.比较研究法 易错100 题中小学科二 让每一个孩子都能遇到好老师 7\n\n45.【答案】B 【解析】本题考查调查研究法。调查研究法是在教育理论指导下，通过运用观察、列表、问卷、访谈、 个案研究以及测验等方式，以教育理论为指导，搜集教育问题的资料，从而对教育的现状作出科学分析， 并提出具体工作建议的研究方法。故本题选B。' },
{ cat:'yicuo', t:'KE2-46', s:'YiCuo100', txt:'[KE2] #46\n\n1903 年，清政府颁发《奏定学堂章程》，该学制体现了张之洞“中学为体，西学为用”的思想，主 要借鉴了日本的学制，其最大的特点就是修业年限长。该学制标志着我国国民教育制度的开始，又称为（ ）。 A.六三三制 B.壬子癸丑学制 C.壬寅学制 D.癸卯学制\n\n46.【答案】D 【解析】本题考查癸卯学制。1903 年（光绪二十九年），清政府拟定了《奏定学堂章程》，1904 年1 月 颁布执行，又称“癸卯学制”。“癸卯学制”主要承袭了日本的学制，是中国第一个实行的现代学制。故 本题选D。' },
{ cat:'yicuo', t:'KE2-47', s:'YiCuo100', txt:'[KE2] #47\n\n张老师在工作中，注重以自己的高尚品德、人格魅力以及对学生的深切期望和真诚的爱来触动、感 化学生，促使学生思想转变。这种德育方法是（ ）。 A.实际锻炼法 B.品德评价法 C.个人修养法 D.情感陶冶法\n\n47.【答案】D 【解析】本题考查情感陶冶法。情感陶冶法是教育者自觉创设良好的教育情境，使受教育者在道德和 思想情操方面受到潜移默化的感染、熏陶的方法。情感陶冶法包括人格感化、环境陶冶、艺术陶冶等。题 干所述属于人格感化。故本题选D。' },
{ cat:'yicuo', t:'KE2-48', s:'YiCuo100', txt:'[KE2] #48\n\n教学《圆的认识》一课时，教师展示圆形纸片、硬币，让学生看一看，摸一摸，然后总结圆的特点。 这一教学过程主要遵循的是（ ）。 A.直观性原则 B.启发性原则 C.循序渐进原则 D.因材施教原则\n\n48.【答案】A 【解析】本题考查直观性教学原则。直观性原则是指在教学中引导学生直接感知事物、模型或通过教 师用形象语言描绘教学对象，使学生获得丰富的感性认识。直观教具包括实物直观、模象直观和言语直观。 展示圆形纸片、硬币采用了实物直观，体现了直观性原则。故本题选A。' },
{ cat:'yicuo', t:'KE2-49', s:'YiCuo100', txt:'[KE2] #49\n\n“不忘初心，牢记使命”，对于学生而言，就是让自己意识到自己是社会主义的建设者和接班人， 要为这一历史使命而勤奋学习，不辜负祖国的期望。这属于（ ）。 A.近景的直接性动机 B.近景的间接性动机 C.远景的直接性动机 D.远景的间接性动机\n\n49.【答案】D 【解析】本题考查学习动机的分类。根据学习动机起作用时间的长短，可以把学习动机分为近景的直 接性学习动机和远景的间接性学习动机：近景的直接性学习动机是指由活动的直接结果所引起的对某种活 动的动机，这种动机很具体，但不够稳定，易随环境的变化而变化。远景的间接性学习动机是指由于了解 活动的社会意义、活动结果的社会价值而引起的对某种活动的动机，这种学习动机既具有一定的社会性和 理想色彩，又与个人的志向、世界观相联系，具有较强的稳定性和持久性。题干中，为社会主义的建设而 易错100 题中小学科二 让每一个孩子都能遇到好老师 10 勤奋学习，属于远景的间接性动机。故本题选D。' },
{ cat:'yicuo', t:'KE2-50', s:'YiCuo100', txt:'[KE2] #50\n\n学期末，李老师对小明作出的评语是：“这个学期你上课听讲比以往认真，积极回答课堂提问，能 按时完成作业，学习成绩有很大的进步，继续加油，我看好你哦！”这种评价属于（ ）。 A.绝对评价 B.相对评价 C.量化评价 D.质性评价\n\n50.【答案】D 【解析】本题考查质性评价。质性评价也叫定性评价，定性评价是根据评价者对评价对象平时的表现、 现实和状态或文献资料的观察和分析，直接对评价对象做出定性结论的价值判断。李老师对小明做出的评 语是基于日常观察的基础上对学生做出的定性结论，属于质性评价。故本题选D。' },
{ cat:'yicuo', t:'KE2-51', s:'YiCuo100', txt:'[KE2] #51\n\n人的高级心理机能是在一定的社会历史文化背景下，借助语言，通过人与人的社会交往而形成的。 持这种观点的心理学家是（ ）。 A.维果茨基 B.乔姆斯基 C.巴甫洛夫 D.弗洛伊德\n\n51.【答案】A 【解析】本题考查维果茨基的文化—历史发展理论。维果茨基所提出的“文化—历史”发展论认为， 人的高级心理机能是在与周围人的交往过程中产生与发展起来的，是社会文化、历史发展的产物。故本题 选A。' },
{ cat:'yicuo', t:'KE2-52', s:'YiCuo100', txt:'[KE2] #52\n\n在近代教育史上，反对思辨，主张用实证方法研究知识价值，提出教育的任务是教导人们为完美生 活做准备的教育家是（ ）。 A.夸美纽斯 B.赫尔巴特 C.斯宾塞 D.卢梭 易错100 题中小学科二 让每一个孩子都能遇到好老师 8\n\n52.【答案】C 【解析】本题考查斯宾塞的教育思想。英国教育家斯宾塞在《什么知识最有价值》中说道：“为我们 的完美生活做好准备，乃是教育所应完成的功能；一种教育课程是否合理的判断，就要看这种功能的完成 程度如何为准。”斯宾塞是著名的实证主义者，他反对思辨，主张科学只是对经验事实的描写和记录，提 出教育的任务是教导人们为完美生活做准备。故本题选C。' },
{ cat:'yicuo', t:'KE2-53', s:'YiCuo100', txt:'[KE2] #53\n\n子路对教育的作用不以为然，说：南山有竹，人不去管它，照样长得直：砍来当箭，照样能穿透犀 牛皮。孔子对他说：若是将砍来的竹子刮光，装上箭头，磨得很利，岂不射得更深吗？子路接受了孔子的 教诲，成了孔门的学生。孔子的做法体现了哪一教育原则？（ ） A.教育影响的一致性、连贯性原则 B.理论联系实际原则 C.长善救失原则 D.疏导原则\n\n53.【答案】D 【解析】本题考查德育原则。疏导原则是指进行德育要循循善诱，以理服人，从提高学生认识入手， 调动学生的主动性，使他们积极向上。题干中孔子的话体现了以理服人。故本题选D。' },
{ cat:'yicuo', t:'KE2-54', s:'YiCuo100', txt:'[KE2] #54\n\n在教学《桂林山水》一课时，教师制定的“感受山水之美，体会作者对祖国的热爱之情”的教学目 标属于（ ）。 A.结果性目标 B.体验性目标 C.表现性目标 D.知识性目标\n\n54.【答案】B 【解析】本题考查体验性目标。《义务教育课程标准》中的目标主要是按结果性目标和体验性目标来描 述的，对不同水平的学习和不同类型的目标要求用不同的行为动词进行描述。其中，体验性目标则主要用 于反映“过程与方法”“情感态度与价值观”等目标领域的要求。题干体现了体验性目标。故本题选B。' },
{ cat:'yicuo', t:'KE2-55', s:'YiCuo100', txt:'[KE2] #55\n\n1632 年捷克教育家夸美纽斯出版《大教学论》。下列不属于夸美纽斯教育观点的是（ ）。 A.夸美纽斯认为教育的最终目的是为人的永生做准备 B.提出普及教育思想 C.教育要心理学化 D.教育适应自然\n\n55.【答案】C 【解析】本题考查夸美纽斯的教育思想。夸美纽斯的教育思想主要有：1632 年的《大教学论》是近代 第一本教育学著作。认为教育的最终目的是为人的永生做准备；提出“泛智教育”，把一切知识教给一切 人；教育要遵循自然；提出普及教育思想等。C 选项教育要心理学化是裴斯泰洛齐提出来的。故本题选C。' },
{ cat:'yicuo', t:'KE2-56', s:'YiCuo100', txt:'[KE2] #56\n\n张老师在教学中经常用奖励来激发学生的学习动机，培养学生良好的学习习惯。张老师的这种做法 符合（ ）。 A.人本主义学习观 B.行为主义学习观 C.认知主义学习观 D.建构主义学习观\n\n56.【答案】B 【解析】本题考查学习动机理论。行为主义的学习动机理论主要强调通过奖励与惩罚的措施，来维持 学生的学习动机。题目中用奖励来激发学生的学习动机体现了这一点。故本题选B。 易错100 题中小学科二 让每一个孩子都能遇到好老师 11' },
{ cat:'yicuo', t:'KE2-57', s:'YiCuo100', txt:'[KE2] #57\n\n提出“学校即社会”“教育即生活”“教育即生长”“教育即经验地不断改组”“儿童中 心”“从做中学”等一系列口号和原则的是（ ）。 A.布拉梅尔德 B.布鲁纳 C.卢梭 D.杜威\n\n57.【答案】D 【解析】本题考查杜威的思想。杜威的《民主主义与教育》从实用主义出发，反对传统的教育以学科 教材为中心和脱离实际生活；主张让学生在实际生活中学习，提出“教育即生活”“教育即成长”“教育 即经验的重组和改造”“学校即社会”和“从做中学”。他的这种学说以“经验”为基础，强调儿童在教 育中的中心地位，主张教师应以学生的发展为目的，围绕学生的需要和活动组织教学。故本题选D。' },
{ cat:'yicuo', t:'KE2-58', s:'YiCuo100', txt:'[KE2] #58\n\n教师布置的作业应让学生“跳一跳，够得着”，这体现的作业设计基本要求是（ ）。 A.形式多样 B.难度适宜 C.尊重差异 D.注重创新\n\n58.【答案】B 【解析】本题考查作业设计的基本要求。作业的要求有：符合课程标准和教科书的要求，要有代表性； 作业分量要适当，难易要适度；要向学生提出明确的要求；老师要经常检查和批改学生的作业。“跳一跳， 够得着”体现了作业既能符合学生的发展水平，又不能过难，是可以通过努力实现的，所以体现了难度适 宜。故本题选B。' },
{ cat:'yicuo', t:'KE2-59', s:'YiCuo100', txt:'[KE2] #59\n\n在学校教育中，学生对客观世界的认识主要借助的是（ ）。 A.生产经验 B.生活经验 C.直接经验 D.间接经验 易错100 题中小学科二 让每一个孩子都能遇到好老师 9\n\n59.【答案】D 【解析】本题考查教学过程的间接性规律。学生在学校中主要学习的是间接经验，这也是他们在学校 教育中认识客观世界的主要材料。故本题选D。' },
{ cat:'yicuo', t:'KE2-60', s:'YiCuo100', txt:'[KE2] #60\n\n赵老师讲解课文《秋》时，先放了一些秋的图片，让学生感受秋意，不知不觉中学生们就记住所学 的材料了。案例中的赵老师广泛利用环境信息，注意调动和发掘大脑无意识领域的潜能，使学生在轻松愉 快的气氛中学习，这种教学方法属于（ ）。 A.发现学习法 B.非指导性教学法 C.范例教学法 D.暗示教学法\n\n60.【答案】D 【解析】本题考查教学模式。暗示教学法，就是对教学环境进行精心的设计，用暗示、联想练习和音 乐等各种综合方式建立起无意识的心理倾向，创造高度的学习动机，激发学生的学习需要和兴趣，充分发 挥学生的潜力，使学生在轻松愉快的学习中获得更好的效果。案例中的赵老师广泛利用环境信息，注意调 动和发掘大脑无意识领域的潜能，使学生在轻松愉快的气氛中学习，这种教学方法属于暗示教学法。故本 题选D。' },
{ cat:'yicuo', t:'KE2-61', s:'YiCuo100', txt:'[KE2] #61\n\n梦佳理解了“物质决定意识，意识反作用于物质”的涵义。按照皮亚杰的认知发展阶段理论，梦佳 的思维发展水平处于（ ）。 A.感知运动阶段 B.前运算阶段 C.具体运算阶段 D.形式运算阶段\n\n61.【答案】D 【解析】本题考查皮亚杰认知发展阶段理论。皮亚杰将个体的认知发展分为四个阶段。其中，第四阶 段是形式运算阶段（11—15 岁以上），该阶段的儿童思维以命题的方式进行，能够根据逻辑推理、归纳或 者演绎的方式解决问题。题干中，学生理解物质和意识之间的关系内涵，属于辩证思维，说明思维水平处 于形式运算阶段。故本题选D。' },
{ cat:'yicuo', t:'KE2-62', s:'YiCuo100', txt:'[KE2] #62\n\n在课程理论发展史上，第一次专门系统研究课程编制的理论是（ ）。 A.泰勒原理教育 B.目标分类学 C.多元智能理论 D.生活教育理论\n\n62.【答案】A 【解析】本题考查泰勒的课程理论。在课程理论发展史上，第一次专门系统研究课程编制的理论是泰 勒原理教育。泰勒提出了课程设计的目标模式，以及关于课程设计的四个问题：目标、内容、方法、评价。 故本题选A。 易错100 题中小学科二 让每一个孩子都能遇到好老师 12' },
{ cat:'yicuo', t:'KE2-63', s:'YiCuo100', txt:'[KE2] #63\n\n教师引导学生选择有针对性的格言、箴言，作为座右铭以自励、自警、自律，使其获得教育的德育 方法是（ ）。 A.说服教育法 B.个人修养法 C.环境陶冶法 D.品德评价法\n\n63.【答案】B 【解析】本题考查个人修养法。个人修养法是在教师的引导下，学生经过自觉学习、自我反思和自我 行为调节，使自身品德不断完善的一种重要方法，主要包括立志、学习、反思、箴言、慎独等。故本题选 B。' },
{ cat:'yicuo', t:'KE2-64', s:'YiCuo100', txt:'[KE2] #64\n\n儿童身心发展有两个高速发展期：乳儿期与青春期，反映了身心发展的（ ）规律。 A.顺序性 B.不平衡性 C.阶段性 D.个别差异性\n\n64.【答案】B 【解析】本题考查不平衡性规律。个体发展的不平衡性表现在两个方面：首先，同一方面的发展速度， 在不同年龄阶段变化是不平衡的，其次，不同方面发展的不平衡性。题目中“两个高速发展期”表明不同 时期，发展速度不同，体现了不平衡性。故本题选B。' },
{ cat:'yicuo', t:'KE2-65', s:'YiCuo100', txt:'[KE2] #65\n\n晓军上中学后，自尊心越来越强，自我评价越来越客观，全面，自我控制能力明显提高，这反映的 是晓军自我意识哪一方面的发展？（ ） A.生理自我 B.心理自我 C.社会自我 D.物质自化\n\n65.【答案】B 【解析】本题考查自我意识的发展阶段。自我意识的发展分为三个阶段：生理自我、社会自我和心理 自我。其中，心理自我，是指个体对自己的心理属性的意识，包括对自己的感知、记忆、思维、智力、性 格、气质、动机、需要、价值观和行为等的意识。心理自我在青年初期开始发展和形成。题干中描述的是 中学生自尊心变强、自我评价更客观，体现的都是心理自我。故本题选B。' },
{ cat:'yicuo', t:'KE2-66', s:'YiCuo100', txt:'[KE2] #66\n\n夏日炎炎，身处蓝绿色调装饰的室内，会感觉相对清凉，这是感觉的（ ）。 A.对比 B.后像 C.联觉 D.适应\n\n66.【答案】C 【解析】本题考查联觉。一种感觉兼有另一种感觉的心理现象叫联觉，如红色给人以热烈的感觉、紫 色给人以高贵的感觉等。题干蓝绿色除了产生视觉，还产生了温度觉，属于联觉，所以C 符合题干；感觉 对比是同一感受器接受不同的刺激，而使感受性发生变化的现象，所以A 不符合题干；感觉后像是指在刺 激作用停止后暂时保留的感觉现象称为感觉后效。所以B 不符合题干；感觉适应是指由于刺激对感受器的 持续作用而使感受性发生变化的现象，如视觉适应、嗅觉适应等，所以D 不符合题干。故本题选C。' },
{ cat:'yicuo', t:'KE2-67', s:'YiCuo100', txt:'[KE2] #67\n\n一位初中语文教师教学生用列课文结构提纲、画网络图的方法促进学习。这里所教的学习策略是 （ ）。 A.复述策略 B.组织策略 易错100 题中小学科二 让每一个孩子都能遇到好老师 10 C.精制策略 D.组块策略\n\n67.【答案】B 【解析】本题考查组织策略。组织策略即根据知识经验之间的内在关系，对学习材料进行系统、有序 的分类、整理与概括，使之结构合理化，包括列提纲、利用图形和表格、概括和归纳等。材料中“列课文 结构提纲、画网络图”均属于学习策略中的组织策略。故本题选B。' },
{ cat:'yicuo', t:'KE2-68', s:'YiCuo100', txt:'[KE2] #68\n\n晓玲性格内向，平时不敢同老师讲话，遇到疑难问题也没有勇气求教。偶有一次，她向杨老师求教， 杨老师耐心解答了问题，并对她的行为及时给予表扬。经过多次这样的教学交往，晓玲学会了主动向老师 请教问题。杨老师改变晓玲行为的方法属于（ ）。 A.强化法 B.自控法 C.脱敏法 D.放松法\n\n68.【答案】A 【解析】本题考查行为改变的基本方法。强化法用来培养新的适应行为。根据学习原理，一个行为发 生后，如果紧跟着一个强化刺激，这个行为就会再一次发生。在本题中，晓玲主动向杨老师求教的行为发 生后，杨老师耐心解答了问题并对晓玲的行为及时给予了表扬，就是对晓玲的行为进行了强化刺激，有助 于晓玲主动求教行为的再次发生。故本题选A。 易错100 题中小学科二 让每一个孩子都能遇到好老师 13' },
{ cat:'yicuo', t:'KE2-69', s:'YiCuo100', txt:'[KE2] #69\n\n晓旭认为服从、听话的孩子就是好孩子，于是她对老师和家长绝对遵从，期望得到他们的赞许。根 据科尔伯格的道德发展理论，她的道德发展处于（ ）。 A.社会契约取向阶段 B.相对功利取向阶段 C.寻求认可取向阶段 D.遵守法规取向阶段\n\n69.【答案】C 【解析】本题考查科尔伯格道德发展阶段理论。科尔伯格将个体道德发展分为三水平六阶段。其中习 俗水平下第三阶段：寻求认可取向阶段（好孩子阶段），在此阶段的儿童看来，一种行为是否正确，要看其 是否被别人喜爱，能否取悦他人。考虑社会对一个“好孩子”的期许来做事。题干中，晓旭认为服从、听 话的孩子就是好孩子，并以这一要求来行事，符合寻求认可取向阶段。故本题选C。' },
{ cat:'yicuo', t:'KE2-70', s:'YiCuo100', txt:'[KE2] #70\n\n邻居小孩一直体弱多病，经常去打针，每次打针他都害怕而大哭，久而久之，一见穿白大褂的大夫 就大哭，有一次，带他去亲戚家玩，清洁工来了，穿白衣，戴白帽，酷似大夫，小孩一见，立马大哭。该 学习理论的代表人物是（ ）。 A.桑代克 B.巴普洛夫 C.斯金纳 D.班杜拉\n\n70.【答案】B 【解析】本题考查巴普洛夫的经典性条件作用理论。经典性条件作用理论是巴普洛夫提出来的。操作 性条件作用理论是斯金纳提出来的。桑代克的是尝试错误说。班杜拉的是社会学习理论。泛化是对相似的 刺激以同样的方式作出反应。题干中邻居小孩因为打针害怕白大褂的大夫，然后清洁工来了，穿白衣，戴 白帽，酷似大夫，这种相类似的刺激也引起了小孩害怕的反应。泛化是巴普洛夫提出的理论。故本题选B。' },
{ cat:'yicuo', t:'KE2-71', s:'YiCuo100', txt:'[KE2] #71\n\n在心理辅导中，小学生有时会把辅导老师当成自己的父母，以获得情感的满足。这种心理现象属于 （ ）。 A.共情 B.移情 C.同情 D.亲情\n\n71.【答案】B 【解析】本题考查移情。移情是来访者将自己过去对生活中某些重要人物的情感会太多投射到分析者 身上的过程，即指本应是对他人的情感和态度转移到了分析家身上。小学生有时会把辅导老师当成自己的 父母，正是移情的表现。故本题选B。' },
{ cat:'yicuo', t:'KE2-72', s:'YiCuo100', txt:'[KE2] #72\n\n在小学科学教材中，先呈现动植物的基本知识，接着是与动植物有关的生态系统知识，再是与人类 有关的生态系统知识。这种课程内容的组织形式属于（ ）。 A.直线式 B.螺旋式 C.并列式 D.循环式\n\n72.【答案】B 【解析】本题考查课程内容组织方式。课程内容组织方式包括直线式和螺旋式。直线式指把课程内容 组织成一条在逻辑上前后联系的“直线”，前后内容基本不重复，即课程内容直线前进，前面安排过的内容 在后面不再呈现，强调知识本身内在逻辑的直线性；螺旋式指在不同阶段、单元或不同课程门类中，使课 程内容重复出现，逐渐扩大知识面，加深知识难度，即同一课程内容前后重复出现，前面呈现的内容是后 面学习内容的基础，后面学习内容是对前面学过内容的不断扩展与加深，层层递进。题干中先呈现动植物 的基本知识，接着是与动植物有关的生态系统知识，再是与人类有关的生态系统知识，内容不断扩展与加 深，层层递进，属于螺旋式。故本题选B。' },
{ cat:'yicuo', t:'KE2-73', s:'YiCuo100', txt:'[KE2] #73\n\n“玉不琢，不成器；人不学，不知道。是故古之王者，建国君民，教学为先。”《学记》中的这句话 反映了（ ）。 A.教育与经济的关系 B.教育与文化的关系 C.教育与政治的关系 D.教育与科技的关系\n\n73.【答案】C 【解析】本题考查《学记》。“建国君民，教学为先”出自《学记》，意思是治国安民，第一要务就是推 行道德教化，反映了教育与政治的关系。故本题选C。' },
{ cat:'yicuo', t:'KE2-74', s:'YiCuo100', txt:'[KE2] #74\n\n从课外活动的内容看，学校举办的法治教育报告会属于（ ）。 A.学科活动 B.社会活动 易错100 题中小学科二 让每一个孩子都能遇到好老师 11 C.主题活动 D.文体活动\n\n74.【答案】C 【解析】本题考查课外活动的类型。课外活动包括社会实践活动、学科活动、科技活动、主题活动等 多种内容。主题活动是就特定专题而展开短期或长期的专门活动。题干中法治教育报告是针对法律主题进 行的教育活动。故本题选C。 易错100 题中小学科二 让每一个孩子都能遇到好老师 14' },
{ cat:'yicuo', t:'KE2-75', s:'YiCuo100', txt:'[KE2] #75\n\n小学高年级学生自我意识的发展受学校、教师、同伴等影响显著。这表明其自我意识发展处于（ ）。 A.生理自我时期 B.社会自我时期 C.心理自我时期 D.精神自我时期\n\n75.【答案】B 【解析】本题考查自我意识发展的三阶段。个体自我意识的发展经历了生理自我到社会自我再到心理 自我的过程。儿童在3 岁之后，自我意识的发展进入社会自我阶段。社会自我至少年期基本成熟。题干中 描述的情形属于社会自我阶段。故本题选B。' },
{ cat:'yicuo', t:'KE2-76', s:'YiCuo100', txt:'[KE2] #76\n\n《中华人民共和国义务教育法》颁布时间为（ ）。 A.1983 年 B.1986 年 C.1993 年 D.2006 年\n\n76.【答案】B 【解析】本题考查《中华人民共和国义务教育法》。1986 年4 月12 日第六届全国人民代表大会第四次 会议通过的《中华人民共和国义务教育法》规定，国家实行九年制义务教育。故本题选B。' },
{ cat:'yicuo', t:'KE2-77', s:'YiCuo100', txt:'[KE2] #77\n\n在小学课程实施过程中，教师挖掘和利用的民风民俗、传说故事、传统节日、文化活动等资源属于 （ ）。 A.自然资源 B.校内资源 C.社会资源 D.个体资源\n\n77.【答案】C 【解析】本题考查课程资源的类型。按照空间分布，课程资源分为校内和校外资源。学校范围内的课 程资源就是校内课程资源。超出学校范围的课程资源就是校外课程资源。题干中的民风民俗、传说故事等 资源属于校外资源中的社会资源。故本题选C。' },
{ cat:'yicuo', t:'KE2-78', s:'YiCuo100', txt:'[KE2] #78\n\n教育具有自身发展的规律，在某些方面不一定会随着社会的改变而改变，这反映了教育的哪一特 征？（ ） A.阶级性 B.生产性 C.目的性 D.相对独立性\n\n78.【答案】D 【解析】本题考查教育的相对独立性。教育是一种主体性的实践活动，在能动地反作用于社会发展的 过程中，具有主体自身的价值取向与行为选择，由此实现着教育的社会功能，并表现出自身的相对独立性。 所谓教育的相对独立性，是指作为社会一个子系统的教育，具有自身的规律，对政治经济制度和生产力发 展具有能动作用。具体表现为：（1）教育对社会的作用具有能动性；（2）教育具有自身的质的规定性；（3） 教育具有历史继承性；（4）教育与社会发展具有不平衡性；（5）教育的独立性并非绝对独立性，而是相对 独立性。故本题选D。' },
{ cat:'yicuo', t:'KE2-79', s:'YiCuo100', txt:'[KE2] #79\n\n钱老师上课时经常先提出问题让大家思考一会儿，然后再叫学生回答，以使学生的心理活动更好地 维持在教学活动中，钱老师所采用的课堂管理方式是（ ）。 A.团体警觉 B.替代强化 C.最小干预 D.处理转换\n\n79.【答案】A 【解析】本题考查课堂管理方式。团体警觉是指在课堂中，先提出问题，让学生思考后再去点名，而 不是先点名，再提问，以此更好地引起全体学生的注意。故本题选A。' },
{ cat:'yicuo', t:'KE2-80', s:'YiCuo100', txt:'[KE2] #80\n\n谢晶在全校大会上受到表扬，兴奋不已；会议结束后，当听到几个同学议论“她有什么了不起，你 看她长得那个样”时，她又很快陷入极度苦恼之中。谢晶的表现典型地反映了中学生情绪的哪种特点？（ ） A.两极性 B.不平衡性 C.阶段性 D.爆发性 二、简答题\n\n80.【答案】A 【解析】本题考查中学生情绪发展的特点。青少年学生正处于身心各方面迅速发展的时期，心理矛盾 错综复杂，神经过程的兴奋和抑制发展不平衡，导致情绪表现的两极性十分明显，情绪容易从一个极端走 向另一个极端，相反情绪的转换剧烈。题干中谢晶先是非常兴奋继而因为小事又变得极度苦恼，体现出情 绪的两极变化。故本题选A。 二、简答题 81.【参考答案】 《小学教师专业标准（试行）》中“终身学习”的基本理念： 易错100 题中小学科二 让每一个孩子都能遇到好老师 15 （1）学习先进小学教育理论，了解国内外小学教育改革与发展的经验和做法； （2）优化知识结构，提高文化素养； （3）具有终身学习与持续发展的意识和能力，做终身学习的典范。 82.【参考答案】 加里培林将智力技能形成划分为5 个阶段： （1）活动定向阶段； （2）物质与物质化阶段； （3）出声的外部言语动作阶段； （4）不出声的外部言语动作阶段； （5）内部言语阶段。 83.【参考答案】 小学教师在撰写操行评语时需要注意： （1）针对性。如针对学生的年龄、性别、个性等特点，充分体现学生的特长，防止千篇一律。 （2）全面性。要从素质教育的高度出发，从德、智、体等各个方面来评价学生，防止以偏概全。 （3）发展性。要以动态的眼光来看待学生，充分肯定学生的成长与进步，防止一成不变。 （4）鼓励性。要满腔热情地反映学生的优点，避免采用严肃冷峻、古板生硬的语言。 （5）可接受性。一是指出的问题不仅真实可靠，而且还要有一定的艺术角度。二是评语用词尽量简单 明了，贴近学生的年龄和文化水平。 84.【参考答案】 中学教学中贯彻启发性原则的基本要求是： （1）调动学生学习的主动性； （2）启发学生独立思考，发展学生的逻辑思维能力； （3）让学生动手，培养独立解决问题的能力； （4）发扬教学民主。 85.【参考答案】 培养学生想象力的方法有： （1）培养和保护学生的好奇心； （2）丰富学生知识，扩大表象储备； （3）创造想象情境，引发想象； 易错100 题中小学科二 让每一个孩子都能遇到好老师 16 （4）利用生动活泼的教学形式唤起学生的想象。 86.【参考答案】 注意的品质包括： （1）注意的广度； （2）注意的稳定性； （3）注意的分配； （4）注意的转移。 87.【参考答案】 小学教师进行教学研究的基本要求包括： （1）以科学理论为指导； （2）遵循学科的特点、规律； （3）有目的性、计划性。 88.【参考答案】 建构主义思想的核心是知识是在主客体相互作用的活动中建构起来的。 （1）知识观 建构主义在一定程度上对知识的客观性和确定性提出质疑，强调知识的动态性。 （2）学习观 建构主义强调学习的主动建构性、社会互动性和情境性。 （3）学生观 第一，建构主义强调学生经验世界的丰富性，强调学生的巨大潜能； 第二，建构主义者强调学生经验世界的差异性，每个人在自己的活动和交往中形成了自己的个性化的、 独特的经验，每个人有自己的兴趣和认知风格。 （4）教学观 由于知识的动态性和相对性以及学习的建构过程，教学不再是传递客观和确定的现成知识，而是激发 出学生原有的相关知识经验，促进知识的“生长”，促进学生的知识建构活动，以促成知识经验的重新组织、 转化和改造。 89.【参考答案】 元认知策略大致可分为以下三种： （1）计划策略：指根据认知活动的特定目标，在认知活动开始之前计划完成任务所涉及的各种活动、 易错100 题中小学科二 让每一个孩子都能遇到好老师 17 预计结果、选择策略，设想解决问题的方法，并预估其有效性等。 （2）监控策略：指在认知过程中，根据认知目标及时评价、反馈自己认知活动的结果与不足，正确估 计自己达到认知目标的程度、水平；根据有效性标准，评价各种认知行动、策略的效果。 （3）调节策略：指根据对认知活动结果的检查，如发现问题，则采取相应的补救措施，根据对认知策 略的效果的检查，及时修正、调整认知策略。 90.【参考答案】 教材编写的基本要求有： （1）按照不同学科的特点，在内容上体现科学性与思想性； （2）强调内容的基础性； （3）在保证科学性的前提下，必须注意到基本教材对大多数学生和大多数学校的适用性； （4）在教材的编排上，要做到知识的内在逻辑与教学法要求的统一； （5）教科书的编排形式要有利于学生的学习； （6）兼顾同一年级各门学科内容之间的关系和同一学科各年级教材之间的衔接。 三、辨析题 91.【参考答案】 这个观点是错误的。 第一，教学是教师的教与学生的学共同组成的一种教育活动，是一种双边活动。第二，教师在教学活 动中起主导作用，学生在教学活动中处于主体地位，而不是客体。学生虽然许多方面并不成熟，需要教师 的指导，但他仍是认识和自身发展的主体，具有主观能动性。第三，在教学中要充分发挥学生的主观能动 性，才能促进教学活动的顺利开展。否定学生在教学中的主体作用，必然会削弱教学效果。因此，这种观 点是错误的。 92.【参考答案】 这种观点是错误的。 第一，学习动机和学习效果之间呈“倒U 型曲线”，并不是学习动机强，学习效果越好；第二，中等 程度的动机水平最有利于学习效果的提高，动机不足或过分强烈都会影响学习效率；第三，最佳动机水平 与学习课题的难易程度有关，任务难度越高，最佳动机水平越低；反之任务难度低，最佳动机水平越高。 因此，这种观点是错误的。 93.【参考答案】 这种说法是错误的。 易错100 题中小学科二 让每一个孩子都能遇到好老师 18 教育的任务不仅仅是向学生传授知识。教学的首要任务是向学生传授科学文化基础知识以及基本技能。 除此之外，还要培养学生高尚的审美情趣、增强学生体力、养成良好的思想品德以及发展学生的智力。因 此，这种观点是错误的。 94.【参考答案】 这种观点是错误的。 皮亚杰利用对偶故事法，发现并总结出了儿童道德认知发展的总规律，即儿童道德的发展经历从他律 到自律的发展过程。科尔伯格提出道德发展阶段论，采用“道德两难故事法”，最典型的就是“海因茨偷 药”的故事，让儿童对道德两难问题作出判断，提出道德认知发展的三水平六阶段理论。题干中科尔伯格 是用两难故事法对道德认知进行的研究。因此，这种观点是错误的。 95.【参考答案】 这种观点是错误的。 道德认识是人们对于行为规范及其意义的认识，是人的认识过程在品德上的表现，是个体品德的基础。 道德行为是个人在一定的道德认识支配下表现出来的对他人和社会有道德意义的活动，是衡量道德品质的 重要标志。但道德行为的形成受主观和客观等多方面因素的影响，也即道德认识在转化为道德行为的过程 中，需要道德意志和道德情感的参与，并不是有了什么样的道德认识就一定会有什么样的道德行为。因此， 这种观点是错误的。 四、材料分析题 96.【参考答案】 （1）课堂教学情境是指教师根据教学目标和教学内容，有目的地创设服务于学生学习的一种特殊的教 学环境。创设小学课堂教学情境时应考虑小学生的心理特点、材料的呈现形式和小学生的知识基础等。生 活是教学赖以生存和发展的源泉，因此，教学必须从抽象、枯燥的形式中解放出来，走向生活，创设生活 情境使教学生活化。材料中孙老师创设的情境，将数学问题转化为学生生活实际问题，激发了学生学习的 兴趣，收到了良好的教学效果。 （2）①教师应该全面深入地理解教材，知道教材的地位和作用。明确教材的知识结构、理论体系，贯 通教材的知识点，熟知教材的内容，并内化为自己的知识储备。 ②教师要充分地了解学生的实际情况，知道学生需要什么，知道哪些内容更有实效性。有针对性地选 择教学内容，激发学生的好奇心和学习兴趣。 ③合理安排教学内容。安排教学内容主要是在广度和深度上，一节课的内容难易程度、信息量的大小 等部会影响教学效果，教师要根据课程特点以及学生实际情况合理选择教学内容。 易错100 题中小学科二 让每一个孩子都能遇到好老师 19 97.【参考答案】 （1）李某不良品德形成的原因可能有： ①归属与爱的需要没有得到满足。归属与爱的需要，也称社交需要，是指每个人都有被他人或群体接 纳、爱护、关注、鼓励及支持的需要。材料中，李某从小父母离异，跟着年老多病的祖父生活，父亲偶尔 回家，对他非打即骂，说明李某缺失关爱。 ②缺乏正确的家庭教育，家庭教养方式不科学。民主型的家庭教养方式最有利于孩子成长，材料中， 李某的祖父对他管教不严，是放任型的，而父亲动辄打骂，是专断型的。错误的教养方式下，孩子容易出 现攻击性行为，缺乏社会责任感。 ③同伴群体的负面影响。个体的态度与品德的形成受同伴群体的影响，同伴群体的负面作用是与家庭、 社区、学校、大众传媒等方面的因素联系在一起的。材料中，李某在社会上结交不良青年，容易形成坏的 行为习惯。 （2）班主任应该： ①了解和研究学生的情况，把握清楚学生行为背后的原因，才能做出有针对性地教育对策。班主任应 该通过家访、电话等方式了解李某的家庭情况，向其家长宣传科学的教育理念，取得家长的理解和配合； ②关心爱护后进生，尊重他们的人格。班主任在日常的学习和生活中，多关注李某的表现，多与之私 下交流，多给予关爱和鼓励。还可以发动班级的力量，成立互助小组，共同帮助李某，走近李某。满足李 某归属与爱的需要； ③长善救失，因材施教。李某虽然纪律不佳，但是擅长运动，班主任要善于发现学生的闪光点，一分 为二地看待他。可以发展李某的运动特长，鼓励他多参与班级、学校的体育活动； ④遵循德育过程的学生思想品德形成的长期性和反复性规律。坚持抓反复，反复抓。班主任应该制定 一个长久的教育计划，有耐心、有爱心的对待李某这种特殊学生，观察、记录他的每一点变化。 综上所述，相信通过以上努力，李某这种特殊学生肯定会发生积极的改变。 98.【参考答案】 （1）材料中的学习现象可以用经验类化理论解释。该理论代表人物是贾德，他用著名的“水下打靶（也 称水下击靶）”实验证明，迁移产生的关键是学习者在两种活动中通过概括形成了能够泛化的共同原理。因 此，该理论也叫概括化理论。材料中，学生掌握了五言绝句的平仄规律后，再学习五言律诗时，通过概括 形成了能够泛化的共同原理，进而很快就能总结出五言律诗的平仄规律。再后来，当学生学习七言律诗时， 也是因为同样的原因，很快总结出了其平仄规律。 （2）学习迁移的经验类化理论（概括化理论）带来的启示体现在： 易错100 题中小学科二 让每一个孩子都能遇到好老师 20 第一，在教学过程中老师应注重原理、理论的教学，促进学生对于共同原理的理解和把握。 第二，注重用理论指导实践，积极创设实践机会，多学多练。 第三，在实践中教师积极指导，尤其是引导学生将原理迁移到操作中。 99.【参考答案】 （1）材料中学生的行为体现了低年级小学生特有的年龄特征： ①想象力进一步丰富和发展，对想象和现实之间没有明确的界限。材料中学生问“我能成为齐天大圣 吗？”“你喜欢熊大还是熊二？”体现了想象力发展的特征。 ②观察力的迅速发展，有很大的具体性和直观性。材料中学生问“太阳为什么白天出来……”体现出 了学生对自然现象的直观细致观察。 ③对世界有着强烈的好奇心和求知欲。材料中在观察到诸多现象之后，孩子们特别喜欢问问题，对世 界的探索欲、好奇心与日俱增。 （2）面对学生的稀奇古怪的问题，老师应该采取如下做法： ①树立正确的学生观，尊重学生的独特性，遵循学生发展的阶段特征，保护学生的好奇心，接纳学生 的稀奇古怪的问题。 ②坚持发展性评价，对极具创造性的回答，予以鼓励和表扬。 ③创设有利于创造性产生的环境。教师应给学生创造一个能容忍、支持标新立异者或偏离常规思维者 的环境，让学生感受到“心理安全”和“心理自由”。敢于大胆发问，大胆质疑。 ④重视非逻辑思维能力，鼓励学生大胆猜测，进行丰富想象，而不拘泥于常规，引导学生进行积极交 流、讨论得出答案。 100.【参考答案】 （1）材料中的“我”贯彻了疏导原则、因材施教原则、尊重学生与严格要求学生相结合原则、教育的 一致性和连贯性原则、集体教育和个别教育相结合的原则、长善救失原则。 （2）①疏导原则是指进行德育要循循善诱，以理服人，从提高学生认识入手，调动学生的主动性，使 他们积极向上。材料中的“我”通过与王伟语重心长的谈心，循循善诱，为他制定了一系列措施，从而调 动了他的积极主动性，体现了疏导原则。 ②因材施教原则是指进行德育要从学生的思想认识和品德发展的实际出发，根据他们的年龄特征和个 性差异进行不同的教育，使每个学生的品德都能得到最好的发展。材料中的“我”通过各种途径了解王伟 的具体情况，从实际出发，提高王伟的道德认识，体现了因材施教原则。 ③尊重学生与严格要求学生相结合原则是指进行德育要把对学生个人的尊重和信赖与对他们的思想和 易错100 题中小学科二 让每一个孩子都能遇到好老师 21 行为的严格要求结合起来，使教育者对学生的影响与要求易于转化为学生的品德。材料中的“我”在针对 王伟不爱学习、玩游戏的情况，没有直接批评，而是发动全班同学关心他、表扬他，在尊重的基础上要求 他不上网，体现了尊重学生与严格要求学生相结合原则。 ④教育的一致性与连贯性原则是指进行德育应当有目的、有计划地把来自各方面对学生的教育影响加 以组织、调节，使其相互配合，协调一致，前后连贯地进行，以保障学生的品德能按教育目的的要求发展。 材料中的“我”通过做家访，发动家庭力量，通过开班会，发动学校集体力量，保证对王伟的教育从空间 上和时间上保持一致，体现了教育的一致性与连贯性原则。 ⑤集体教育和个别教育相结合的原则是指在德育过程中，教育者要善于组织和教育学生热爱集体，并 依靠集体教育每个学生，同时通过对个别学生的教育，来促进集体的形成和发展，从而把集体教育和个别 教育有机地结合起来。材料中的“我”通过开班会，提高班集体对网络游戏的认识，通过发动全班同学对 王伟进行关心、表扬、监督，还让王伟担任学校清洁区卫生评分员，赋予他一定的责任，体现了集体教育 和个别教育相结合的原则。 ⑥长善救失原则是指在德育工作中，教育者要善于依靠、
