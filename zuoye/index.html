<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作业布置导航 · 二年级数学上册</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;min-height:100vh;color:#334155;
  background:linear-gradient(135deg,#a8edea 0%,#7fd1f7 45%,#c7b9ff 100%);background-attachment:fixed}
.container{max-width:920px;margin:0 auto;padding:18px}
.header{text-align:center;padding:24px 12px 14px}
.header h1{font-size:1.95em;font-weight:800;color:#0f172a;text-shadow:0 2px 10px rgba(255,255,255,.6)}
.header p{margin-top:8px;font-size:.95em;color:#33415580;color:#475569}

.progress-card{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 6px 24px rgba(15,23,42,.1);margin-bottom:18px}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:.92em;color:#475569}
.progress-top b{font-size:1.5em;color:#4338ca}
.bar{height:14px;background:#e2e8f0;border-radius:10px;overflow:hidden}
.bar span{display:block;height:100%;width:0;border-radius:10px;
  background:linear-gradient(90deg,#34d399,#3b82f6,#8b5cf6);transition:width .5s}
.reset{margin-top:12px;background:#f1f5f9;color:#64748b;border:none;border-radius:10px;padding:8px 14px;font-size:.82em;cursor:pointer;font-family:inherit}
.reset:hover{background:#e2e8f0}

.unit{background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 4px 18px rgba(15,23,42,.08)}
.unit-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;cursor:pointer}
.u-num{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1em;flex:0 0 auto}
.u-title{flex:1}
.u-title h3{font-size:1.12em;color:#1e293b;font-weight:800}
.u-title .kp{font-size:.8em;color:#94a3b8;margin-top:3px;line-height:1.5}
.u-state{font-size:.78em;color:#64748b;white-space:nowrap}
.arrow{color:#cbd5e1;font-size:.9em;transition:.3s}
.unit.open .arrow{transform:rotate(90deg)}

.tasks{display:none;margin-top:6px;border-top:1px dashed #e2e8f0;padding-top:12px}
.unit.open .tasks{display:block}
.task{display:flex;gap:11px;padding:11px 12px;border-radius:12px;margin-bottom:8px;background:#f8fafc;cursor:pointer;transition:.2s;align-items:flex-start}
.task:hover{background:#eef2ff}
.task.done{background:#ecfdf5}
.box{width:22px;height:22px;border-radius:7px;border:2px solid #cbd5e1;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:.8em;margin-top:1px;transition:.2s}
.task.done .box{background:#10b981;border-color:#10b981}
.task .tx{font-size:.94em;line-height:1.6;color:#334155}
.task.done .tx{color:#94a3b8;text-decoration:line-through}
.tag{font-size:.72em;padding:2px 9px;border-radius:8px;font-weight:700;margin-right:7px;white-space:nowrap}
.t1{background:#dbeafe;color:#1d4ed8}
.t2{background:#fef3c7;color:#b45309}
.t3{background:#f3e8ff;color:#7e22ce}

.tip{background:rgba(255,255,255,.85);border-radius:16px;padding:16px 18px;font-size:.88em;line-height:1.9;color:#475569;margin:6px 0 14px}
.tip b{color:#1d4ed8}
.back{display:block;text-align:center;color:#475569;text-decoration:none;padding:14px;font-size:.95em}
@media(max-width:520px){.header h1{font-size:1.55em}.unit{padding:16px}.u-title h3{font-size:1.02em}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📋 作业布置导航</h1>
    <p>北师大版 · 二年级上册 · 8 个单元</p>
  </div>

  <div class="progress-card">
    <div class="progress-top">
      <div>我的完成进度</div>
      <div><b id="pct">0%</b> <span id="cnt" style="font-size:.85em"></span></div>
    </div>
    <div class="bar"><span id="barFill"></span></div>
    <button class="reset" id="resetBtn">清空重新开始</button>
  </div>

  <div id="list"></div>

  <div class="tip">
    <b>怎么用：</b>点开单元 → 完成一项就点一下打勾 ✅（进度会自动记住，下次打开还在）。<br>
    <b>顺序建议：</b><span class="tag t1">基础必做</span>先做完，再做<span class="tag t2">提升选做</span>，最后玩<span class="tag t3">动手实践</span>。
  </div>

  <a class="back" href="../">← 返回学习主页</a>
</div>

<script>
const UNITS=[
 {n:'一',c:'linear-gradient(135deg,#60a5fa,#2563eb)',t:'加与减',kp:'100以内连加连减 · 加减混合 · 竖式计算',
  tasks:[
   {k:1,x:'口算 20 道（100 以内加减法），限时 3 分钟'},
   {k:1,x:'用竖式计算 6 道，注意数位对齐、进位退位'},
   {k:2,x:'把本单元"练一练"剩下的题做完'},
   {k:3,x:'和爸爸妈妈玩"买东西找零钱"游戏，算一算找回多少'}]},
 {n:'二',c:'linear-gradient(135deg,#34d399,#059669)',t:'购物',kp:'元、角、分 · 付钱找钱 · 估算',
  tasks:[
   {k:1,x:'背熟：1 元 = 10 角，1 角 = 10 分'},
   {k:1,x:'口答 10 道"几元几角 =（　）角"换算题'},
   {k:2,x:'用真钱或卡片摆一摆：买 2 样东西，付钱找钱各一次'},
   {k:3,x:'去超市看 3 样商品价格，估一估 20 元够不够买'}]},
 {n:'三',c:'linear-gradient(135deg,#fbbf24,#d97706)',t:'数一数与乘法',kp:'几个几 · 乘法的意义 · 乘法算式',
  tasks:[
   {k:1,x:'说清楚："3 个 4" 写成乘法算式是 3×4 还是 4×3？为什么'},
   {k:1,x:'看图写乘法算式 8 道'},
   {k:2,x:'用小棒或扣子摆出 4 个 5，并写出算式'},
   {k:3,x:'在家找一找"几个几"：如 6 盒鸡蛋、4 排椅子，记下算式'}]},
 {n:'四',c:'linear-gradient(135deg,#f472b6,#db2777)',t:'图形的变化',kp:'轴对称 · 平移 · 旋转',
  tasks:[
   {k:1,x:'说出身边 3 个轴对称的物体（蝴蝶、窗花……）'},
   {k:1,x:'在方格纸上画一个轴对称图形并剪下来'},
   {k:2,x:'判断 6 个动作哪个是平移、哪个是旋转（推窗、转风扇……）'},
   {k:3,x:'用一张纸折一折、剪一剪，做一张对称窗花'}]},
 {n:'五',c:'linear-gradient(135deg,#a78bfa,#7c3aed)',t:'2~5 的乘法口诀',kp:'编口诀 · 背口诀 · 用口诀算',
  tasks:[
   {k:1,x:'背熟 1~5 的乘法口诀（顺着背 + 打乱背）'},
   {k:1,x:'对口令：家长说"三五"，你答"十五"，20 组'},
   {k:2,x:'用口诀算 20 道乘法，限时 3 分钟'},
   {k:3,x:'到"乘法口诀练习"页面做一次 60 秒挑战，记下最高分'}]},
 {n:'六',c:'linear-gradient(135deg,#22d3ee,#0e7490)',t:'测量',kp:'厘米 · 米 · 用尺子量',
  tasks:[
   {k:1,x:'背熟：1 米 = 100 厘米'},
   {k:1,x:'用尺子量 5 样东西的长度（铅笔、书本、手指……）并记录'},
   {k:2,x:'估一估再量一量：课桌宽、门高、身高，比一比差多少'},
   {k:3,x:'量出家到学校的大概距离（用步数估算），说说你怎么估的'}]},
 {n:'七',c:'linear-gradient(135deg,#fb923c,#ea580c)',t:'分一分与除法',kp:'平均分 · 除法的意义 · 除法算式',
  tasks:[
   {k:1,x:'用 12 颗糖平均分成 3 份，说说每份几颗、算式怎么写'},
   {k:1,x:'看图写除法算式 8 道'},
   {k:2,x:'分清"12÷3=4"里每个数表示什么'},
   {k:3,x:'帮家里分碗筷：8 根筷子能分给几个人？说说怎么算的'}]},
 {n:'八',c:'linear-gradient(135deg,#94a3b8,#475569)',t:'6~9 的乘法口诀',kp:'口诀 · 用口诀解决问题',
  tasks:[
   {k:1,x:'背熟 6~9 的乘法口诀（重点：七八五十六、六八四十八）'},
   {k:1,x:'对口令 20 组，家长打乱顺序抽查'},
   {k:2,x:'用口诀算 20 道乘法 + 10 道除法'},
   {k:3,x:'做一次"乘法口诀练习"全部模式挑战，看正确率能不能到 90%'}]}
];

const list=document.getElementById('list');
const KEY='zuoye_done_v1';
let done=JSON.parse(localStorage.getItem(KEY)||'{}');

UNITS.forEach((u,ui)=>{
  const total=u.tasks.length;
  const el=document.createElement('div');
  el.className='unit';
  el.innerHTML=`
    <div class="unit-head">
      <div class="u-num" style="background:${u.c}">${u.n}</div>
      <div class="u-title">
        <h3>第${u.n}单元 · ${u.t}</h3>
        <div class="kp">${u.kp}</div>
      </div>
      <div class="u-state" data-state></div>
      <div class="arrow">▶</div>
    </div>
    <div class="tasks"></div>`;
  const tasksBox=el.querySelector('.tasks');
  u.tasks.forEach((t,ti)=>{
    const id=ui+'-'+ti;
    const d=document.createElement('div');
    d.className='task'+(done[id]?' done':'');
    d.innerHTML=`<div class="box">${done[id]?'✓':''}</div>
      <div class="tx"><span class="tag t${t.k}">${t.k===1?'基础必做':t.k===2?'提升选做':'动手实践'}</span>${t.x}</div>`;
    d.onclick=()=>{
      const on=!d.classList.contains('done');
      d.classList.toggle('done',on);
      d.querySelector('.box').textContent=on?'✓':'';
      if(on)done[id]=1;else delete done[id];
      localStorage.setItem(KEY,JSON.stringify(done));
      updateState(el,u,ui);
      renderProgress();
    };
    tasksBox.appendChild(d);
  });
  el.querySelector('.unit-head').onclick=()=>el.classList.toggle('open');
  list.appendChild(el);
  updateState(el,u,ui);
});

function updateState(el,u,ui){
  let n=0;u.tasks.forEach((t,ti)=>{if(done[ui+'-'+ti])n++;});
  const s=el.querySelector('[data-state]');
  s.textContent=n===u.tasks.length?'✅ 全部完成':'完成 '+n+'/'+u.tasks.length;
  s.style.color=n===u.tasks.length?'#059669':'#64748b';
}

function renderProgress(){
  let total=0,d=0;
  UNITS.forEach((u,ui)=>{u.tasks.forEach((t,ti)=>{total++;if(done[ui+'-'+ti])d++;});});
  const p=Math.round(d/total*100);
  document.getElementById('pct').textContent=p+'%';
  document.getElementById('cnt').textContent=`（${d}/${total} 项）`;
  document.getElementById('barFill').style.width=p+'%';
}
renderProgress();

document.getElementById('resetBtn').onclick=()=>{
  if(!confirm('确定清空所有打勾记录吗？'))return;
  done={};localStorage.setItem(KEY,'{}');
  document.querySelectorAll('.task').forEach(t=>{t.classList.remove('done');t.querySelector('.box').textContent='';});
  UNITS.forEach((u,ui)=>updateState(list.children[ui],u,ui));
  renderProgress();
};
</script>
</body>
</html>
