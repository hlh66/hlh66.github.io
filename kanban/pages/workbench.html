<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>洪老师 · 个人总工作台</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --border:#30363d;
  --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --green:#3fb950;
  --orange:#d29922; --red:#f85149; --purple:#bc8cff; --cyan:#39d0d8;
  --radius:10px; --shadow:0 1px 3px rgba(0,0,0,.4);
}
body.light{
  --bg:#f6f8fa; --panel:#ffffff; --panel2:#f0f3f6; --border:#d0d7de;
  --text:#1f2328; --muted:#636c76; --accent:#0969da; --green:#1a7f37;
  --orange:#9a6700; --red:#cf222e; --purple:#8250df; --cyan:#1b7c83;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.55;
  font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; padding-bottom:40px;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}

/* ============ 顶栏 ============ */
header{
  position:sticky; top:0; z-index:50;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--border);
}
.hd{max-width:1460px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:650;font-size:15px;letter-spacing:.3px;white-space:nowrap}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);align-self:center}
.brand small{font-weight:400;color:var(--muted);font-size:12px}
.search{flex:1;min-width:180px;max-width:520px;position:relative}
.search input{
  width:100%;padding:8px 12px 8px 32px;border-radius:8px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);font-size:13px;outline:none;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.search svg{position:absolute;left:10px;top:9px;opacity:.55}
.acts{display:flex;gap:7px;margin-left:auto}
.acts button{
  background:var(--panel);color:var(--text);border:1px solid var(--border);
  border-radius:7px;padding:6px 11px;font-size:12.5px;transition:.15s;
}
.acts button:hover{border-color:var(--accent);color:var(--accent)}
.subline{max-width:1460px;margin:0 auto;padding:0 18px 9px;display:flex;gap:16px;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.subline b{color:var(--text);font-weight:600}

/* ============ 布局 ============ */
main{max-width:1460px;margin:0 auto;padding:16px 18px 0;display:grid;grid-template-columns:1fr 1.08fr 1fr;gap:16px;align-items:start}
@media (max-width:1180px){main{grid-template-columns:1fr 1fr}}
@media (max-width:760px){main{grid-template-columns:1fr;padding:12px}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel>h2{
  margin:0;padding:11px 14px;font-size:13px;font-weight:650;letter-spacing:.4px;
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;
  background:var(--panel2);
}
.panel>h2 .tag{font-weight:500;font-size:11.5px;color:var(--muted);margin-left:auto}
.panel .body{padding:12px 14px}
.panel .body.tight{padding:8px}

/* ============ 卡片 ============ */
.card{
  display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;
  border:1px solid transparent;transition:.13s;cursor:pointer;
}
.card:hover{background:var(--panel2);border-color:var(--border);text-decoration:none}
.card .mark{
  width:26px;height:26px;border-radius:7px;flex:0 0 26px;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#0d1117;background:var(--accent);
}
.card .t{font-size:13px;font-weight:550;color:var(--text);line-height:1.35}
.card .d{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.cards{display:flex;flex-direction:column;gap:2px}

/* 芯片链接 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--border);font-size:12px;color:var(--text);
}
.chip:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}

/* ============ 待办 ============ */
.todo-form{display:flex;gap:7px;padding:0 14px 10px}
.todo-form input{
  flex:1;padding:8px 10px;border-radius:7px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:13px;outline:none;min-width:0;
}
.todo-form input:focus{border-color:var(--accent)}
.todo-form button{
  border:1px solid var(--border);background:var(--accent);color:#fff;border-radius:7px;
  padding:0 14px;font-size:13px;font-weight:600;border-color:transparent;
}
ul.todos{list-style:none;margin:0;padding:0 8px 8px}
ul.todos li{
  display:flex;gap:9px;align-items:flex-start;padding:8px 8px;border-radius:7px;font-size:13px;
  group;transition:.12s;
}
ul.todos li:hover{background:var(--panel2)}
ul.todos li.done .txt{text-decoration:line-through;color:var(--muted)}
.cb{
  width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border);flex:0 0 16px;
  margin-top:2px;display:grid;place-items:center;font-size:11px;color:transparent;background:transparent;
}
li.done .cb{background:var(--green);border-color:var(--green);color:#0d1117}
.txt{flex:1;word-break:break-word}
.del{opacity:0;border:none;background:transparent;color:var(--muted);font-size:15px;line-height:1;padding:0 3px}
li:hover .del{opacity:.75}
.del:hover{color:var(--red)}
.empty{color:var(--muted);font-size:12.5px;padding:10px 12px;text-align:center}

/* ============ 指令卡 ============ */
.prompt{border:1px solid var(--border);border-radius:8px;margin-bottom:7px;overflow:hidden;background:var(--bg)}
.prompt .ph{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer}
.prompt .ph:hover{background:var(--panel2)}
.prompt .pn{font-size:12.5px;font-weight:600;flex:1}
.prompt .cp{
  border:1px solid var(--border);background:var(--panel);color:var(--muted);
  border-radius:6px;padding:3px 8px;font-size:11.5px;
}
.prompt .cp:hover{color:var(--accent);border-color:var(--accent)}
.prompt pre{
  display:none;margin:0;padding:10px 11px;font-size:11.5px;line-height:1.6;white-space:pre-wrap;
  color:var(--muted);border-top:1px solid var(--border);background:var(--panel);
  font-family:ui-monospace,"Cascadia Code",Consolas,monospace;max-height:260px;overflow:auto;
}
.prompt.open pre{display:block}

/* ============ 文档卡 ============ */
.doc{border-left:2px solid var(--border);padding:7px 0 7px 11px;margin-bottom:11px}
.doc:last-child{margin-bottom:0}
.doc .dt{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.doc .dt .lvl{font-size:10.5px;padding:1px 5px;border-radius:4px;background:var(--panel2);color:var(--muted);font-weight:500}
.doc .dm{font-size:12px;color:var(--muted);margin-top:3px}
.doc ul{margin:5px 0 0;padding-left:16px;font-size:12.2px;color:var(--muted)}
.doc ul li{margin:2px 0}
.doc .lnk{font-size:11.5px;word-break:break-all}

/* ============ 表格 ============ */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12px;min-width:430px}
th,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--panel2);font-weight:600;font-size:11.5px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--accent)}
tr:last-child td{border-bottom:none}
td.mem{color:var(--cyan);white-space:nowrap;font-variant-numeric:tabular-nums}
td.sc{color:var(--orange);white-space:nowrap}
tbody tr:hover{background:var(--panel2)}

/* ============ 项目索引 ============ */
.projects{max-width:1460px;margin:18px auto 0;padding:0 18px}
@media (max-width:760px){.projects{padding:0 12px}}
.proj-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.proj-head h2{margin:0;font-size:14px;font-weight:650}
.proj-head small{color:var(--muted);font-weight:400;font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{
  border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:999px;
  padding:4px 12px;font-size:12px;transition:.13s;
}
.tab:hover{color:var(--text);border-color:var(--accent)}
.tab.on{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:8px}
.pitem{
  background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:9px 11px;
  cursor:pointer;transition:.13s;position:relative;overflow:hidden;
}
.pitem:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.25)}
.pitem .pname{font-size:12.8px;font-weight:550;display:flex;align-items:center;gap:6px}
.pitem .ppath{font-size:10.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.pitem .badge{font-size:9.5px;padding:0 4px;border-radius:3px;background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green);font-weight:600}

/* ============ toast ============ */
#toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:9px 16px;
  font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.45);transition:.22s;z-index:99;max-width:90vw;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

footer{max-width:1460px;margin:26px auto 0;padding:14px 18px 0;border-top:1px solid var(--border);color:var(--muted);font-size:11.5px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hidden{display:none !important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="brand"><span class="dot"></span>洪老师 · 个人总工作台 <small id="modeTag"></small></div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="搜项目 / 应用 / 指令…  (按 / 聚焦)">
    </div>
    <div class="acts">
      <button id="btnTheme">亮色</button>
      <button id="btnExport">备份</button>
      <button id="btnImport">恢复</button>
      <input type="file" id="fileIn" accept="application/json" class="hidden">
    </div>
  </div>
  <div class="subline">
    <span id="dateLine"></span>
    <span>待办 <b id="todoCount">0</b> 条</span>
    <span>项目 <b id="projCount">0</b> 个</span>
    <span>链接库 <b>5</b> 篇已学</span>
  </div>
</header>

<main>
  <!-- 左列 -->
  <div class="col">
    <div class="panel">
      <h2>我的应用 <span class="tag">线上成品</span></h2>
      <div class="body tight" id="appList"></div>
    </div>
    <div class="panel">
      <h2>常用网站 <span class="tag">点开即用</span></h2>
      <div class="body"><div class="chips" id="siteList"></div></div>
    </div>
  </div>

  <!-- 中列 -->
  <div class="col">
    <div class="panel">
      <h2>今日待办 <span class="tag" id="todoTag"></span></h2>
      <form class="todo-form" id="todoForm">
        <input id="todoInput" placeholder="加一条，回车确认" autocomplete="off">
        <button type="submit">加</button>
      </form>
      <ul class="todos" id="todoList"></ul>
    </div>
    <div class="panel">
      <h2>常用指令 <span class="tag">点标题展开 · 右侧复制</span></h2>
      <div class="body" id="promptList"></div>
    </div>
  </div>

  <!-- 右列 -->
  <div class="col">
    <div class="panel">
      <h2>链接库 · 已学 5 篇 <span class="tag">飞书文档</span></h2>
      <div class="body" id="docList"></div>
    </div>
    <div class="panel">
      <h2>私有网盘 · 10 种方案 <span class="tag">点表头排序</span></h2>
      <div class="body tight">
        <div class="tbl-wrap">
          <table id="nasTable">
            <thead><tr><th data-k="n">方案</th><th data-k="mem">内存</th><th data-k="sc">适合</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<section class="projects">
  <div class="proj-head">
    <h2>项目索引 <small id="projHint"></small></h2>
    <div class="tabs" id="catTabs"></div>
  </div>
  <div class="pgrid" id="projGrid"></div>
</section>

<footer>
  <span>数据存浏览器本地 · 换机或清缓存会丢，记得每月点「备份」</span>
  <span id="savedAt"></span>
</footer>

<div id="toast"></div>

<script>
/* =========================================================
   0. 基础
   ========================================================= */
const LOCAL = location.protocol === 'file:';

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('show'), 1900);
}
function copy(text){
  const done = ()=>toast('已复制');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动选中'); }
    document.body.removeChild(ta);
  }
}

  {n:'① 按规范建项目文件夹', t:`按我的「Agent 任务标准化管理规范」办事：

/* =========================================================
   2. 状态
   ========================================================= */
const DEFAULT_TODOS = [
  {t:'把「待办事项」飞书文档更新到 10 月（还停在 9/01）', d:false},
  {t:'给 Agent 指令库存第 2 条任务（现在只有「打开计算器」）', d:false},
  {t:'资源链接总表还空着，把工作台 16 条常用网站录进去', d:false},
  {t:'教师工作台浏览器数据备份一次（换机会丢）', d:false}
];
let ST = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {todos: DEFAULT_TODOS.map(x=>({...x})), theme:'dark', savedAt:''};
}
function save(){
  ST.savedAt = new Date().toLocaleString('zh-CN',{hour12:false});
  try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){}
  $('#savedAt').textContent = '最后保存 ' + ST.savedAt;
}

/* =========================================================
   3. 渲染
   ========================================================= */
function renderApps(){
  const box = $('#appList');
  box.innerHTML = APPS.map(a=>{
    const href = a.u || (LOCAL ? 'file:///' + encodeURI((ROOT + a.p).replace(/\\/g,'/')) : '');
    return `<a class="card" data-search="${a.n} ${a.d}" data-href="${a.u||''}" data-path="${a.p||''}">
      <span class="mark">${a.k}</span>
      <span><span class="t">${a.n}</span><span class="d">${a.d}</span></span>
    </a>`;
  }).join('');
  box.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click', e=>{
      const url = el.dataset.href;
      const path = el.dataset.path;
      if(url){ return; }             // 外链走默认跳转
      e.preventDefault();
      if(LOCAL){ window.location.href = 'file:///' + encodeURI((ROOT + path).replace(/\\/g,'/')); }
      else { copy(ROOT + path); toast('已复制本地路径，粘到资源管理器打开'); }
    });
  });
  if(!LOCAL){
    box.querySelectorAll('.card').forEach(el=>{ if(!el.dataset.href) el.removeAttribute('href'); });
    $('#modeTag').textContent = '· 线上模式（本地路径只能复制）';
  } else {
    $('#modeTag').textContent = '· 本地模式（可直达文件夹）';
  }
}

function renderSites(){
  $('#siteList').innerHTML = SITES.map(([n,u])=>`<a class="chip" href="${u}" target="_blank" rel="noopener">${n}</a>`).join('');
}

function renderTodos(){
  const list = $('#todoList');
  const arr = ST.todos;
  if(!arr.length){ list.innerHTML = '<div class="empty">还没有待办，上面加一条</div>'; }
  else {
    list.innerHTML = arr.map((x,i)=>`<li class="${x.d?'done':''}" data-i="${i}">
      <button class="cb" aria-label="勾选">✓</button>
      <span class="txt">${escapeHtml(x.t)}</span>
      <button class="del" aria-label="删除">×</button></li>`).join('');
  }
  const left = arr.filter(x=>!x.d).length;
  $('#todoCount').textContent = left;
  $('#todoTag').textContent = left ? `剩 ${left} 条` : '全部完成';
  list.querySelectorAll('li').forEach(li=>{
    const i = +li.dataset.i;
    li.querySelector('.cb').onclick = ()=>{ ST.todos[i].d = !ST.todos[i].d; save(); renderTodos(); };
    li.querySelector('.del').onclick = ()=>{ ST.todos.splice(i,1); save(); renderTodos(); };
  });
}

function renderPrompts(){
  $('#promptList').innerHTML = PROMPTS.map((p,i)=>`<div class="prompt" data-search="${p.n}">
    <div class="ph"><span class="pn">${p.n}</span><button class="cp" data-i="${i}">复制</button></div>
    <pre>${escapeHtml(p.t)}</pre>
  </div>`).join('');
  const wrap = $('#promptList');
  wrap.querySelectorAll('.prompt .ph .pn').forEach(n=>{
    n.onclick = ()=> n.closest('.prompt').classList.toggle('open');
  });
  wrap.querySelectorAll('.cp').forEach(b=>{
    b.onclick = e=>{ e.stopPropagation(); copy(PROMPTS[+b.dataset.i].t); };
  });
}

function renderDocs(){
  $('#docList').innerHTML = DOCS.map(d=>`<div class="doc" data-search="${d.n} ${d.d}">
    <div class="dt">${d.n}<span class="lvl">${d.lvl}</span></div>
    <div class="dm">${d.d}</div>
    <ul>${d.pts.map(p=>`<li>${p}</li>`).join('')}</ul>
    <div class="lnk"><a href="${d.u}" target="_blank" rel="noopener">打开飞书原文</a></div>
  </div>`).join('');
}

let nasSort = {k:'m', asc:true};
function renderNas(){
  const tb = $('#nasTable tbody');
  const data = [...NAS].sort((a,b)=>{
    const k = nasSort.k;
    let r;
    if(k==='m') r = a.m - b.m;
    else r = String(a[k]).localeCompare(String(b[k]),'zh');
    return nasSort.asc ? r : -r;
  });
  tb.innerHTML = data.map(x=>`<tr data-search="${x.n} ${x.sc}"><td>${x.n}</td><td class="mem">${x.mem}</td><td class="sc">${x.sc}</td></tr>`).join('');
}
document.querySelectorAll('#nasTable th').forEach(th=>{
  th.onclick = ()=>{
    const k = th.dataset.k;
    nasSort.asc = (nasSort.k===k) ? !nasSort.asc : true;
    nasSort.k = k;
    renderNas();
  };
});

function renderProjects(cat){
  const grid = $('#projGrid');
  const cats = PROJECTS.map(p=>p.c);
  $('#catTabs').innerHTML = cats.map(c=>`<button class="tab ${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('');
  $('#catTabs').querySelectorAll('.tab').forEach(b=>{
    b.onclick = ()=> renderProjects(b.dataset.c);
  });
  const group = PROJECTS.find(p=>p.c===cat) || PROJECTS[0];
  grid.innerHTML = group.items.map(([n,p,open])=>`
    <div class="pitem" data-search="${n} ${p}" data-p="${p}" data-open="${open?1:0}">
      <div class="pname">${n}${open?'<span class="badge">可用</span>':''}</div>
      <div class="ppath">${p}</div>
    </div>`).join('');
  grid.querySelectorAll('.pitem').forEach(el=>{
    el.onclick = ()=>{
      const p = el.dataset.p;
      const isOpen = el.dataset.open === '1';
      if(LOCAL){
        window.location.href = 'file:///' + encodeURI((ROOT + p).replace(/\\/g,'/') + (isOpen?'\\index.html':''));
      } else {
        copy(ROOT + p); toast('已复制路径');
      }
    };
  });
  const total = PROJECTS.reduce((s,p)=>s+p.items.length,0);
  $('#projCount').textContent = total;
  $('#projHint').textContent = `共 ${total} 个 · ${LOCAL?'点击直达':'点击复制路径'}`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* =========================================================
   4. 交互
   ========================================================= */
$('#todoForm').addEventListener('submit', e=>{
  e.preventDefault();
  const v = $('#todoInput').value.trim();
  if(!v) return;
  ST.todos.unshift({t:v, d:false});
  $('#todoInput').value = '';
  save(); renderTodos();
});

$('#q').addEventListener('input', e=>{
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('[data-search]').forEach(el=>{
    const hit = !q || el.dataset.search.toLowerCase().includes(q);
    el.classList.toggle('hidden', !hit);
  });
  if(q){
    document.querySelectorAll('.panel').forEach(p=>{
      const any = [...p.querySelectorAll('[data-search]')].some(x=>!x.classList.contains('hidden'));
      p.classList.toggle('hidden', !any && p.querySelectorAll('[data-search]').length>0);
    });
  } else {
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('hidden'));
  }
});
document.addEventListener('keydown', e=>{
  if(e.key === '/' && document.activeElement.tagName !== 'INPUT'){
    e.preventDefault(); $('#q').focus();
  }
  if(e.key === 'Escape'){ $('#q').value = ''; $('#q').dispatchEvent(new Event('input')); }
});

$('#btnTheme').onclick = ()=>{
  document.body.classList.toggle('light');
  const light = document.body.classList.contains('light');
  ST.theme = light ? 'light' : 'dark';
  $('#btnTheme').textContent = light ? '暗色' : '亮色';
  save();
};

$('#btnExport').onclick = ()=>{
  const blob = new Blob([JSON.stringify(ST,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `工作台备份_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  toast('已导出备份文件');
};
$('#btnImport').onclick = ()=> $('#fileIn').click();
$('#fileIn').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      const obj = JSON.parse(fr.result);
      if(!obj.todos) throw new Error('格式不对');
      ST = obj; save(); boot(); toast('已恢复');
    }catch(err){ toast('文件读不了，确认是备份 JSON'); }
  };
  fr.readAsText(f);
};

/* =========================================================
   5. 启动
   ========================================================= */
function boot(){
  renderApps(); renderSites(); renderTodos(); renderPrompts();
  renderDocs(); renderNas(); renderProjects('教学课堂');
  if(ST.theme === 'light'){ document.body.classList.add('light'); $('#btnTheme').textContent = '暗色'; }
  const now = new Date();
  const wd = ['日','一','二','三','四','五','六'][now.getDay()];
  $('#dateLine').textContent = `${now.getFullYear()} 年 ${now.getMonth()+1} 月 ${now.getDate()} 日 · 周${wd}`;
  if(ST.savedAt) $('#savedAt').textContent = '最后保存 ' + ST.savedAt;
}
boot();
</script>
