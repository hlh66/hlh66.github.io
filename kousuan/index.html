<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乘法口诀练习 · 60 秒挑战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;min-height:100vh;color:#334155;
  background:linear-gradient(135deg,#ff9a56 0%,#ff6b95 55%,#a855f7 100%);background-attachment:fixed}
.container{max-width:760px;margin:0 auto;padding:16px}
.header{text-align:center;padding:20px 12px 8px;color:#fff}
.header h1{font-size:1.9em;font-weight:800;text-shadow:2px 2px 6px rgba(0,0,0,.25)}
.header p{margin-top:6px;font-size:.9em;color:rgba(255,255,255,.92)}

.modes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.mode{padding:9px 18px;border-radius:22px;border:2px solid rgba(255,255,255,.65);background:transparent;
  color:#fff;font-size:.88em;font-family:inherit;font-weight:700;cursor:pointer;transition:.2s}
.mode.on{background:#fff;color:#e11d48;border-color:#fff}

.panel{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 28px rgba(0,0,0,.16);margin-bottom:16px}
.stats{display:flex;gap:10px;margin-bottom:16px}
.stat{flex:1;text-align:center;background:#f8fafc;border-radius:12px;padding:10px 6px}
.stat .lb{font-size:.72em;color:#94a3b8;margin-bottom:3px}
.stat .vl{font-size:1.35em;font-weight:800;color:#1e293b}
.stat.hot .vl{color:#e11d48}

.qbox{text-align:center;padding:10px 0 4px}
.qtext{font-size:3em;font-weight:800;color:#1e293b;letter-spacing:2px;line-height:1.3}
.qtext .eq{color:#a855f7}
#ans{width:150px;font-size:2em;text-align:center;font-weight:800;padding:10px;border:3px solid #e2e8f0;border-radius:14px;
  outline:none;font-family:inherit;color:#1e293b;background:#f8fafc}
#ans:focus{border-color:#a855f7;background:#fff}
.tf{height:26px;text-align:center;font-size:1em;font-weight:700;margin-top:8px}
.tf.ok{color:#059669}.tf.no{color:#e11d48}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.keypad button{padding:14px;font-size:1.25em;font-weight:800;border-radius:12px;border:none;background:#f1f5f9;color:#334155;cursor:pointer;font-family:inherit}
.keypad button:active{background:#e2e8f0}
.keypad .ok{background:linear-gradient(135deg,#34d399,#10b981);color:#fff}
.keypad .del{background:#fef3c7;color:#b45309}

.start{width:100%;padding:16px;font-size:1.1em;font-weight:800;color:#fff;border:none;border-radius:14px;
  background:linear-gradient(135deg,#e11d48,#a855f7);cursor:pointer;font-family:inherit;box-shadow:0 6px 18px rgba(225,29,72,.3)}
.start:active{transform:scale(.985)}

.wrong{background:rgba(255,255,255,.95);border-radius:18px;padding:18px;margin-bottom:16px}
.wrong h3{font-size:1em;color:#1e293b;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.wrong h3 button{font-size:.75em;padding:6px 12px;border-radius:9px;border:none;background:#fee2e2;color:#b91c1c;cursor:pointer;font-family:inherit;font-weight:700}
.wlist{display:flex;flex-wrap:wrap;gap:8px}
.witem{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:8px 12px;font-size:.9em;font-weight:700}
.witem small{color:#f87171;font-weight:400;margin-left:4px}
.empty{color:#94a3b8;font-size:.88em}

.table-wrap{background:rgba(255,255,255,.95);border-radius:18px;padding:16px;margin-bottom:16px;overflow-x:auto}
.table-wrap h3{font-size:1em;color:#1e293b;margin-bottom:10px}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:.82em}
td,th{border:1px solid #e2e8f0;padding:6px 4px;text-align:center;color:#475569}
th{background:#f8fafc;color:#1e293b;font-weight:700}
td.hd{background:#f8fafc;font-weight:700;color:#7c3aed}
.back{display:block;text-align:center;color:#fff;text-decoration:none;padding:12px;font-size:.92em;opacity:.92}
@media(max-width:480px){.qtext{font-size:2.3em}#ans{width:120px;font-size:1.7em}.header h1{font-size:1.55em}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚡ 乘法口诀 60 秒</h1>
    <p>看谁算得又快又准</p>
  </div>

  <div class="modes">
    <button class="mode on" data-max="5">2~5 口诀</button>
    <button class="mode" data-max="9">6~9 口诀</button>
    <button class="mode" data-max="9" data-all="1">全部</button>
  </div>

  <div class="panel">
    <div class="stats">
      <div class="stat"><div class="lb">时间</div><div class="vl" id="time">60</div></div>
      <div class="stat hot"><div class="lb">答对</div><div class="vl" id="score">0</div></div>
      <div class="stat"><div class="lb">连对</div><div class="vl" id="streak">0</div></div>
      <div class="stat"><div class="lb">正确率</div><div class="vl" id="acc">--</div></div>
    </div>

    <div class="qbox">
      <div class="qtext" id="qtext">准备好了吗？</div>
      <div style="margin-top:12px"><input id="ans" inputmode="numeric" autocomplete="off" placeholder="?" disabled></div>
      <div class="tf" id="tf"></div>
    </div>

    <div class="keypad" id="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="del" class="del">⌫</button><button data-k="0">0</button><button data-k="ok" class="ok">✓</button>
    </div>

    <div style="margin-top:14px"><button class="start" id="startBtn">开始挑战（60 秒）</button></div>
    <div style="text-align:center;font-size:.78em;color:#94a3b8;margin-top:10px" id="best"></div>
  </div>

  <div class="wrong">
    <h3><span>❌ 我的错题本</span><button id="clearWrong">清空</button></h3>
    <div class="wlist" id="wlist"><span class="empty">还没有错题，厉害！</span></div>
  </div>

  <div class="table-wrap">
    <h3>📖 乘法口诀表（点一点可以看答案意象）</h3>
    <table id="kjTable"></table>
  </div>

  <a class="back" href="../">← 返回学习主页</a>
</div>

<script>
const $=id=>document.getElementById(id);
let maxNum=5, running=false, timer=null, left=60, score=0, total=0, streak=0, best=0;
let cur={a:0,b:0,ans:0};
let wrongs=JSON.parse(localStorage.getItem('ks_wrong')||'{}');

/* 口诀文字 */
function kj(a,b){
  const s=Math.min(a,b),l=Math.max(a,b),p=['','一','二','三','四','五','六','七','八','九'];
  const r=s*l, head=(s===1?'':p[s])+p[l];
  if(r<10)return head+'得'+p[r];
  if(r===10)return head+'一十';
  const sh=Math.floor(r/10),ge=r%10;
  let t=(sh===1?'十':p[sh]+'十');
  if(ge>0)t+=p[ge];
  return head+t;
}

/* 模式切换 */
document.querySelectorAll('.mode').forEach(btn=>{
  btn.onclick=()=>{
    if(running)return;
    document.querySelectorAll('.mode').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    maxNum=Number(btn.dataset.max);
    $('tf').textContent='';
  };
});

function nextQ(){
  let a,b;
  if(maxNum===5){a=2+Math.floor(Math.random()*4);b=2+Math.floor(Math.random()*8);}
  else{a=2+Math.floor(Math.random()*8);b=2+Math.floor(Math.random()*8);}
  cur={a,b,ans:a*b};
  $('qtext').innerHTML=`${a} × ${b} <span class="eq">=</span> ?`;
  $('ans').value='';
  $('ans').focus();
}

function submit(){
  if(!running)return;
  const v=$('ans').value.trim();
  if(v==='')return;
  total++;
  if(Number(v)===cur.ans){
    score++;streak++;
    $('tf').className='tf ok';
    $('tf').textContent = streak>4 ? ('🔥 连对 '+streak+' 题！') : '✓ 对了';
  }else{
    streak=0;
    $('tf').className='tf no';
    $('tf').textContent=`✗ 应该是 ${cur.ans}（${kj(cur.a,cur.b)}）`;
    const k=cur.a+'x'+cur.b;
    wrongs[k]=(wrongs[k]||0)+1;
    localStorage.setItem('ks_wrong',JSON.stringify(wrongs));
    renderWrong();
  }
  $('score').textContent=score;
  $('streak').textContent=streak;
  $('acc').textContent=Math.round(score/total*100)+'%';
  nextQ();
}

function start(){
  if(running)return;
  running=true;left=60;score=0;total=0;streak=0;
  $('score').textContent=0;$('streak').textContent=0;$('acc').textContent='--';
  $('ans').disabled=false;$('startBtn').textContent='挑战中…';
  $('startBtn').style.opacity='.6';
  nextQ();
  timer=setInterval(()=>{
    left--;$('time').textContent=left;
    if(left<=0)stop();
  },1000);
}

function stop(){
  clearInterval(timer);running=false;
  $('ans').disabled=true;
  $('startBtn').textContent='再来一次（60 秒）';
  $('startBtn').style.opacity='1';
  $('qtext').innerHTML='⏰ 时间到！';
  $('tf').textContent=`本轮答对 ${score} 题，正确率 ${total?Math.round(score/total*100):0}%`;
  const prev=Number(localStorage.getItem('ks_best')||0);
  if(score>prev){localStorage.setItem('ks_best',score);$('best').textContent=`🏆 新纪录！最高分 ${score} 题`;}
  else $('best').textContent=`🏆 最高纪录：${prev} 题`;
}

$('startBtn').onclick=start;
$('ans').addEventListener('keydown',e=>{if(e.key==='Enter')submit();});

/* 键盘数字块 */
document.querySelectorAll('#keypad button').forEach(btn=>{
  btn.onclick=()=>{
    const k=btn.dataset.k;
    if(k==='ok'){submit();return;}
    if(k==='del'){$('ans').value=$('ans').value.slice(0,-1);return;}
    $('ans').value=($('ans').value+k).slice(0,3);
  };
});

/* 错题本 */
function renderWrong(){
  const keys=Object.keys(wrongs).sort((x,y)=>wrongs[y]-wrongs[x]).slice(0,14);
  const box=$('wlist');
  if(!keys.length){box.innerHTML='<span class="empty">还没有错题，厉害！</span>';return;}
  box.innerHTML=keys.map(k=>{
    const [a,b]=k.split('x');
    return `<span class="witem">${a}×${b}=${a*b}<small>错 ${wrongs[k]} 次</small></span>`;
  }).join('');
}
renderWrong();
$('clearWrong').onclick=()=>{wrongs={};localStorage.setItem('ks_wrong','{}');renderWrong();};

/* 口诀表 */
(function(){
  const t=$('kjTable');
  let h='<tr><th></th>';for(let i=2;i<=9;i++)h+=`<th>${i}</th>`;h+='</tr>';
  for(let i=2;i<=9;i++){
    h+=`<tr><td class="hd">${i}</td>`;
    for(let j=2;j<=9;j++){
      h+= j<i?`<td style="background:#fafafa"></td>`:`<td>${kj(i,j)}<br><span style="color:#94a3b8">${i}×${j}=${i*j}</span></td>`;
    }
    h+='</tr>';
  }
  t.innerHTML=h;
})();

const b=Number(localStorage.getItem('ks_best')||0);
if(b)$('best').textContent=`🏆 最高纪录：${b} 题`;
</script>
</body>
</html>
