.step{display:flex;gap:15px;margin-bottom:15px;align-items:flex-start;padding:12px;background:#f8f9fa;border-radius:10px;transition:all .3s}

.step-num{counter-increment:step;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;flex-shrink:0}

/* 淇℃伅鍗＄墖 */

</style>

<script>
const questions = [
  {q:'2 脳 6 = ?', a:'12锛佷簩鍏崄浜岋紒'},
  {q:'3 脳 5 = ?', a:'15锛佷笁浜斿崄浜旓紒'},
  {q:'4 脳 7 = ?', a:'28锛佸洓涓冧簩鍗佸叓锛?},
  {q:'5 脳 8 = ?', a:'40锛佷簲鍏洓鍗侊紒'},
  {q:'6 脳 6 = ?', a:'36锛佸叚鍏笁鍗佸叚锛?},
  {q:'3 脳 9 = ?', a:'27锛佷笁涔濅簩鍗佷竷锛?},
  {q:'4 脳 4 = ?', a:'16锛佸洓鍥涘崄鍏紒'},
  {q:'7 脳 8 = ?', a:'56锛佷竷鍏簲鍗佸叚锛?},
];
let qIdx = 0;

function newQuestion() {
  qIdx = (qIdx + 1) % questions.length;
  const card = document.getElementById('projectorCard');
  card.classList.remove('show-answer');
  document.getElementById('qText').textContent = questions[qIdx].q;
  document.getElementById('aText').textContent = questions[qIdx].a;
  // 閲嶇疆瀛︾敓
  document.querySelectorAll('.student').forEach(s => {
    s.classList.remove('raised', 'correct');
  });
}

function showAnswer() {
  document.getElementById('projectorCard').classList.add('show-answer');
}

function raiseHand(el) {
  el.classList.toggle('raised');
  if (el.classList.contains('raised')) {
    setTimeout(() => {
      if (el.classList.contains('raised')) el.classList.add('correct');
    }, 300);
  }
}

let autoTimer = null;
function autoDemo() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; return; }
  let step = 0;
  autoTimer = setInterval(() => {
    step++;
    if (step === 1) newQuestion();
    else if (step === 2) {
      // 闅忔満閫夊嚑涓鐢熶妇鎵?
      const students = document.querySelectorAll('.student');
      students.forEach((s, i) => {
        if (Math.random() > 0.5) setTimeout(() => raiseHand(s), i * 200);
      });
    } else if (step === 3) showAnswer();
    else if (step === 4) {
      clearInterval(autoTimer);
      autoTimer = null;
      step = 0;
    }
  }, 1500);
}
</script>
