<style>
*{margin:0;padding:0;box-sizing:border-box}

/* 涓夊浗鏉€鎴樺満 */

.skill-card:hover{transform:translateY(-5px) scale(1.05)}
.skill-card.s1{background:linear-gradient(135deg,#e74c3c,#c0392b)} /* 浜ゆ崲寰嬪弽鍑?*/

.btn-row{display:flex;justify-content:center;gap:12px;margin-top:15px;flex-wrap:wrap}

.step-num{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#eb3349,#f45c43);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px;flex-shrink:0}

</style>

<!-- 鍩烘湰淇℃伅 -->

<script>
const warDeck = [
  {e:'1脳2',r:2},{e:'2脳3',r:6},{e:'3脳4',r:12},{e:'4脳5',r:20},
  {e:'5脳6',r:30},{e:'3脳5',r:15},{e:'4脳6',r:24},{e:'5脳7',r:35},
  {e:'6脳7',r:42},{e:'4脳7',r:28},{e:'5脳8',r:40},{e:'6脳8',r:48},
  {e:'3脳8',r:24},{e:'4脳9',r:36},{e:'5脳9',r:45},{e:'6脳9',r:54},
  {e:'7脳8',r:56},{e:'8脳9',r:72},{e:'5脳5',r:25},{e:'6脳6',r:36},
];
const skills = ['馃棥锔忎氦鎹㈠緥鍙嶅嚮','馃洝锔忎節涔濇姢鐩?,'鈿″緱瀛楃獊琚?,'馃挘濉┖闄烽槺'];

let handA = 5, handB = 5;
let currentMax = 0;
let roundNum = 0;

function battleRound() {
  const ca = warDeck[Math.floor(Math.random() * warDeck.length)];
  const cb = warDeck[Math.floor(Math.random() * warDeck.length)];
  
  // 闅忔満瑙﹀彂鎶€鑳?
  const useSkill = Math.random() > 0.7;
  const skillName = skills[Math.floor(Math.random() * skills.length)];
  
  const area = document.getElementById('playedArea');
  
  if (roundNum === 0 || ca.r > currentMax) {
    area.innerHTML = `
      <div class="war-card card-a ${ca.r > (currentMax||0) ? 'winner' : ''}">
        ${useSkill ? '<div class="skill-tag">' + skillName + '</div>' : ''}
        <div class="w-expr">${ca.e}</div>
        <div class="w-result">=${ca.r}</div>
      </div>
      <div class="vs-badge">VS</div>
      <div class="war-card card-b">
        <div class="w-expr">${cb.e}</div>
        <div class="w-result">=${cb.r}</div>
      </div>`;
    
    let logText = '';
    if (ca.r > cb.r) {
      logText = `鈿旓笍 绗?{roundNum+1}杞細A鍑?[${ca.e}=${ca.r}] vs B鍑?[${cb.e}=${cb.r}] 鈫?<span style="color:#3498db">A鑳滐紒${ca.r}>${cb.r}</span>`;
      handA++; handB--;
      currentMax = ca.r;
    } else if (cb.r > ca.r && cb.r > currentMax) {
      logText = `鈿旓笍 绗?{roundNum+1}杞細A鍑?[${ca.e}=${ca.r}] vs B鍑?[${cb.e}=${cb.r}] 鈫?<span style="color:#e74c3c">B鑳滐紒${cb.r}>${ca.r}</span>`;
      handA--; handB++;
      currentMax = cb.r;
    } else {
      logText = `鈿旓笍 绗?{roundNum+1}杞細A鍑?[${ca.e}=${ca.r}] vs B鍑?[${cb.e}=${cb.r}] 鈫?<span style="color:#ffa502">B鏃犳硶瓒呰秺锛岃烦杩囷紒</span>`;
      handB--;
    }
    if (useSkill) logText += ` <span style="color:#f39c12">[${skillName}]</span>`;
    
    addLog(logText);
  } else {
    addLog(`鈿旓笍 A娌℃湁鏇村ぇ鐨勭墝浜嗭紝<span style="color:#e74c3c">璺宠繃鍥炲悎</span>`);
    handA--;
  }
  
  document.getElementById('handA').textContent = handA;
  document.getElementById('handB').textContent = handB;
  roundNum++;
}

function addLog(text) {
  const log = document.getElementById('battleLog');
  log.innerHTML = `<div class="log-entry">${text}</div>` + log.innerHTML;
}

let autoTimer = null;
function autoBattle() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; return; }
  resetBattle();
  autoTimer = setInterval(() => {
    battleRound();
    if (roundNum >= 5 || handA <= 0 || handB <= 0) {
      clearInterval(autoTimer);
      autoTimer = null;
      declareWinner();
    }
  }, 1500);
}

function resetBattle() {
  if (autoTimer) clearInterval(autoTimer);
  handA = 5; handB = 5; currentMax = 0; roundNum = 0;
  document.getElementById('handA').textContent = handA;
  document.getElementById('handB').textContent = handB;
  document.getElementById('playedArea').innerHTML = '<div style="color:#666;font-size:14px">鐐瑰嚮涓嬫柟鎸夐挳寮€濮嬪鎴?..</div>';
  document.getElementById('battleLog').innerHTML = '';
}

function declareWinner() {
  if (handA > handB) addLog('馃弳 <span style="color:#3498db;font-size:16px">鐜╁A 鑾峰緱鏈€缁堣儨鍒╋紒</span>');
  else if (handB > handA) addLog('馃弳 <span style="color:#e74c3c;font-size:16px">鐜╁B 鑾峰緱鏈€缁堣儨鍒╋紒</span>');
  else addLog('馃 <span style="color:#ffa502;font-size:16px">骞冲眬锛佹棗榧撶浉褰擄紒</span>');
}
</script>
