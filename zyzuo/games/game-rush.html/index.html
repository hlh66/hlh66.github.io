<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⏱️ 乘法口诀限时抢答（班级投影版）</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'Microsoft YaHei','微软雅黑',Arial,sans-serif;
            background:linear-gradient(135deg,#ff0844 0%,#ffb199 100%);
            min-height:100vh;padding:15px;display:flex;flex-direction:column;align-items:center;
        }
        .header{text-align:center;color:white;margin-bottom:10px;}
        .header h1{font-size:clamp(24px,3.5vw,36px);text-shadow:3px 3px 6px rgba(0,0,0,0.3);}
        .header p{font-size:clamp(12px,1.8vw,16px);opacity:0.95;margin-top:4px;}

        /* 模式 */
        .mode-bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
        .mode-tab{
            padding:7px 16px;border:2px solid rgba(255,255,255,0.6);background:transparent;
            color:white;border-radius:16px;font-size:clamp(11px,1.5vw,14px);cursor:pointer;transition:all 0.25s;
        }
        .mode-tab.active{background:white;color:#c92a2a;font-weight:900;}
        .mode-tab:hover:not(.active){background:rgba(255,255,255,0.18);}

        /* 控制面板 */
        .ctrl-panel{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:800px;width:100%;margin-bottom:10px;}
        .cg{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.97);padding:8px 14px;border-radius:12px;}
        .cg label{font-size:clamp(12px,1.6vw,15px);color:#555;font-weight:bold;white-space:nowrap;}
        select{padding:8px 12px;border:2px solid #ddd;border-radius:10px;font-size:clamp(13px,1.7vw,16px);outline:none;font-weight:bold;}
        select:focus{border-color:#ff0844;}
        button{
            padding:10px 22px;border:none;border-radius:12px;font-size:clamp(13px,1.7vw,17px);
            font-weight:bold;cursor:pointer;transition:all 0.25s;color:white;letter-spacing:1px;
        }
        .btn-go{background:linear-gradient(135deg,#51cf66,#2b8a3e);font-size:clamp(16px,2.2vw,22px);padding:14px 36px;}
        .btn-pause{background:linear-gradient(135deg,#fcc419,#e67700);}
        .btn-reset{background:linear-gradient(135deg,#ff8787,#c92a2a);}
        .btn-skip{background:linear-gradient(135deg,#74c0fc,#339af0);}
        button:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,0.25);}

        /* 状态栏 */
        .big-status{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;background:rgba(255,255,255,0.97);padding:14px 24px;border-radius:18px;margin-bottom:10px;box-shadow:0 6px 20px rgba(0,0,0,0.2);}
        .bs-item{text-align:center;min-width:75px;}
        .bs-label{font-size:clamp(11px,1.5vw,14px);color:#888;font-weight:bold;}
        .bs-val{font-size:clamp(26px,4vw,40px);font-weight:900;}
        .v-ok{color:#2b8a3e;} .v-ng{color:#c92a2a;} .v-fire{color:#e67700;} .v-rnd{color:#9c36b5;} .v-tm{color:#1971c2;}

        /* 主答题区 */
        .quiz-stage{
            width:100%;max-width:850px;background:white;border-radius:28px;
            padding:clamp(20px,3vw,40px);box-shadow:0 10px 40px rgba(0,0,0,0.2);margin-bottom:10px;position:relative;overflow:hidden;
        }

        /* 题号条 */
        .round-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:3px dashed #eee;}
        .rn{font-size:clamp(15px,2vw,21px);font-weight:bold;color:#999;}
        .rp{width:200px;height:10px;background:#eee;border-radius:5px;overflow:hidden;}
        .rf{height:100%;background:linear-gradient(90deg,#ff0844,#ffb199);border-radius:5px;transition:width 0.35s;}

        /* 超大算式 */
        .mega-f{text-align:center;padding:clamp(22px,4vw,42px);background:linear-gradient(135deg,#fff5f5,#fff0f0);border-radius:22px;border:5px solid #ffccc7;margin-bottom:16px;position:relative;}
        .ft{font-size:clamp(46px,9vw,100px);font-weight:900;color:#333;letter-spacing:6px;line-height:1.3;}
        .ft .na{color:#e64980;} .ft .op{color:#888;margin:0 0.15em;} .ft .nb{color:#1971c2;} .ft .eq{color:#aaa;margin:0 0.15em;}

        /* 倒计时 */
        .cd-ring{
            position:absolute;top:12px;right:12px;width:clamp(60px,8vw,76px);height:clamp(60px,8vw,76px);
            border-radius:50%;display:flex;align-items:center;justify-content:center;
            font-size:clamp(20px,3vw,30px);font-weight:900;z-index:2;
        }
        .cd-n{background:linear-gradient(135deg,#339af0,#1971c2);color:white;box-shadow:0 4px 12px rgba(51,154,240,0.4);}
        .cd-w{background:linear-gradient(135deg,#fcc419,#e67700);color:white;animation:pulse .5s infinite;}
        .cd-d{background:linear-gradient(135deg,#ff6b6b,#c92a2a);color:white;animation:pulse .25s infinite;}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

        /* 四选项（超大）*/
        .opts-area{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
        .obtn{
            padding:clamp(18px,3vw,30px);border:4px solid #eee;border-radius:18px;
            background:white;font-size:clamp(30px,5vw,52px);font-weight:900;
            cursor:pointer;transition:all 0.25s;display:flex;align-items:center;
            justify-content:center;gap:10px;position:relative;
        }
        .obtn:hover:not(.disabled):not(.correct):not(.wrong){border-color:#ff0844;background:#fff0f0;transform:translateY(-3px);box-shadow:0 6px 16px rgba(255,8,68,0.25);}
        .obtn .ol{position:absolute;top:8px;left:12px;font-size:clamp(13px,1.8vw,17px);font-weight:bold;color:#ccc;}
        .obtn.correct{border-color:#51cf66!important;background:#d3f9d8!important;color:#2b8a3e!important;animation:cpBig 0.5s ease;}
        .obtn.wrong{border-color:#ff6b6b!important;background:#ffe3e3!important;color:#c92a2a!important;animation:shBig 0.5s ease;}
        .obtn.disabled{pointer-events:none;opacity:0.55;}
        @keyframes cpBig{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
        @keyframes shBig{0%,100%{transform:translateX(0)}25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}

        /* 反馈 */
        .fb-zone{text-align:center;min-height:clamp(48px,6vw,70px);display:flex;flex-direction:column;align-items:center;justify-content:center;}
        .fb-main{font-size:clamp(26px,4vw,40px);font-weight:900;}
        .fb-ok{color:#2b8a3e;} .fb-ng{color:#c92a2a;}
        .fb-sub{font-size:clamp(17px,2.4vw,23px);color:#666;margin-top:6px;letter-spacing:4px;}

        /* 连击火焰 */
        .sf-badge{position:absolute;top:-14px;right:-14px;font-size:clamp(34px,5vw,52px);animation:fPop .5s cubic-bezier(0.175,0.885,0.32,1.275);pointer-events:none;z-index:5;display:none;}
        @keyframes fPop{from{transform:scale(0)rotate(-25deg);opacity:0}to{transform:scale(1)rotate(0deg);opacity:1}}

        /* 全屏按钮 */
        .fs-btn{position:fixed;bottom:15px;right:15px;padding:12px 18px;background:rgba(0,0,0,0.6);color:white;border:none;border-radius:12px;cursor:pointer;font-size:14px;z-index:100;}

        @media(max-width:600px){body{padding:8px;}.quiz-stage{padding:16px;}.opts-area{grid-template-columns:1fr;gap:10px;}}
    </style>
</head>
<body>

<div class="header"><h1>⏱️ 乘法口诀限时抢答</h1><p>班级投影版 · 选答案 · 大字体 · 倒计时挑战！</p></div>

<div class="mode-bar">
    <button class="mode-tab active" onclick="setM('all')">📚 全部 (45题)</button>
    <button class="mode-tab" onclick="setM('easy')">⭐ 基础 (1-5)</button>
    <button class="mode-tab" onclick="setM('medium')">⚡ 进阶 (6-7)</button>
    <button class="mode-tab" onclick="setM('hard')">🔥 困难 (8-9)</button>
    <button class="mode-tab" onclick="setM('speed15')">⚡ 极速15题</button>
</div>

<div class="ctrl-panel">
    <div class="cg"><label>⏱️ 时间:</label><select id="timeSel"><option value="10">10秒</option><option value="7" selected>7秒</option><option value="5">5秒</option><option value="3">3秒</option></select></div>
    <div class="cg"><label>🎯 题数:</label><select id="qSel"><option value="10">10题</option><option value="15" selected>15题</option><option value="20">20题</option><option value="30">30题</option></select></div>
    <button class="btn-go" id="goBtn" onclick="toggleGo()">▶️ 开始!</button>
    <button class="btn-pause" onclick="pauseG()">⏸️ 暂停</button>
    <button class="btn-skip" onclick="skipQ()">⏭️ 跳过</button>
    <button class="btn-reset" onclick="resetAll()">🔄 重置</button>
</div>

<div class="big-status">
    <div class="bs-item"><div class="bs-label">✅ 正确</div><div class="bs-val v-ok" id="vOk">0</div></div>
    <div class="bs-item"><div class="bs-label">❌ 错误</div><div class="bs-val v-ng" id="vNg">0</div></div>
    <div class="bs-item"><div class="bs-label">🔥 连击</div><div class="bs-val v-fire" id="vFire">0</div></div>
    <div class="bs-item"><div class="bs-label">📊 题目</div><div class="bs-val v-rnd" id="vRnd">1/15</div></div>
    <div class="bs-item"><div class="bs-label">⏱️ 用时</div><div class="bs-val v-tm" id="vTm">0:00</div></div>
</div>

<div class="quiz-stage" id="qStage">
    <div class="cd-ring cd-n" id="cdRing">7</div>
    <div class="sf-badge" id="sfBadge" style="display:none;"></div>

    <div class="round-bar">
        <span class="rn" id="rnDisp">第 1 / 15 题</span>
        <div class="rp"><div class="rf" id="rfFill" style="width:6.67%"></div></div>
    </div>

    <div class="mega-f">
        <div class="ft" id="ftDisp"><span class="na" id="dA">7</span><span class="op">×</span><span class="nb" id="dB">8</span><span class="eq">=</span><span style="color:#e67700;">?</span></div>
    </div>

    <div class="opts-area" id="optsArea"></div>

    <div class="fb-zone">
        <div class="fb-main" id="fbMain"></div>
        <div class="fb-sub" id="fbSub"></div>
    </div>
</div>

<button class="fs-btn" onclick="toggleFS()">⛶ 全屏投影</button>

<script>
const ALL_Q=[
    {a:1,b:1,r:1},{a:1,b:2,r:2},{a:2,b:2,r:4},
    {a:1,b:3,r:3},{a:2,b:3,r:6},{a:3,b:3,r:9},
    {a:1,b:4,r:4},{a:2,b:4,r:8},{a:3,b:4,r:12},{a:4,b:4,r:16},
    {a:1,b:5,r:5},{a:2,b:5,r:10},{a:3,b:5,r:15},{a:4,b:5,r:20},{a:5,b:5,r:25},
    {a:1,b:6,r:6},{a:2,b:6,r:12},{a:3,b:6,r:18},{a:4,b:6,r:24},{a:5,b:6,r:30},{a:6,b:6,r:36},
    {a:1,b:7,r:7},{a:2,b:7,r:14},{a:3,b:7,r:21},{a:4,b:7,r:28},{a:5,b:7,r:35},{a:6,b:7,r:42},{a:7,b:7,r:49},
    {a:1,b:8,r:8},{a:2,b:8,r:16},{a:3,b:8,r:24},{a:4,b:8,r:32},{a:5,b:8,r:40},{a:6,b:8,r:48},{a:7,b:8,r:56},{a:8,b:8,r:64},
    {a:1,b:9,r:9},{a:2,b:9,r:18},{a:3,b:9,r:27},{a:4,b:9,r:36},{a:5,b:9,r:45},{a:6,b:9,r:54},{a:7,b:9,r:63},{a:8,b:9,r:72},{a:9,b:9,r:81}
];
const OL=['A','B','C','D'];

let qs=[],qi=0,ok=0,ng=0,streak=0,maxStreak=0,tLimit=7,cdVal=7,cdT=null,tT=null,running=false,paused=false,answered=false;

function setM(mode){
    document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));
    event.target.classList.add('active');
    switch(mode){
        case'easy':qs=ALL_Q.filter(d=>d.b<=5&&d.a<=d.b);break;
        case'medium':qs=ALL_Q.filter(d=>d.b>=6||d.r>=30);break;
        case'hard':qs=ALL_Q.filter(d=>d.b>=8||[56,63,72,54].includes(d.r));break;
        case'speed15':qs=[...ALL_Q].sort(()=>Math.random()-0.5).slice(0,15);break;
        default:qs=[...ALL_Q];
    }
    resetAll();
}

function resetAll(){
    stopTs();ok=0;ng=0;streak=0;maxStreak=0;qi=0;running=false;paused=false;answered=false;
    updStats();showQ();
    const btn=document.getElementById('goBtn');btn.textContent='▶️ 开始!';btn.className='btn-go';
    document.getElementById('cdRing').className='cd-ring cd-n';document.getElementById('cdRing').textContent=tLimit;
    document.getElementById('sfBadge').style.display='none';
}

function showQ(){
    if(qi>=qs.length){showFinal();return;}
    const q=qs[qi];
    document.getElementById('dA').textContent=q.a;document.getElementById('dB').textContent=q.b;
    document.getElementById('rnDisp').textContent=`第 ${qi+1} / ${qs.length} 题`;
    document.getElementById('rfFill').style.width=((qi+1)/qs.length*100)+'%';
    document.getElementById('vRnd').textContent=`${qi+1}/${qs.length}`;

    const opts=genOpts(q.r);
    const grid=document.getElementById('optsArea');
    grid.innerHTML='';
    opts.forEach((v,i)=>{
        const b=document.createElement('div');
        b.className='obtn';b.innerHTML=`<span class="ol">${OL[i]}</span>${v}`;
        b.dataset.val=v;b.onclick()=>chooseOpt(b,v,q);grid.appendChild(b);
    });
    document.getElementById('fbMain').textContent='';document.getElementById('fbMain').className='fb-main';
    document.getElementById('fbSub').textContent='';answered=false;
}

function genOpts(correct){
    const s=new Set([correct]);
    while(s.size<4){let f=Math.random()>0.5?correct+Math.floor(Math.random()*7)-3:Math.floor(Math.random()*81)+1;if(f>0&&f!==correct&&f<=81)s.add(f);}
    return Array.from(s).sort(()=>Math.random()-0.5);
}

function chooseOpt(btn,val,q){
    if(answered||!running)return;
    answered=true;stopCd();
    document.querySelectorAll('.obtn').forEach(b=>b.classList.add('disabled'));
    if(val===q.r){
        ok++;streak++;if(streak>maxStreak)maxStreak=streak;
        btn.classList.add('correct');
        document.getElementById('fbMain').textContent='✅ 正确！！';document.getElementById('fbMain').className='fb-main fb-ok';
        document.getElementById('fbSub').textContent=`${q.a}×${q.b}=${q.r}`;
        if(streak>=3){
            const bd=document.getElementById('sfBadge');
            bd.textContent=['🔥','💥','⚡','🌟'][Math.min(streak-3,3)]+` ×${streak}`;
            bd.style.display='block';bd.style.animation='none';void bd.offsetWidth;bd.style.animation='fPop .5s cubic-bezier(0.175,0.885,0.32,1.275)';
        }
    }else{
        ng++;streak=0;
        btn.classList.add('wrong');
        document.querySelectorAll('.obtn').forEach(b=>{if(parseInt(b.dataset.val)===q.r)b.classList.add('correct');});
        document.getElementById('fbMain').textContent='❌ 不对...';document.getElementById('fbMain').className='fb-main fb-ng';
        document.getElementById('fbSub').textContent=`正确答案是 ${q.r}`;
    }
    updStats();
    setTimeout(()=>{qi++;if(qi>=qs.length){showFinal()}else{showQ();if(running&&!paused)startCd();}},900);
}

function toggleGo(){if(running){pauseG();return;}running=true;paused=false;
    document.getElementById('goBtn').textContent='⏸️ 进行中...';document.getElementById('goBtn').className='btn-pause';
    if(!tT)tT=setInterval(updTm,1000);startCd();}
function pauseG(){paused=true;running=false;document.getElementById('goBtn').textContent='▶️ 继续';document.getElementById('goBtn').className='btn-go';stopCd();}
function skipQ(){ng++;streak=0;const q=qs[qi];showFb(false,q.r,q,true);updStats();setTimeout(()=>{qi++;showQ();if(running&&!paused)startCd();},1200);}

function startCd(){tLimit=parseInt(document.getElementById('timeSel').value);cdVal=tLimit;updCd();cdT=setInterval(()=>{if(paused)return;cdVal--;updCd();if(cdVal<=0){if(!answered)chooseOpt(null,NaN,qs[qi],true);clearInterval(cdT);}},1000);}
function stopCd(){if(cdT){clearInterval(cdT);cdT=null;}}
function updCd(){const r=document.getElementById('cdRing');r.textContent=cdVal>0?cdVal:'⏰';r.className='cd-ring '+(cdVal<=2?'cd-d':cdVal<=4?'cd-w':'cd-n');}

function stopTs(){stopCd();if(tT){clearInterval(tT);tT=null;}}
function updTm(){const el=document.getElementById('vTm');if(!el.dataset.t0)el.dataset.t0=Date.now();const e=Math.floor((Date.now()-parseInt(el.dataset.t0))/1000);const m=Math.floor(e/60),s=e%60;el.textContent=`${m}:${s.toString().padStart(2,'0')}`;}

function updStats(){document.getElementById('vOk').textContent=ok;document.getElementById('vNg').textContent=ng;document.getElementById('vFire').textContent=streak;}
function showFb(isOk,ans,q,isTimeout){const m=document.getElementById('fbMain'),s=document.getElementById('fbSub');
    m.textContent=isTimeout?'⏰ 时间到！！':'❌ 不对哦...';m.className=`fb-main ${isTimeout?'fb-ng':'fb-ng'}`;s.textContent=`正确答案是${ans}`;}

function showFinal(){
    stopTs();running=false;const total=ok+ng,acc=total>0?Math.round(ok/total*100):0;
    let em,title,msg;
    if(acc>=95){em='🏆';title='完美通关！';msg='你是口诀大师！';}
    else if(acc>=85){em='🥇';title='非常棒！';msg='继续保持！';}
    else if(acc>=70){em='🥈';title='不错哦！';msg='多练习会更好！';}
    else if(acc>=50){em='🥉';title='加油！';msg='还需要多加练习~';}
    else{em='💪';title='继续努力！';msg='别灰心，熟能生巧！';}
    document.getElementById('fbMain').innerHTML=`<span style="font-size:clamp(36px,5vw,56px)">${em}</span>`;
    document.getElementById('fbMain').className='fb-main fb-ok';
    document.getElementById('fbSub').innerHTML=`<strong style="font-size:clamp(20px,2.8vw,28px)">${title}</strong><br><span style="font-size:clamp(15px,2vw,19px)">正确${ok}|错误${ng}|最高连击${maxStreak}|正确率${acc}%</span>`;
    document.getElementById('goBtn').textContent='▶️ 再来一次';document.getElementById('cdRing').style.display='none';
}
function closeFinal(){/*直接重新开始*/}

function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}

// 键盘
document.addEventListener('keydown',e=>{
    if(e.key==='Enter'){/*由点击处理*/});
    const m={'a':0,'b':1,'c':2,'d':3,'A':0,'B':1,'C':2,'D':3,'1':0,'2':1,'3':2,'4':3};
    if(m[e.key]!==undefined&&!answered&&running){const bs=document.querySelectorAll('.obtn');if(bs[m[e.key]])bs[m[e.key]].click();}
});

setM('all');
</script>
</body>
</html>
