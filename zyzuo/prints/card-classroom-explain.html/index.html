<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乘法口诀表 - V7大字版（带解释·全班展示）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
            background: #f5f5f5;
            padding: 10mm;
        }

        .page {
            max-width: 210mm;
            margin: 0 auto;
            background: white;
            padding: 8mm;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .title {
            text-align: center;
            font-size: 24pt;
            color: #333;
            margin-bottom: 3pt;
            font-weight: bold;
        }

        .subtitle {
            text-align: center;
            font-size: 11pt;
            color: #888;
            margin-bottom: 8pt;
            line-height: 1.4;
        }

        /* 说明框 */
        .info-box {
            background: linear-gradient(135deg, #E8F4FD, #D1ECF9);
            border: 2pt solid #4DABF7;
            border-radius: 8pt;
            padding: 6pt 12pt;
            margin-bottom: 10pt;
            font-size: 10pt;
            line-height: 1.6;
            color: #555;
            text-align: center;
        }

        .info-box strong {
            color: #1971C2;
        }

        /* 卡片区 - 单列布局 */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 8pt;
        }

        /* ====== 卡牌样式 - V7大字版（一行一张，带解释）====== */
        .card {
            width: 100%;
            height: 170pt;             /* 超大高度 */
            min-height: 170pt;
            max-height: 170pt;
            border: 4pt solid;
            border-radius: 12pt;
            padding: 12pt 20pt;
            background: white;
            page-break-inside: avoid;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8pt;
            transition: all 0.3s;
        }

        /* 每行不同边框色 */
        .card.row-1 { 
            border-color: #FF6B6B; 
            background: linear-gradient(to right, #FFF5F5, white);
        }
        .card.row-2 { 
            border-color: #FFA94D; 
            background: linear-gradient(to right, #FFF9F0, white);
        }
        .card.row-3 { 
            border-color: #E8C547; 
            background: linear-gradient(to right, #FFFFF0, white);
        }
        .card.row-4 { 
            border-color: #51CF66; 
            background: linear-gradient(to right, #F0FFF5, white);
        }
        .card.row-5 { 
            border-color: #20C997; 
            background: linear-gradient(to right, #F0FFFF, white);
        }
        .card.row-6 { 
            border-color: #339AF0; 
            background: linear-gradient(to right, #F5FAFF, white);
        }
        .card.row-7 { 
            border-color: #5C7CFA; 
            background: linear-gradient(to right, #F5F8FF, white);
        }
        .card.row-8 { 
            border-color: #CC5DE8; 
            background: linear-gradient(to right, #FFF5FE, white);
        }
        .card.row-9 { 
            border-color: #F06595; 
            background: linear-gradient(to right, #FFF0F7, white);
        }

        /* 第一行：算式 + 填空 */
        .top-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15pt;
            flex-shrink: 0;
        }

        .formula {
            font-size: 42pt;
            font-weight: bold;
            color: #333;
            letter-spacing: 3pt;
        }

        .equals-sign {
            font-size: 42pt;
            font-weight: bold;
            color: #999;
        }

        .answer-box {
            width: 90pt;
            height: 50pt;
            border: 4pt dashed #E67E22;
            border-radius: 10pt;
            background: #FFF9F0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32pt;
            font-weight: bold;
            color: #E67E22;
            cursor: pointer;
            transition: all 0.3s;
        }

        .answer-box:hover {
            background: #FFF3E0;
            border-color: #F57C00;
            transform: scale(1.05);
        }

        /* 第二行：圆圈图示 */
        .visual-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 2pt 3pt;
            width: 100%;
            line-height: 1.3;
            place-content: center;
            margin-top: 4pt;
        }

        .circle-group-inline {
            display: inline-flex;
            gap: 1pt;
            align-items: center;
            justify-content: center;
        }

        .circle {
            border-radius: 50%;
            border: 1pt solid rgba(0,0,0,0.25);
            box-shadow: 0 1px 2px rgba(0,0,0,0.12);
            flex-shrink: 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        @media print {
            .circle {
                border: 1pt solid #333 !important;
                box-shadow: none !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .answer-box {
                border: 4pt dashed #666 !important;
                background: white !important;
            }
        }

        /* 圆圈尺寸 - V7适中 */
        .card.has-few .circle { width: 10pt; height: 10pt; }
        .card.has-medium .circle { width: 7pt; height: 7pt; }
        .card.has-many .circle { width: 5.5pt; height: 5.5pt; }
        .card.has-huge .circle { width: 4pt; height: 4pt; }

        .plus-sign {
            font-size: 8pt;
            color: #ccc;
            font-weight: bold;
            margin: 0 2pt;
        }

        /* 第三行：口诀 + 意义 */
        .bottom-row {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 15pt;
            flex-shrink: 0;
            margin-top: 4pt;
            padding-top: 3pt;
            border-top: 1pt dashed #eee;
        }

        .chinese-formula {
            font-size: 16pt;
            font-weight: bold;
            color: #444;
            letter-spacing: 2pt;
        }

        .blank-line {
            display: inline-block;
            min-width: 35pt;
            border-bottom: 3pt solid #E67E22;
            margin: 0 3pt;
            color: transparent;
        }

        .meaning-text {
            font-size: 11pt;
            color: #777;
            line-height: 1.4;
        }

        .meaning-text .highlight {
            color: #1971C2;
            font-weight: bold;
        }

        /* 切换按钮 */
        .toggle-section {
            text-align: center;
            margin: 10pt 0;
        }

        .toggle-btn {
            padding: 10pt 30pt;
            font-size: 13pt;
            background: linear-gradient(135deg, #4DABF7, #228BE6);
            color: white;
            border: none;
            border-radius: 25pt;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 2pt;
            transition: all 0.3s;
        }

        .toggle-btn:hover { opacity: 0.9; }
        .toggle-btn.showing-answer { background: linear-gradient(135deg, #51CF66, #2B8A3E); }

        /* 打印按钮 */
        .print-section { text-align: center; margin-top: 12pt; }
        .print-btn {
            padding: 10pt 30pt; font-size: 13pt;
            background: linear-gradient(135deg, #4DABF7, #228BE6);
            color: white; border: none; border-radius: 25pt;
            cursor: pointer; font-weight: bold; letter-spacing: 2pt;
        }
        .print-btn:hover { opacity: 0.9; }

        @media print {
            body { background: white; padding: 0; }
            .page { box-shadow: none; padding: 5mm; max-width: 100%; }
            .print-section, .toggle-section, .info-box { display: none; }
            .cards-container { gap: 5pt; }
            .card { break-inside: avoid; height: 150pt; }
            .answer-box { border: 4pt dashed #666 !important; background: white !important; }
        }
    </style>
</head>
<body>
<div class="page">
    <h1 class="title">📖✨ 乘法口诀卡牌 V7（大字版·带解释）</h1>
    
    <div class="subtitle">
        全班可见 · 一行一张 &nbsp;|&nbsp; 超大字体 &nbsp;|&nbsp; 图文并茂
    </div>

    <!-- 说明框 -->
    <div class="info-box">
        <strong>📖 V7大字版说明：</strong>专为<strong>全班展示</strong>设计，<strong>带图示和解释</strong>！
        📌 <strong>特点：</strong>超大字体、圆圈图示、意义说明、隐藏答案
        &nbsp;&nbsp; 💡 <strong>适合场景：</strong>课堂投影、打印练习、家长会展示
        &nbsp;&nbsp; 🔑 <strong>点击"显示/隐藏答案"！</strong>
    </div>

    <!-- 切换按钮 -->
    <div class="toggle-section">
        <button class="toggle-btn" id="toggleBtn" onclick="toggleAnswers()">👁️ 显示答案</button>
    </div>

    <!-- 口诀卡牌 -->
    <div class="cards-container" id="cards"></div>

    <div class="print-section">
        <button class="print-btn" onclick="window.print()">🖨️ 打印V7大字版</button>
    </div>
</div>

<script>
// 颜色配置
const colors = [
    '#FF6B6B', '#FFA94D', '#E8C547', '#51CF66', '#20C997', '#339AF0', '#5C7CFA', '#CC5DE8', '#F06595'
];

const cnNums = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
const cnResults = [
    '零','一','二','三','四','五','六','七','八','九',
    '一十','十一','十二','十三','十四','十五','十六','十七','十八','十九',
    '二十','二十一','二十二','三','二十四','二十五','二十六','二十七','二十八','二十九',
    '三十','三十一','三十二','三十三','三十四','三十五','三十六','三十七','三十八','三十九',
    '四十','四十一','四十二','四十三','四十四','四十五','四十六','四十七','四十八','四十九',
    '五十','五十一','五十二','五十三','五十四','五十五','五十六','五十七','五十八','五十九',
    '六十','六十一','六十二','六十三','六十四','六十五','六十六','六十七','六十八','六十九',
    '七十','七十一','七十二','七十三','七十四','七十五','七十六','七十七','七十八','七十九',
    '八十','八十一'
];

let showingAnswers = false;

function toggleAnswers() {
    showingAnswers = !showingAnswers;
    const btn = document.getElementById('toggleBtn');
    if (showingAnswers) {
        btn.textContent = '🙈 隐藏答案'; btn.classList.add('showing-answer');
    } else {
        btn.textContent = '👁️ 显示答案'; btn.classList.remove('showing-answer');
    }
    document.querySelectorAll('.answer-content').forEach(el => el.style.display = showingAnswers ? 'inline' : 'none');
    document.querySelectorAll('.blank-content').forEach(el => el.style.display = showingAnswers ? 'none' : 'inline');
}

const container = document.getElementById('cards');

for (let i = 1; i <= 9; i++) {
    for (let j = i; j <= 9; j++) {
        const result = i * j;
        const mainColor = colors[i - 1];
        
        // 尺寸分级
        const totalCircles = result;
        let sizeClass = 'has-few';
        if (totalCircles > 63) sizeClass = 'has-huge';
        else if (totalCircles >= 28) sizeClass = 'has-many';
        else if (totalCircles >= 13) sizeClass = 'has-medium';
        
        // 正向版：i个j
        let circlesHTML = '';
        for (let g = 0; g < i; g++) {
            if (g > 0) circlesHTML += '<span class="plus-sign">+</span>';
            circlesHTML += '<span class="circle-group-inline">';
            for (let c = 0; c < j; c++) {
                circlesHTML += `<div class="circle" style="background: ${mainColor}"></div>`;
            }
            circlesHTML += '</span>';
        }

        const useDe = (result <= 9);
        
        const card = document.createElement('div');
        card.className = `card row-${i} ${sizeClass}`;
        
        card.innerHTML = `
            <div class="top-row">
                <span class="formula">${i} × ${j}</span>
                <span class="equals-sign">=</span>
                <div class="answer-box">
                    <span class="blank-content">?</span>
                    <span class="answer-content" style="display:none;">${result}</span>
                </div>
            </div>
            
            <div class="visual-row">${circlesHTML}</div>
            
            <div class="bottom-row">
                <div class="chinese-formula">
                    ✦ ${cnNums[i]}${cnNums[j]}${useDe ? '得' : ''}
                    <span class="blank-content"><span class="blank-line">${'__'.repeat(cnResults[result].length)}</span></span>
                    <span class="answer-content" style="display:none;">${cnResults[result]}</span>
                </div>
                <div class="meaning-text">
                    表示 <span class="highlight">${i}个${j}</span> 相加 = ?
                </div>
            </div>
        `;
        
        container.appendChild(card);
    }
}
</script>
</body>
</html>
