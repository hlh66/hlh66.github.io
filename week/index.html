<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>熹涌学校 2026秋 · 周工作安排</title>
<style>
  :root{
    --ink:#1b1f24; --sub:#5b6470; --line:#e4e7eb; --bg:#f2f3f6;
    --card:#ffffff; --red:#c0392b; --red-strong:#a5271a; --red-soft:#fdf1ef; --blue:#2c5c8f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:17px; line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:10; background:rgba(255,255,255,.97);
    backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--line);
  }
  .wrap{max-width:900px;margin:0 auto;padding:0 18px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 0 10px}
  .school{font-size:13.5px;color:var(--sub);letter-spacing:.06em}
  h1{font-size:22px;margin:3px 0 0;font-weight:700;letter-spacing:.01em}
  .meta{font-size:12px;color:#8b929c;white-space:nowrap;padding-bottom:3px}
  .chips{display:flex;gap:9px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--sub);
    padding:7px 17px;border-radius:999px;font-size:15px;cursor:pointer;white-space:nowrap;
    transition:.15s;position:relative;
  }
  .chip:hover{border-color:#c9ced6;color:var(--ink)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
  .chip.is-now::after{
    content:'';position:absolute;top:4px;right:6px;width:6px;height:6px;border-radius:50%;
    background:var(--red);
  }
  .chip.on.is-now::after{background:#ff8a80}
  .tools{display:flex;gap:9px;align-items:center;padding-bottom:10px;flex-wrap:wrap}
  input[type=search]{
    flex:1 1 200px;min-width:0;border:1px solid var(--line);background:#fff;border-radius:9px;
    padding:9px 13px;font-size:15px;color:var(--ink);outline:none;font-family:inherit;
  }
  input[type=search]:focus{border-color:#b9c2cc}
  .mine{display:inline-flex;align-items:center;gap:7px;font-size:15px;color:var(--sub);
    border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;cursor:pointer;white-space:nowrap}
  .mine input{accent-color:var(--red);margin:0;width:16px;height:16px}

  /* ---------- 时间段高亮条 ---------- */
  .periodbar{display:flex;gap:7px;align-items:center;overflow-x:auto;padding:0 0 11px;scrollbar-width:none}
  .periodbar::-webkit-scrollbar{display:none}
  .periodbar .plabel{font-size:13px;color:#8b929c;flex:0 0 auto;margin-right:2px}
  .pchip{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:#fff;color:var(--sub);padding:5px 12px;border-radius:999px;font-size:14px;
    cursor:pointer;white-space:nowrap;transition:.15s;font-family:inherit;
  }
  .pchip:hover{border-color:var(--pc);color:var(--ink)}
  .pchip .swatch{width:9px;height:9px;border-radius:50%;background:var(--pc)}
  .pchip .cnt{font-size:12px;color:#9aa1ab}
  .pchip.on{background:var(--pc);border-color:var(--pc);color:#fff;font-weight:700}
  .pchip.on .swatch{background:#fff}
  .pchip.on .cnt{color:rgba(255,255,255,.9)}
  .pchip[data-p="all"]{--pc:#5b6470}
  .pchip[data-p="morning"]{--pc:#2c7a4b}
  .pchip[data-p="noon"]{--pc:#b8761b}
  .pchip[data-p="afternoon"]{--pc:#2c5c8f}
  .pchip[data-p="evening"]{--pc:#6b4fa0}
  .pchip[data-p="allday"]{--pc:#7a828e}

  main{max-width:900px;margin:0 auto;padding:20px 18px 100px}

  /* ---------- 图例 ---------- */
  .legend{
    display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--sub);
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 14px;margin-bottom:16px;
  }
  .legend .lg{display:inline-flex;align-items:center;gap:6px}
  .legend .box{width:13px;height:13px;border-radius:4px;display:inline-block;flex:0 0 auto}
  .legend .lg-txt{color:#8b929c}
  .legend .cur-period{font-weight:700;color:var(--ink)}

  /* ---------- 今日提示条 ---------- */
  .todaybar{
    display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;
    background:linear-gradient(135deg,#fff7ed,#fffdf8);border:1px solid #f0d3a8;
    border-left:5px solid #d98a20;border-radius:14px;padding:12px 16px;margin-bottom:16px;
  }
  .todaybar .tb-title{font-size:15px;font-weight:800;color:#9a5b12;white-space:nowrap}
  .todaybar .tb-list{font-size:14px;color:#6b5637;line-height:1.7;flex:1 1 260px}
  .todaybar .tb-list b{color:#9a5b12}
  .todaybar .tb-empty{font-size:14px;color:#8b929c;flex:1 1 260px}
  .item.in-range{
    border-color:#d98a20;border-left-color:#d98a20;border-left-width:6px;
    background:#fffaf0;box-shadow:0 0 0 3px rgba(217,138,32,.16);opacity:1;
  }
  .item.in-range .work{text-decoration:none}
  .badge.range{background:#d98a20}

  /* ---------- 秋假托管专项 ---------- */
  .sp-wrap{margin-bottom:20px}
  .sp-top{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:16px;font-weight:800;
    color:var(--blue);margin:0 2px 12px;
  }
  .sp-top .sp-sub{font-size:13px;font-weight:500;color:#8b929c}
  .sp-top::after{content:'';height:1px;background:#cfd8e3;flex:1;min-width:20px}
  .special{
    background:linear-gradient(180deg,#f2f8ff,#fcfdff);border:1px solid #c9dcec;
    border-radius:16px;padding:16px 18px 8px;margin-bottom:14px;
  }
  .special.is-today{
    border-color:#e9b6ae;background:linear-gradient(180deg,#fff5f2,#fffcfa);
    box-shadow:0 0 0 2px #efc4bd,0 10px 28px rgba(192,57,43,.10);
  }
  .sp-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:13px}
  .sp-date{font-size:19px;font-weight:800}
  .special.is-today .sp-date{color:var(--red-strong);font-size:21px}
  .sp-role{font-size:14px;color:var(--sub)}
  .sp-badge{font-size:13px;font-weight:700;border-radius:7px;padding:3px 11px;background:#2c5c8f;color:#fff}
  .sp-badge.dai{background:#c0392b}
  .sp-today-pill{font-size:13px;font-weight:700;border-radius:7px;padding:3px 11px;background:var(--red);color:#fff}
  .special .item{margin-bottom:9px;padding:13px 16px}
  .special .work{font-size:17px;line-height:1.6}
  .special .item.live{padding:15px 17px}
  .special .item.live .work{font-size:18px}
  .special .owner{font-size:14.5px;margin-top:6px}
  .special .note{font-size:13.5px;margin-top:7px;line-height:1.6;display:block;word-break:break-word}
  .special .item.free{background:#fafbfc;border-left-color:#dfe3e8;opacity:.7}
  .special .item.free .work{font-size:15.5px;color:var(--sub);font-weight:500}
  .special .item.free .ptag{opacity:.6}
  .badge.free{background:#9aa1ab}
  .sp-note{
    font-size:13.5px;color:#6b7280;background:#fff;border:1px dashed #d7dde5;
    border-radius:10px;padding:9px 13px;margin:2px 0 12px;line-height:1.65;
  }
  @media print{ .special .item.free{opacity:1} }

  /* ---------- 周头 ---------- */
  .weekhead{
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:18px;
  }
  .weekhead .range{font-size:15px;color:var(--sub)}
  .weekhead .label{font-size:27px;font-weight:800;margin:3px 0 9px;letter-spacing:.01em}
  .focuses{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .focus{font-size:14px;background:#eef3f9;color:var(--blue);border-radius:8px;padding:5px 12px;font-weight:500}
  .nowline{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:15px;color:var(--sub);
    border-top:1px dashed var(--line);margin-top:14px;padding-top:12px;
  }
  .nowline .dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 1.8s infinite}
  .nowline b{color:var(--ink);font-size:17px}

  /* ---------- 每一天 ---------- */
  .day{margin-bottom:22px;scroll-margin-top:170px;border-radius:18px;transition:box-shadow .3s}
  .dayhead{display:flex;align-items:center;gap:10px;padding:4px 2px 11px;flex-wrap:wrap}
  .dayname{font-size:21px;font-weight:800;letter-spacing:.02em}
  .daydate{font-size:14px;color:#8b929c}
  .today-pill{
    font-size:14px;font-weight:700;color:#fff;background:var(--red);border-radius:7px;padding:3px 13px;letter-spacing:.05em;
  }

  /* 今天：整块强高亮 */
  .day.is-today{
    background:linear-gradient(180deg,#fff5f2 0%,#fffcfa 55%,#ffffff 100%);
    box-shadow:0 0 0 2px #efc4bd, 0 12px 34px rgba(192,57,43,.13);
    padding:14px 14px 8px;
  }
  .day.is-today .dayname{font-size:25px;color:var(--red-strong)}
  .day.is-today .daydate{color:#a4544a;font-size:15px}
  .day.is-today .today-pill{font-size:15px;padding:4px 15px;box-shadow:0 3px 10px rgba(192,57,43,.32)}

  .item{
    background:var(--card);border:1px solid var(--line);border-left:5px solid #d7dbe1;
    border-radius:14px;padding:17px 20px;margin-bottom:11px;transition:.2s;
  }
  /* 与工具区「只看我的」label 同名，必须显式还原为块级，否则卡片被 inline-flex 挤成横排 */
  .item.mine{display:block;border-left-color:var(--red);background:var(--red-soft)}
  .row1{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
  .time{font-size:15px;color:var(--blue);font-weight:700;background:#e8f0f9;border-radius:7px;padding:3px 11px}
  .ptag{font-size:12.5px;color:#fff;font-weight:700;border-radius:6px;padding:3px 9px;letter-spacing:.02em}
  .ptag[data-p="morning"]{background:#2c7a4b}
  .ptag[data-p="noon"]{background:#b8761b}
  .ptag[data-p="afternoon"]{background:#2c5c8f}
  .ptag[data-p="evening"]{background:#6b4fa0}
  .ptag[data-p="allday"]{background:#7a828e}
  .badge{font-size:13px;color:#fff;background:var(--red);border-radius:7px;padding:3px 11px;font-weight:700;letter-spacing:.03em}
  .badge.live{background:var(--red-strong);display:inline-flex;align-items:center;gap:5px}
  .badge.live::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
  .badge.next{background:#c8901f}
  .work{font-size:19px;white-space:pre-wrap;line-height:1.72;letter-spacing:.005em}
  .owner{font-size:15.5px;color:var(--sub);margin-top:8px}
  .owner b{color:var(--ink);font-weight:700}
  .note{font-size:14.5px;color:#8b6b3e;background:#fdf7ec;border-radius:8px;padding:5px 11px;margin-top:9px;display:inline-block}

  /* 到了具体时间点：再叠一层强高亮 */
  .item.live{
    border:2px solid #d9534f;border-left:7px solid var(--red-strong);
    background:linear-gradient(180deg,#fff1ee,#fff8f6);
    padding:20px 22px;margin-bottom:14px;
    box-shadow:0 0 0 4px rgba(192,57,43,.13), 0 12px 30px rgba(192,57,43,.17);
    animation:breathe 2.6s ease-in-out infinite;
  }
  .item.live .work{font-size:20.5px;font-weight:600}
  .item.live .time{background:var(--red-strong);color:#fff}

  /* 今天已过去的：淡化 */
  .item.past{opacity:.52}
  .item.past .work{text-decoration:line-through;text-decoration-color:#b9bfc7;text-decoration-thickness:1px}

  /* 今天即将开始的 */
  .item.next{
    border-left-color:#c8901f;border-left-width:7px;background:#fffdf3;
    box-shadow:0 0 0 3px rgba(200,144,31,.13);
  }

  /* 选定时间段：命中项彩色描边高亮，其余淡出 */
  .item.p-hit{opacity:1;border-color:var(--pc);border-left-color:var(--pc);
    box-shadow:0 0 0 3px var(--pcs),0 8px 20px var(--pcs)}
  .item.p-hit[data-p="morning"]{--pc:#2c7a4b;--pcs:rgba(44,122,75,.20)}
  .item.p-hit[data-p="noon"]{--pc:#b8761b;--pcs:rgba(184,118,27,.20)}
  .item.p-hit[data-p="afternoon"]{--pc:#2c5c8f;--pcs:rgba(44,92,143,.20)}
  .item.p-hit[data-p="evening"]{--pc:#6b4fa0;--pcs:rgba(107,79,160,.20)}
  .item.p-hit[data-p="allday"]{--pc:#7a828e;--pcs:rgba(122,130,142,.20)}
  .item.p-dim{opacity:.24}
  .item.p-dim .work{text-decoration:none}

  .empty{text-align:center;color:#9aa1ab;padding:40px 0;font-size:16px}

  /* 一个 sheet 含两周时的分周条 */
  .wkdiv{
    display:flex;align-items:center;gap:12px;margin:6px 2px 16px;
    font-size:15px;font-weight:700;color:var(--blue);letter-spacing:.02em;
  }
  .wkdiv::before,.wkdiv::after{content:'';height:1px;background:#cfd8e3;flex:1}
  .notes{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-top:8px}
  .notes h3{font-size:15px;margin:0 0 8px;color:var(--sub);font-weight:700}
  .notes p{margin:0 0 7px;font-size:16px;white-space:pre-wrap}
  footer{max-width:900px;margin:0 auto;padding:0 18px 34px;font-size:12.5px;color:#9aa1ab;text-align:center}
  .fab{
    position:fixed;right:18px;bottom:22px;z-index:20;display:none;align-items:center;gap:7px;
    background:var(--ink);color:#fff;border:none;border-radius:999px;padding:13px 19px;font-size:15px;
    box-shadow:0 10px 26px rgba(0,0,0,.26);cursor:pointer;font-family:inherit;font-weight:600;
  }
  .fab.show{display:inline-flex}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes breathe{
    0%,100%{box-shadow:0 0 0 4px rgba(192,57,43,.13), 0 12px 30px rgba(192,57,43,.17)}
    50%{box-shadow:0 0 0 8px rgba(192,57,43,.06), 0 12px 30px rgba(192,57,43,.24)}
  }
  @media (max-width:540px){
    body{font-size:16px}
    h1{font-size:19px}
    .meta{display:none}
    .wrap,.wrap main{padding-left:14px;padding-right:14px}
    main{padding-left:14px;padding-right:14px;padding-bottom:90px}
    .weekhead .label{font-size:23px}
    .item{padding:15px 16px}
    .item.live{padding:17px 18px}
    .work{font-size:17.5px}
    .item.live .work{font-size:18.5px}
    .day.is-today{padding:12px 11px 6px}
    .day.is-today .dayname{font-size:22px}
    .legend{font-size:12px;gap:6px 12px;padding:8px 11px}
  }
  @media print{ .fab,.chips,.tools,.periodbar,.legend{display:none} .item.past,.item.p-dim{opacity:1} .item.p-hit{box-shadow:none} }
</style>
</head>

/* ---------- 时间工具 ---------- */
// 支持调试：?now=2026-10-28T15:00 强制指定「现在」
function getNow(){
  const p = new URLSearchParams(location.search).get('now');
  if (p){ const d = new Date(p); if (!isNaN(d)) return d; }
  return new Date();
}
const pad2 = n => String(n).padStart(2, '0');
const dayIndex = d => (d.getDay() + 6) % 7;           // 周一=0 ... 周日=6
const DAY_CN = ['一','二','三','四','五','六','日'];

function weekStart(w){
  if (w.start){ const d = new Date(w.start + 'T00:00:00'); if (!isNaN(d)) return d; }
  return null;
}
function dateOfDay(w, idx){
  const s = weekStart(w); if (!s) return null;
  const d = new Date(s.getTime()); d.setDate(s.getDate() + idx); return d;
}
function sameDay(a, b){
  return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
// 把 "11月16日" 这种文本转成日期（年份取本周起始年）
function parseMD(text, year){
  const m = /(\d{1,2})\s*月\s*(\d{1,2})\s*日/.exec(String(text || ''));
  if (!m) return null;
  return new Date(year, parseInt(m[1], 10) - 1, parseInt(m[2], 10));
}
// 解析「11月11日至15日」「10月1日-7日」这类合并日期行（秋假/长假常用）
function dateRangeOf(text, year){
  const m = /(\d{1,2})\s*月\s*(\d{1,2})\s*日\s*(?:至|到|—|–|-|~)\s*(?:(\d{1,2})\s*月\s*)?(\d{1,2})\s*日/.exec(String(text || ''));
  if (!m) return null;
  const mo1 = parseInt(m[1], 10), d1 = parseInt(m[2], 10);
  const mo2 = m[3] ? parseInt(m[3], 10) : mo1, d2 = parseInt(m[4], 10);
  const a = new Date(year, mo1 - 1, d1); a.setHours(0, 0, 0, 0);
  const b = new Date(year, mo2 - 1, d2); b.setHours(23, 59, 59, 999);
  return [a, b];
}

// 解析中文时间：上午8:20-8:40 / 下午2:30-4:30 / 14:00-16:00 / 全天
function toMin(h, m, mod){
  h = parseInt(h, 10); m = m ? parseInt(m, 10) : 0;
  const pm = ['下午','晚上','傍晚','中午'].includes(mod);
  const am = ['上午','早上','早晨'].includes(mod);
  if (pm && h < 12) h += 12;
  else if (am && h >= 12) h -= 12;
  else if (!mod && !am && h <= 6) h += 12;  // 裸写 2:30 / 5:00 默认按下午；7:45 这类早读值岗保持上午
  return h * 60 + m;
}
function rangesOf(text){
  const out = [];
  if (!text) return out;
  const t = String(text);
  if (/^全天/.test(t)) return [{ start: 8 * 60, end: 17 * 60 }];
  const re = /(上午|下午|晚上|中午|早上|傍晚)?\s*(\d{1,2})[:：](\d{2})\s*(?:[-—–~至]\s*(上午|下午|晚上|中午|早上|傍晚)?\s*(\d{1,2})[:：](\d{2}))?/g;
  let m;
  while ((m = re.exec(t))){
    const start = toMin(m[2], m[3], m[1]);
    let end = null;
    if (m[5]) end = toMin(m[5], m[6], m[4] || m[1]);
    out.push({ start, end });
  }
  return out;
}
// 事项的有效时段：优先时间列，没有钟点再看内容
function spansOf(it){
  const a = rangesOf(it.time), b = rangesOf(it.work);
  return a.length ? a : b;
}

/* ---------- 时间段划分 ---------- */
const PERIODS = [
  { key:'all',       name:'全部' },
  { key:'morning',   name:'上午' },
  { key:'noon',      name:'中午' },
  { key:'afternoon', name:'下午' },
  { key:'evening',   name:'晚上' },
  { key:'allday',    name:'全天/未定' },
];
const PERIOD_NAME = Object.fromEntries(PERIODS.map(p => [p.key, p.name]));
function periodFromMin(s){
  if (s < 11 * 60 + 30) return 'morning';
  if (s < 14 * 60)       return 'noon';
  if (s < 18 * 60)       return 'afternoon';
  return 'evening';
}
// 一个事项可能跨多个时段（如上午一场、下午一场），全部列出来
// 没有具体钟点的一律归「全天/未定」；有钟点按每段开始时间归段
function periodsOf(it){
  const raw = (it.time || '') + ' ' + (it.work || '');
  if (!/\d{1,2}\s*[:：]\s*\d{2}/.test(raw)) return ['allday'];
  const rs = spansOf(it);
  if (!rs.length) return ['allday'];
  const set = [];
  rs.forEach(r => { const p = periodFromMin(r.start); if (!set.includes(p)) set.push(p); });
  return set.length ? set : ['allday'];
}
function periodOf(it){ return periodsOf(it)[0]; }
function currentPeriod(nowMin){
  if (nowMin < 11 * 60 + 30) return 'morning';
  if (nowMin < 14 * 60)      return 'noon';
  if (nowMin < 18 * 60)      return 'afternoon';
  return 'evening';
}

    if (!items.length) return;
    any = true;

    const box = el('div','special' + (isToday ? ' is-today' : ''));
    const head = el('div','sp-head');
    head.appendChild(el('span','sp-date', (gd.getMonth()+1) + '月' + gd.getDate() + '日 ' + esc(g.weekday || ('周' + DAY_CN[dayIndex(gd)]))));
    if (isToday) head.appendChild(el('span','sp-today-pill','今天'));
    head.appendChild(el('span','sp-badge' + (g.badge === '代班' ? ' dai' : ''), esc(g.badge || '')));
    head.appendChild(el('span','sp-role', esc(g.role || '')));
    box.appendChild(head);

    // 「全天」不参与钟点判定，避免整日高亮
    const spans = items.map(it => /全天/.test(it.time || '') ? [] : rangesOf(it.time));
    const states = items.map((it, i) => {
      if (!isToday || it.kind === 'free') return '';
      const rs = spans[i];
      if (!rs.length) return '';
      if (rs.some(r => nowMin >= r.start && nowMin <= (r.end == null ? r.start + 60 : r.end))) return 'live';
      return rs.every(r => (r.end == null ? r.start + 60 : r.end) < nowMin) ? 'past' : '';
    });
    let nextIdx = -1, best = Infinity;
    if (isToday){
      items.forEach((it, i) => {
        if (it.kind === 'free' || states[i] === 'live' || states[i] === 'past') return;
        spans[i].forEach(r => { if (r.start > nowMin && r.start - nowMin < best){ best = r.start - nowMin; nextIdx = i; } });
      });
      if (best > 120) nextIdx = -1;
    }

    items.forEach((it, i) => {
      const st = states[i];
      const isNext = (i === nextIdx);
      const free = it.kind === 'free';
      const pers = periodsOf({ time: it.time, work: it.work });
      const per = pers[0];
      let cls = 'item mine' + (free ? ' free' : '');
      if (st === 'live') cls += ' live';
      else if (isNext) cls += ' next';
      else if (st === 'past') cls += ' past';
      if (activePeriod && st !== 'live' && !free){
        cls += pers.includes(activePeriod) ? ' p-hit' : ' p-dim';
      }
      const card = el('div', cls);
      if (activePeriod) card.dataset.p = per;
      const r1 = el('div','row1');
      const pt = el('span','ptag', esc(pers.map(p => PERIOD_NAME[p]).join('·')));
      pt.dataset.p = per;
      r1.appendChild(pt);
      if (it.time) r1.appendChild(el('span','time', esc(it.time)));
      r1.appendChild(el('span', free ? 'badge free' : 'badge', free ? '不用带班' : '我的任务'));
      if (st === 'live') r1.appendChild(el('span','badge live','进行中'));
      if (isNext) r1.appendChild(el('span','badge next', '还有' + (best >= 60 ? Math.floor(best/60) + '小时' + (best % 60 ? (best % 60) + '分' : '') : best + '分钟')));
      card.appendChild(r1);
      card.appendChild(el('div','work', esc(it.work)));
      if (it.place && it.place !== '—') card.appendChild(el('div','owner','📍 <b>' + esc(it.place) + '</b>'));
      if (it.note) card.appendChild(el('div','note', esc(it.note)));
      box.appendChild(card);
    });
    wrap.appendChild(box);
  });
  return any ? wrap : null;
}

/* ---------- 渲染 ---------- */
function render(scrollToToday){
  renderChips();
  now = getNow();
  const w = weeks[cur];
  const app = $('#app');
  app.innerHTML = '';
  if (!w){ app.appendChild(el('div','empty','暂无数据')); return; }

  const todayIdx = DAY_CN[dayIndex(now)];
  const isCurWeek = (cur === currentWeekIndex());
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const wsBase = weekStart(w);
  const yr = wsBase ? wsBase.getFullYear() : now.getFullYear();

  // 本周时段统计（不受搜索/只看我的影响）
  const counts = { morning:0, noon:0, afternoon:0, evening:0, allday:0 };
  (w.days || []).forEach(d => (d.items || []).forEach(it => { periodsOf(it).forEach(p => { counts[p]++; }); }));
  renderPeriodBar(counts);

  app.appendChild(legendEl(nowMin));

  // 今天覆盖到的安排：既含「星期四」这种单日行，也含「11月11日至15日」这种合并日期行
  function coversToday(it, dayDate){
    if (dayDate && sameDay(dayDate, now)) return true;
    const rr = dateRangeOf(it.time, yr) || dateRangeOf(it.work, yr);
    return !!(rr && now >= rr[0] && now <= rr[1]);
  }
  if (isCurWeek){
    const spToday = specialTodayTasks();
    const todayItems = [];
    (w.days || []).forEach(d => {
      const dd = wsBase ? parseMD(d.date, yr) : null;
      (d.items || []).forEach(it => { if (coversToday(it, dd)) todayItems.push(it); });
    });
    const allToday = spToday.concat(todayItems);
    const tb = el('div','todaybar');
    tb.appendChild(el('div','tb-title','📍 今天 · 周' + todayIdx + ' ' + (now.getMonth()+1) + '月' + now.getDate() + '日'));
    if (allToday.length){
      const list = el('div','tb-list');
      list.innerHTML = '<b>今天要做 ' + allToday.length + ' 项' +
        (spToday.length ? '（含秋假托管 ' + spToday.length + ' 项）' : '') + '：</b>' +
        esc(allToday.slice(0, 3).map(x => (x.work || '').slice(0, 28)).join('；')) +
        (allToday.length > 3 ? ' …' : '');
      tb.appendChild(list);
    } else {
      tb.appendChild(el('div','tb-empty','本周安排表没有单列今天（假期 / 无排期），可切换上方周次查看'));
    }
    app.appendChild(tb);
  }

  // 周头
  const head = el('div','weekhead');
  head.appendChild(el('div','range', esc(w.rangeText)));
  head.appendChild(el('div','label', esc(w.label) + ' 工作安排'));
  if (w.focus && w.focus.length){
    const f = el('div','focuses');
    w.focus.forEach(t => f.appendChild(el('span','focus', esc(t))));
    head.appendChild(f);
  }
  const nl = el('div','nowline');
  nl.appendChild(el('span','dot'));
  nl.appendChild(el('span','', '现在 <b>' + pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + '</b>'));
  nl.appendChild(el('span','', '· 今天 周' + todayIdx + ' ' + (now.getMonth()+1) + '月' + now.getDate() + '日'));
  nl.appendChild(el('span','', isCurWeek ? '· 已锁定本周' : '· 当前查看 ' + esc(w.label)));
  head.appendChild(nl);
  app.appendChild(head);

  const kw = keyword.trim();
  const spEl = renderSpecial(w, nowMin, kw);
  if (spEl) app.appendChild(spEl);
  let total = 0, liveEl = null;

  // 两周合一个 sheet 时，用分周条把第二周分开
  const dayNo = d => wsBase ? Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(wsBase.getFullYear(), wsBase.getMonth(), wsBase.getDate())) / 86400000) : 0;
  let shownWeek = 1;

  (w.days || []).forEach(d => {
    const items = d.items.filter(it => {
      if (onlyMine && !it.mine) return false;
      if (kw){
        const blob = (it.work||'') + (it.owner||'') + (it.time||'') + (it.note||'');
        if (!blob.includes(kw)) return false;
      }
      return true;
    });
    if (!items.length) return;
    total += items.length;

    const ws = weekStart(w);
    const idx = DAY_CN.indexOf(d.day);
    // 优先用表里写的日期（跨两周的 sheet 靠它区分），没有再用「周起始 + 星期序号」推算
    let dDate = ws ? parseMD(d.date, ws.getFullYear()) : null;
    if (!dDate && idx >= 0) dDate = dateOfDay(w, idx);
    const isToday = isCurWeek && dDate && sameDay(dDate, now);

    // 跨到第二周时插一条分周分隔
    if (wsBase && dDate){
      const n = Math.floor(dayNo(dDate) / 7) + 1;
      if (n > 1 && n !== shownWeek){
        shownWeek = n;
        const s2 = new Date(dDate.getTime()); s2.setDate(s2.getDate() - ((dDate.getDay() + 6) % 7));
        const e2 = new Date(s2.getTime()); e2.setDate(e2.getDate() + 6);
        app.appendChild(el('div','wkdiv', esc((s2.getMonth()+1)+'月'+s2.getDate()+'日 – '+(e2.getMonth()+1)+'月'+e2.getDate()+'日')));
      }
    }

    const day = el('section', 'day' + (isToday ? ' is-today' : ''));
    if (isToday) day.id = 'today';
    const h = el('div','dayhead');
    h.appendChild(el('span','dayname','星期' + d.day));
    if (isToday) h.appendChild(el('span','today-pill','今天'));
    const dTxt = d.date || (dDate ? (dDate.getMonth()+1) + '月' + dDate.getDate() + '日' : '');
    if (dTxt) h.appendChild(el('span','daydate', esc(dTxt)));
    day.appendChild(h);

    // 项目状态：live 进行中 / past 已过去 / next 即将开始（仅今天计算）
    const spans = items.map(spansOf);
    const states = items.map((it, i) => {
      if (!isToday) return '';
      const rs = spans[i];
      if (!rs.length) return '';
      const isLive = rs.some(r => nowMin >= r.start && nowMin <= (r.end == null ? r.start + 60 : r.end));
      if (isLive) return 'live';
      const allEnded = rs.every(r => (r.end == null ? r.start + 60 : r.end) < nowMin);
      return allEnded ? 'past' : '';
    });
    // 下一项（2 小时内）
    let nextIdx = -1, best = Infinity;
    if (isToday){
      items.forEach((it, i) => {
        if (states[i] === 'live' || states[i] === 'past') return;
        spans[i].forEach(r => {
          if (r.start > nowMin && r.start - nowMin < best){ best = r.start - nowMin; nextIdx = i; }
        });
      });
      if (best > 120) nextIdx = -1;
    }

    items.forEach((it, i) => {
      const st = states[i];
      const isNext = (i === nextIdx);
      const pers = periodsOf(it);
      const per = pers[0];
      const rangeHit = isCurWeek && !isToday && coversToday(it, dDate);
      let cls = 'item' + (it.mine ? ' mine' : '');
      if (st === 'live') cls += ' live';
      else if (isNext) cls += ' next';
      else if (st === 'past') cls += ' past';
      // 时段高亮：进行中的事项保留红色强高亮，不参与淡化
      if (activePeriod && st !== 'live'){
        if (pers.includes(activePeriod)) cls += ' p-hit';
        else cls += ' p-dim';
      }
      if (rangeHit) cls += ' in-range';
      const card = el('div', cls);
      if (activePeriod) card.dataset.p = per;
      const r1 = el('div','row1');
      const pt = el('span','ptag', esc(pers.map(p => PERIOD_NAME[p]).join('·')));
      pt.dataset.p = per;
      r1.appendChild(pt);
      if (it.time) r1.appendChild(el('span','time', esc(it.time)));
      if (rangeHit) r1.appendChild(el('span','badge range','覆盖今天'));
      if (st === 'live') r1.appendChild(el('span','badge live','进行中'));
      if (isNext) r1.appendChild(el('span','badge next', '还有' + (best >= 60 ? Math.floor(best/60) + '小时' + (best % 60 ? (best % 60) + '分' : '') : best + '分钟')));
      if (it.mine) r1.appendChild(el('span','badge','我的任务'));
      if (r1.children.length) card.appendChild(r1);
      card.appendChild(el('div','work', esc(it.work)));
      if (it.owner) card.appendChild(el('div','owner','负责人：<b>' + esc(it.owner) + '</b>'));
      if (it.note) card.appendChild(el('div','note', esc(it.note)));
      if (st === 'live') liveEl = card;
      day.appendChild(card);
    });
    app.appendChild(day);
  });

  if (!total && !spEl) app.appendChild(el('div','empty', kw || onlyMine ? '没有匹配的事项' : '本周暂无安排'));
  else if (!total && spEl && onlyMine) app.appendChild(el('div','empty','常规周安排里没有点名「林华」的事项，上面秋假托管专项就是你的全部任务'));

  if (w.notes && w.notes.length){
    const n = el('div','notes');
    n.appendChild(el('h3','','备注'));
    w.notes.forEach(t => n.appendChild(el('p','', esc(t))));
    app.appendChild(n);
  }

  // 悬浮「回到今天」按钮
  const fab = $('#fab');
  const hasToday = !!document.querySelector('.day.is-today');
  fab.classList.toggle('show', hasToday && isCurWeek);

  // 自动定位：优先正在进行的事项，其次今天整天
  if (scrollToToday !== false){
    const target = liveEl || document.querySelector('.day.is-today');
    if (target) setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'center' }), 150);
  }

  document.title = '熹涌学校 · ' + (w.label || '') + '工作安排';
}

$('#q').addEventListener('input', e => { keyword = e.target.value; render(false); });
$('#onlyMine').addEventListener('change', e => { onlyMine = e.target.checked; render(false); });
$('#fab').addEventListener('click', () => {
  const t = document.querySelector('.item.live') || document.querySelector('.day.is-today');
  if (t) t.scrollIntoView({ behavior: 'smooth', block: 'center' });
});

render(true);

// 每 30 秒刷新「进行中 / 即将开始 / 已过去 / 当前时段」
setInterval(() => render(false), 30000);
</script>
</body>
</html>
