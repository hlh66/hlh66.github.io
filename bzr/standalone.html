<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班主任技能大赛 · 刷题（单文件版）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:#0f1623;color:#e6edf7;min-height:100vh;padding:16px 12px 40px;line-height:1.7}
.wrap{max-width:900px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:22px;font-weight:600;letter-spacing:.5px}
.sub{font-size:12px;color:#8ea3bf;margin-top:2px}
.readbox{display:flex;align-items:center;gap:8px;background:#182233;border:1px solid #2a3a52;border-radius:12px;padding:8px 12px}
.switch{position:relative;width:46px;height:25px;background:#39465c;border-radius:20px;cursor:pointer;transition:.2s;flex:none}
.switch.on{background:#3ecf8e}
.switch i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}
.switch.on i{left:24px}
.rate{font-size:12px;color:#8ea3bf;display:flex;align-items:center;gap:4px}
select,input[type=text],textarea{font-family:inherit;background:#111c2c;color:#e6edf7;border:1px solid #2a3a52;border-radius:9px;padding:7px 9px;font-size:13px;outline:none}
select:focus,input:focus,textarea:focus{border-color:#4da3ff}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#182233;border:1px solid #2a3a52;border-radius:14px;padding:10px 12px;margin-bottom:12px}
.toolbar label{font-size:12px;color:#8ea3bf;display:flex;align-items:center;gap:5px}
.toolbar input[type=text]{flex:1;min-width:130px}
.chk{display:flex;align-items:center;gap:5px;font-size:12px;color:#b9c9dd;cursor:pointer;user-select:none}
.chk input{accent-color:#4da3ff}
.statbar{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#8ea3bf;margin-bottom:12px;padding:0 4px}
.statbar b{color:#e6edf7;font-size:15px}
.card{background:#182233;border:1px solid #2a3a52;border-radius:18px;padding:22px;margin-bottom:14px}
.tags{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tag{font-size:11px;padding:3px 10px;border-radius:20px;background:#223650;color:#9fc6ff;border:1px solid #33507a}
.tag.m{background:#1d3b39;color:#7ee2bd;border-color:#2c5c54}
.tag.t{background:#3a2f4d;color:#c8a8ff;border-color:#544075}
.tag.s{background:#2a3346;color:#9fb0c9;border-color:#3a4761;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qnum{font-size:12px;color:#7d93b0;margin-left:auto;white-space:nowrap}
.stem{font-size:20px;line-height:1.85;margin-bottom:18px;white-space:pre-wrap;word-break:break-word}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:11px;text-align:left;width:100%;background:#111c2c;border:2px solid #2a3a52;color:#e6edf7;border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit;cursor:pointer;transition:.15s;line-height:1.7}
.opt:hover:not(.locked){border-color:#4da3ff;background:#16273d}
.opt .k{font-weight:700;color:#7fb6ff;flex:none;min-width:22px}
.opt.picked{border-color:#4da3ff;background:#1b3352}
.opt.correct{border-color:#3ecf8e;background:#163a30;color:#b8f5d8}
.opt.correct .k{color:#3ecf8e}
.opt.wrong{border-color:#ff6b6b;background:#3a2027;color:#ffc9c9}
.opt.wrong .k{color:#ff6b6b}
.opt.locked{cursor:default}
.opt.dim{opacity:.55}
.essay{width:100%;min-height:110px;font-size:15px;line-height:1.8;resize:vertical;margin-bottom:10px}
.btn{font-family:inherit;font-size:14px;font-weight:600;border:none;border-radius:10px;padding:9px 18px;cursor:pointer;background:#2b6cb0;color:#fff;transition:.15s}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:#26364d;color:#cfe0f5}
.btn.green{background:#2e9c6e}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fb{margin-top:16px;border-radius:13px;padding:16px;border:2px solid}
.fb.ok{background:#122c25;border-color:#2f8f6b}
.fb.no{background:#2e1c22;border-color:#a0444f}
.fb-title{font-size:17px;font-weight:600;margin-bottom:8px}
.fb.ok .fb-title{color:#7ee2bd}
.fb.no .fb-title{color:#ff9b9b}
.ansline{font-size:16px;margin-bottom:12px}
.ansline b{color:#ffd479;font-size:19px}
.anabox{background:rgba(0,0,0,.22);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.anah{font-size:12px;color:#8ea3bf;letter-spacing:1px;margin-bottom:6px}
.anatx{font-size:15px;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.anatx.empty{color:#7d93b0;font-size:14px}
.ref{font-size:14px;color:#a9d3ff;border-left:3px solid #3b6fa8;padding-left:10px;margin-top:8px;line-height:1.8}
.src{font-size:12px;color:#8ea3bf;margin-top:10px;word-break:break-all}
.note{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.note textarea{flex:1;min-width:200px;min-height:54px;font-size:14px}
.blankin{display:inline-block;width:132px;max-width:38vw;margin:0 5px;padding:2px 8px;font-family:inherit;font-size:15px;line-height:1.5;background:#0d1a2b;color:#ffe6a3;border:1px solid #4b6b96;border-bottom:2px solid #4da3ff;border-radius:6px;outline:none;text-align:center}
.blankin:focus{border-color:#ffe6a3;background:#16273d}
.blankin.ok{background:#163a30;color:#b8f5d8;border-color:#3ecf8e}
.blankin.no{background:#3a2027;color:#ffc9c9;border-color:#ff6b6b}
.blankline{display:flex;gap:9px;flex-wrap:wrap;font-size:14px;line-height:1.9;margin-bottom:8px}
.blankline span{padding:1px 9px;border-radius:7px;background:rgba(255,255,255,.06)}
.blankline .r{background:#163a30;color:#b8f5d8}
.blankline .w{background:#3a2027;color:#ffc9c9}
.nav{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.tip{text-align:center;font-size:12px;color:#6f829d;margin-top:14px;line-height:1.9}
@media(max-width:560px){.card{padding:16px}.stem{font-size:18px}.opt{font-size:15px}h1{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>班主任技能大赛 · 刷题</h1>
      <div class="sub" id="sub">题目与答案从 Word 原卷照搬 · 加载中…</div>
    </div>
    <div class="readbox">
      <span style="font-size:13px">🔊 朗读</span>
      <div class="switch" id="sw" onclick="toggleRead()"><i></i></div>
      <span class="rate">语速
        <select id="rate" onchange="state.rate=parseFloat(this.value)">
          <option value="0.8">慢</option><option value="1" selected>正常</option><option value="1.2">快</option>
        </select>
      </span>
      <button class="btn ghost" style="padding:6px 10px;font-size:12px" onclick="readCurrent(true)">读本题</button>
    </div>
  </header>

  <div class="toolbar">
    <label>方面 <select id="fAspect" onchange="onAspect()"></select></label>
    <label>模块 <select id="fModule" onchange="apply()"></select></label>
    <label>题型 <select id="fType" onchange="apply()">
      <option value="all">全部</option><option value="single">单选</option>
      <option value="multi">多选</option><option value="blank">填空</option>
      <option value="essay">案例/简答</option>
    </select></label>
    <label>批次 <select id="fBatch" onchange="apply()"></select></label>
    <input type="text" id="fKey" placeholder="搜题干关键词…" oninput="apply()">
    <label class="chk"><input type="checkbox" id="fShuffle" onchange="apply()">随机顺序</label>
    <label class="chk"><input type="checkbox" id="fNew" onchange="apply()">只刷没做过的</label>
    <label class="chk"><input type="checkbox" id="fWrong" onchange="apply()">只看错题</label>
  </div>

  <div class="statbar">
    <span>本题库 <b id="sTotal">0</b> 道</span>
    <span>已答 <b id="sDone">0</b></span>
    <span>答对 <b id="sOk" style="color:#7ee2bd">0</b></span>
    <span>答错 <b id="sBad" style="color:#ff9b9b">0</b></span>
    <span>正确率 <b id="sAcc">--</b></span>
    <span>错题本 <b id="sWrong">0</b></span>
  </div>

  <div class="card" id="card"></div>

  <div class="nav">
    <button class="btn ghost" onclick="go(-1)">← 上一题</button>
    <button class="btn" onclick="go(1)">下一题 →</button>
    <button class="btn ghost" onclick="randomOne()">🎲 随机一题</button>
    <button class="btn ghost" onclick="retry()">↻ 重做本题</button>
    <button class="btn ghost" onclick="clearWrong()">清空错题本</button>
    <button class="btn ghost" onclick="clearSeen()">重置「已做」记录</button>
  </div>
  <div class="tip">选择题点一下立即出答案 · 多选题选完点「确定」· 填空题填完点「核对」· 案例题对照参考答案自评<br>批次说明：「原卷题库 / 挖空还原」= 原卷原题；「原文出题」= 政策原句挖空选择题；「出处辨析」= 判断原句出自哪份文件（题干、答案均原文照搬）<br>只想刷原卷题，批次选「原卷题库」或「挖空还原」即可 · 键盘：A/B/C/D 选项 · ← → 翻题 · 空格朗读</div>
</div>

type": "blank", "stem": "学校是公民道德建设的重要阵地，要全面贯彻党的教育方针，坚持社会主义办学方向，坚持育人为本、______。", "options": {}, "answer": "德育为先", "blanks": ["德育为先"], "analysis": "", "aspect": "德育与价值引领", "module": "新时代公民道德建设实施纲要", "source": "近7天笔试题+2套新题/书面测试题2套.docx", "multi": false, "batch": "挖空还原", "reference": "88.把立德树人贯穿学校教育全过程。学校是公民道德建设的重要阵地。要全面贯彻党的教育方针，坚持社会主义办学方向，坚持育人为本、德育为先，把思想品德作为学生核心素养、纳入学业质量标准，构建德智体美劳全面培养的教育体系。", "blank_count": 1, "align_mode": "忽略标点", "analysis_from_doc": false, "id": 503}, {"type": "essay", "stem": "班主任布置学生写生活随笔《我的家庭》，结果一个写作很好的女生留给老师一张纸条，写着： 父亲是个酒鬼、烟鬼兼赌徒，在遥远的新疆工作。我问过母亲为什么与父亲结合。母亲无言。后来 我自己搞清了，母亲是为了生存，而父亲是为了逃避家长安排的婚姻。原来我是他们随随便便结合 的产物，我鄙视他们。 问题： 1、请分析这个学生的心理？ 2、如何帮助这个学生走出目前的状态？", "options": {}, "answer": "1、感受不到父母的爱；对父母失望；埋怨父母，因此也不爱父母。\n2、A.让学生理解父母当初也许只是一种无奈的选择。B、婚姻虽然不幸福，但是，最终没选择离婚，是为了孩子的幸福。C、想想生活中父母对他的付出，理解父母对他的爱。D.学会感恩父母，作为子女，尽量去弥补父母之间的间隙。", "analysis": "", "aspect": "家校社协同与心理健康", "module": "中华人民共和国家庭教育促进法", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 504}, {"type": "essay", "stem": "学生每天中午都吃学校的盒饭，一天，班主任发现垃圾桶附近饭盒扔得到处都是，就请在场的同学 清理。可在场的同学却说：“这事一直都是小东在做，我们不管！小东是刚从外校转来的，家境很贫寒，人也很老实。 问题：这时，班主任应该怎么做？可以从哪些方面来教育学生？", "options": {}, "answer": "老师与在场的同学一起清理干净。事后再找机会与学生谈心，或以班会或其他形式，让学生明白：A.要保护环境卫生。B.同学之间是平等的，工作应该是大家分着做。C.同学之间应该互相关爱。", "analysis": "", "aspect": "班主任基本功综合", "module": "案例分析与情景答辩", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 505}, {"type": "essay", "stem": "班上张强和汪波打了起来，被值日老师抓到班主任处。班主任问原因，张强和汪波异口同声的指责 对方，强调自己的道理。问题： 1、这时班主任应该怎么做？ 2、你如何认识学生自我教育的作用？", "options": {}, "answer": "1.先耐心听学生谈事情的经过，弄清楚事情真相，从中判断各自承担什么责任。再让学生谈打架的害处；之后让学生讨论他们各自应当承担什么责任。\n2.苏联教育家苏霍姆林斯基曾经这样说过：具有能够激发学生去进行自我教育的教育才是真正的教育。真正的教育只有当学生有自我教育的要求时才能实现。”当今学生自我主见比较强很有自己的思想所以有一部分学生会不听别人的劝告，包括家长的和老师的，总是坚持自己的意见和做自己的事。因此加强学生的自我教育非常重要。目的是让学生自己悟出道理来,而不是老师苦口婆心的说道理。自我教育的途径多种多样，比如:自信疗法、培养自己的意志力、树立正确的学习目标、培养自己的学习兴趣、调节自己的情绪、自我反省等。", "analysis": "", "aspect": "班主任基本功综合", "module": "案例分析与情景答辩", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 506}, {"type": "essay", "stem": "学校举行篮球联赛，我班有绝对的实力取胜，全班同学都很兴奋。可决赛时，由于队员们轻敌、对手实力也确实很强，所以我班比分的落后，学生情绪有点焦躁；中场休息时，我班啦啦队的助兴表演又遭到对方的无故起哄，虽然同学们都很生气，但是当对方的啦啦队上场时，我班学生还是报以热烈的掌声。同时更用力的为场上队员加油，场上的队员也在奋力地拚抢，力争缩小与对手的差距，可是结果还是输了。同学们泪流满面，默默无声地坐在地上，没有互相埋怨，牵着手向教室走。 问题： 1、你怎样看待这次输球？ 2、你认为体育活动对班集体有何作用？", "options": {}, "answer": "1.虽然对这次联赛有影响，但对班集体后续的发展会有良好的推动。学生充分体验了骄傲、轻敌的危害，而且表现出来的文明礼貌、失败后没有互相埋怨，牵手向教室走、拼搏精神以及强烈的班集体荣誉感，都会推动班级各方面把发展。\n2.增强学生集体荣誉感，增强学生团结互助精神，理解团结拼搏的体育精神", "analysis": "", "aspect": "班级建设与管理", "module": "中小学班主任工作规定", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 507}, {"type": "essay", "stem": "班上有个同学身体有一些残疾，走路有一些跛，班级有些同学常学她走路的样子，开他的玩笑，还给她起外号。作为班主任，我觉得应当批评那些不尊重残疾同学的行为。但转念一想，这样一来会伤害残疾学生的自尊心，我一直在寻找一个恰当的方法。 问题 1、请你给她找到一个恰当的办法？ 2、请你说说自己对生命特点尊重的理解？", "options": {}, "answer": "通过主题班会等多种形式，给学生介绍一些残疾人的成功事迹，让学生明白，不管什么样的生命特点，都有可能为社会作贡献，引以学生讨论、理解、尊重生命特点。也可以写周记，比如，“如果我是残疾人”。", "analysis": "", "aspect": "班级建设与管理", "module": "班集体建设", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 508}, {"type": "essay", "stem": "班主任正在认真地向学生布置着大扫除任务。话音未落，王明同学立即说了句笑话惹得同学们哄堂大笑起来。班主任措手不及，怒火中烧，这不是明摆着对老师公开挑衅吗？”王明，你……你简直太过分了！“班主任竟一时语塞。 问题 1、分析王明的心态？ 2、你认为应该怎样处理类似情况？", "options": {}, "answer": "1.也许他只是搞笑，也许他是故意捣乱，也有可能是公开挑衅老师。\n2.冷处理，当场不要发火，可以当作没听到，甚至一笑而过。事后可以私底下找王明好好谈谈，了解他这样做的原因，并给予相应的教育。", "analysis": "", "aspect": "班主任基本功综合", "module": "案例分析与情景答辩", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 509}, {"type": "essay", "stem": "自从作了班主任，他不敢有所松懈，平时从早上的早读课开始他就到班检查，中午还经常跟班上学生坐在一起吃饭、聊天，晚上也要等学生全部回家后自己才回家，遇到事情总要对学生千叮咛万嘱咐，生怕没做到自己该做的事情。”满以为尽到了做班主任的责任，可是有些同学不理解，认为老师跟得太紧，象监督他们一样，甚至有些同学对老师产生抵触情绪。 问题：1.请你分析产生这种问题的原因，2.你认为他应该怎么办？", "options": {}, "answer": "每个学生都希望老师严格管理，都希望老师与他多接触。并不是老师的跟得紧”，让学生不理解，应该从老师的工作方法上寻找产生这种问题的原因，比如师生的交流方式是否符合学生的年龄特点，怎么样让学生感受到老师对他们的关爱等。", "analysis": "", "aspect": "家校社协同与心理健康", "module": "学生心理健康教育", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 510}, {"type": "essay", "stem": "数学老师反映班上有一个姓赵的同学不知何故连续3天不交数学作业。班主任把小赵叫到办公室问他：“ 你为什么不交作业？”他低头不语。给他讲学习的意义，做作业的重要性……他还是一言不发。“作为班主任的你火了，大发雷霆，责令小赵：必须当天把所缺作业补齐。否则……你原以为这最后通牒一定起作用，谁知，第二天小赵不但没有把作业补上，反而不进教室上课了。这下你没辙了，可是若让他开了先例，再有效仿的，那以后教学还怎么进行？ 问题： 1、请你分析该班主任的做法？ 2、对不交作业的学生该如何处理？", "options": {}, "answer": "1.班主任把小赵叫到办公室，给他讲学习的意义，做作业的重要性。这些做法是没问题的；大发雷霆，下最后通牒的做法是不可取的，轻易发火容易激化师生矛盾，不利于解决问题。这种做法也容易使老师下不了台。\n2.了解学生不交作业的原因，学生不回答，也可以从侧面去了解，比如问同学，问家长学生在家里情况等。然后针对学生的具体情况再找他谈。", "analysis": "", "aspect": "班主任基本功综合", "module": "案例分析与情景答辩", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 511}, {"type": "essay", "stem": "” 不同名数不可相加“，可却发生了这样一件事：一位教数学的班主任在强调不同名数不可相加这一概念时，用反问的形式向全班同学说：”一头牛和一匹马能相加吗？“一名学生脱口而出：”能，等于两头牲畜。“教师勃然大怒，他喝令这名学生站起来，厉声训斥道：”你妈和你爸相加能等于两头动物吗？\"学生顿时伸手推了老师一下，全班同学一片哗然。 问题： 1、如果是你，这时你怎么做？ 2、说说你认为很糟的班主任忌语！", "options": {}, "answer": "1.教师应该勇敢地马上向学生道歉，检讨自己刚才讲的话是错误的，并请学生原谅。这反而是显示了自己的大度。并以自己作为反面教材，教育学生要使用文明用语，不说侮辱性语言。\n2.你真蠢！你是猪！我从来没见过这么蠢的学生。你没救了。真不明白你父母是怎么生出你来的。你真没教养。\n13)\n一个女学生家境不好，本人相貌也很一般，虽然为人本份，学习也很刻苦，但成绩仍不突出，别人对她也是不冷不热。她感到这个世界对她太平公平；你这样做的理由？别人那么有钱，那么漂亮，那么聪明？于是她有了轻生的念头，留了纸条就跑出去了。你找到她时，她已经在外面游荡两天。问题：面对神情呆滞、了无生气的她，你是怎么做的？你这样做的理由？\n参考答案：不批评、不责骂，只是轻轻地说，你饿了吗？然后我们去吃点东西。我们一起回学校吧。你知道老师和父母是多么地着急啊（给她关心）。你在老师心目中，……（说她的优点，给她自信）。我们没有选择父母的权利，但我们有选择奋斗，自立自强的机会（给她希望）。\n14)同学们议论纷纷,说张日和李诗正在谈恋爱,但你怎么都不相信,因为他们俩在各方面的表现是那么的优秀。可是,那个下雨天的傍晚,在公交车站你竟与搂腰共伞并向对方嘴里送巧克力的张李二人不期而遇.问题：此时你会怎么做？你这样做的理由？\n参考答案：装作没看到，事后另找时间与他们阐述早恋的危害。理由是：如果当场点破或批评，会 使他们很没面子，增大心理压力，甚至对老师有抵触情绪，破坏了师生感情。如果给他们面子，保 留一些美好的东西，再阐述早恋的危害，他们会更容易接受。\n15)一位后进生，家长恨铁不成钢，教育的方式方法简单粗暴，动不动就拳脚相加，孩子越打越顽\n皮，与家长产生对抗情绪。家长悲叹不已，叫你对她的孩子不要客气，即使打也无所谓。问题：你会怎么做？你这样做的理由？\n参考答案：劝阻家长，不要随便打学生；多了解学生在家的情况；与家长多谈教育孩子的方法，说服家长多给学生一些关心、爱护、鼓励。另一方面，与学生沟通，学会理解父母的爱，明白父母的苦心。改正缺点，让家长开心。\n16)\n你带的班，在学校每月开展一次的文明班评选活动中，将近一年了，还没被评上过一次。你很着急，对照文明班的评选条件，召开了一次班会，让同学们寻找差距，分析原因，想想办法。会上，同学们都把矛头指向那几个后进生，纷纷指责他们拖后退，这几位后进生却不服。\n问题：你会怎么做？你这样做的理由？\n参考答案：先自己向学生做检讨自己工作的不足，自己承担主要责任。然后让学生明白，每个学生都有责任，让学生反省、讨论自己应该承担什么责任。再分析还有班上哪些工作没做好，寻找差距，找出不足，怎么去改进。理由是：老师要做好敢于承担责任的表率；教育学生勇于承担责任；让学生知道接下来工作怎么做。\n第二篇：班主任工作技能比赛现场答辩题目", "analysis": "", "aspect": "班主任基本功综合", "module": "案例分析与情景答辩", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 512}, {"type": "essay", "stem": "学生每天中午都吃学校的盒饭，一天，班主任发现垃圾桶附近饭盒扔得到处都是，就请在场的同学清理。可在场的同学却说：“这事一直都是小东在做，我 不管！”小东是刚从外校转来的，家境很贫寒，人也很老实。问题：这时，班主任应该怎么做？可以从哪些方面来教育学生？", "options": {}, "answer": "老师与在场的同学一起清理干净。事后再找机会与学生谈心，或以班会或其他形式，让学生明白：A.要保护环境卫生。B.同学之间是平等的，工作应该是大家分着做。C.同学之间应该互相关爱。", "analysis": "", "aspect": "班主任基本功综合", "module": "案例分析与情景答辩", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 513}, {"type": "essay", "stem": "班上有“四大金刚”，一个班干部，三个课代表。有的同学反映，他们四个很团结，个个都很牛，谁给他们提意见，不仅听不进去，还可凶了。 问题： 1、你认为该怎么做？ 2、班主任如何看待班级中的“非正式群体”？", "options": {}, "answer": "非正式群体是在与同伴交往过程中自发形成的，对学生的心理品质发展乃至日常学习、生活极具影响力，值得老师们注意。如果非正式群体的价值取向、目标、行为规范与班集体一致时，会对班集体的形成起到促进作用，但值得我们重视的是，非正式群体也有偏离集体、偏离正确舆论的时候，这时就要求我们教育者适度介入，适度引导，将其纳入班集体的发展轨道。而对于对立（反抗）型的小群体成员，教师更应当更多的关注、接近和亲近他们，发其闪光点，及时强化，作耐心细致的思想工作，切忌简单、粗暴。\n对于各类非正式群体，我们可以：\n1、利用非正式群体成员间的感情基础，增进同学间友谊、增强班集体的凝聚力。\n2、利用非正式群体成员间畅通的信息管道，了解学生的思想动态和对班集体管理的一些意见和建议。\n3、培养、培训非正式群体的领导者，形成强而有力，管而有效的班干部集体。", "analysis": "", "aspect": "班级建设与管理", "module": "班集体建设", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 514}, {"type": "essay", "stem": "有一天早晨当我来到教室，听见里面吵吵闹闹，推开门一看，只见两个女生正在吵架，大有兵戎相见之势。我当时非常生气，本想冲过去严厉批评她们一顿，但理智告诉我，这时她们正在气头上，万一弄不好，她们同我顶上了，那可下不了台。于是，我咳了一声，同学们见了我都乖乖地坐到了座位上。我装作不知道发生了什么事，笑吟吟地指着窗外的稻秧道：“稻花香里说丰年”，这一大家都熟悉的句子，一下子把学生的注意力吸引过来，情不自禁地“哇声一片”。问题： 1、请评价该班主任的做法？ 2、你是如何处理类似事件的？", "options": {}, "answer": "班主任机智地用学生熟悉的诗句把窗外的水稻与现场的情景串起来，转移了学生的注意力，淡化了火药味，避免的了师生之间的尴尬，体现了教育的艺术性。事后老师也要看看有没必要再找两位女生了解情况。", "analysis": "", "aspect": "班主任基本功综合", "module": "案例分析与情景答辩", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 515}, {"type": "essay", "stem": "班长是个重要角色。选谁当班长啊？最后我把目光停留在小华身上，小华的品性、威信……都合适。我向小华讲了我的想法，她默默无语。直到最后，也没有回答我。当天晚上，我又接到小华妈妈的电话，小华妈妈说了许多理由，拒绝了我。 问题： 1、如果是你接下来怎么做？ 2、你怎样建立班委会的？", "options": {}, "answer": "做她妈妈的工作，让她明白，她的孩子很优秀，做班长是对她的进一步的锻炼和培养。2.先要在班上明确班委会的组成及分工，然后通过民主与集中的方法组建班委全，再次要经常培养班干部。", "analysis": "", "aspect": "班主任基本功综合", "module": "案例分析与情景答辩", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 516}, {"type": "essay", "stem": "班上有“四大金刚”，一个班干部，三个课代表。有的同学反映，他们四个很团结，个个 问题 1、分析王明的心态？ 2、你认为应该怎样处理类似情况？", "options": {}, "answer": "1.也许他只是搞笑，也许他是故意捣乱，也有可能是公开挑衅老师。2.冷处理，当场不要发火，可以当作没听到，甚至一笑而过。事后可以私底下找王明好好谈谈，了解他这样做的原因，并给予相应的教育。", "analysis": "", "aspect": "班级建设与管理", "module": "中小学班主任工作规定", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 517}, {"type": "essay", "stem": "班长是个重要角色。选谁当班长啊？最后我把目光停留在小华身上，小华的品性、威信„„都合适。我向小华讲了我的想法，她默默无语。直到最后，也没有回答我。当天晚上，我又接到小华妈妈的电话，小华妈妈说了许多理由，拒绝了我。 问题： 1、如果是你接下来怎么做？ 2、你怎样建立班委会的？", "options": {}, "answer": "做她妈妈的工作，让她明白，她的孩子很优秀，做班长是对她的进一步的锻炼和培养。2.先要在班上明确班委会的组成及分工，然后通过民主与集中的方法组建班委全，再次要经常培养班干部。", "analysis": "", "aspect": "班主任基本功综合", "module": "案例分析与情景答辩", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 518}, {"type": "essay", "stem": "班主任正在认真地向学生布置着大扫除任务。话音未落，王明同学立即说了句笑话惹得同学们哄堂大笑起来。班主任措手不及，怒火中烧，这不是明摆着对老师公开挑衅吗？“王明，你„„你简直太过分了！”班主任竟一时语塞。 问题 1、分析王明的心态？ 2、你认为应该怎样处理类似情况？", "options": {}, "answer": "1.也许他只是搞笑，也许他是故意捣乱，也有可能是公开挑衅老师。2.冷处理，当场不要发火，可以当作没听到，甚至一笑而过。事后可以私底下找王明好好谈谈，了解他这样做的原因，并给予相应的教育。", "analysis": "", "aspect": "班主任基本功综合", "module": "案例分析与情景答辩", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 519}, {"type": "essay", "stem": "数学老师反映班上有一个姓赵的同学不知何故连续3天不交数学作业。班主任把小赵叫到办公室问他：”你为什么不交作业？“他低头不语。给他讲学习的意义，做作业的重要性„„他还是一言不发。”作为班主任的你火了，大发雷霆，责令小赵：必须当天把所缺作业补齐。否则„„你原以为这最后通牒一定起作用，谁知，第二天小赵不但没有把作业补上，反而不进教室上课了。这下你没辙了，可是若让他开了先例，再有效仿的，那以后教学还怎么进行？ 问题： 1、请你分析该班主任的做法？ 2、对不交作业的学生该如何处理？", "options": {}, "answer": "1.班主任把小赵叫到办公室，给他讲学习的意义，做作业的重要性。这些做法是没问题的；大发雷霆，下最后通牒的做法是不可取的，轻易发火容易激化师生矛盾，不利于解决问题。这种做法也容易使老师下不了台。2.了解学生不交作业的原因，学生不回答，也可以从侧面去了解，比如问同学，问家长学生在家里情况等。然后针对学生的具体情况再找他谈。", "analysis": "", "aspect": "班主任基本功综合", "module": "案例分析与情景答辩", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 520}, {"type": "essay", "stem": "学生每天中午都吃学校的盒饭，一天，班主任发现垃圾桶附近饭盒扔得到处都是，就请在场的同学清理。可在场同学却说：“这事一直都是小东在做，我们不管！”小东是刚从外校转来的，家境很贫寒，人也老实。 问题：这时，班主任应该怎么做？可以从哪些方面来教育学生？", "options": {}, "answer": "老师与在场的同学一起清理干净。事后再找机会与学生谈心，或以班会或其他形式，让学生明白：A.要保护环境卫生。B.同学之间是平等的，工作应该是大家分着做。C.同学之间应该互相关爱。", "analysis": "", "aspect": "班主任基本功综合", "module": "案例分析与情景答辩", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 521}, {"type": "essay", "stem": "某小学班主任任命班长采用学生投票选举定期更换的方法，结果一位学习纪律都比较差的同学连续两任当选，教师的调查的结果是该生提前用各种手段拉选票所致。请问你认为这样的问题该如何处理？", "options": {}, "answer": "（1）做该生的工作，使之明确“班长”的责任、权利和义务，肯定该生愿意当班长的积极动机是好的，更要珍惜同学们的信任，利用这个职务为同学服好务，以身作则起到模范带头作用。树立自己的威信，真正成为有号召力的领导。（2）改变班长的任命方法，能者上，庸者下，树立正气抑恶扬善。", "analysis": "", "aspect": "班主任基本功综合", "module": "案例分析与情景答辩", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 522}, {"type": "essay", "stem": "你带的班，在学校每月开展一次的文明班评选活动中，将近一年了，还没被评上过一次。你很着急，对照文明班的评选条件，召开了一次班会，让同学们寻找差距，分析原因，想想办法。会上，同学们都把矛头指向那几个后进生，纷纷指责他们拖后退，这几位后进生却不服。问题：（1）你会怎么做？你这样做的理由？（2）如果班上的同学对评上的班级不服气你将如何开班会。", "options": {}, "answer": "（1）先自己向学生做检讨自己工作的不足，自己承担主要责任。然后让学生明白，每个学生都有责任，让学生反省、讨论自己应该承担什么责任。再分析还有班上哪些工作没做好，寻找差距，找出不足，怎么去改进。理由是：老师要做好敢于承担责任的表率；教育学生勇于承担责任；让学生知道接下来工作怎么做。（2）我认为班会应当这样开，第一，首先让学生指出我们班的优点，看到我们那些方面胜过了被评上的班级，第二，让学生指出我们班有哪些地方不如被评优的班级，我们要想被评优就应该努力的保持自己的优点去克服自己的不足，只要有这种精神，我们班就离评优不远了。", "analysis": "", "aspect": "班级建设与管理", "module": "班集体建设", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 523}, {"type": "essay", "stem": "你担任班主任工作时间不久，你的任课老师都是老教师，有学生告诉你有任课老师在和学生交流的时候流露出对你工作的一些不满态度，你怎么办？", "options": {}, "answer": "首先：我会感谢把这个情况反映给我的这位同学，因为事实上他这么做是在帮助我的工作，我会希望他以后能继续把班级中其他老师和同学的意见反映给我，让我可以从中反思自我、提高自我。同时我会告诉他任课老师能在课堂上和同学交流老师的工作情况，说明他是一位民主、公开的老师，并不是在背后说坏话。以后我会经常在班级中和同学们进行交流，如果同学们对我有什么意见和建议都可以直接来向我指出，这样是有利于我的进步的！\n其次：我会十分虚心地向老教师请教班主任工作方面的经验，尤其是重点学习如何解决学生告诉我的那些缺陷，我相信，只要我诚恳地去请教，学然后思，然后改，老教师一定会愿意帮助我的。想当年，我刚毕业时，周围也都是经验丰富的老师，如果没有他们的指点，也就没有我今天的进步！\n让每个孩子健康生活成长。我具体会有以下做法：第一加强自身在这方面的学习，现在有部分老师连灭火器都不会用，也不懂得急救，我必须加强自己在这方面的能力训练。在加强自身的同时也利用深圳市教育局下发的一些校本教材进行相关课程的教学，让学生在这方面有一定的认识。第二，人不仅是个体的生物，也是集体的动物。根据马卡连柯的集体主义建设理论，我利用班集体的利用对学生强化教学。首先开展班会，借助中央电视台“知识守护生命”的活动在班上开展自救自助的主题班会，让学生们在各式各样的活动中学会保护自己。另外我还设计了板报手抄报等活动。第三，苏霍姆林斯基说，家校合作才能产生对孩子教育的最大合力，我会给家长发放一些安全知识的资料，让家长与孩子们共同学习安全方面的自救知识和技能。著名班主任任小艾曾说学生只是我们老师眼中的百分之一，但他确实每个家庭的百分之百，希望我们所有的老师都把每个孩子当成自己的百分之百去对待，让每个孩子快快乐乐地上学来，平平安安地回家去。", "analysis": "", "aspect": "班级建设与管理", "module": "班主任职责与专业素养", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 524}, {"type": "essay", "stem": "学生石磊，喜欢下象棋，在六年级下学期初经常利用课间十分钟与同桌在楚河汉界上厮杀。由于课间休息时间短，如此这般必将分散上课的注意力。多次看到这种现象后，作为班主任该怎样做？", "options": {}, "answer": "（一）理论支撑：有自己的爱好是积极向上的一面；但学生的主要精力应用在学习上，应让爱好促进学习\n（二）方法措施：\n1、赞赏其特长，因势利导，以一方面的兴趣带动学习、活动等其它方面的提高。\n2、与之谈心，指出其不足，更加严格的要求自己。", "analysis": "", "aspect": "班主任基本功综合", "module": "案例分析与情景答辩", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 525}, {"type": "essay", "stem": "著名教育家苏霍姆林斯基有深刻的论断：“只有教师关心人的尊严感，才能使学生通过学习而受到教育。教育的核心就其本质而言，就在于让儿童始终体验到自已的尊严感。”结合工作实际谈谈你对这句话的理解。", "options": {}, "answer": "（一）理论支撑：尊重是教书育人的起点，能唤起学生的自尊和信心\n（二）方法措施：\n1、赞赏其特长，因势利导，以一方面的兴趣带动学习、活动等其它方面的提高。\n2、宽容其不足，在不断激励和赏识中使学生不断完善自己。", "analysis": "", "aspect": "教育学与心理学基础", "module": "教育家与心理学效应", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 526}, {"type": "essay", "stem": "邓旭同学是在本学期才转入新班的，由于家庭环境特殊，父亲和母亲外出打工，经常转学，导致学习成绩不好，纪律涣散。刚来时，他上课无精打采，要么搞小动作，要么影响别人学习，提不起一点学习兴趣；下课追逐打闹，喜欢动手动脚；每天不是科任老师就是学生向班主任告状。作为班主任你该如何转化邓旭同学。", "options": {}, "answer": "（一）理论支撑：先让他认识自己的错误，树立做个受人喜欢的人的思想。\n（二）方法措施：\n1、找他心平气和的谈话，让他承认自己的不足，下定改正错误的决心。\n2、为他确定小目标，根据目标完成情况适时表扬，不断激发他的上进心。\n3、做好家访工作，形成教育的合力", "analysis": "", "aspect": "班级建设与管理", "module": "班主任职责与专业素养", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 527}, {"type": "essay", "stem": "请结合工作实际，谈谈你对“教育局提出的特别要关注后1/3的学生”的理解。", "options": {}, "answer": "（一）理论支撑：符合素质教育所提出的“全面育人、全员育人”的宗旨。\n（二）方法措施：能够结合实际，举事例阐述这一观点的现实意义。", "analysis": "", "aspect": "班主任基本功综合", "module": "案例分析与情景答辩", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 528}, {"type": "essay", "stem": "班主任李老师为加强对学生行为规范的管理，制定了班规，其中对随地吐痰做了明确要求，在教室吐一口痰，罚款1元，作为班费。请对班主任李老师的做法给予评价。", "options": {}, "answer": "（一）理论支撑：违反义务教育法。免费性是义务教育法特点之一。\n（二）方法措施：能够结合实际，举事例阐述这一做法的弊端。", "analysis": "", "aspect": "德育与价值引领", "module": "未成年人思想道德建设", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 529}, {"type": "essay", "stem": "班主任张老师为加大对学生的管理力度，当学生犯错误时，立刻通知家长来校，向家长诉说学生的种种不足，让家长与自己一起教育学生。请对张老师的做法给予评价。", "options": {}, "answer": "（一）理论支撑：教师应从尊重学生的人格出发，关注学生的个体差异，因材施教。动辄叫家长，不利于对学生的正面引导，容易使孩子自尊心受挫。\n（二）方法措施：能够结合实际，举事例阐述这一做法的危害性。", "analysis": "", "aspect": "家校社协同与心理健康", "module": "中华人民共和国家庭教育促进法", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 530}, {"type": "essay", "stem": "五年级王红同学星期日在同学家玩，很晚未回家。王红的父亲很着急，向王红的几个同学打听，都说不知道王红的去向。王红的父亲无奈打通了班主任蔡老师的电话，报告了这一情况。蔡老师也说不知道王红的去向，并且批评王红的父亲没有履行好家长的职责，之后挂掉电话。蔡老师对这件事处理的方法是否恰当，试做分析。", "options": {}, "answer": "（一）理论支撑：教师在校内和校外都有教育和管理学生的义务。\n（二）方法措施：能够结合5\n（2）你平时是如何做好学生的心理教育的？ 参考答案：（1）不批评、不责骂，只是轻轻地说，你饿了吗？然后我们去吃点东西。我们一起回学校吧。你知道老师和父母是多么地着急啊（给她关心）。你在老师心目中，„„（说她的优点，给她自信）。我们没有选择父母的权利，但我们有选择奋斗，自立自强的机会（给她希望）。（2）首先，上好每一堂心理课。“学会求知，学会做人”是新时代的要求，学生要有积极健康的心态，这句要求班主任老师营造良好的环境，结合学生年龄特点及认知水平，精心设计好每一堂心理课，发挥课堂教学主渠道的作用。还要用平等信任的眼光看学生，用爱心去感化他们，用自己的人格魅力去影响他们，从而使学生形成健康的心理。其次，密切联系家长，及时沟通。学生不仅是学校的孩子，也是社会的孩子，更是父母的孩子。家庭环境，家庭教育对孩子的成长起着至关重要的作用，孩子的细微的变化也只有父母最先察觉，因此，家校及时密切沟通，携手共同促进孩子健康成长。", "analysis": "", "aspect": "家校社协同与心理健康", "module": "中华人民共和国家庭教育促进法", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 531}, {"type": "essay", "stem": "六年级班主任王老师星期日遇见了本班学生王鹏的母亲，王鹏的母亲告诉王老师王鹏被几个小伙伴拉去上网吧了，请求张老师管管这些孩子，张老师为难的说：“我们老师没有权利管网吧，等明天上学我在找王鹏做做他的工作，让他远离网吧。” 张老师对这件事处理的方法是否恰当，试做分析。", "options": {}, "answer": "（一）理论支撑：拒绝未成年人上营业性网吧，使其远离网吧是每个公民义不容辞的责任。张老师确认王鹏确实与小伙伴上网吧了，应及时向学校相关部门汇报情况，让学校与相关部门联系查处接纳未成年人上网的网吧。\n（二）方法措施：能够结合实际，举事例阐述这一做法的危害性。首届班主任论坛班主任专业能力竞赛答题\n我校首届班主任论坛班主任专业能力竞赛已经结束了，参赛的选手表现突出，体现了我校班主任的工作艺术、较好的学生观、反映敏捷和睿智，在处理具体的班级事务和突发事件上具有较好方法和条理性，符合学校的相关规定，给与会的师生留下了较好的印象，处理事务和突发事件的程序和方法对班主任处理类似问题起到一定的借鉴性和指导性。但选手处理事务的方法与先进教育理念的结合度还有待提高，选手的口头表达及叙述的条理性还需进一步加强。\n虽然我们有可能感受到首届班主任论坛班主任专业能力竞赛的青涩，但我们坚信，只要坚持，我校班主任专业能力的建设肯定会让我们感受到成熟的甜美和成功的喜悦。再次祝贺获奖的选手，感谢辛勤耕宇在教育教学一线的老师们，感谢关心支持班主任工作的部门和同仁们。\n在此将案例公布。（解决问题的方法永远都不是唯一的，所提供的答案仅供参考，期待有更多更好的答案涌现出来。）\n一、案例：小明今天早晨又迟到了，并且一副精神萎靡的样子，他这学期已多次迟到了，成绩也不好，班主任也多次和他交谈过，也与家长联系过，小明也在家长和班主任面前也作过保证，但一段时间后，老毛病会复发。最近具同学和家长反映，小明迷恋网络游戏，也经常有厌学情绪，家长也对他没有办法。问题：1.作为班主任，你认为应该怎样处理小明这件事？2.学生上网成瘾，应采取怎样的教育对策？ 参考答案：\n1.（1）对待像小明这样的学生应该有耐心和热心，要让他感觉到老师对他还是关心、信任他的。耐心就是老师找了家长后，学生可能还会犯，这就需要教师对他耐心一点，不要粗暴处理，否则，学生会变本加厉。热心，就是班级里不管有什么事情，尽量请他帮忙，让他觉得，除了他的学习成绩不好以外，他还是个有用的人，至少老师有什么事情求他帮忙，让他有一种自豪和自信。\n（2）学生违反纪律，找家长谈话也是必要的，但是，谈话中，还应该让家长明白，责骂、暴打孩子是错误的，不仅不能让孩子回心转意，还会让他对老师的教育更排斥。因此，因为迷恋网吧而家长，班主任首先应该告诉家长不能责骂、打骂学生，应该教给家长一些教育理念，然后再针对孩子的情况，和家长商量如何管理，比如限制他的零花钱，上下学接送孩子，晚上放学回家后对孩子进行必要的管理，和孩子沟通，让孩子正确的认识网络游戏，正确认识网络以及正确利用网络等等。\n2.(1)帮助学生找到爱和归属感。班主任要有耐心和爱心，尊重学生，理解学生，使他们找到归属感，与他们一道建立生活的信心，积极面对人生。\n(2)用有意义的活动，安排学生的时间和空间，充实他们的生活，转变学生生活的重心。\n(3)与家长沟通，争取家长教育的配合。中小学生迷恋游戏机或网络与父母的教育方式和方法有直接的关\n四、案例：你带的班级在学校每月开展一次的文明班评选活动中，将近一年了，还没被评上过一次。你很着急，对照文明班的评选条件，召开了一次班会，让同学们寻找差距，分析原因，想想办法。会上，同学们都把矛头指向那几个后进生，纷纷指责他们拖后退，这几位后进生却不服。\n问题：1.你会怎么做？你这样做的理由？2.如果班上的同学对评上的班级不服气你将如何开班会。\n参考答案：\n1.先自己向学生做检讨自己工作的不足，自己承担主要责任。然后让学生明白，每个学生都有责任，让学生反省、讨论自己应该承担什么责任。再分析还有班上哪些工作没做好，寻找差距，找出不足，怎么去改进。理由是：老师要做好敢于承担责任的表率；教育学生勇于承担责任；教育学生要有团队、集体的意识；让学生知道接下来工作怎么做。\n2.第一，首先让学生指出我们班的优点，看到我们哪些方面胜过了被评上的班级，第二，让学生指出我们班有哪些地方不如被评上的班级，我们要想被评优就应该努力的保持自己的优点去克服自己的不足，只要有这种精神，我们班就离评优不远了。\n案例：一天在课间，某学校高一年级学生在慢跑时突然前扑倒地，不省人事，同学发现后立即向班主任老师汇报，老师和同学立即将其送往医院进行抢救，但因抢救无效，不幸死亡，经初步诊断，该学生因突发性心脏病死亡。\n问题：1.假如你是该学生的班主任，当你知道学生发生意外后，你会怎么做？2.你在平时的工作中是如何体现学生安全重于泰山，请谈谈你的做法。参考答案：\n1.先积极开展抢救工作，同时汇报学校领导，过后在学校的统一部署下进行工作（向家长汇报、协助事故情况调查、班级同学情绪的稳定以及善后事情的处理等)2.安全教育要警钟长鸣，安全要教育与预防为主，增强学生安全防范能力，班主任要有高度的责任意识密切关注学生的学习、生活、思想以及心理健康等，细心观察，多渠道了解情况，防患于未然，特别是做好特异体质的学生和思想、心理和行为问题学生的排查工作，密切注意，建好档案，加大家校联系，杜绝意外伤害事故的发生。\n（1）熟悉和了解校园安全的政策和法律，做到安全问题依法办事；（2）加强安全教育，让学生了解相关安全知识；（3）培养学生安全意识，增强自我保护能力；\n（4）建立危机处理相关部门和人员的“电话联系名册”；（5）冷静妥善的处理所发生的安全问题。\n六、案例：一个女学生家境不好，本人相貌也很一般，虽然为人本份，学习也很刻苦，但成绩仍不突出，别人对她也是不冷不热。她感到这个世界对她太平公平；别人那么有钱，那么漂亮，那么聪明？于是她有了轻生的念头，留了纸条就跑出去了。你找到她时，她已经在外面游荡两天。\n问题：1.面对神情呆滞、了无生气的她，你是怎么做的？2.你平时是如何做好学生的心理教育的？ 参考答案：\n1.不批评、不责骂，只是轻轻地说，你饿了吗？然后我们去吃点东西。我们一起回学校吧。你知道老师和父母是多么地着急啊（给她关心）。你在老师心目中，„„（说她的优点，给她自信）。我们没有选择父母的权利，但我们有选择奋斗，自立自强的机会（给她希望）。\n2.首先，班主任要认识到保证学生心理的健康发展是班主任的主要职责之一。“学会求知，学会做人”是新时代的要求，学生要有积极健康的心态，这句要求班主任老师营造良好的环境，结合学生年龄特点及认知水平，精心设计好加强学生心理健康教育的每一个环节（班会课、班级活动及每一次与学生的谈话），发挥学校教育主渠道的作用。\n其次，还要用平等信任的眼光看学生，用爱心去感化他们，用自己的人格魅力去影响他们，从而使学生形成健康的心理。\n另外，密切联系家长，及时沟通。学生不仅是学校的孩子，也是社会的孩子，更是父母的孩子。家庭环\n总之，教育是一门科学，也是一门艺术。\n案例：自从做了班主任，他不敢有所松懈，平时从早上的早读课开始他就到班检查，中午还经常跟班上学生坐在一起吃饭、聊天，晚上也要等学生全部回家后自己才回家，遇到事情总要对学生千叮咛万嘱咐，生怕没做到自己该做的事情。满以为尽到了做班主任的责任，可是有些同学不理解，认为老师跟得太紧，象监督他们一样，甚至有些同学对老师产生抵触情绪。\n问题：1.请你分析产生这种问题的原因？2.你认为他应该怎么办，作为班主任的你，你认为平日里该如何于学生相处呢？并用几个词来概括。参考答案：\n1.每个学生都希望老师能理解学生，都希望老师与他多接触。并不是老师的“跟得紧”让学生不理解，应该从老师的工作方法上寻找产生这种问题的原因，比如师生的交流方式是否符合学生的年龄特点，怎么样让学生感受到老师对他们的关爱等。\n2.（1）认真研究学生，要懂得去爱每一位学生。作为一名老师，爱学生会是基本要素。爱学生，就要随时随地了解学生的感受，善于站在学生的角度去考虑问题、解决问题。此时，你不仅是一位老师，还是学生的朋友。\n（2）对人对事，要像天平般公正平等地对待每一位学生。要想成为学生心目中的好老师，其中一点就是要像天平般公正、平等地对待每一位学生。\n（3）积极营造和谐民主、平等的师生关系。新一代的师生关系应该是平等的、民主的。例如，班干部评选应该是民主选举。班中的规章制度不是老师一人订的，而是集合全班同学的意见，再在平时的实践中不断地完善而得出的。就连班中的规矩都有自己的一份意见，学生主人公的身份充分体现出来。学生们在班上有言论自由，能够自由地提出老师的不足之处，只要态度是诚恳的、正确的。爱心、诚心、细心和恒心\n十一、案例：数学老师反映班上有一个姓赵的同学不知何故连续3天不交数学作业。班主任把小赵叫到办公室问他：“你为什么不交作业？”他低头不语。给他讲学习的意义，做作业的重要性„„他还是一言不发。\"作为班主任的你火了，大发雷霆，责令小赵：必须当天把所缺作业补齐。否则„„你原以为这最后通牒一定起作用，谁知，第二天小赵不但没有把作业补上，反而不进教室上课了。这下你没辙了，可是若让他开了先例，再有效仿的，那以后教学还怎么进行？\n问题：1.请你分析该班主任的做法？2.对不交作业的学生该如何处理？你是怎样来加强班级学风建设的。参考答案：\n1.班主任把小赵叫到办公室，给他讲学习的意义，做作业的重要性。这些做法是没问题的；大发雷霆，下最后通牒的做法是不可取的，轻易发火容易激化师生矛盾，不利于解决问题。这种做法也容易使老师下不了台。\n2.了解学生不交作业的原因，学生不回答，也可以从侧面去了解，比如问同学，问家长学生在家里情况等。然后针对学生的具体情况再找他谈。作为班主任既要关注学生思想品德、行为习惯、心理健康，学生的学习情况也是班主任要关注的重点，平时对学生加强学习重要性的教育，注重培养学生良好的学习习惯，引导学生掌握较好的学习方法，经常性的与科任老师联系，关注每一个学生的学习情况，发现问题，及时解决，加强家校联系，形成合力，帮助学生成长。\n学风建设是班级建设的重中之重，学风是一个班级的灵魂，良好的学风是提高学生整体素质的前提和保证。\n抓好入学教育环节。入学时对学生进行学习观念转变教育，帮助他们培养学习兴趣，在学习方法上加以指导，时时提醒他们走出校门的严峻环境，使同学们时时有一种压力，有一种危机感，并实实在在地感到不学不行。\n培养学生建立一个乐观的心态。成功的唯一阻碍就是自己的心态，拥有乐观的心态能够克服学生在当今社会的种种诱惑面前丧失一种圣洁的信念、奋斗的理想，保证他们自重、自省、自警、自励，从而能够使他们在以后达到一种高尚人格的修炼。\n（3）制定阶段性的学习目标，关注过程性的引导。班主任帮助学生制定每一学习阶段的目标，但这个目标定的不能太高，要让学生有了目标才有了前进的动力，稍加努力便可达到使其朝着既定目标努力，引\n作为班主任，我会用以下程序进行处理：先调节情绪，调整心态，安慰这名学生，稳定她的情绪；然后采取妥善而有效的方法，帮助这名学生找到她失去的钱；最后，我会对这件事进行总结和反思，并选择合适的时机和形式对班上学生进行思想教育。\n我会采用以下具体方法帮助这名学生找到失去的钱：在稳定了这名同学情绪后，再了解清楚事情的情况，为后面有针对性的处理做好准备。确定钱真的被人拿走后，我先在班长上面对全体学生强调这些钱对这名学生有多么重要，对这位同学的母亲有多么重要。然后再说，可是这钱却被这名同学不小心丢了，这可意味着这名同学的母亲不能及时服到治病的药，也许她的病情会加重。这可怎么办呀。接着我再说，老师的手提包有神奇的魔力，会把失去的钱找回来，下面，我把手提包挂在教室外面，请同学们依次走到教室外，看看钱回来了吗。在这样的引导和教育下，我想那位一时出错而拿了钱的孩子一定会把钱放在手提包里的。这样，既帮助那位孩子找回了失去的钱，又保护了一时出错的孩子的自尊心，还对班上的孩子进行了一次教育，真是一举多得。\n小学组选手情景题案例选编\n（三）说实话，类似的事情在我的班主任工作中也曾经遇到过，如果是我面对这样的情景和事件，作为班主任，我会这样来处理：\n1．首先，我会安抚这名孩子。我觉得这是我必须要先做到的，尽管对于事情如何解决我还没有去想，因为孩子终归是孩子，当他遇到这样的事情时，他的内心可以说已经处在一种极度恐慌与无助中，这笔钱对于孩子来说是多么重要，源于对老师的信任，他找到了老师，希望老师能够帮助到他，因为不管怎样，老师千万别责怪孩子，千万别说些“你怎么不小心啊！”这类的话，要控制好学生的情绪，我会对他说：“孩子，不要慌，把情况和老师慢慢说，相信老师，老师一定能够帮助你的！”给孩子一个承诺，孩子的心就会踏实，使他不至于因为自责而过激。\n2．调查。安抚好孩子后，就要着手调查这件事情了，首先要确定孩子的钱在不见之前是不是一直都在书包，排除孩子自己遗失的情况。如果确定钱是被同学拿走的，我会让孩子回忆一下，书包里的钱有没有被其他同学看到过，都有谁事先知道。\n3．对这件事可能涉及到的同学逐一了解，在这个过程中，为了避免被调查的学生误解，让他们误以为老师不信任他才找他谈话这种情况，我在和学生谈话时不会直接引入这件事，会先和孩子谈谈其他的事情，比如孩子的学习情况或者最近的心情之类的，不动声色让孩子谈谈自己今天做了些什么，在这个过程，注意倾听学生的语言，注意观察孩子的表情，把这些孩子的话逐一印证，寻找孩子说话的漏洞，确定是否被某个学生拿走。\n4．进行集体教育，排除丢钱的这名孩子之外，先将这件事情说出来，在说的过程观察学生的反应，然后表扬丢钱的孩子，赞扬他的孝顺，也说明他的着急，晓之以理，动之以情，然后让孩子们发表看法，说说我们怎样帮助他，最后我会提出希望：（1）让同学们安慰这个丢钱的孩子，（2）、希望拿钱的孩子能用自己的方法改正这个错误，给同学改过的机会，不会批判谁，处分谁。打消拿钱孩子的顾虑。\n5．暗中观察，在放学之前我会问丢钱的孩子，钱被人送回来了吗？如果不知不觉中送回来了，这件事情就到此为止了，如果没有，我会自己拿出150元钱给孩子，就说是老师帮他找到了钱，让他去给妈妈买药，并告诉他以后要小心，至少让这名丢钱的孩子安心，让孩子对老师充满信心，那这件事情我会悄悄地继续调查，我想，拿了钱的孩子他的内心肯定不会平静，我会在班级重点观察孩子的反常举动，并注意向家长了解学生的家里情况，我相信我总能将事情弄清楚。\n中学情景题案例选编\n四、情景题（30分）\n有同学向你反映，看见本班一男同学与另一女同学关系非常“亲密”，相处似乎超出一般同学友情，作为班主任请你提出对此问题的看法，如若两生确有相处甚密现象„„，请你提出教育的方法及引导办法。中学组选手情景题案例选编\n（一）作为班主任，听到同学这样的反应，我首先会暗示反映的同学不必把他看见的情况到处宣扬。我知道处于青春萌动期的孩子对异性互相倾慕的现象属于正常的心理反应。不必大惊小怪，更不能武断、鲁莽的3\n小学班主任基本功竞赛情景问题现场答辩参考第一题 场景：老师办公室\n内容：老师批评学生上课违反课堂纪律，影响同学学习。前提是因为此问题已经多次请家长到校谈话，没有效果。因此，老师提出了解决的办法，就是从明天起，家长陪同孩子上课。\n问题：你认为该班主任的想法和做法是否正确，为什么？如果你的班上有这样的学生，你怎么办？点评：\n1、课堂纪律属于老师管理范畴，长期处理该生而没有效果是老师管理方法不当。\n2、家长对于孩子在课堂上的表现没有直接责任属于家庭教育配合范畴。\n3、班主任应当调查学生扰乱课堂纪律的原因，寻找解决问题的途径。\n如该生和他人讨论老师所讲问题过于随意，声音过大而影响课堂纪律，应该用积极的方法引导他到正确发言的轨道上来；\n如该生和同学聊与课堂无关的话题，一方面说明老师讲课不吸引人，无趣无味，那么老师就要在自己身上找原因；另一方面应以该生为重点在其周围进行尊重老师讲课，尊重同学听课的教育或讨论，引导大家都学会尊重他人讲话；第三要重点对该生进行学习态度和学习方法的教导，使其懂得上课说话是放弃学习的机会，而学习是学生的义务；第四要使用各种方法使其尝到成功的甘甜，让小成功成为其今后大成功的阶梯。\n第二题 场景：教室里，上课过程中\n内容：两名学生上课玩东西，吸引了教师的注意力，肯定也吸引了部分学生的注意力，教师没有上课批评他们，而是让学生下课找老师面谈。\n问题：你认为教师该不该及时解决学生不听讲的问题？教师请学生下课找老师，你认为老师可能会做什么？\n点评：\n1、对于学生上课玩东西或其他不守纪律的问题，如果没有影响大面积的学生上课，如果没有阻断教师讲课，教师应该适当提醒后，下课再解决学生的问题。\n内容：老师找学生谈话，批评学生不专心听讲，而此刻老师一会接电话，一会和同事聊天，一会刷指甲油，使得学生对老师的批评无所谓，还不时插嘴教师之间的谈话。问题：你认为在处理学生问题时，老师存在哪些问题？\n点评：\n1、教师的言行是学生的榜样，学生无时无刻不在模仿着老师，这是未成年人的学习方法之一。教育学生做事专心，教师就应该首先做到做事专心。\n2、找学生谈话时教师的态度应该诚恳、认真，这是对学生的尊重，学生在言传身教的过程中才能学会尊重他人。\n3、要求学生发型服饰符合学生的身份和标准，教师更要为人师表，上班时间教师不应该涂抹指甲油，更不应该当着学生面涂抹指甲油。第四题 场景：教室，班会正在进行\n内容：班主任正在召开班会，班级没有形成良好的班风，学生在各方面表现出纪律涣散，缺乏上进心。因此，就是否参加学校即将召开的队列比赛，班主任召开了班会，让学生来讨论做结论。问题：开展班级建设，班主任有没有必要召开班会？班主任召开班会的目的是什么？\n点评：树立良好的班风，用班会的形式比较好，提出问题，让学生自己讨论，自己教育自己，形成积极的氛围，达成共同的愿景，师生承诺容易共同的内容，严格执行。第五题 场景：在老师办公室里，班主任和一学生家长交流学生情况\n内容：老师向家长反映该生近来常常欺负同学，不少同学经常告状，学生家长也有反映，希望家长能配合学校说服教育孩子。但是，第二天，家长气势汹汹地找到老师，说自己的孩子说了，没有平白无故地欺负别人，都是别人招他，他是自卫行为。\n问题：如何解决这样的学生问题？如何面对这样的家长？\n第三篇：班主任工作技能比赛现场答辩题目及参考答案\n班主任工作技能比赛现场答辩题目及参考答案\n（解决问题的方法永远都不是唯一的，所提供的答案仅供参考，期待有更多更好的答案涌现出来。）\n（1）案例简述：班主任布置学生写生活随笔《我的家庭》，结果一个写作很好的女生留给老师一张纸条，写着：“父亲是个酒鬼、烟鬼兼赌徒，在遥远的新疆工作。我问过母亲为什么与父亲结合。母亲无言。后来我自己搞清了，母亲是为了生存，而父亲是为了逃避家长安排的婚姻。原来我是他们随随便便结合的产物，我鄙视他们。”\n问题：\n1、请分析这个学生的心理？\n2、如何帮助这个学生走出目前的状态？\n参考答案：\n1、感受不到父母的爱；对父母失望；埋怨父母，因此也不爱父母。\n2、A.让学生理解父母当初也许只是一种无奈的选择。B、婚姻虽然不幸福，但是，最终没选择离婚，是为了孩子的幸福。C、想想生活中父母对他的付出，理解父母对他的爱。D.学会感恩父母，作为子女，尽量去弥补父母之间的间隙。\n（2）案例简述：学生每天中午都吃学校的盒饭，一天，班主任发现垃圾桶附近饭盒扔得到处都是，就请在场的同学清理。可在场的同学却说：“这事一直都是小东在做，我们不管！”小东是刚从外校转来的，家境很贫寒，人也很老实。\n问题：这时，班主任应该怎么做？可以从哪些方面来教育学生？ 参考答案：老师与在场的同学一起清理干净。事后再找机会与学生谈心，或以班会或其他形式，让学生明白：A.要保护环境卫生。B.同学之间是平等的，工作应该是大家分着做。C.同学之间应该互相关爱。\n（3）案例简述：班上张强和汪波打了起来，被值日老师抓到班主任处。班主任问原因，张强和汪波异口同声的指责对方，强调自己的道理。\n问题：\n1、这时班主任应该怎么做？\n2、你如何认识学生自我教育的作用？\n参考答案：1.先耐心听学生谈事情的经过，弄清楚事情真相，从中判断各自承担什么责任。再让学生谈打架的害处；之后让学生讨论他们各自应当承担什么责任。2.苏联教育家苏霍姆林斯基曾经这样说过:“具有能够激发学生去进行自我教育的教育才是真正的教育。真正的教育只有当学生有自我教育的要求时才能实现。” 当今学生自我主见比较强,很有自己的思想,所以有一部分学生会不听别人的劝告,包括家长的和老师的，总是坚持自己的意见和做自己的事。因此,加强学生的自我教育非常重要。目的是让学生自己悟出道理来,而不是老师苦口婆心的说道理。自我教育的途径多种多样，比如:自信疗法、培养自己的意志力、树立正确的学习目标、培养自己的学习兴趣、调节自己的情绪、自我反省等。\n（4）案例简述：班上有“四大金刚”，一个班干部，三个课代表。有的同学反映，他们四个很团结，个个都很牛，谁给他们提意见，不仅听不进去，还可凶了。\n问题：\n1、你认为该怎么做？\n2、班主任如何看待班级中的“非正式群体”？\n参考答案：非正式群体是在与同伴交往过程中自发形成的，对学生的心理品质发展乃至日常学习、生活极具影响力，值得老师们注意。如果非正式群体的价值取向、目标、行为规范与班集体一致时，会对班集体的形成起到促进作用，但值得我们重视的是，非正式群体也有偏离集体、偏离正确舆论的时候，这时就要求我们教育者适度介入，适度引导，将其纳入班集体的发展轨道。而对于对立（反抗）型的小群体成员，教师更应当更多的关注、接近和亲近他们，发其闪光点，及时强化，作耐心细致的思想工作，切忌简单、粗暴。\n对于各类非正式群体，我们可以：\n1、利用非正式群体成员间的感情基础，增进同学间友谊、增强班集体的凝聚力。\n2、利用非正式群体成员间畅通的信息管道，了解学生的思想动态和对班集体管理的一些意见和建议。\n3、培养、培训非正式群体的领导者，形成强而有力，管而有效的班干部集体。\n5)\n案例简述：有一天早晨当我来到教室，听见里面吵吵闹闹，推开门一看，只见两个女生正在吵架，大有兵戎相见之势。我当时非常生气，本想冲过去严厉批评她们一顿，但理智告诉我，这时她们正在气头上，万一弄不好，她们同我顶上了，那可下不了台。于是，我咳了一声，同学们见了我都乖乖地坐到了座位上。我装作不知道发生了什么事，笑吟吟地指着窗外的稻秧道：“稻花香里说丰年”，这一大家都熟悉的句子，一下子把学生的注意力吸引过来，情不自禁地“哇声一片”。\n问题：\n1、请评价该班主任的做法？\n2、你是如何处理类似事件的？\n参考答案：班主任机智地用学生熟悉的诗句把窗外的水稻与现场的情景串起来，转移了学生的注意力，淡化了火药味，避免的了师生之间的尴尬，体现了教育的艺术性。事后老师也要看看有没必要再找两位女生了解情况。\n6)\n案例简述：班长是个重要角色。选谁当班长啊？最后我把目光停留在小华身上，小华的品性、威信„„都合适。我向小华讲了我的想法，她默默无语。直到最后，也没有回答我。当天晚上，我又接到小华妈妈的电话，小华妈妈说了许多理由，拒绝了我。\n问题：\n1、如果是你接下来怎么做？\n2、你怎样建立班委会的？\n参考答案：做她妈妈的工作，让她明白，她的孩子很优秀，做班长是对她的进一步的锻炼和培养。2.先要在班上明确班委会的组成及分工，然后通过民主与集中的方法组建班委全，再次要经常培养班干部。7)\n案例简述：学校举行篮球联赛，我班有绝对的实力取胜，全班同学都很兴奋。可决赛时，由于队员们轻敌、对手实力也确实很强，所以我班比分的落后，学生情绪有点焦躁；中场休息时，我班啦啦队的助兴表演又遭到对方的无故起哄，虽然同学们都很生气，但是当对方的啦啦队上场时，我班学生还是报以热烈的掌声。同时更用力的为场上队员加油，场上的队员也在奋力地拚抢，力争缩小与对手的差距，可是结果还是输了。同学们泪流满面，默默无声地坐在地上，没有互相埋怨，牵着手向教室走。\n问题：\n1、你怎样看待这次输球？\n2、你认为体育活动对班集体有何作用？\n参考答案：1.虽然对这次联赛有影响，但对班集体后续的发展会有良好的推动。学生充分体验了骄傲、轻敌的危害，而且表现出来的文明礼貌、失败后没有互相埋怨，牵手向教室走、拼搏精神以及强烈的班集体荣誉感，都会推动班级各方面把发展。2.增强学生集体荣誉感，增强学生团结互助精神，理解团结拼搏的体育精神。\n8)\n案例简述：班上有个同学身体有一些残疾，走路有一些跛，班级有些同学常学她走路的样子，开他的玩笑，还给她起外号。作为班主任，我觉得应当批评那些不尊重残疾同学的行为。但转念一想，这样一来会伤害残疾学生的自尊心，我一直在寻找一个恰当的方法。问题\n1、请你给她找到一个恰当的办法？\n2、请你说说自己对生命特点尊重的理解？\n参考答案：通过主题班会等多种形式，给学生介绍一些残疾人的成功事迹，让学生明白，不管什么样的生命特点，都有可能为社会作贡献，引以学生讨论、理解、尊重生命特点。也可以写周记，比如，“如果我是残疾人”。\n9)\n案例简述：班主任正在认真地向学生布置着大扫除任务。话音未落，王明同学立即说了句笑话惹得同学们哄堂大笑起来。班主任措手不及，怒火中烧，这不是明摆着对老师公开挑衅吗？“王明，你„„你简直太过分了！”班主任竟一时语塞。\n问题\n1、分析王明的心态？\n2、你认为应该怎样处理类似情况？\n参考答案：1.也许他只是搞笑，也许他是故意捣乱，也有可能是公开挑衅老师。2.冷处理，当场不要发火，可以当作没听到，甚至一笑而过。事后可以私底下找王明好好谈谈，了解他这样做的原因，并给予相应的教育。\n10)\n案例简述：自从作了班主任，他不敢有所松懈，平时从早上的早读课开始他就到班检查，中午还经常跟班上学生坐在一起吃饭、聊天，晚上也要等学生全部回家后自己才回家，遇到事情总要对学生千叮咛万嘱咐，生怕没做到自己该做的事情。“满以为尽到了做班主任的责任，可是有些同学不理解，认为老师跟得太紧，象监督他们一样，甚至有些同学对老师产生抵触情绪。问题：1.请你分析产生这种问题的原因，2.你认为他应该怎么办？\n参考答案：每个学生都希望老师严格管理，都希望老师与他多接触。并不是老师的“跟得紧”让学生不理解，应该从老师的工作方法上寻找产生这种问题的原因，比如师生的交流方式是否符合学生的年龄特点，怎么样让学生感受到老师对他们的关爱等。\n11)\n案例简述：数学老师反映班上有一个姓赵的同学不知何故连续3天不交数学作业。班主任把小赵叫到办公室问他：”你为什么不交作业？“他低头不语。给他讲学习的意义，做作业的重要性„„他还是一言不发。”作为班主任的你火了，大发雷霆，责令小赵：必须当天把所缺作业补齐。否则„„你原以为这最后通牒一定起作用，谁知，第二天小赵不但没有把作业补上，反而不进教室上课了。这下你没辙了，可是若让他开了先例，再有效仿的，那以后教学还怎么进行？ 问题：\n1、请你分析该班主任的做法？\n2、对不交作业的学生该如何处理？\n参考答案：1.班主任把小赵叫到办公室，给他讲学习的意义，做作业的重要性。这些做法是没问题的；大发雷霆，下最后通牒的做法是不可取的，轻易发火容易激化师生矛盾，不利于解决问题。这种做法也容易使老师下不了台。2.了解学生不交作业的原因，学生不回答，也可以从侧面去了解，比如问同学，问家长学生在家里情况等。然后针对学生的具体情况再找他谈。\n12)\n案例简述：“不同名数不可相加”，可却发生了这样一件事：一位教数学的班主任在强调不同名数不可相加这一概念时，用反问的形式向全班同学说：“一头牛和一匹马能相加吗？”一名学生脱口而出：“能，等于两头牲畜。”教师勃然大怒，他喝令这名学生站起来，厉声训斥道：“你妈和你爸相加能等于两头动物吗？”学生顿时伸手推了老师一下，全班同学一片哗然。\n问题：\n1、如果是你，这时你怎么做？\n2、说说你认为很糟的班主任忌语！\n参考答案：1.教师应该勇敢地马上向学生道歉，检讨自己刚才讲的话是错误的，并请学生原谅。这反而是显示了自己的大度。并以自己作为反面教材，教育学生要使用文明用语，不说侮辱性语言。2.你真蠢！你是猪！我从来没见过这么蠢的学生。你没救了。真不明白你父母是怎么生出你来的。你真没教养。\n13)一个女学生家境不好，本人相貌也很一般，虽然为人本份，学习也很刻苦，但成绩仍不突出，别人对她也是不冷不热。她感到这个世界对她太平公平；你这样做的理由？别人那么有钱，那么漂亮，那么聪明？于是她有了轻生的念头，留了纸条就跑出去了。你找到她时，她已经在外面游荡两天。\n问题：面对神情呆滞、了无生气的她，你是怎么做的？你这样做的理由？\n参考答案：不批评、不责骂，只是轻轻地说，你饿了吗？然后我们去吃点东西。我们一起回学校吧。你知道老师和父母是多么地着急啊（给她关心）。你在老师心目中，„„（说她的优点，给她自信）。我们没有选择父母的权利，但我们有选择奋斗，自立自强的机会（给她希望）。\n14)同学们议论纷纷,说张日和李诗正在谈恋爱,但你怎么都不相信,因为他们俩在各方面的表现是那么的优秀。可是,那个下雨天的傍晚,在公交车站,你竟与搂腰共伞并向对方嘴里送巧克力的张李二人不期而遇了.问题：此时你会怎么做？你这样做的理由？\n参考答案：装作没看到，事后另找时间与他们阐述早恋的危害。理由是：如果当场点破或批评，会使他们很没面子，增大心理压力，甚至对老师有抵触情绪，破坏了师生感情。如果给他们面子，保留一些美好的东西，再阐述早恋的危害，他们会更容易接受。\n15)一位后进生，家长恨铁不成钢，教育的方式方法简单粗暴，动不动就拳脚相加，孩子越打越顽皮，与家长产生对抗情绪。家长悲叹不已，叫你对她的孩子不要客气，即使打也无所谓。问题：你会怎么做？你这样做的理由？\n参考答案：劝阻家长，不要随便打学生；多了解学生在家的情况；与家长多谈教育孩子的方法，说服家长多给学生一些关心、爱护、鼓励。另一方面，与学生沟通，学会理解父母的爱，明白父母的苦心。改正缺点，让家长开心。\n16)你带的班，在学校每月开展一次的文明班评选活动中，将近一年了，还没被评上过一次。你很着急，对照文明班的评选条件，召开了一次班会，让同学们寻找差距，分析原因，想想办法。会上，同学们都把矛头指向那几个后进生，纷纷指责他们拖后退，这几位后进生却不服。\n问题：你会怎么做？你这样做的理由？\n参考答案：先自己向学生做检讨自己工作的不足，自己承担主要责任。然后让学生明白，每个学生都有责任，让学生反省、讨论自己应该承担什么责任。再分析还有班上哪些工作没做好，寻找差距，找出不足，怎么去改进。理由是：老师要做好敢于承担责任的表率；教育学生勇于承担责任；让学生知道接下来工作怎么做。\n17)制定班主任工作计划的依据是什么？\n参考答案：1.上级指示。包括党和国家的教育方针、政策和法规，以及上级教育行政部门的指示和要求。2.学校要求。学校工作计划是制定班主任工作计划的直接依据。3.班级情况。包括“学生人员构成”、“学习状况”、“思想状况”、“体质状况”、“骨干状况”、“班级特点”等。4.以教育科学理论为基础。班主任工作计划必须符合教育工作的现律和青少年身心发展的规律。5.间接经验。学习和借鉴别人的管理经验，博众人之长，取百家精华。6.考虑到各方面的条件。应考虑学校条件、任课教师条件和班主任自身条件等，确保工作计划实施的可行性。\n18)如何教育学生遵守纪律？\n参考答案：（1）培养学生分清是非的能力；（2）通过各种活动增强学生对纪律的感性认识，增强学生对纪律的理性理解，而且坚信其必要性和正确性。（3）让学生懂得纪律要求。（4）创设条件，让学生在纪律实践中产生积极的纪律体验，从而形成自愿遵守、主动执行、积极维护的良好心理基础。（5）锻炼学生的纪律意志力，培养学生自我克制能力。\n19)班主任工作职责有哪些？\n参考答案：（1）做好学生思想品德教育。（2）努力建设好班集体。（3）抓好学生的学习质量。（3）关心学生的生活和身心健康。（4）组织和指导学生开展课外校外活动。（5）培养学生自治自理能力。（6）做好学生的家长工作和社会工作。（7）做好班级常规工作等。（8）做好本班学生思想品德评定和有关奖惩工作。\n20)影响师生关系的因素主要有哪些？举例说明。\n参考答案：（1）教师知识的拥有量。（2）教与学的水平。（3）情感、态度和价值观的吻合度。（4）师生性格的一致程度。（5）师生相互信任的程度。\n21)为什么班主任对学生要采取宽容态度?\n参考答案：班主任对学生必须采取宽容的态度，这是相对于某些班主任动不动就对学生采取惩罚而言的。惩罚太多收不到教育效果，班主任对学生必须采取宽容的态度是教育学生的需要，这是因为:\n一、班主任对学生采取宽容的态度，可以缓和学生的紧张情绪，有利于学生更好地接受班主任的教育。如果一个班主任对学生，特别是对那些所谓差生，动不动就施以惩罚，往往会使学生的情感朝相反的两极发展；一是，对个性软弱的学生来说，由于屈服于教师的惩罚，多半会变得消极自卑；再是，对个性倔强的学生来说，对班主任的惩罚思想上容易产生强烈的不满，甚至公开对抗，顶牛，对教师失去信任感，教师的教育他也听不进去，对他也不起作用。而教师对学生的宽容所带来的心理效应恰好相反。由于学生在犯了错误后，得到的是教师的谅解和宽容，他就会重新评价教师的行为并从情感上与教师接近了一步。这样，就缓和了学生的紧张情绪而乐意接受老师对他的教育。\n二、对学生的宽容体现了教师对学生的热爱，有利于教师对学生的教育。每个学生都希望能得到教师的爱，当一个学生犯了错误，教师不是随便施以惩罚，而是循循善诱，耐心教育，给以谅解和信任。这就充分体现了教师对学生的热爱，教师的这种热爱有利于教师对学生的教育，也会成为推动学生改正缺点和错误的动力。\n三、班主任对学生的宽容能调节师生之间的关系。滥用惩罚而造成师生关系紧张，这是每个班主任所熟悉的。那些好用惩罚的班主任与学生的关系不仅在校时显得很不融洽，即或学生毕业后走上了社会，也对班主任仍然有着极不好的印象。然而宽容却会改变这种关系，他会使师生关系融洽，尤其是当一个贯用惩罚的班主任，如果在以后的教育中改变这种作法而代之以宽容，那么，过去那种紧张的师生关系将会很快得到改变，换来的将是相互尊重、相互关心。因此，我们说，宽容能调节师生之间的关系。\n既然宽容有如此之多的可取之处，我们建议所有的班主任都来宽容你们的学生吧!当然，也应强调一句，我们说宽容是教育学生的必需但也并不全排斥必须要的惩罚。\n22)某特级教师说:“学生是在犯错误中成长起来的，因此，要允许他们犯错误，要正确对待他们的犯错误„„”。问题：你认为这句话对吗?为什么？\n参考答案：\n首先应该肯定，这位特级教师的话是完全正确的，学生的确是在不断犯错误的过程中成长起来的。\n其次，这是他们的心理特点决定的。青少年儿童有一个共同的心理特点，就是好奇心重，由于好奇心的驱使，不管该做或不该做的事情，能做或不能做的事情，他们都要去探究一下，去尝试一下，结果是“心有余而力不足”，导致了犯错误。\n再次，由于他们年龄小，经验很不足，辨别能力又很低，对什么是对的，什么是不对的，往往分辨不清，结果也导致了他们犯错误。\n第四，他们缺乏抵制能力和自制能力也是使得他们经常犯错误的原因。\n第五，错误的模仿也是使他们犯错误的一个原因。他们往往模仿成人的一些错误言行，从而使得自己犯了错误„„。\n因而，必须正确对待，循循善诱，千万不要一见他们出现错误就横加指责，粗暴对待，而是应该改进教育方法使他们尽可能的少犯错误。\n23)养成教育的主要内容有哪些？\n参考答案：《中共中央关于改革和加强中小学德育工作的通知》中明确指出：贯彻中小学生日常行为规范，培养学生良好的道德品质和道德行为是养成教育的主要内容。可以具体化为七个方面。①尊敬国旗、国徽。要求学生做到：升国旗、唱国歌及整个升旗仪式中要庄严、肃立。②文明礼貌。③遵纪守法。④站、立、走、坐、说话、写字、举手、敬礼等方面的常规要求。⑤劳动教育。⑥培养自觉学习的好习惯。按时完成作业，上课专心听讲，爱护学习用具、书包、铅笔、铅笔盒、课桌椅等。并能经常清理、码放整齐。⑦卫生，仪表。搞好个人卫生、勤洗澡、勤换衣。衣着打扮要整洁大方，学生化。不带头饰和各种首饰。\n第四篇：班主任工作技能比赛现场答辨题目\n1)案例简述：班主任布置学生写生活随笔《我的家庭》，结果一个写作很好的女生留给老师一张纸条，写着：“父亲是个酒鬼、烟鬼兼赌徒，在遥远的新疆工作。我问过母亲为什么与父亲结合。母亲无言。后来我自己搞清了，母亲是为了生存，而父亲是为了逃避家长安排的婚姻。原来我是他们随随便便结合的产物，我鄙视他们。”\n问题：\n1、请分析这个学生的心理？\n2、如何帮助这个学生走出目前的状态？\n2)案例简述：学生每天中午都吃学校的盒饭，一天，班主任发现垃圾桶附近饭盒扔得到处都是，就请在场的同学清理。可在场的同学却说：“这事一直都是小东在做，我们不管！”小东是刚从外校转来的，家境很贫寒，人也很老实。\n问题：这时，班主任应该怎么做？可以从哪些方面来教育学生？\n3)案例简述：班上张强和汪波打了起来，被值日老师抓到班主任处。班主任问原因，张强和汪波异口同声的指责对方，强调自己的道理。\n问题：\n1、这时班主任应该怎么做？\n2、你如何认识学生自我教育的作用？\n4)案例简述：班上有“四大金刚”，一个班干部，三个课代表。有的同学反映，他们四个很团结，个个都很牛，谁给他们提意见，不仅听不进去，还挺凶。\n问题：\n1、你认为该怎么做？\n2、班主任如何看待班级中的“非正式群体”？\n5)案例简述：有一天早晨当我来到教室，听见里面吵吵闹闹，推开门一看，只见两个女生正在吵架，大有兵戎相见之势。我当时非常生气，本想冲过去严厉批评她们一顿，但理智告诉我，这时她们正在气头上，万一弄不好，她们同我顶上了，那可下不了台。于是，我咳了一声，同学们见了我都乖乖地坐到了座位上。我装作不知道发生了什么事，笑吟吟地指着窗外的稻秧道：“稻花香里话丰年”，这一大家都熟悉的句子，一下子把学生的注意力吸引过来，情不自禁地“哇声一片”。\n问题：\n1、请评价该班主任的做法？\n2、你是如何处理类似事件的？\n6)案例简述：班长是个重要角色。选谁当班长啊？最后我把目光停留在小华身上，小华的品性、威信……都合适。我向小华讲了我的想法，她默默无语。直到最后，也没有回答我。当天晚上，我又接到小华妈妈的电话，小华妈妈说了许多理由，拒绝了我。\n问题：\n1、如果是你接下来怎么做？\n2、你怎样建立班委会的？\n7)案例简述：学校举行篮球联赛，我班有绝对的实力取胜，全班同学都很兴奋。可决赛时，由于队员们轻敌、对手实力也确实很强，所以我班比分的落后，学生情绪有点焦躁；中场休息时，我班啦啦队的助兴表演又遭到对方的无故起哄，虽然同学们都很生气，但是当对方的啦啦队上场时，我班学生还是报以热烈的掌声。同时更用力的为场上队员加油，场上的队员也在奋力地拚抢，力争缩小与对手的差距，可是结果还是输了。同学们泪流满面，默默无声地坐在地上，没有互相埋怨，牵着手向教室走。\n问题：\n1、你怎样看待这次输球？\n2、你认为体育活动对班集体有何作用？\n8)案例简述：班上有个同学身体有一些残疾，走路有一些跛，班级有些同学常学她走路的样子，开他的玩笑，还给她起外号。作为班主任，我觉得应当批评那些不尊重残疾同学的行为。但转念一想，这样一来会伤害残疾学生的自尊心，我一直在寻找一个恰当的方法。\n问题\n1、请你给她找到一个恰当的办法？\n2、请你说说自己对生命特点尊重的理解？\n9)案例简述：自从作了班主任，他不敢有所松懈，平时从早上的早读课开始他就到班检查，中午还经常跟班上学生坐在一起吃饭、聊天，晚上也要等学生全部回家后自己才回家，遇到事情总要对学生千叮咛万嘱咐，生怕没做到自己该做的事情。“满以为尽到了做班主任的责任，可是有些同学不理解，认为老师跟得太紧，象监督他们一样，甚至有些同学对老师产生抵触情绪。\n问题：1.请你分析产生这种问题的原因，2.你认为他应该怎么办？\n10)案例简述：数学老师反映班上有一个姓赵的同学不知何故连续3天不交数学作业。班主任把小赵叫到办公室问他：”你为什么不交作业？“他低头不语。给他讲学习的意义，做作业的重要性…他还是一言不发。”作为班主任的你火了，大发雷霆，责令小赵：必须当天把所缺作业补齐。否则……你原以为这最后通牒一定起作用，谁知，第二天小赵不但没有把作业补上，反而不进教室上课了。这下你没辙了，可是若让他开了先例，再有效仿的，那以后教学还怎么进行？\n问题：\n1、请你分析该班主任的做法？\n2、对不交作业的学生该如何处理？\n11)案例简述：“不同名数不可相加”，可却发生了这样一件事：一位教数学的班主任在强调不同名数不可相加这一概念时，用反问的形式向全班同学说：“一头牛和一匹马能相加吗？”一名学生脱口而出：“能，等于两头牲畜。”教师勃然大怒，他喝令这名学生站起来，厉声训斥道：“你妈和你爸相加能等于两头动物吗？”学生顿时伸手推了老师一下，全班同学一片哗然。\n问题：\n1、如果是你，这时你怎么做？\n2、说说你认为很糟的班主任忌语！\n12)一个女学生家境不好，本人相貌也很一般，虽然为人本份，学习也很刻苦，但成绩仍不突出，别人对她也是不冷不热。她感到这个世界对她太平公平；你这样做的理由？别人那么有钱，那么漂亮，那么聪明？于是她有了轻生的念头，留了纸条就跑出去了。你找到她时，她已经在外面游荡两天。问题：面对神情呆滞、了无生气的她，你是怎么做的？你这样做的理由？\n13)同学们议论纷纷,说张日和李诗正在谈恋爱,但你怎么都不相信,因为他们俩在各方面的表现是那么的优秀。可是,那个下雨天的傍晚,在公交车站,你竟与搂腰共伞并向对方嘴里送巧克力的张李二人不期而遇了.问题：此时你会怎么做？你这样做的理由？\n14)一位后进生，家长恨铁不成钢，教育的方式方法简单粗暴，动不动就拳脚相加，孩子越打越顽皮，与家长产生对抗情绪。家长悲叹不已，叫你对她的孩子不要客气，即使打也无所谓。问题：你会怎么做？你这样做的理由？\n15)你带的班，在学校每月开展一次的文明班评选活动中，将近一年了，还没被评上过一次。你很着急，对照文明班的评选条件，召开了一次班会，让同学们寻找差距，分析原因，想想办法。会上，同学们都把矛头指向那几个后进生，纷纷指责他们拖后退，这几位后进生却不服。\n问题：你会怎么做？你这样做的理由？\n16)我们教育孩子要懂得感恩，经常教育引导孩子知道感恩父母，可是有的家长反映，这么引导对于单亲孩子来说，会对他们的心理造成伤害，造成负面影响。作为班主任，你如何看待？你会怎么做？\n17)目前，学生的课外作业是师生及家长普遍关注的问题，有的认为作业过重，影响了学生的身心发展，有的认为作业是学生学习成绩提高的重要途径。你作为班主任怎么对待学生作业？如何调控本班学生作业?\n18)我校多年来一直重视学生的素质教育，通过开展丰富多彩的活动，使学生的特长得到发挥，活动必然需要时间，有的老师认为这样就会影响学生的学习成绩，不主张搞课外活动，你对这种现象有什么认识？认为该怎么做?\n太和经济开发区学区班主任基本功大赛\n面试题目及参考答案\n1)案例简述：班主任布置学生写生活随笔《我的家庭》，结果一个写作很好的女生留给老师一张纸条，写着：“父亲是个酒鬼、烟鬼兼赌徒，在遥远的新疆工作。我问过母亲为什么与父亲结合。母亲无言。后来我自己搞清了，母亲是为了生存，而父亲是为了逃避家长安排的婚姻。原来我是他们随随便便结合的产物，我鄙视他们。”\n问题：\n1、请分析这个学生的心理？\n2、如何帮助这个学生走出目前的状态？\n参考答案：\n1、感受不到父母的爱；对父母失望；埋怨父母，因此也不爱父母。\n2、A.让学生理解父母当初也许只是一种无奈的选择。B、婚姻虽然不幸福，但是，最终没选择离婚，是为了孩子的幸福。C、想想生活中父母对他的付出，理解父母对他的爱。D.学会感恩父母，作为子女，尽量去弥补父母之间的隔阂。\n2)案例简述：学生每天中午都吃学校的盒饭，一天，班主任发现垃圾桶附近饭盒扔得到处都是，就请在场的同学清理。可在场同学却说：“这事一直都是小东在做，我们不管！”小东是刚从外校转来的，家境很贫寒，人也老实。\n问题：这时，班主任应该怎么做？可以从哪些方面来教育学生？\n参考答案：老师与在场的同学一起清理干净。事后再找机会与学生谈心，或以班会或其他形式，让学生明白：A.要保护环境卫生。B.同学之间是平等的，工作应该是大家分着做。C.同学之间应该互相关爱。\n3)案例简述：班上张强和汪波打了起来，被值日老师抓到班主任处。班主任问原因，张强和汪波异口同声的指责对方，强调自己的道理。问题：\n1、这时班主任应该怎么做？\n2、你如何认识学生自我教育的作用？ 参考答案：1.先耐心听学生谈事情的经过，弄清楚事情真相，从中判断各自承担什么责任。再让学生谈打架的害处；之后让学生讨论他们各自应当承担什么责任。2.苏联教育家苏霍姆林斯基曾经这样说过:“具有能够激发学生去进行自我教育的教育才是真正的教育。真正的教育只有当学生有自我教育的要求时才能实现。” 当今学生自我主见比较强,很有自己的思想,所以有一部分学生会不听别人的劝告,包括家长的和老师的，总是坚持自己的意见和做自己的事。因此,加强学生的自我教育非常重要。目的是让学生自己悟出道理来,而不是老师苦口婆心的说道理。自我教育的途径多种多样，比如:自信疗法、培养自己的意志力、树立正确的学习目标、培养自己的学习兴趣、调节自己的情绪、自我反省等。\n4)案例简述：班上有“四大金刚”，一个班干部，三个课代表。有的同学反映，他们四个很团结，个个都很牛，谁给他们提意见，不仅听不进去，还可凶了。\n问题：\n1、你认为该怎么做？\n2、班主任如何看待班级中的“非正式群体”？\n参考答案：非正式群体是在与同伴交往过程中自发形成的，对学生的心理品质发展乃至日常学习、生活极具影响力，值得老师们注意。如果非正式群体的价值取向、目标、行为规范与班集体一致时，会对班集体的形成起到促进作用，但值得我们重视的是，非正式群体也有偏离集体、偏离正确舆论的时候，这时就要求我们教育者适度介入，适度引导，将其纳入班集体的发展轨道。而对于对立（反抗）型的小群体成员，教师更应当更多的关注、接近和亲近他们，发其闪光点，及时强化，作耐心细致的思想工作，切忌简单、粗暴。对于各类非正式群体，我们可以：\n1、利用非正式群体成员间的感情基础，增进同学间友谊、增强班集体的凝聚力。\n2、利用非正式群体成员间畅通的信息管道，了解学生的思想动态和对班集体管理的一些意见和建议。\n3、培养、培训非正式群体的领导者，形成强而有力，管而有效的班干部集体。5)案例简述：有一天早晨当我来到教室，听见里面吵吵闹闹，推开门一看，只见两个女生正在吵架，大有兵戎相见之势。我当时非常生气，本想冲过去严厉批评她们一顿，但理智告诉我，这时她们正在气头上，万一弄不好，她们同我顶上了，那可下不了台。于是，我咳了一声，同学们见了我都乖乖地坐到了座位上。我装作不知道发生了什么事，笑吟吟地指着窗外的稻秧道：“稻花香里说丰年”，这一大家都熟悉的句子，一下子把学生的注意力吸引过来，情不自禁地“哇声一片”。\n问题：\n1、请评价该班主任的做法？\n2、你是如何处理类似事件的？\n参考答案：班主任机智地用学生熟悉的诗句把窗外的水稻与现场的情景串起来，转移了学生的注意力，淡化了火药味，避免的了师生之间的尴尬，体现了教育的艺术性。事后老师也要看看有没必要再找两位女生了解情况。\n6)案例简述：班长是个重要角色。选谁当班长啊？最后我把目光停留在小华身上，小华的品性、威信……都合适。我向小华讲了我的想法，她默默无语。直到最后，也没有回答我。当天晚上，我又接到小华妈妈的电话，小华妈妈说了许多理由，拒绝了我。\n问题：\n1、如果是你接下来怎么做？\n2、你怎样建立班委会的？\n参考答案：做她妈妈的工作，让她明白，她的孩子很优秀，做班长是对她的进一步的锻炼和培养。2.先要在班上明确班委会的组成及分工，然后通过民主与集中的方法组建班委全，再次要经常培养班干部。\n7)案例简述：学校举行篮球联赛，我班有绝对的实力取胜，全班同学都很兴奋。可决赛时，由于队员们轻敌、对手实力也确实很强，所以我班比分的落后，学生情绪有点焦躁；中场休息时，我班啦啦队的助兴表演又遭到对方的无故起哄，虽然同学们都很生气，但是当对方的啦啦队上场时，我班学生还是报以热烈的掌声。同时更用力的为场上队员加油，场上的队员也在奋力地拚抢，力争缩小与对手的差距，可是结果还是输了。同学们泪流满面，默默无声地坐在地上，没有互相埋怨，牵着手向教室走。\n问题：\n1、你怎样看待这次输球？\n2、你认为体育活动对班集体有何作用？\n参考答案：1.虽然对这次联赛有影响，但对班集体后续的发展会有良好的推动。学生充分体验了骄傲、轻敌的危害，而且表现出来的文明礼貌、失败后没有互相埋怨，牵手向教室走、拼搏精神以及强烈的班集体荣誉感，都会推动班级各方面把发展。2.增强学生集体荣誉感，增强学生团结互助精神，理解团结拼搏的体育精神。\n8)案例简述：班上有个同学身体有一些残疾，走路有一些跛，班级有些同学常学她走路的样子，开他的玩笑，还给她起外号。作为班主任，我觉得应当批评那些不尊重残疾同学的行为。但转念一想，这样一来会伤害残疾学生的自尊心，我一直在寻找一个恰当的方法。\n问题\n1、请你给她找到一个恰当的办法？\n2、请你说说自己对生命特点尊重的理解？\n参考答案：通过主题班会等多种形式，给学生介绍一些残疾人的成功事迹，让学生明白，不管什么样的生命特点，都有可能为社会作贡献，引以学生讨论、理解、尊重生命特点。也可以写周记，比如，“如果我是残疾人”。\n9)案例简述：自从作了班主任，他不敢有所松懈，平时从早上的早读课开始他就到班检查，中午还经常跟班上学生坐在一起吃饭、聊天，晚上也要等学生全部回家后自己才回家，遇到事情总要对学生千叮咛万嘱咐，生怕没做到自己该做的事情。“满以为尽到了做班主任的责任，可是有些同学不理解，认为老师跟得太紧，象监督他们一样，甚至有些同学对老师产生抵触情绪。问题：1.请你分析产生这种问题的原因，2.你认为他应该怎么办？\n参考答案：每个学生都希望老师严格管理，都希望老师与他多接触。并不是老师的“跟得紧”让学生不理解，应该从老师的工作方法上寻找产生这种问题的原因，比如师生的交流方式是否符合学生的年龄特点，怎么样让学生感受到老师对他们的关爱等。10)案例简述：数学老师反映班上有一个姓赵的同学不知何故连续3天不交数学作业。班主任把小赵叫到办公室问他：”你为什么不交作业？“他低头不语。给他讲学习的意义，做作业的重要性……他还是一言不发。”作为班主任的你火了，大发雷霆，责令小赵：必须当天把所缺作业补齐。否则……你原以为这最后通牒一定起作用，谁知，第二天小赵不但没有把作业补上，反而不进教室上课了。这下你没辙了，可是若让他开了先例，再有效仿的，那以后教学还怎么进行？\n问题：\n1、请你分析该班主任的做法？\n2、对不交作业的学生该如何处理？\n参考答案：1.班主任把小赵叫到办公室，给他讲学习的意义，做作业的重要性。这些做法是没问题的；大发雷霆，下最后通牒的做法是不可取的，轻易发火容易激化师生矛盾，不利于解决问题。这种做法也容易使老师下不了台。2.了解学生不交作业的原因，学生不回答，也可以从侧面去了解，比如问同学，问家长学生在家里情况等。然后针对学生的具体情况再找他谈。\n11)案例简述：“不同名数不可相加”，可却发生了这样一件事：一位教数学的班主任在强调不同名数不可相加这一概念时，用反问的形式向全班同学说：“一头牛和一匹马能相加吗？”一名学生脱口而出：“能，等于两头牲畜。”教师勃然大怒，他喝令这名学生站起来，厉声训斥道：“你妈和你爸相加能等于两头动物吗？”学生顿时伸手推了老师一下，全班同学一片哗然。问题：\n1、如果是你，这时你怎么做？\n2、说说你认为很糟的班主任忌语！\n参考答案：1.教师应该勇敢地马上向学生道歉，检讨自己刚才讲的话是错误的，并请学生原谅。这反而是显示了自己的大度。并以自己作为反面教材，教育学生要使用文明用语，不说侮辱性语言。2.你真蠢！你是猪！我从来没见过这么蠢的学生。你没救了。真不明白你父母是怎么生出你来的。你真没教养。\n12)一个女学生家境不好，本人相貌也很一般，虽然为人本份，学习也很刻苦，但成绩仍不突出，别人对她也是不冷不热。她感到这个世界对她太平公平；你这样做的理由？别人那么有钱，那么漂亮，那么聪明？于是她有了轻生的念头，留了纸条就跑出去了。你找到她时，她已经在外面游荡两天。问题：面对神情呆滞、了无生气的她，你是怎么做的？你这样做的理由？\n参考答案：不批评、不责骂，只是轻轻地说，你饿了吗？然后我们去吃点东西。我们一起回学校吧。你知道老师和父母是多么地着急啊（给她关心）。你在老师心目中，……（说她的优点，给她自信）。我们没有选择父母的权利，但我们有选择奋斗，自立自强的机会（给她希望）。\n13)同学们议论纷纷,说张日和李诗正在谈恋爱,但你怎么都不相信,因为他们俩在各方面的表现是那么的优秀。可是,那个下雨天的傍晚,在公交车站,你竟与搂腰共伞并向对方嘴里送巧克力的张李二人不期而遇了.问题：此时你会怎么做？你这样做的理由？\n参考答案：装作没看到，事后另找时间与他们阐述早恋的危害。理由是：如果当场点破或批评，会使他们很没面子，增大心理压力，甚至对老师有抵触情绪，破坏了师生感情。如果给他们面子，保留一些美好的东西，再阐述早恋的危害，他们会更容易接受。\n14)一位后进生，家长恨铁不成钢，教育的方式方法简单粗暴，动不动就拳脚相加，孩子越打越顽皮，与家长产生对抗情绪。家长悲叹不已，叫你对她的孩子不要客气，即使打也无所谓。问题：你会怎么做？你这样做的理由？\n参考答案：劝阻家长，不要随便打学生；多了解学生在家的情况；与家长多谈教育孩子的方法，说服家长多给学生一些关心、爱护、鼓励。另一方面，与学生沟通，学会理解父母的爱，明白父母的苦心。改正缺点，让家长开心。\n15)你带的班，在学校每月开展一次的文明班评选活动中，将近一年了，还没被评上过一次。你很着急，对照文明班的评选条件，召开了一次班会，让同学们寻找差距，分析原因，想想办法。会上，同学们都把矛头指向那几个后进生，纷纷指责他们拖后退，这几位后进生却不服。问题：你会怎么做？你这样做的理由？\n参考答案：先自己向学生做检讨自己工作的不足，自己承担主要责任。然后让学生明白，每个学生都有责任，让学生反省、讨论自己应该承担什么责任。再分析还有班上哪些工作没做好，寻找差距，找出不足，怎么去改进。理由是：老师要做好敢于承担责任的表率；教育学生勇于承担责任；让学生知道接下来工作怎么做。\n16)我们教育孩子要懂得感恩，经常教育引导孩子知道感恩父母，可是有的家长反映，这么引导对于单亲孩子来说，会对他们的心理造成伤害，造成负面影响。作为班主任，你如何看待？你会怎么做？\n参考答案：学会感恩是人的良好思想品德的具体体现，是处理好人际关系的基础；单亲家庭的孩子会有亲情的缺失，但是仍会受到亲人的关爱，让孩子理解家庭的实际情况，感受到亲人的关爱，从而学会感恩亲人；老师、家长平时多和孩子沟通，了解孩子思想状况，有针对性地引导学生感恩他人。\n17)目前，学生的课外作业是师生及家长普遍关注的问题，有的认为作业过重，影响了学生的身心发展，有的认为作业是学生学习成绩提高的重要途径。你作为班主任怎么对待学生作业？如何调控本班学生作业? 参考答案：班主任要正确认识作业，知道作业的意义；引导学生正确对待作业，理解作业对巩固知识，提升综合素质和能力的重要作用；认真做好调查研究，适时适度布置作业；做好各科教师的协调工作，调控学生各科作业种类和总量。\n18)我校多年来一直重视学生的素质教育，通过开展丰富多彩的活动，使学生的特长得到发挥，活动必然需要时间，有的老师认为这样就会影响学生的学习成绩，不主张搞课外活动，你对这种现象有什么认识？认为该怎么做? 参考答案：教师要有正确的教育观和学生观，真正为学生的一生发展考虑；全面正确理解素质教育的内涵：促进学生的全面发展，提升学生综合素质；正确认识学习成绩与学生素质的关系，两者是相辅相成的；精心安排组织有益活动，调控好文化学习与课外活动的时间，做到两不误，两促进。\n第五篇：班主任技能大赛情景答辩题目答案_\n题目一\n1、案例简述：学生每天中午都吃学校的盒饭，一天，班主任发现垃圾桶附近饭盒扔得到处都是，就请在场的同学清理。可在场的同学却说：“这事一直是 小东在做，我不管！”小东是刚从外校转来的，家境很贫寒，人也很老实。\n问题：这时，班主任应该怎么做？可以从哪些方面来教育学生？\n参考答案：老师与在场的同学一起清理干净。事后再找机会与学生谈心，或以班会或其他形式，让学生明白：A.要保护环境卫生。B.同学之间是平等的，工作应该是大家分着做。C.同学之间应该互相关爱。\n2、评委王娟提问：班主任在班级管理工作中应如何对待不同境遇的学生?\n选手李梅英回答：学生之间是平等的，班里的卫生工作应该是大家分着做，这样可提高学生对班级的荣誉感和责任意识，对于家境等各方面有困难的学生，班主任更应该在学习、生活等各方面多加关心，给予温暖，消除自卑心理，避免同学歧视，营造一个师生之间、同学之间互相关爱的和谐氛围。\n题目二\n1、案例简述：班上张强和汪波打了起来，被值日老师抓到班主任处。班主任问原因，张强和汪波异口同声的指责对方，强调自己的道理。\n问题：（1）这时班主任应该怎么做？（2）你如何认识学生自我教育的作用？\n参考答案：（1）先耐心听学生谈事情的经过，弄清楚事情真相，从中判断各自承担什么责任。再让学生谈打架的害处；之后让学生讨论他们各自应当承担什么责任。（2）苏联教育家苏霍姆林斯基曾经这样说过:“具有能够激发学生去进行自我教育的教育才是真正的教育。真正的教育只有当学生有自我教育的要求时才能实现。” 当今学生自我主见比较强,很有自己的思想,所以有一部分学生会不听别人的劝告,包括家长的和老师的，总是坚持自己的意见和做自己的事。因此,加强学生的自我教育非常重要。目的是让学生自己悟出道理来,而不是老师苦口婆心的说道理。自我教育的途径多种多样，比如:自信疗法、培养自己的意志力、树立正确的学习目标、培养自己的学习兴趣、调节自己的情绪、自我反省等。", "analysis": "", "aspect": "班主任基本功综合", "module": "案例分析与情景答辩", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 532}, {"type": "essay", "stem": "案例：一个女学生家境不好，本人相貌也很一般，虽然为人本份，学习也很刻苦，但成绩仍不突出，别人对她也是不冷不热。她感到这个世界对她太平公平；你这样做的理由？别人那么有钱，那么漂亮，那么聪明？于是她有了轻生的念头，留了纸条就跑出去了。你找到她时，她已经在外面游荡两天。 问题：面对神情呆滞、了无生气的她，你是怎么做的？你这样做的理由？", "options": {}, "answer": "不批评、不责骂，只是轻轻地说，你饿了吗？然后我们去吃点东西。我们一起回学校吧。你知道老师和父母是多么地着急啊（给她关心）。你在老师心目中，„„（说她的优点，给她自信）。我们没有选择父母的权利，但我们有选择奋斗，自立自强的机会（给她希望）。\n2、评委付淑荣提问：你平时是如何做好学生的心理教育的？ 盐中选手张海燕答案：首先，上好每一堂心理课。“学会求知，学会做人”是新时代的要求，学生要有积极健康的心态，这句要求班主任老师营造良好的环境，结合学生年龄特点及认知水平，精心设计好每一堂心理课，发挥课堂教学主渠道的作用。还要用平等信任的眼光看学生，用爱心去感化他们，用自己的人格魅力去影响他们，从而使学生形成健康的心理。\n其次，密切联系家长，及时沟通。学生不仅是学校的孩子，也是社会的孩子，更是父母的孩子。家庭环境，家庭教育对孩子的成长起着至关重要的作用，孩子的细微的变化也只有父母最先察觉，因此，家校及时密切沟通，携手共同促进孩子健康成长。", "analysis": "", "aspect": "班主任基本功综合", "module": "案例分析与情景答辩", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 533}, {"type": "essay", "stem": "同学们议论纷纷,说张日和李诗正在谈恋爱,但你怎么都不相信,因为他们俩在各方面的表现是那么的优秀。可是,那个下雨天的傍晚,在公交车站,你竟与搂腰共伞并向对方嘴里送巧克力的张李二人不期而遇了.问题：此时你会怎么做？你这样做的理由？", "options": {}, "answer": "装作没看到，事后另找时间与他们阐述早恋的危害。理由是：如果当场点破或批评，会使他们很没面子，增大心理压力，甚至对老师有抵触情绪，破坏了师生感情。如果给他们面子，保留一些美好的东西，再阐述早恋的危害，他们会更容易接受。", "analysis": "", "aspect": "班主任基本功综合", "module": "案例分析与情景答辩", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 534}, {"type": "essay", "stem": "一位后进生，家长恨铁不成钢，教育的方式方法简单粗暴，动不动就拳脚相加，孩子越打越顽皮，与家长产生对抗情绪。家长悲叹不已，叫你对她的孩子不要客气，即使打也无所谓。 问题：你会怎么做？你这样做的理由？", "options": {}, "answer": "劝阻家长，不要随便打学生；多了解学生在家的情况；与家长多谈教育孩子的方法，说服家长多给学生一些关心、爱护、鼓励。另一方面，与学生沟通，学会理解父母的爱，明白父母的苦心。改正缺点，让家长开心。", "analysis": "", "aspect": "班级建设与管理", "module": "班集体建设", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 535}, {"type": "essay", "stem": "学生林森，喜欢下象棋，在六年级下学期初经常利用课间十分钟与同桌在楚河汉界上厮杀。由于课间休息时间短，如此这般必将分散上课的注意力。多次看到这种现象后，作为班主任该怎样做？", "options": {}, "answer": "（一）理论支撑：有自己的爱好是积极向上的一面；但学生的主要精力应用在学习上，应让爱好促进学习（意思对即可，10分）\n（二）方法措施：\n1、赞赏其特长，因势利导，以一方面的兴趣带动学习、活动等其它方面的提高。\n2、与之谈心，指出其不足，更加严格的要求自己。（意思对即可，12分）\n（三）有较好效果，有启发性。（8分）", "analysis": "", "aspect": "班主任基本功综合", "module": "情景答辩答题要点", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 536}, {"type": "essay", "stem": "六年级班主任王老师星期日遇见了本班学生张鹏的母亲，张鹏的母亲告诉王老师张鹏被几个小伙伴拉去上网吧了，请求张老师管管这些孩子，张老师为难的说：“我们老师没有权利管网吧，等明天上学我在找王鹏做做他的工作，让他远离网吧。” 张老师对这件事处理的方法是否恰当，试做分析。", "options": {}, "answer": "（一）理论支撑：拒绝未成年人上营业性网吧，使其远离网吧是每个公民义不容辞的责任。张老师确认张鹏确实与小伙伴上网吧了，应及向与工商、文化部门报告，查处接纳未成年人上网的网吧。（意思对即可，10分）\n（二）方法措施：能够结合实际，举事例阐述这一做法的危害性。（意思对即可，12分）\n（三）有启发性和教育效果。（8分）", "analysis": "", "aspect": "班主任基本功综合", "module": "情景答辩答题要点", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 537}, {"type": "essay", "stem": "李桦同学家庭贫苦，个别同学向她炫耀吃穿，使她产生担忧、自卑等心理问题，她向班主任求助。作为班主任你将怎样应对这一问题。", "options": {}, "answer": "（一）理论支撑：告诉李桦同学这是正常的心理现象，不必太在意。（意思对即可，10分）\n（二）方法措施：第一、增强自信心，找到闪光点；第二、转变认知，对自身、对自己家庭的正确认识。学会感恩。淡化对家庭因素的担忧。第三、与家长沟通，营造积极向上的氛围。第四、组织班会。主题：“我们都是一样的”或“如何对待挫折与贫穷”。（答对三点得12分，意思对即可）\n（三）有启发性和教育效果。（8分）", "analysis": "", "aspect": "家校社协同与心理健康", "module": "学生心理健康教育", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 538}, {"type": "essay", "stem": "陈明学习刻苦，早来晚走，想尽快地提高成绩，但现实与理想总有差距，每次考试都不遂人愿，造成陈明心理的重大负担，几次向班主任表示“走不出考试的阴影”。如果你是班主任，该怎样帮助陈明走出阴影。", "options": {}, "answer": "（一）理论支撑：告诉陈明同学谁都有过失败，失败后的心理反应是正常的，不必太在意。（意思对即可，10分）\n（二）方法措施：第一、转变认知和评价，不要以考试作为唯一的评价，应对自身有全面的认识和评价。第二、增强自信心，找到闪光点。第三、与家长沟通，营造积极向上的氛围。（12分，意思对即可）\n（三）有启发性和教育效果。（8分）", "analysis": "", "aspect": "家校社协同与心理健康", "module": "学生心理健康教育", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 539}, {"type": "essay", "stem": "李娜同学是单亲家庭，与母亲相依为命，有一段时间她感到十分孤独，总觉得缺乏爱！不论是在家庭、学校还是同学之间都缺乏爱的温暖。如果你是班主任，该怎样帮助李娜走出困境。", "options": {}, "answer": "（一）理论支撑：告诉李娜同学爱无处不在，人间处处有温暖，贵在 发现，贵在感受。（意思对即可，10分）\n（二）方法措施：第一、通过主题班会或集体活动，让其参与到同学之中，以积极的心态与同学相处，有一颗宽容的心和感恩的心。第二、增强自信心，找到自己的闪光点，快乐的生活和学习。第三、与家长沟通，营造积极向上的氛围。（12分，意思对即可）\n（三）有启发性和教育效果。（8分）", "analysis": "", "aspect": "班主任基本功综合", "module": "情景答辩答题要点", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 540}, {"type": "essay", "stem": "王莹同学父母体质不好，家庭条件差，因此她有自卑感，很少与同学交往。但有一段时间她却在班内追求穿着的时髦，衣服买了一件又一件。父母向班主任刘老师诉说了这一苦衷，让刘老师教育王莹学会勤俭，不要爱慕虚荣。假如你是刘老师，你将怎么处理这件事？", "options": {}, "answer": "（一）理论支撑：王莹存在的是心理问题，不是品质问题。穿时髦的衣服是为了让老师同学注意她，重视她（意思对即可，10分）。\n（二）方法措施：能够结合实际，举事例阐述这一做法。（意思对即可，12分）\n（三）有启发性和教育效果。（8分）", "analysis": "", "aspect": "班主任基本功综合", "module": "情景答辩答题要点", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 541}, {"type": "essay", "stem": "王卓同学很顽皮，经常给同学起外号，闹的同学之间很不融洽，作为班主任，你将怎样阻止这一行为，建设好和谐班集体。", "options": {}, "answer": "（一）理论支撑：让他认识到给人起外号是不文明的表现。（意思对即可，10分）\n（二）方法措施：第一、通过主题班会或集体活动，让其参与到同学之中，以积极的心态与同学相处，有一颗宽容的心和感恩的心。第二、开展“我与同学比文明”演讲、讲故事、手抄报评比活动，在活动中增强自律意识和关爱他人意识。第三、开展“我与同学结对子”实践活动，让同学互相监督、互相帮助、互相激励。（12分，意思对即可）\n（三）有启发性和教育效果。（8分）", "analysis": "", "aspect": "班级建设与管理", "module": "中小学班主任工作规定", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 542}, {"type": "essay", "stem": "有些同学反感班主任家访，认为老师家访就是向家长告自己的状，作为班主任你将怎样纠正学生的这一认识误区。", "options": {}, "answer": "（一）理论支撑：学校、家庭、社会三位一体才能收到较好的育人效果。（意思对即可，10分）\n（二）方法措施：第一、通过班会告诉同学们，家访可以了解学生在家的表现，发现学生在学校没有表现出来的优点和潜质，以便更好地因材施教。第二、邀请家长到学校，与学生一起听课，一起活动，让学生感受到学校、家庭是不可分割的。（12分，意思对即可）\n（三）有启发性和教育效果。（8分）", "analysis": "", "aspect": "家校社协同与心理健康", "module": "中华人民共和国家庭教育促进法", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 543}, {"type": "essay", "stem": "班主任甄老师患了感冒，但他照常上班，为了增强育人效果，她抓住“有病” 这一教育契机，实施了教育的创新。请推想甄老师是如何抓住“有病”这一教育契机的？", "options": {}, "answer": "（一）理论支撑：教育契机无处不在，要善于抓住教育契机，因势利导，取得良好的育人效果。（意思对即可，10分）\n（二）方法措施：第一、抓住“有病”这一教育契机，引导学生关爱他人，学会感恩。第二、抓住“有病”这一教育契机，锻炼学生自我管理能力。（12分，意思对即可）\n（三）有启发性和教育效果。（8分）", "analysis": "", "aspect": "班主任基本功综合", "module": "情景答辩答题要点", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 544}, {"type": "essay", "stem": "四年级的李强同学由于父母溺爱，在家饭来张口，衣来伸手，从来不干家务。但在学校他像换了一个人，班级卫生抢着干，还报名参加竞争生活委这一职务，部分同学对李强校内校外不一致的做法表示反感。作为班主任你将如何做好对李强和其他同学的教育工作？", "options": {}, "answer": "（一）理论支撑：要善于抓住闪光点，因势利导，取得良好的育人效果。（意思对即可，10分）\n（二）方法措施：第一、开展“多关注别人的闪光点”主题班会，教育学生放大同学的亮点，多学习别人的优点。第二、找李强同学谈心，引导他校内校外一致，表里如一，增强自我管理能力。（12分，意思对即可）\n（三）有启发性和教育效果。（8分）\n班主任工作技能比赛现场答辩题目及参考答案\n1)案例简述：\n班主任布置学生写生活随笔《我的家庭》，结果一个写作很好的女生留给老师一张纸条，写着：“父亲是个酒鬼、烟鬼兼赌徒，在遥远的新疆工作。我问过母亲为什么与父亲结合。母亲无言。后来我自己搞清了，母亲是为了生存，而父亲是为了逃避家长安排的婚姻。原来我是他们随随便便结合的产物，我鄙视他们。” 问题：\n1、请分析这个学生的心理？\n2、如何帮助这个学生走出目前的状态？\n参考答案：\n1、感受不到父母的爱；对父母失望；埋怨父母，因此也不爱父母。", "analysis": "", "aspect": "班级建设与管理", "module": "班集体建设", "source": "班主任工作技能比赛现场答辩题目及参考答案.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 545}, {"type": "essay", "stem": "大二女生王霞来自农村，最近父亲去世给原本贫困的家庭雪上加霜，母亲身体患病，无力承担学习和生活费用，劝其退学，该生找到辅导员求助，帮助家庭经济困难学生度过难关继续学业，作为辅导员的你该如何与他交谈？", "options": {}, "answer": "1）帮助小林树立信心，告诉她人生道路上会碰到各种困难和挫折，只要她坚定信念，学校会给予力所能及的帮助；2）介绍学院学生资助体系。包括国家及学院自主设立两部分，含有“奖、助、贷、补、减”五个方面，主要是奖励在校全日制优秀学生，资助由于家庭经济困难不能正常完成学业的困难学生。符合国家及学院各种资助政策要求的学生均可申请。", "analysis": "", "aspect": "班主任基本功综合", "module": "案例拓展（辅导员类）", "source": "班主任技能大赛案例分析（题库）.docx", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 546}, {"type": "essay", "stem": "班主任基本功问题答疑带答案 1.如何组织与培养班集体？", "options": {}, "answer": "班主任对组织和培养集体负有主要责任，应把主要时间和精力用在建设班集体上。我认为可以从几下几点做：第一提出共同的奋斗目标，可以达到振奋学生精神、鼓舞学生前进的动力、有利于达到凝聚集体的目的。第二选择和培养班干部，要把全班学生组织起来，班主任应该善于发现和培养积极分子，挑选和培养班干部，建立班集体的领导核心。让学生学会自我管理、自我教育的目的。第三培养正确的集体舆论和优良的班风，正确的集体舆论和良好的班风会形成一种巨大的教育力量，对每个成员都有熏陶、感染和制约的作用，在管理班集体的过程中发挥着巨大的作用。第四加强对班集体纪律的管理，班级好的纪律有利于学生更好的学习，是调高学生学习成绩的关键，也可以使集体及其成员变得更美好。第五组织多样的教育活动，有了集体活动，学生会焕发精神，开阔眼界，增长知识，促进学生才能、特长的发挥和相互的团结。班主任指导学生参加或组织适当的活动室比不可少的。以上是组织和培养集体的一些方法，在实际工作中，还可以灵活采用一些别的方法。\n2.如何与不同类型的家长沟通，怎样一种家校合作方式比较好？\n【参考答案】：首先，尊重家长是沟通的第一原则，也是老师基本素质的表现。其次，老师要有较强的服务意识。\n第三，老师与家长联系沟通时要有理性的意识。最后，应重视沟通方式，通常情况下对学生的评价要先扬后抑，让家长在心理上有一个适应过程。\n家长的组成非常复杂，其知识结构、职业类别、性格气质、修养程度等都参差不齐，没有哪一种教育方法是万能的，某种方法在这个家庭有效，但到另外一家则可能不灵。班主任应对学生家庭进行调查分析，对家长的文化水平、职业状况、年龄、家教思想、家庭关系等做到心中有数。在与家长沟通的过程中，尽量做到有针对性和实效性。\n3.学生心目中的好班主任形象有那些？\n【参考答案】：我心目中的好班主任应该是一个有爱心的人。当然，这个世界上绝对没有爱心的人几乎不存在，但真正有爱心并懂得怎样付出爱的人更难能可贵。有爱心的班主任应当是一个善解人意的好老师、好长辈、好朋友，最起码的，他不会体罚和侮辱学生。在他眼中，所有的学生都是平等的，没有什么好生和差生之分。他会尊重学生，一视同仁，让学生健康地成长。最重要的是，他懂得宽容学生，能够原谅和宽容学生，给学生改正错误的机会。他懂得关怀学生，在学生受到挫折时去安慰他们，在学生烦恼时去开导他们，在学生迷茫时去帮助他们。我认为，一个创造了高升学率的“成功”班主任未必就是一个好班主任。作为一个班主任，我认为最重要的是要有很好的管理能力，使得班级纪律严明，风气良好，教给学生做人的道理、健康的思想和正确的学习方法，以提高班级的整体素质，而不是只盯着成绩。\n4.请你描述青春期男女学生的心理特点？\n【参考答案】：青少年步入青春期，心理发育迅猛，心理特点体现在：\n第一、性意识骤然增长由于生理上出现性发育加速，使得青少年对性知识特别感兴趣，对异性有强烈的交往欲望，性的好奇感和神秘感与日俱增。\n第二、智力水平迅猛提高 对问题的精确性和概括性发展迅速，逐步从形象思维为主向抽象逻辑思维过渡。\n第三、自我意识强而不稳独立欲望增强，对事物能做出自己的判断和见解，但对自我的认识和评价过高或过低，常被一些矛盾所困扰，如独立欲望与缺乏独立能力的矛盾，自己心中的“成人感”与成人眼中的“孩子气”之间的矛盾等等。\n第四、情感世界充满风暴常常表现出幼稚的感情冲动和短暂的不安定状态，孤独、优伤、激动、喜悦、愤怒微妙地交织在一起，组成一个强烈、动摇和不协调的情感世界。\n第五、兴趣爱好日益广泛求知欲与好奇心强烈，富有理想，热爱生活，积极向上，乐于参加各种创造性活动，对于竞争性、冒险性和趣味性的活动更是乐不知疲。\n第六、人际交往欲望强烈一方面强烈希望结交志趣相同，年龄相仿，能够相互理解、分亨生活感受的知心朋友，另一方面，对自己周围的人尽量保持良好的关系，尤其是对自己所属的集体，有强烈的归属感和依赖性，宁肯自己受点委屈，也要保持生活圈的平衡与协调。\n5.何谓“班级文化”，怎样营造？\n【参考答案】：班级文化可分为“硬文化”和“软文化”。所谓硬文化，是一种“显性文化”，可以摸得着、看得见的环境文化，也就是物质文化，比如教室墙壁上的名言警句，英雄人物或世界名人的画像；摆成马蹄形、矩形、椭圆形的桌椅；展示学生书画艺术的书画长廊；激发学生探索未知世界的科普长廊；表露爱心的“小小地球村”；悬挂在教室前面的班训、班风等醒目图案和标语等等。而软文化，则是一种“隐性文化”，包括制度文化、观念文化和行为文化。\n6.“学生自己管理自己”的观点你赞同吗？\n【参考答案】：赞同。每个学生都希望自己在班集体中得到重视。既然学生是主体，那么教师就要敢于放手，让每个学生发挥自己的能力，体验成功的快感，激发了他们的积极性。老师要善于引导学生，放手让学生自己管理自己。\n7.你最欣赏的班主任是那一种类型？\n【参考答案】：每一位班主任都有自己独到的教育管理班级的方法。有人将优秀的班主任划分成以下六种类型：\n第一母亲型。这种班主任主要靠“爱心”来工作。他们总是把“爱”的旗帜举得高高的，把爱的气氛搞得浓浓的。无论遇到什么问题，他们都诉诸感情，求助于“爱”。这种班主任活脱脱就是一位“亲妈”，眼巴巴地盯着一帮儿女，喜怒哀乐搅成一团。\n第二官员型。这种班主任主要靠“监督检查评比”来工作。他们热衷于制定各种条条框框，热爱指标，喜欢板上钉钉的要求。他们早来晚走，不错眼珠地死盯着孩子，高密度地使用赏罚手段。这种老师摆出的是一副和学生拼到底的架势，学生没奈何，只好就范。于是各项工作井然有序，颇见成效。\n第三政治家型。这种班主任主要靠“煽情”来工作。这是一些知识丰富、口才上乘、有一定表演才能的人。他们凭三寸不滥之舌，能把学生一会说哭了，一会又说笑了。如果你能引领学生的情感，当然你也就能引领学生的行动，于是我们就看见他的学生常常热泪盈眶地追随在他后面。\n第四领袖型。这种班主任主要靠活动来工作。他们是优秀的鼓动家，更是优秀的组织家和活动家。他们的拿手好戏是不断地组织学生进行各种各样地活动。在活动中凝聚集体，在活动中形成正确舆论，在活动中冲刷存在的问题，用活动裹挟差生前进。他们领导的班级往往充满生机。\n第五导师型。这种班主任主要靠威信来工作。他们的威信往往高到令学生“迷信”的程度。这样，他们就可以摆脱一些俗物，很多事情只要“运筹帷幄”，甚至“遥控”就行了。这种班主任一般有自己独立的教育思想，有特殊的思路，会用班干部。他们能像“巫师”一样把学生迷住，甘愿为老师赴汤蹈火。\n第六科学家型。他们主要靠科学来工作。他们对学生，第一是尊重，第二是爱。他们遇到问题，总是采取研究的态度，进行诊断，然后拿出解决方案。对他们来说，学生不但是朋友，而且是研究对象。对他们来说，工作本身也是一门科学和艺术，是研究的对象。更重要的是，对他们来说，自身也是研究对象，他们很注意经常反思和梳理自己的思路。\n我认为这六种类型都有各自的优势和特点，我更倾向于自己能成为一名综合型的班主任。", "analysis": "", "aspect": "班级建设与管理", "module": "中小学班主任工作规定", "source": "笔试题/笔试题/班主任基本功问题答疑带答案.doc", "multi": false, "batch": "原卷题库", "analysis_from_doc": false, "blanks": [], "reference": "", "id": 547}];</script>
<script>
const ALL = window.QUESTIONS || [];
const LS = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem('bzr_'+k)) ?? d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('bzr_'+k, JSON.stringify(v)); }catch(e){} }
};
const state = {
  list: [], idx: 0, answered: false, picked: new Set(), lastOk: null, selfJudged: false,
  blankDetail: [], wrong: new Set(LS.get('wrong', [])), seen: new Set(LS.get('seen', [])),
  notes: LS.get('notes', {}), stats: LS.get('stats', {done:0, ok:0}),
  read: LS.get('read', false), rate: 1
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const typeName = q => q.type === 'essay' ? '案例 / 简答' : q.type === 'blank' ? '填空（原文还原）' : (q.multi ? '多选' : '单选');
const sorted = s => String(s).split('').sort().join('');
const normAns = s => String(s == null ? '' : s).replace(/[\s，。、；：（）()《》“”"'．\.？?！!]/g, '');
const markSeen = q => { state.seen.add(q.id); LS.set('seen', [...state.seen]); };

/* ---------- 朗读 ---------- */
let voice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices() || [];
  voice = vs.find(v => /^zh/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, force){
  if((!state.read && !force) || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/[（　）]/g,' '));
    u.lang = 'zh-CN'; u.rate = state.rate; u.pitch = 1;
    if(voice) u.voice = voice;
    speechSynthesis.speak(u);
  }catch(e){}
}
function toggleRead(){
  state.read = !state.read; LS.set('read', state.read);
  $('sw').classList.toggle('on', state.read);
  if(!state.read && 'speechSynthesis' in window) speechSynthesis.cancel();
  if(state.read) readCurrent();
}
function readCurrent(force){
  const q = cur(); if(!q) return;
  let t = '第' + (state.idx+1) + '题。' + q.stem.replace(/______/g, '，什么，');
  if(q.type === 'choice') for(const k of Object.keys(q.options).sort()) t += ' 选项' + k + '，' + q.options[k] + '。';
  speak(t, force);
}
setInterval(() => { // 手机熄屏后浏览器会暂停朗读，兜底恢复
  if(state.read && 'speechSynthesis' in window && speechSynthesis.speaking && speechSynthesis.paused) speechSynthesis.resume();
}, 4000);

/* ---------- 筛选 ---------- */
function cur(){ return state.list[state.idx]; }
function fillAspect(){
  const set = [...new Set(ALL.map(q => q.aspect))].sort();
  $('fAspect').innerHTML = '<option value="all">全部方面</option>' + set.map(a => '<option>'+esc(a)+'</option>').join('');
  const bs = [...new Set(ALL.map(q => q.batch || '原卷题库'))];
  $('fBatch').innerHTML = '<option value="all">全部批次</option>' + bs.map(b => '<option>'+esc(b)+'</option>').join('');
}
function onAspect(){
  const a = $('fAspect').value;
  const set = [...new Set(ALL.filter(q => a==='all' || q.aspect===a).map(q => q.module))].sort();
  $('fModule').innerHTML = '<option value="all">全部模块</option>' + set.map(m => '<option>'+esc(m)+'</option>').join('');
  apply();
}
function apply(){
  const a = $('fAspect').value, m = $('fModule').value, t = $('fType').value, b = $('fBatch').value;
  const key = $('fKey').value.trim(), onlyWrong = $('fWrong').checked, onlyNew = $('fNew').checked;
  let list = ALL.filter(q => {
    if(a !== 'all' && q.aspect !== a) return false;
    if(m !== 'all' && q.module !== m) return false;
    if(b !== 'all' && (q.batch || '原卷题库') !== b) return false;
    if(t === 'single' && !(q.type==='choice' && !q.multi)) return false;
    if(t === 'multi'  && !(q.type==='choice' &&  q.multi)) return false;
    if(t === 'blank'  && q.type !== 'blank') return false;
    if(t === 'essay'  && q.type !== 'essay') return false;
    if(key && !q.stem.includes(key)) return false;
    if(onlyWrong && !state.wrong.has(q.id)) return false;
    if(onlyNew && state.seen.has(q.id)) return false;
    return true;
  });
  if($('fShuffle').checked) for(let i=list.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [list[i],list[j]]=[list[j],list[i]]; }
  state.list = list; state.idx = 0;
  $('sTotal').textContent = list.length;
  render();
}
function go(d){
  if(!state.list.length) return;
  state.idx = (state.idx + d + state.list.length) % state.list.length;
  if(state.read && 'speechSynthesis' in window) speechSynthesis.cancel();
  render(); if(state.read) setTimeout(readCurrent, 120);
}
function randomOne(){ if(state.list.length){ state.idx = Math.floor(Math.random()*state.list.length); render(); } }
function retry(){ render(); }

/* ---------- 渲染 ---------- */
function render(){
  state.answered = false; state.picked = new Set(); state.selfJudged = false; state.blankDetail = [];
  const q = cur(), c = $('card');
  if(!q){ c.innerHTML = '<div class="stem" style="text-align:center;color:#8ea3bf">没有符合条件的题目，换个筛选条件试试～<br>（若勾了「只刷没做过的」，可能已经全部刷完啦）</div>'; updateStats(); return; }
  let h = '<div class="tags">'
    + '<span class="tag">'+esc(q.aspect)+'</span>'
    + '<span class="tag m">'+esc(q.module)+'</span>'
    + '<span class="tag t">'+typeName(q)+'</span>'
    + '<span class="tag s" title="'+esc(q.source)+'">出处：'+esc(q.source)+'</span>'
    + (q.batch && q.batch !== '原卷题库' ? '<span class="tag m">'+esc(q.batch)+'</span>' : '')
    + '<span class="qnum">'+(state.idx+1)+' / '+state.list.length+'</span></div>';
  if(q.type === 'blank'){
    let i = 0;
    const body = esc(q.stem).replace(/______/g, () =>
      '<input class="blankin" data-i="'+(i++)+'" autocomplete="off" placeholder="填这里">');
    h += '<div class="stem">'+body+'</div>';
    h += '<div style="font-size:13px;color:#8ea3bf;margin-bottom:10px">共 '+(q.blanks||[]).length
       + ' 个空 · 答案与解析来自政策原文，填完点核对（回车亦可）</div>';
    h += '<button class="btn green" onclick="judgeBlank()">核对答案</button>';
  }else{
    h += '<div class="stem">'+esc(q.stem)+'</div>';
    if(q.type === 'choice'){
      h += '<div class="opts" id="opts">';
      for(const k of Object.keys(q.options).sort())
        h += '<button class="opt" data-k="'+k+'" onclick="choose(\''+k+'\')"><span class="k">'+k+'.</span><span>'+esc(q.options[k])+'</span></button>';
      h += '</div>';
      if(q.multi) h += '<div style="margin-top:12px"><button class="btn green" id="okBtn" onclick="confirmMulti()">确定答案</button> <span style="font-size:12px;color:#8ea3bf">多选题可选多个，选齐再点确定</span></div>';
    }else{
      h += '<textarea class="essay" id="myAns" placeholder="先自己写一写思路，再对照参考答案…"></textarea>';
      h += '<button class="btn" onclick="showEssay()">查看参考答案（原文照搬）</button>';
    }
  }
  h += '<div id="fb"></div>';
  c.innerHTML = h;
  updateStats();
}

/* ---------- 判题 ---------- */
function choose(k){
  const q = cur(); if(!q || state.answered) return;
  if(q.multi){
    state.picked.has(k) ? state.picked.delete(k) : state.picked.add(k);
    document.querySelectorAll('.opt').forEach(b => b.classList.toggle('picked', state.picked.has(b.dataset.k)));
    return;
  }
  state.answered = true;
  judge(k);
}
function confirmMulti(){
  const q = cur(); if(!q || state.answered || !state.picked.size) return;
  state.answered = true;
  judge(sorted([...state.picked].join('')));
}
function judge(pick){
  const q = cur(), ok = sorted(pick) === sorted(q.answer);
  state.lastOk = ok; markSeen(q);
  state.stats.done++; if(ok) state.stats.ok++;
  if(!ok) state.wrong.add(q.id); else state.wrong.delete(q.id);
  LS.set('stats', state.stats); LS.set('wrong', [...state.wrong]);
  document.querySelectorAll('.opt').forEach(b => {
    const k = b.dataset.k; b.classList.add('locked');
    if(q.answer.includes(k)) b.classList.add('correct');
    else if(k === pick || (q.multi && state.picked.has(k))) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const ob = $('okBtn'); if(ob) ob.disabled = true;
  showFeedback(ok, '你的选择：' + (pick || '未选'), q.answer);
  if(state.read) speak((ok ? '回答正确。' : '回答错误。') + '正确答案是' + q.answer.split('').join('、') + '。');
}
function showEssay(){
  const q = cur(); if(!q || state.answered) return;
  state.answered = true; state.lastOk = null; markSeen(q);
  showFeedback(null, '', q.answer, true);
}
function judgeBlank(){
  const q = cur(); if(!q || state.answered || q.type !== 'blank') return;
  state.answered = true; markSeen(q);
  const blanks = q.blanks || [];
  let okCount = 0;
  state.blankDetail = [];
  document.querySelectorAll('.blankin').forEach(inp => {
    const i = +inp.dataset.i, right = blanks[i] || '', mine = inp.value.trim();
    const good = !!mine && normAns(mine) === normAns(right);
    inp.classList.add(good ? 'ok' : 'no');
    inp.disabled = true;
    inp.title = good ? '正确' : '正确答案：' + right;
    if(good) okCount++;
    state.blankDetail.push({i:i, mine:mine, right:right, good:good});
  });
  const ok = okCount === blanks.length;
  state.lastOk = ok;
  state.stats.done++; if(ok) state.stats.ok++;
  if(!ok) state.wrong.add(q.id); else state.wrong.delete(q.id);
  LS.set('stats', state.stats); LS.set('wrong', [...state.wrong]);
  showFeedback(ok, '填对 ' + okCount + ' / ' + blanks.length + ' 个空', q.answer, false, true);
  if(state.read) speak((ok ? '全对。' : '填对' + okCount + '个，共' + blanks.length + '个空。') + '正确答案是' + blanks.join('、'));
}

/* ---------- 答案 + 解析 ---------- */
function showFeedback(ok, pickLine, answer, isEssay, isBlank){
  const q = cur(), box = $('fb');
  const cls = ok === null ? 'ok' : (ok ? 'ok' : 'no');
  const title = ok === null ? '📖 参考答案 · 原文照搬' : (ok ? '✅ 答对了！' : '❌ 不对，再看一眼');
  let h = '<div class="fb '+cls+'"><div class="fb-title">'+title+'</div>';
  if(!isEssay){
    h += '<div class="ansline">正确答案 <b>'+esc(answer)+'</b>'
       + (isBlank ? '' : '　' + esc(Object.keys(q.options).filter(k => answer.includes(k)).map(k => k+'. '+q.options[k]).join('；'))) + '</div>';
    if(pickLine) h += '<div style="font-size:13px;color:#b9c9dd;margin-bottom:10px">'+esc(pickLine)+'</div>';
  }
  if(isBlank && state.blankDetail.length){
    h += '<div class="blankline">' + state.blankDetail.map(d =>
      '<span class="'+(d.good?'r':'w')+'">第'+(d.i+1)+'空：'+(d.good ? '✓ '+esc(d.mine) : '✗ '+(esc(d.mine)||'未填')+' → '+esc(d.right))+'</span>').join('') + '</div>';
  }
  h += '<div class="anabox"><div class="anah">'+(isBlank ? '政策原文（答案出处，原文照搬）' : '解析 / 参考答案')+'</div>';
  const note = state.notes[q.id] || '';
  const body = isEssay ? q.answer : (isBlank ? (q.reference || q.answer) : (note || q.analysis || ''));
  h += '<div class="anatx'+(body?'':' empty')+'">'+esc(body || '原卷未附文字解析。可在下方补一句，或先看「出处」与「政策原文依据」。')+'</div>';
  if(isBlank && note) h += '<div class="ref"><b>我的补充</b><br>'+esc(note)+'</div>';
  if(!isEssay && !isBlank && q.reference) h += '<div class="ref"><b>政策原文依据（自动匹配，原文照搬）</b><br>'+esc(q.reference)+'</div>';
  h += '</div>';
  h += '<div class="anabox"><div class="anah">题目归属</div><div style="font-size:14px;line-height:1.9">'
     + '所属方面：<b style="color:#9fc6ff">'+esc(q.aspect)+'</b>　｜　具体模块：<b style="color:#7ee2bd">'+esc(q.module)+'</b><br>'
     + '题型：'+typeName(q)+'　｜　批次：'+esc(q.batch || '原卷题库')+'<br>出处：'+esc(q.source)+'</div></div>';
  h += '<div class="src">来源文件：'+esc(q.source)+'　·　题目文字未作改写，仅将答案挖空</div>';
  if(!isEssay) h += '<div class="note"><textarea id="noteIn" placeholder="补一句解析 / 记忆要点（自动存本机）">'+esc(note)+'</textarea><button class="btn ghost" onclick="saveNote()">保存</button></div>';
  if(isEssay) h += '<div style="margin-top:10px;display:flex;gap:8px"><button class="btn green" onclick="selfJudge(true)">✅ 我答对了</button><button class="btn ghost" onclick="selfJudge(false)">❌ 再练一次</button></div>';
  h += '</div>';
  box.innerHTML = h;
  updateStats();
}
function saveNote(){
  const q = cur(), v = $('noteIn').value.trim();
  if(v) state.notes[q.id] = v; else delete state.notes[q.id];
  LS.set('notes', state.notes);
  showFeedback(state.lastOk, '', q.answer, q.type === 'essay', q.type === 'blank');
}
function selfJudge(ok){
  const q = cur();
  if(state.selfJudged) return;
  markSeen(q);
  state.selfJudged = true;
  state.stats.done++; if(ok) state.stats.ok++;
  if(!ok) state.wrong.add(q.id); else state.wrong.delete(q.id);
  LS.set('stats', state.stats); LS.set('wrong', [...state.wrong]);
  const b = $('fb'); b.insertAdjacentHTML('afterbegin',
    '<div style="font-size:14px;margin-bottom:8px;color:'+(ok?'#7ee2bd':'#ff9b9b')+'">'+(ok?'已记为答对 ✅':'已加入错题本 ❌')+'</div>');
  updateStats();
}
function updateStats(){
  $('sDone').textContent = state.stats.done;
  $('sOk').textContent = state.stats.ok;
  $('sBad').textContent = state.stats.done - state.stats.ok;
  $('sAcc').textContent = state.stats.done ? Math.round(state.stats.ok / state.stats.done * 100) + '%' : '--';
  $('sWrong').textContent = state.wrong.size;
}
function clearWrong(){ state.wrong.clear(); LS.set('wrong', []); updateStats(); apply(); }
function clearSeen(){ state.seen.clear(); LS.set('seen', []); apply(); }

/* ---------- 启动 ---------- */
$('sub').textContent = '共 ' + ALL.length + ' 道题 · 原卷题目 / 答案 / 参考答案照搬 · 「原文出题」「出处辨析」批次来自政策原文 · 每道标注方面与模块';
$('sw').classList.toggle('on', state.read);
if(!('speechSynthesis' in window)) $('sw').title = '当前浏览器不支持语音朗读';
fillAspect(); onAspect();
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && document.activeElement.classList.contains('blankin')){ judgeBlank(); return; }
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const k = e.key.toUpperCase();
  if(/^[A-E]$/.test(k)){ const b = document.querySelector('.opt[data-k="'+k+'"]'); if(b) b.click(); }
  else if(e.key === 'ArrowRight') go(1);
  else if(e.key === 'ArrowLeft') go(-1);
  else if(e.key === ' '){ e.preventDefault(); readCurrent(true); }
});
</script>
</body>
</html>
